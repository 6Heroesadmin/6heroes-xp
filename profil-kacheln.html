<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Heldenprofil – 6Heroes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: transparent;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #F2B705;
  }

  html, body {
    min-height: 100vh;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text-main);
    padding: 16px;
    min-height: 100vh;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 640px;
    margin: 0 auto;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }

  .tile {
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    display: block;
    border: 1.5px solid rgba(255,255,255,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    color: inherit;
  }

  .tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  .tile-top {
    height: 5px;
  }

  .tile-body {
    padding: 18px 16px 20px;
  }

  .tile-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    font-size: 22px;
  }

  .tile-role {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .tile-hero {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .tile-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.4;
  }

  /* Locked state */
  .tile.locked .tile-body {
    filter: blur(5px);
    pointer-events: none;
    user-select: none;
  }

  .lock-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(15, 23, 42, 0.45);
    z-index: 2;
  }

  .lock-icon {
    font-size: 22px;
  }

  .lock-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    text-align: center;
    padding: 0 8px;
  }

  .error {
    text-align: center;
    color: #f87171;
    padding: 40px 16px;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div id="content"></div>

  <script>
    const BASE_SITE = 'https://regal-mooncake-d3a250.netlify.app';
    const UPGRADE_URL = 'https://myablefy.com/s/6heroes/testprodukt-zapier-7ae4eae2/payment';

    const HERO_COLORS = {
      'Innovator':  '#F2B705',
      'Commander':  '#0B63CE',
      'Strategist': '#94A3B8',
      'Sage':       '#C0266A',
      'Guardian':   '#1F9D62',
      'Explorer':   '#F0672A',
    };

    const HERO_TINT = {
      'Innovator':  'rgba(242,183,5,0.2)',
      'Commander':  'rgba(11,99,206,0.2)',
      'Strategist': 'rgba(51,65,85,0.4)',
      'Sage':       'rgba(192,38,106,0.2)',
      'Guardian':   'rgba(31,157,98,0.2)',
      'Explorer':   'rgba(240,103,42,0.2)',
    };

    const HERO_ICONS = {
      'Innovator':  '💡',
      'Commander':  '🎯',
      'Strategist': '🧭',
      'Sage':       '🔥',
      'Guardian':   '🛡️',
      'Explorer':   '🧩',
    };

    const ROLE_DESCRIPTIONS = {
      'Basisheld':    'Dein Kernprofil – so trittst du im Alltag auf.',
      'Zweitheld':    'Deine zweite Seite – verstärkt deinen Basishelden.',
      'Stressheld 1': 'Deine erste Reaktion unter Druck.',
      'Stressheld 2': 'Deine zweite Reaktion unter Druck.',
    };

    // Normalize: capitalize first letter, lowercase rest (e.g. "commander" -> "Commander")
    function normalizeHero(name) {
      if (!name) return '';
      return name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
    }

    function lc(name) {
      return (name || '').toLowerCase();
    }

    function tileHTML({ role, hero, url, locked }) {
      const heroNorm = normalizeHero(hero);
      const color = HERO_COLORS[heroNorm] || '#475569';
      const tint = HERO_TINT[heroNorm] || 'rgba(71,85,105,0.2)';
      const icon = HERO_ICONS[heroNorm] || '⭐';
      const desc = ROLE_DESCRIPTIONS[role] || '';
      const href = locked ? UPGRADE_URL : url;
      const lockOverlay = locked
        ? `<div class="lock-overlay">
             <span class="lock-icon">🔒</span>
             <span class="lock-label">Jetzt freischalten</span>
           </div>`
        : '';

      return `
        <a class="tile ${locked ? 'locked' : ''}" href="${href}" target="_top">
          ${lockOverlay}
          <div class="tile-top" style="background:${color}"></div>
          <div class="tile-body">
            <div class="tile-icon" style="background:${tint}; color:${color}">${icon}</div>
            <div class="tile-role">${role}</div>
            <div class="tile-hero" style="color:${color}">${heroNorm}</div>
            <div class="tile-desc">${desc}</div>
          </div>
        </a>
      `;
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      const base = params.get('basis');
      const second = params.get('zweit');
      const s1 = params.get('stress1');
      const s2 = params.get('stress2');
      const isPaid = params.get('paid') === '1';

      const content = document.getElementById('content');

      if (!base || !second || !s1 || !s2) {
        content.className = 'error';
        content.textContent = 'Profil konnte nicht geladen werden.';
        return;
      }

      const tiles = [
        {
          role: 'Basisheld',
          hero: base,
          url: `${BASE_SITE}/paid_${lc(base)}.html`,
          locked: false,
        },
        {
          role: 'Zweitheld',
          hero: second,
          url: `${BASE_SITE}/kombi_${lc(base)}_${lc(second)}.html`,
          locked: !isPaid,
        },
        {
          role: 'Stressheld 1',
          hero: s1,
          url: `${BASE_SITE}/stress_${lc(s1)}_s1.html`,
          locked: !isPaid,
        },
        {
          role: 'Stressheld 2',
          hero: s2,
          url: `${BASE_SITE}/stress_${lc(s2)}_s2.html`,
          locked: !isPaid,
        },
      ];

      content.outerHTML = `<div class="grid">${tiles.map(tileHTML).join('')}</div>`;
    }

    init();
  </script>
</body>
</html>
