<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Heldenprofil – 6Heroes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #F2B705;

    --c-innovator: #F2B705;
    --c-commander: #0B63CE;
    --c-strategist: #334155;
    --c-sage: #C0266A;
    --c-guardian: #1F9D62;
    --c-explorer: #F0672A;
  }

  .tile-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.4;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text-main);
    padding: 16px;
    min-height: 100vh;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 640px;
    margin: 0 auto;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }

  .tile {
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    display: block;
    border: 1.5px solid rgba(255,255,255,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    color: inherit;
  }

  .tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  .tile-top {
    height: 5px;
  }

  .tile-body {
    padding: 18px 16px 20px;
  }

  .tile-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    font-size: 22px;
  }

  .tile-role {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .tile-hero {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* Locked state */
  .tile.locked .tile-body {
    filter: blur(5px);
    pointer-events: none;
    user-select: none;
  }

  .lock-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(15, 23, 42, 0.45);
    z-index: 2;
  }

  .lock-icon {
    font-size: 22px;
  }

  .lock-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    text-align: center;
    padding: 0 8px;
  }

  .loading, .error {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 16px;
    font-size: 14px;
  }

  .error {
    color: #f87171;
  }
</style>
</head>
<body>

  <div id="content" class="loading">Lade dein Heldenprofil …</div>

  <script>
    const HERO_COLORS = {
      'Innovator':  '#F2B705',
      'Commander':  '#0B63CE',
      'Strategist': '#334155',
      'Sage':       '#C0266A',
      'Guardian':   '#1F9D62',
      'Explorer':   '#F0672A',
    };

    const HERO_TINT = {
      'Innovator':  'rgba(242,183,5,0.2)',
      'Commander':  'rgba(11,99,206,0.2)',
      'Strategist': 'rgba(51,65,85,0.25)',
      'Sage':       'rgba(192,38,106,0.2)',
      'Guardian':   'rgba(31,157,98,0.2)',
      'Explorer':   'rgba(240,103,42,0.2)',
    };

    const ROLE_DESCRIPTIONS = {
      'Basisheld':    'Dein Kernprofil – so trittst du im Alltag auf.',
      'Zweitheld':    'Deine zweite Seite – verstärkt deinen Basishelden.',
      'Stressheld 1': 'Deine erste Reaktion unter Druck.',
      'Stressheld 2': 'Deine zweite Reaktion unter Druck.',
    };

    const HERO_ICONS = {
      'Innovator':  '💡',
      'Commander':  '🎯',
      'Strategist': '🧭',
      'Sage':       '🔥',
      'Guardian':   '🛡️',
      'Explorer':   '🧩',
    };

    function tileHTML({ role, hero, url, locked, upgradeUrl }) {
      const color = HERO_COLORS[hero] || '#475569';
      const tint = HERO_TINT[hero] || 'rgba(71,85,105,0.2)';
      const icon = HERO_ICONS[hero] || '⭐';
      const desc = ROLE_DESCRIPTIONS[role] || '';
      const href = locked ? upgradeUrl : url;
      const lockOverlay = locked
        ? `<div class="lock-overlay">
             <span class="lock-icon">🔒</span>
             <span class="lock-label">Jetzt freischalten</span>
           </div>`
        : '';

      return `
        <a class="tile ${locked ? 'locked' : ''}" href="${href}" target="_top">
          ${lockOverlay}
          <div class="tile-top" style="background:${color}"></div>
          <div class="tile-body">
            <div class="tile-icon" style="background:${tint}; color:${color}">${icon}</div>
            <div class="tile-role">${role}</div>
            <div class="tile-hero" style="color:${color}">${hero}</div>
            <div class="tile-desc">${desc}</div>
          </div>
        </a>
      `;
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const content = document.getElementById('content');

      if (!id) {
        content.className = 'error';
        content.textContent = 'Kein Profil angegeben.';
        return;
      }

      try {
        const res = await fetch(`/.netlify/functions/profile?id=${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error('Profil konnte nicht geladen werden');
        const data = await res.json();

        const isPaid = !!data.isPaid;
        const upgradeUrl = data.upgrade_url || '#';

        const tiles = [
          { role: 'Basisheld',   hero: data.base,   url: data.paid_url,  locked: false },
          { role: 'Zweitheld',   hero: data.second, url: data.kombi_url, locked: !isPaid },
          { role: 'Stressheld 1', hero: data.s1,    url: data.s1_url,    locked: !isPaid },
          { role: 'Stressheld 2', hero: data.s2,    url: data.s2_url,    locked: !isPaid },
        ];

        const html = `<div class="grid">
          ${tiles.map(t => tileHTML({ ...t, upgradeUrl })).join('')}
        </div>`;

        content.outerHTML = html;
      } catch (err) {
        content.className = 'error';
        content.textContent = 'Profil konnte nicht geladen werden.';
      }
    }

    init();
  </script>
</body>
</html>
