<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Heldenprofil – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--gold:#F2B705}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{padding:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:680px;margin:0 auto}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.tile{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(32,41,58,.12);border-color:var(--ink)}
.top{height:4px}
.body{padding:20px 20px 22px}
.role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.name{font-family:'DM Serif Display',Georgia,serif;font-size:26px;line-height:1.1}
.desc{font-size:14px;line-height:1.55;color:var(--mute);margin-top:8px}
.q{font-size:13px;line-height:1.5;color:var(--mute);margin-top:10px}
.q span{color:var(--ink);font-style:italic}
.more{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:13.5px;font-weight:600;color:var(--ink)}
.more .ar{transition:transform .12s}.tile:hover .more .ar{transform:translateX(3px)}
.wide{grid-column:1/-1}
.roles{display:flex;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.roles .pl{color:var(--mute)}
.free{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:#E6F5EC;color:#1F7A4C;font-size:10.5px;letter-spacing:.04em;vertical-align:middle}
.tile.locked{border-color:#EBD9A0}
.tile.locked .body{opacity:.85}
.badge{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid #E5C25A;display:flex;align-items:center;justify-content:center;z-index:2}
.badge svg{width:15px;height:15px;color:#B88A00}
.unlock{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;background:#FFF6D6;border-top:1px solid #EBD9A0;font-size:13px;font-weight:700;color:#7A5C00}
.unlock svg{width:13px;height:13px}
.stress{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#F7F5F0}
.error{text-align:center;color:#B4471B;padding:40px 16px;font-size:14px}
</style>
</head>
<body>
<div id="content"></div>
<script>
var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';
const UPGRADE_URL='https://6heroes.de/preise.html#pricing';
const APP='https://app.6heroes.de';
const HERO_COLORS={'Innovator':'#F2B705','Commander':'#0B63CE','Strategist':'#475569','Sage':'#C0266A','Guardian':'#1F9D62','Explorer':'#F0672A'};
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const HERO_SHORT = {
      'Innovator':  { line: 'Du erzeugst Neues und denkst in Möglichkeiten.',            q: 'Was wäre noch möglich?' },
      'Explorer':   { line: 'Du testest die Realität und lernst durch Erfahrung.',        q: 'Was passiert, wenn wir es ausprobieren?' },
      'Commander':  { line: 'Du lieferst Ergebnisse und bringst Entscheidungen ins Tun.', q: 'Was tun wir jetzt?' },
      'Guardian':   { line: 'Du hältst Stabilität, Sicherheit und Verlässlichkeit.',      q: 'Was ist richtig, sicher, verlässlich?' },
      'Sage':       { line: 'Du schaffst Verstehen, Klarheit und Orientierung.',          q: 'Was stimmt – und was bedeutet das?' },
      'Strategist': { line: 'Du machst Komplexität beherrschbar – mit Plan und Trade-offs.', q: 'Was ist die beste Option unter aktuellen Bedingungen?' },
    };
const COMBO_NAME = {
      'commander_explorer': 'Der Action-Leader',
      'commander_guardian': 'Der Protective Commander',
      'commander_innovator': 'Der Disruptive Leader',
      'commander_sage': 'Der Principled Leader',
      'commander_strategist': 'Der Präzise Macher',
      'explorer_commander': 'Der Expedition Leader',
      'explorer_guardian': 'Der Grounded Explorer',
      'explorer_innovator': 'Der Trailblazer',
      'explorer_sage': 'Der Purpose Explorer',
      'explorer_strategist': 'Der Smart Adventurer',
      'guardian_commander': 'Der Firm Protector',
      'guardian_explorer': 'Der Safe Adventurer',
      'guardian_innovator': 'Der Modernizer',
      'guardian_sage': 'Der Compassionate Stabilizer',
      'guardian_strategist': 'Der Process Anchor',
      'innovator_commander': 'Der Vision-Executor',
      'innovator_explorer': 'Der Field Tester',
      'innovator_guardian': 'Der Safe Innovator',
      'innovator_sage': 'Der Meaning Maker',
      'innovator_strategist': 'Der System-Designer',
      'sage_commander': 'Der Guiding Authority',
      'sage_explorer': 'Der Experiential Sage',
      'sage_guardian': 'Der Steady Mentor',
      'sage_innovator': 'Der Insight Innovator',
      'sage_strategist': 'Der Systems Philosopher',
      'strategist_commander': 'Der Decisive Strategist',
      'strategist_explorer': 'Der Adaptive Planner',
      'strategist_guardian': 'Der Reliable Builder',
      'strategist_innovator': 'Der Innovative Analyst',
      'strategist_sage': 'Der Wise Architect',
    };
const nh=n=>n?n.charAt(0).toUpperCase()+n.slice(1).toLowerCase():'';
const lc=n=>(n||'').toLowerCase();
function tile(o){
  const col=HERO_COLORS[o.hero]||'#64748B',s=HERO_SHORT[o.hero]||{line:'',q:''};
  const href=o.locked?UPGRADE_URL:o.url;
  return '<a class="tile'+(o.locked?' locked':'')+'" href="'+href+'" target="_top">'
   +(o.locked?'<div class="badge">'+LOCK+'</div>':'')
   +'<div class="top" style="background:'+col+'"></div><div class="body"><div class="role">'+o.role+(o.locked?'':'<span class="free">Frei</span>')+'</div>'
   +'<div class="name" style="color:'+col+'">'+o.hero+'</div><div class="desc">'+s.line+'</div>'
   +(s.q?'<div class="q">Leitfrage: <span>„'+s.q+'“</span></div>':'')
   +(o.locked?'':'<div class="more">Dein '+o.role+' lesen <span class="ar">&rarr;</span></div>')+'</div>'
   +(o.locked?'<div class="unlock">'+LOCK+'<span>Jetzt freischalten</span></div>':'')+'</a>';
}
function comboTile(b,z,locked){
  const cB=HERO_COLORS[b],cZ=HERO_COLORS[z],name=COMBO_NAME[lc(b)+'_'+lc(z)]||'Eure Kombination';
  return '<a class="tile wide'+(locked?' locked':'')+'" href="'+(locked?UPGRADE_URL:APP+'/kombihelden')+'" target="_top">'
   +(locked?'<div class="badge">'+LOCK+'</div>':'')
   +'<div class="top" style="background:linear-gradient(90deg,'+cB+','+cZ+')"></div><div class="body">'
   +'<div class="roles"><span style="color:'+cB+'">'+b+'</span><span class="pl">+</span><span style="color:'+cZ+'">'+z+'</span></div>'
   +'<div class="name">'+name+'</div><div class="desc">Wie Basis- und Zweitheld sich gegenseitig färben – deine fünf Kennzeichen und typische Alltagssituationen.</div>'
   +(locked?'':'<div class="more">Das Zusammenspiel lesen <span class="ar">&rarr;</span></div>')+'</div>'
   +(locked?'<div class="unlock">'+LOCK+'<span>Jetzt freischalten</span></div>':'')+'</a>';
}
function stressTile(s1,s2,locked){
  const c1=HERO_COLORS[s1],c2=HERO_COLORS[s2];
  return '<a class="tile wide'+(locked?' locked':'')+'" href="'+(locked?UPGRADE_URL:APP+'/stresshelden')+'" target="_top">'
   +(locked?'<div class="badge">'+LOCK+'</div>':'')
   +'<div class="top" style="background:linear-gradient(90deg,'+c1+','+c2+')"></div><div class="body">'
   +'<div class="role">Stresshelden</div><div class="name">Wie du unter Druck reagierst</div>'
   +'<div class="desc">Deine erste und deine zweite Stressreaktion – so zeigst du dich, wenn es eng wird, und wie andere dich dann erleben.</div>'
   +'<div class="stress"><span class="chip" style="color:'+c1+'">1 · '+s1+'</span><span class="chip" style="color:'+c2+'">2 · '+s2+'</span></div>'
   +(locked?'':'<div class="more">Deine Stressmuster lesen <span class="ar">&rarr;</span></div>')+'</div>'
   +(locked?'<div class="unlock">'+LOCK+'<span>Jetzt freischalten</span></div>':'')+'</a>';
}
function init(){
  const p=new URLSearchParams(location.search);
  const b=nh(p.get('basis')),z=nh(p.get('zweit')),s1=nh(p.get('stress1')),s2=nh(p.get('stress2'));
  const paid=p.get('paid')==='1';
  const c=document.getElementById('content');
  if(!b||!z||!s1||!s2){c.className='error';c.textContent='Profil konnte nicht geladen werden.';postHeight();return;}
  c.outerHTML='<div class="grid">'
   +tile({role:'Basisheld',hero:b,url:APP+'/basisheld',locked:false})
   +tile({role:'Zweitheld',hero:z,url:APP+'/zweitheld',locked:!paid})
   +comboTile(b,z,!paid)+stressTile(s1,s2,!paid)+'</div>';
  postHeight();
}
function postHeight(){
  const g=document.querySelector('.grid')||document.getElementById('content');
  const h=g?Math.ceil(g.getBoundingClientRect().bottom+window.scrollY)+8:document.documentElement.scrollHeight;
  parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');
}
window.addEventListener('load',postHeight);window.addEventListener('resize',postHeight);
if(window.ResizeObserver)new ResizeObserver(postHeight).observe(document.body);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(postHeight);
[50,200,500,1000].forEach(t=>setTimeout(postHeight,t));
init();
</script>
</body>
</html>
