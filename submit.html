<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest abschließen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #20293A;
    --gold: #F2B705;
    --text: #F4F1E9;
    --text-soft: #C8CEDA;
    --text-muted: #8E96A8;
    --border: rgba(255,255,255,0.08);
    --card: rgba(255,255,255,0.035);
    --card-hover: rgba(255,255,255,0.06);
    --done: #1F9D62;
  }
  html, body {
    background: var(--navy);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .scroll { background: var(--navy); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 22px 16px 36px; }

  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 8px;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 30px; font-weight: 400; letter-spacing: -0.01em; margin-bottom: 10px;
  }
  .instruction {
    font-size: 15px; color: var(--text-soft);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 8px;
  }
  .meta {
    font-size: 13px; color: var(--text-muted); margin-bottom: 24px;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .meta strong { color: var(--gold); font-weight: 600; }

  .field-label {
    font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: block;
  }
  .field-hint { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }

  textarea {
    width: 100%; min-height: 150px; resize: vertical;
    font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.55; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; transition: border-color .12s, background .12s;
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus {
    outline: none; border-color: rgba(242,183,5,0.55); background: var(--card-hover);
  }

  .footer {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-top: 1px solid var(--border); padding-top: 20px; margin-top: 24px;
  }
  .actions { margin-left: auto; display: flex; gap: 10px; }

  .btn {
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    padding: 10px 20px; border-radius: 999px; cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--text-soft); transition: background .12s, opacity .12s;
  }
  .btn:hover { background: var(--card-hover); }
  .btn-primary {
    background: var(--gold); color: #1a1a1a; border-color: var(--gold);
  }
  .btn-primary:hover { opacity: 0.9; background: var(--gold); }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  .status { font-size: 13px; margin-top: 14px; min-height: 18px; }
  .status.ok { color: var(--done); }
  .status.err { color: #E06A5A; }

  .coach-block {
    margin-top: 22px; border-top: 1px solid var(--border); padding-top: 22px;
  }
  .coach-body {
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--gold); border-radius: 14px;
    padding: 16px 18px; margin-top: 10px;
    font-size: 15px; line-height: 1.6; color: var(--text-soft);
    white-space: pre-wrap;
  }
  .coach-body b { color: var(--text); font-weight: 600; }
  .thinking { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 14px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    opacity: 0.35; animation: blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay: .2s; }
  .dots span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.35} 40%{opacity:1} }
  .coach-actions { margin-top: 14px; }
</style>
</head>
<body>
<div class="scroll">
<div class="wrap" id="wrap">
  <div class="eyebrow" id="eyebrow">Quest</div>
  <div class="header">
    <h1 id="questTitle">Quest abschließen</h1>
  </div>
  <div class="instruction" id="instruction">…</div>
  <div class="meta" id="meta"></div>

  <label class="field-label" for="freetext">Deine Reflexion</label>
  <div class="field-hint">Was hast du getan, erlebt oder bemerkt? Ein paar Sätze genügen.</div>
  <textarea id="freetext" placeholder="Schreib hier, wie es gelaufen ist …"></textarea>

  <div class="footer">
    <div class="actions">
      <button class="btn" id="cancelBtn">Abbrechen</button>
      <button class="btn btn-primary" id="doneBtn">Erledigt</button>
    </div>
  </div>
  <div class="status" id="status"></div>

  <div class="coach-block" id="coachBlock" hidden>
    <div class="eyebrow">Dein Coach</div>
    <div class="coach-body" id="coachBody">
      <div class="thinking" id="thinking">
        <span class="dots"><span></span><span></span><span></span></span>
        Dein Coach denkt nach …
      </div>
    </div>
    <div class="coach-actions" id="coachActions" hidden>
      <button class="btn" id="listBtn">Zu meinen Einträgen</button>
    </div>
  </div>
</div>
</div>

<script>
/* 6HEROES submit.html
   Quest-Abschluss mit Freitext-Reflexion.
   Wird via Noloco Record Page (ExerciseEntries, Feld Submit_URL) eingebettet.
   Der ExerciseEntries-Record existiert zu diesem Zeitpunkt bereits (angelegt
   durch "Quest Session Create" beim Quest-Klick in quests.html).

   URL-Params (kommen aus dem Submit_URL-Formelfeld in Airtable):
     email     Pflicht – Login-Email
     qid       Pflicht – QuestID, z.B. Q_STR_ACT_001
     entryId   Pflicht – Airtable Record-ID des ExerciseEntries-Eintrags

   Titel/Instruction/Hero/Type/Min/XP werden NICHT per URL übergeben (anders
   als ursprünglich geplant), sondern selbst per Quests-Read-Webhook geladen
   und per qid rausgefiltert – analog zu quests.html. */

const QUESTS_WEBHOOK_URL = 'https://hook.eu1.make.com/smmkpjh8x1tgqmsx5mp4ossl86tqp2eg';
const WRITE_WEBHOOK_URL  = 'https://hook.eu1.make.com/xkwbtclbfogop0egbh03yikjhgihdc8r';
/* Coaching Entries Read – liefert entries[] mit EntryID + AI_CoachingResponse_Display.
   Dieselbe Quelle wie eintraege.html, hier zum Nachverfolgen der frisch erzeugten Antwort. */
const READ_WEBHOOK_URL   = 'https://hook.eu1.make.com/np1n3s26oesoijxzeo97s9tf1gf2yrvc';
const LIST_URL = 'https://app.6heroes.de/meine-quest-eintraege';

/* Polling-Verhalten: alle POLL_INTERVAL ms nachfragen, bis Antwort da ist
   oder POLL_MAX_TRIES erreicht ist (danach Fallback-Hinweis). */
const POLL_INTERVAL  = 2500;
const POLL_MAX_TRIES = 24;   // ~60 s

/* E_-Präfix vom Read-Webhook (E_rec…) gegen die nackte entryId (rec…) angleichen. */
function stripPrefix(id){ return (id||'').toString().replace(/^E_/, ''); }

function escapeHtml(s){ return (s||'').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
/* Nur **fett** wird interpretiert, alles andere escaped (XSS-sicher) – analog eintraege.html. */
function renderCoaching(s){
  return escapeHtml((s||'').trim()).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
/* Erkennt den Platzhalter-Text, solange die echte Antwort noch nicht geschrieben ist. */
function isPending(txt){
  if (!txt || !txt.trim()) return true;
  return /wird gerade vorbereitet|denkt nach|noch nicht viel|vorbereitet —/i.test(txt);
}

function getParams(){
  const p = new URLSearchParams(window.location.search);
  return {
    email:   (p.get('email')||'').trim(),
    qid:     (p.get('qid')||'').trim(),
    entryId: (p.get('entryId')||'').trim(),
  };
}

function setStatus(msg, kind){
  const s = document.getElementById('status');
  s.textContent = msg || '';
  s.className = 'status' + (kind?(' '+kind):'');
}

function renderInfo(q){
  if (!q){
    document.getElementById('questTitle').textContent = 'Quest abschließen';
    document.getElementById('instruction').textContent = '';
    document.getElementById('eyebrow').textContent = 'Quest';
    document.getElementById('meta').innerHTML = '';
    return;
  }
  document.getElementById('questTitle').textContent = q.Title || 'Quest abschließen';
  document.getElementById('instruction').textContent = q.Instruction || '';
  document.getElementById('eyebrow').textContent = q.Hero ? (q.Hero.charAt(0).toUpperCase()+q.Hero.slice(1)) : 'Quest';
  const bits = [];
  if (q.DurationMin) bits.push(q.DurationMin + ' Min');
  if (q.XP_Base)      bits.push('<strong>+' + q.XP_Base + ' XP</strong>');
  document.getElementById('meta').innerHTML = bits.join('<span style="opacity:.4">·</span>');
}

/* Toleranter Parser, analog zu quests.html – falls der Webhook doch mal
   eine leicht kaputte JSON-Antwort liefert, bricht das Laden nicht komplett ab. */
function parseWebhookPayload(text){
  if (!text || !text.trim()) return null;
  try { return JSON.parse(text); } catch(_) {}
  let repaired = text
    .replace(/:\s*,/g, ': [],')
    .replace(/:\s*}/g, ': [] }')
    .replace(/,\s*}/g, ' }')
    .replace(/,\s*]/g, ' ]');
  try { return JSON.parse(repaired); } catch(e){
    console.warn('Quest-Payload auch nach Reparatur nicht parsebar:', e);
    return null;
  }
}

async function loadQuest(email, qid){
  if (!email || !qid) return null;
  const url = QUESTS_WEBHOOK_URL + '?email=' + encodeURIComponent(email);
  const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
  if (!res.ok) throw new Error('Quests-Webhook '+res.status);
  const raw = await res.text();
  const data = parseWebhookPayload(raw);
  const quests = Array.isArray(data && data.quests) ? data.quests
               : (data && data.quests && typeof data.quests === 'object') ? [data.quests]
               : [];
  return quests.find(q => q.QuestID === qid) || null;
}

async function submit(){
  const P = getParams();
  const doneBtn = document.getElementById('doneBtn');
  const freetext = document.getElementById('freetext').value.trim();

  if (!P.entryId){
    setStatus('Eintrag nicht erkannt – Abschluss nicht möglich.', 'err');
    return;
  }
  doneBtn.disabled = true;
  setStatus('Wird gespeichert …');
  try {
    const res = await fetch(WRITE_WEBHOOK_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        entryId:  P.entryId,
        freetext: freetext
      })
    });
    if (!res.ok) throw new Error('HTTP '+res.status);
    setStatus('Erledigt – gut gemacht.', 'ok');
    // Eingabe abschließen, Coach-Antwort-Bereich zeigen und auf die Antwort warten.
    document.getElementById('freetext').setAttribute('disabled','');
    document.getElementById('cancelBtn').style.display = 'none';
    startPolling(P.email, P.entryId);
  } catch(e){
    console.error(e);
    setStatus('Konnte nicht gespeichert werden. Bitte erneut versuchen.', 'err');
    doneBtn.disabled = false;
  }
}

/* Fragt den Read-Webhook wiederholt ab, bis die Antwort für DIESEN Eintrag
   nicht mehr "pending" ist. Kein Wegnavigieren – die Antwort erscheint hier.
   (window.parent.location ist Cross-Origin ohnehin blockiert.) */
function startPolling(email, entryId){
  const block   = document.getElementById('coachBlock');
  const body    = document.getElementById('coachBody');
  const actions = document.getElementById('coachActions');
  block.hidden = false;
  postHeight();

  const wantId = stripPrefix(entryId);
  let tries = 0;

  async function tick(){
    tries++;
    let text = null;
    try {
      const url = READ_WEBHOOK_URL + '?email=' + encodeURIComponent(email) + '&_=' + Date.now();
      const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
      if (res.ok){
        const data = parseWebhookPayload(await res.text());
        const rows = (data && (data.entries || data.records)) || [];
        const mine = Array.isArray(rows)
          ? rows.find(r => stripPrefix(r.EntryID || r.entryId) === wantId)
          : null;
        if (mine) text = mine.AI_CoachingResponse_Display || mine.coaching || '';
      }
    } catch(e){ console.warn('Polling-Versuch fehlgeschlagen:', e); }

    if (text && !isPending(text)){
      body.innerHTML = '<div class="eyebrow" style="margin-bottom:8px">Dein Coach</div>'
                     + renderCoaching(text);
      actions.hidden = false;
      setStatus('', '');
      postHeight();
      return; // fertig
    }
    if (tries >= POLL_MAX_TRIES){
      body.innerHTML = '<div class="thinking">Deine Antwort dauert etwas länger. '
        + 'Du findest sie gleich unter <b>Meine Quest-Einträge</b>.</div>';
      actions.hidden = false;
      postHeight();
      return;
    }
    setTimeout(tick, POLL_INTERVAL);
  }
  setTimeout(tick, POLL_INTERVAL);
}

/* Cross-Origin-sichere Top-Navigation: window.top.location direkt setzen
   scheitert bei fremder Parent-Domain (Noloco). Zuerst versuchen, bei
   Blockade auf _top-Anker ausweichen (funktioniert domainübergreifend). */
function navigateTop(url){
  try { window.top.location.href = url; return; } catch(_){}
  const a = document.createElement('a');
  a.href = url; a.target = '_top'; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
}

function bindButtons(){
  document.getElementById('doneBtn').addEventListener('click', submit);
  document.getElementById('cancelBtn').addEventListener('click', ()=> navigateTop(LIST_URL));
  document.getElementById('listBtn').addEventListener('click', ()=> navigateTop(LIST_URL));
}

async function init(){
  const P = getParams();
  bindButtons();

  if (!P.email || !P.qid || !P.entryId){
    renderInfo(null);
    setStatus('Quest-Daten unvollständig – bitte über "Meine Quests" erneut öffnen.', 'err');
    document.getElementById('doneBtn').disabled = true;
    postHeight();
    return;
  }

  try {
    const q = await loadQuest(P.email, P.qid);
    renderInfo(q);
    if (!q){
      setStatus('Quest-Details konnten nicht geladen werden, Abschluss ist trotzdem möglich.', '');
    }
  } catch(e){
    console.warn('Quest-Details konnten nicht geladen werden:', e);
    renderInfo(null);
  }
  postHeight();
}

let lastH = 0;
function postHeight(){
  const h = Math.max(
    document.body.scrollHeight, document.documentElement.scrollHeight,
    document.body.offsetHeight, document.documentElement.offsetHeight
  );
  if (h === lastH) return;
  lastH = h;
  parent.postMessage({type:"6heroes:setHeight",height:h},"*");
}
window.addEventListener("load",init);
window.addEventListener("resize",postHeight);
if (window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
if (document.fonts && document.fonts.ready){ document.fonts.ready.then(postHeight); }
[50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
</script>
</body>
</html>
