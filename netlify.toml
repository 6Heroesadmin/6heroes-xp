[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://app.6heroes.de"
[[redirects]]
  from = "/"
  to = "https://6heroes.de/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://6heroes.de/"
  status = 301
  force = true
