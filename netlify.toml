[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://app.6heroes.de https://6heroes.de"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://app.6heroes.de"

[[redirects]]
  from = "/"
  to = "https://6heroes.de/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://6heroes.de/"
  status = 301
  force = true
