<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zusammenspiel deiner Helden – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--ok:#1F9D62;--warn:#B4471B;--gold:#F2B705;--accent:#0B63CE;--accent2:#F0672A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 72px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.topbar svg{width:20px;height:20px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 6px}
.emb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'DM Serif Display',Georgia,serif;font-size:38px}
.emb2{display:flex}
.emb2 .emb{width:68px;height:68px;border-radius:34px;font-size:30px;border:3px solid var(--bg)}
.emb2 .emb+.emb{margin-left:-14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.15}
h1 .accent{color:var(--accent)}
.hook{font-size:16px;line-height:1.6;color:var(--mute);max-width:54ch}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
details[open]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s1{display:flex;flex-direction:column;gap:1px}
summary .a{font-size:15.5px;font-weight:600;line-height:1.35}
summary .b{font-size:12.5px;color:var(--mute)}
summary:after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details[open] summary:after{transform:rotate(45deg)}
.body{padding:2px 18px 20px;display:flex;flex-direction:column;gap:18px}
.blk{display:flex;flex-direction:column;gap:6px}
.bl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bl.ok{color:var(--ok)}.bl.warn{color:var(--warn)}
p{font-size:15.5px;line-height:1.7}
ul{padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:15.5px;line-height:1.6}
.card{display:flex;flex-direction:column;gap:18px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding-top:30px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.pill:hover{border-color:var(--ink)}
@media (max-width:480px){.wrap{padding:8px 16px 56px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const KOMBI={"commander_strategist":{"name":"Der Präzise Macher","hook":"Du willst nicht nur schnell sein – du willst richtig liegen. Diese Kombination verbindet unaufhaltsamen Vorwärtsdrang mit methodischer Präzision. Wenn andere noch diskutieren, hast du längst den kritischen Pfad identifiziert und bist auf dem Weg.","merk":[["Gezielte Tatkraft.","Du lieferst nicht nur schnell – du lieferst mit dem richtigen Fokus. Bevor du losgehst, weißt du, welcher Hebel wirklich zählt."],["Systematische Umsetzung.","Dein Drive findet in dir selbst seine eigene Ordnung. Du verwandelst Energie in Prozesse – nicht als Selbstzweck, sondern weil du weißt, dass gute Strukturen schneller ans Ziel führen."],["Analytische Führung.","Deine Ansagen kommen nicht aus dem Bauch – sie basieren auf einer tiefen Durchdringung von Abhängigkeiten und Konsequenzen. Das gibt ihnen Gewicht."],["Hebel-Intuition.","Du findest instinktiv den Punkt mit der größten Wirkung. Andere sehen ein komplexes System – du siehst den einen Schalter, der alles verändert."],["Methodisches Momentum.","Du kombinierst unaufhaltsamen Vorwärtsdrang mit präziser Priorisierung. Das macht dich in Umsetzungsphasen besonders stark."]],"mod":[["Im Alltag unter Zeitdruck","Du kennst das Gefühl: Der Morgen läuft nicht nach Plan. Dein Commander will jetzt loslegen, und dein Strategist beginnt gleichzeitig, den Ablauf zu optimieren – wer macht was, in welcher Reihenfolge, wie lässt sich das effizienter gestalten."],["Bei komplexen Entscheidungen","Dein Commander will entscheiden, dein Strategist will zuerst alle Abhängigkeiten verstehen. Diese Kombination macht dich besonders klug in Entscheidungen – und kann dich gleichzeitig in eine „Hebel-Blockade“ bringen, wenn du nach der perfekten taktischen Positionierung suchst, statt einfach loszugehen."],["In Deadline-Phasen","Im Endspurt willst du sicherstellen, dass das Timing stimmt und keine Fehler durch unsaubere Prozesse entstehen. Der Strategist in dir drängt kurz vor Schluss noch einmal darauf, die Abläufe zu straffen. Das Ergebnis: Das Team verliert den Fokus, weil die Regeln sich ändern, wenn eigentlich alle nur noch liefern wollen."],["In schwierigen Feedbackgesprächen","Du willst klar sein und gleichzeitig einen strukturierten Entwicklungsweg aufzeigen. Das ist eine starke Kombination – aber manchmal wirkt das Feedback dadurch zu kühl, zu sehr wie ein Performance-Design. Die menschliche Ebene tritt in den Hintergrund."]]},"commander_guardian":{"name":"Der Protective Commander","hook":"Du führst konsequent – und hast dabei immer die Menschen im Blick. Diese Kombination erzeugt eine seltene Qualität: Du bist gleichzeitig fordernd und fürsorglich, klar und loyal. Dein Team weiß: Du stellst hohe Ansprüche, weil du an sie glaubst.","merk":[["Protektive Führung.","Du verbindest starke Durchsetzungskraft mit echter Fürsorge für die Menschen, die du führst. Das ist keine Schwäche – das ist Führung auf einem höheren Level."],["Qualitätsorientierte Umsetzung.","Du treibst Ergebnisse voran und sicherst gleichzeitig Standards. Für dich geht beides – Tempo und Sorgfalt."],["Verlässlicher Rahmen.","Du schaffst psychologische Sicherheit durch klare Richtung und stabile Regeln. Menschen wissen bei dir, woran sie sind."],["Menschliche Stärke.","Du bleibst streng in der Sache – und bist dabei tief unterstützend gegenüber den Menschen. Diese Kombination macht dich zu einer Führungsperson, der andere wirklich vertrauen."],["Strukturierte Fürsorge.","Deine klaren Ansagen schützen dein Team vor Chaos und Überforderung. Das ist Fürsorge in Aktion."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Commander sofort loslegen – und dein Guardian stellt sicher, dass dabei nichts Wichtiges vergessen wird. Das Ergebnis: Du gibst sehr viele Anweisungen. Wenn dann Widerstand kommt oder die Zeit wegläuft, kann deine Stimme schärfer werden als du es eigentlich wolltest."],["Bei komplexen Entscheidungen","Dein Commander will die Richtung vorgeben, dein Guardian will zusätzlich absichern, dass keine Fehler entstehen, die dem System oder den Menschen schaden. Diese Spannung kann dich in eine Dauernachkontrolle führen – du triffst Entscheidungen, vertraust ihnen aber nicht ganz."],["In Deadline-Phasen","Kurz vor dem Ziel bekommt dein Guardian eine Qualitätspanic: Alles noch einmal prüfen, absichern, nichts Halbgares abliefern. Das ist ein guter Impuls – aber in der Zielphase erzeugt er oft späte Review-Schleifen, die das Team stressen und die Deadline gefährden."],["In schwierigen Feedbackgesprächen","Du willst fair sein. Du sammelst Beispiele, um deine Kritik wasserdicht zu machen. Das ist gut gemeint – aber manchmal fühlt sich das Gegenüber durch die Menge an Beweisen erdrückt statt entwickelt."]]},"commander_innovator":{"name":"Der Disruptive Leader","hook":"Du willst nicht nur gewinnen – du willst auf eine Art gewinnen, die noch niemand so gedacht hat. Diese Kombination verbindet unaufhaltsamen Vorwärtsdrang mit dem Mut, das Bekannte radikal in Frage zu stellen. Du öffnest neue Türen und gehst dann als Erster hindurch.","merk":[["Visionäre Durchsetzung.","Du setzt radikale, unkonventionelle Ideen konsequent und energisch um. Du bist nicht nur Ideengeber – du bist der Macher hinter der Vision."],["Kreative Führung.","Du führst nicht linear. Du nutzt mutige Perspektivwechsel, um Ziele auf Wegen zu erreichen, die andere nicht gesehen hätten."],["Smarte Effizienz.","Du suchst ständig nach Abkürzungen und Hacks – nicht aus Faulheit, sondern weil du weißt, dass der klügste Weg oft nicht der offensichtlichste ist."],["Mutige Entscheidungskraft.","Du triffst Entscheidungen jenseits des Standardweges. Das erzeugt manchmal Reibung – und fast immer Wirkung."],["Inspirierendes Momentum.","Du motivierst andere durch eine Mischung aus Klarheit und ansteckender Begeisterung. In deiner Nähe wollen Menschen mehr wagen."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, hat dein Innovator sofort eine Idee, wie man das smarter lösen könnte. Eine neue Routine, eine Challenge, ein kreativer Hack. Das ist faszinierend – aber unter Zeitdruck kann die neue Idee den Ablauf instabilisieren statt beschleunigen."],["Bei komplexen Entscheidungen","Du präsentierst manchmal mehrere brillante Hebel gleichzeitig – weil du sie alle siehst und alle für relevant hältst. Das überfordert dein Gegenüber und verwässert die Führungsklarheit deines Commanders."],["In Deadline-Phasen","Kurz vor der Ziellinie hat dein Innovator den „letzten genialen Einfall“ – ein neues Tool, eine Automatisierung, eine Verbesserung, die morgen alles leichter machen würde. Das ist gut gemeint. Aber in der Zielphase erzeugt jede Änderung Chaos statt Fortschritt."],["In schwierigen Feedbackgesprächen","Du willst nicht nur korrigieren – du willst inspirieren. Also nutzt du Metaphern, sprichst über das große Bild, deutest das Problem in eine Vision um. Das ist eine schöne Absicht – aber dein Gegenüber braucht manchmal konkrete Klarheit statt inspirierendes Framing."]]},"commander_sage":{"name":"Der Principled Leader","hook":"Du entscheidest – und du willst dabei im Einklang mit dem handeln, was wirklich wahr und richtig ist. Diese Kombination macht dich zu einem der integrsten Führungstypen. Menschen vertrauen dir, weil sie wissen: Du sagst, was du meinst, und du meinst, was du sagst.","merk":[["Begründete Kraft.","Du führst nicht nur durch Ansagen – du führst durch Logik und Sinn. Deine Richtung ist keine Behauptung, sondern eine Überzeugung."],["Integrität in Aktion.","Du verbindest Entschlossenheit mit einem unbestechlichen inneren Wertekompass. Das gibt deiner Führung eine Qualität, die andere spüren."],["Reflektierte Führung.","Du bleibst auch unter Druck besonnen und ordnest Entscheidungen in einen größeren Zusammenhang ein. Das macht dich besonders verlässlich in komplexen Situationen."],["Souveräne Sachlichkeit.","Du schaffst Orientierung durch Objektivität – nicht durch Lautstärke. Das ist eine seltene Kombination."],["Wertebasierte Verbindlichkeit.","Du stehst für Ergebnisse ein, die einer tiefen Prüfung standhalten. Kurzfristige Abkürzungen auf Kosten der Substanz sind nichts für dich."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, hält dein Sage inne – und will den Sinn der Situation vermitteln. Warum das wichtig ist. Was das über Respekt aussagt. Was das Prinzip dahinter ist. Das ist wertvoll – aber in echtem Zeitdruck erleben andere das als Mini-Vorlesung, während die Uhr tickt."],["Bei komplexen Entscheidungen","Dein Commander will entscheiden, dein Sage will zuerst alle Perspektiven einbeziehen und sicherstellen, dass die Wahl fachlich wahr und ethisch korrekt ist. Diese Spannung macht deine Entscheidungen besonders durchdacht – und kann sie gleichzeitig unnötig verzögern."],["In Deadline-Phasen","Kurz vor dem Abschluss erkennt dein Sage eine fachliche Unschärfe – einen Punkt, der nicht ganz stimmt, einen Widerspruch zu den ursprünglichen Zielen. Der Drang, das noch zu korrigieren, ist stark. Aber in der Zielphase kostet jede Grundsatzdiskussion das Team enorm."],["In schwierigen Feedbackgesprächen","Du willst dem anderen den tieferen Sinn vermitteln. Du sprichst über Haltung, Werte, Identität. Das ist gut gemeint – aber manchmal fühlt sich das Gegenüber moralisch bewertet statt professionell begleitet."]]},"commander_explorer":{"name":"Der Action-Leader","hook":"Du bewegst dich schnell und improvisierst brillant. Keine andere Kombination erzeugt so schnell Energie und Vorwärtsbewegung aus dem Nichts. Du bist derjenige, der aus einer unklaren Situation in kürzester Zeit Momentum macht.","merk":[["Intuitive Entscheidungskraft.","Du bist auch in unbekannten Lagen sofort handlungsfähig. Du brauchst keine vollständige Karte – du orientierst dich im Gehen."],["Pragmatisches Momentum.","Du glaubst daran, dass Handeln klüger macht als Planen. „Raus aus dem Kopf – rein ins Tun“ ist keine Ungeduld, sondern eine Philosophie."],["Flexible Führung.","Du gibst klare Richtung – bleibst aber beweglich genug, um dich spontan anzupassen, wenn neue Informationen kommen."],["Mut zum Experiment.","Du integrierst schnelle Test-Loops und echtes Feedback in dein Vorgehen. Du lernst durch Machen, nicht durch Analysieren."],["Begeisternde Tatkraft.","Du motivierst andere durch eine Mischung aus Klarheit und ansteckender, spielerischer Energie. In deiner Nähe trauen sich Menschen mehr."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, kombinierst du klare Ansagen mit radikaler Improvisation. Das Frühstück wird zum To-go-Event, Details werden unterwegs geklärt, Schuhe werden irgendwie angezogen. Das funktioniert – aber dein Umfeld fühlt sich manchmal überfahren, weil die hohe Geschwindigkeit keinen Raum für Mitgestaltung lässt."],["Bei komplexen Entscheidungen","Dein Commander will entscheiden, dein Explorer will sofort Fakten durch Handeln schaffen. Du triffst Entscheidungen schnell und testest sie in der Realität – was oft funktioniert. Manchmal entstehen dabei aber Entscheidungen ohne das nötige strategische Fundament, das sie langfristig trägt."],["In Deadline-Phasen","Im Endspurt will dein Explorer neue Wege finden, Abkürzungen nehmen, spontan den Kurs anpassen – während dein Commander eigentlich nur noch liefern will. Diese innere Spannung führt manchmal zu Scope-Sprüngen, die das Team verunsichern, kurz bevor alle nur noch ins Ziel wollen."],["In schwierigen Feedbackgesprächen","Du willst klar sein – und gleichzeitig motivierend, locker, nicht zu schwer. Also verpackst du kritisches Feedback manchmal mit Humor oder übst dich in Leichtigkeit, die die Dringlichkeit der Botschaft abschwächt."]]},"explorer_commander":{"name":"Der Expedition Leader","hook":"Du brichst auf – und du bringst andere mit. Diese Kombination verbindet Neugier und Vorwärtsdrang mit entschlossener Führung und Verbindlichkeit. Du machst nicht nur Tempo – du erzeugst Richtung, der andere wirklich folgen können.","merk":[["Zielgerichtete Freiheit.","Du verbindest Abenteuerlust und Neugier mit klarer Führung. Du willst nicht nur losrennen – du weißt, wohin du läufst, und du nimmst andere mit."],["Entschlussfreudiger Aufbruch.","Du nutzt den Mut zum Neuen, um schnell und verantwortlich Weichen zu stellen. Unsicherheit macht dich nicht langsamer – sie macht dich entschiedener."],["Pragmatische Führung.","Du gehst voran und setzt klare Ziele, ohne den Raum für Flexibilität zu opfern. Du führst durch Bewegung, nicht durch Kontrolle."],["Tatenreiches Momentum.","Du beschleunigst Entdeckungen durch klare Ansagen und konsequentes Handeln im Gelände. Bei dir entsteht aus Energie keine Hektik, sondern Fortschritt."],["Souveräner Kurs.","Du hältst auch in komplexen Situationen die Richtung und nimmst andere aktiv mit in die Umsetzung. Selbst wenn du improvisierst, weißt du, was das Ziel ist."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Explorer einfach loslegen – der Commander schaltet sich ein und fordert Struktur: Was ist gesichert, was läuft mit? Diese innere Spannung ist produktiv, kann aber unter Druck nach außen als Schärfe wirken. Du willst Tempo erzwingen, statt die Situation spielerisch zu lösen."],["Bei komplexen Entscheidungen","Dein Commander will entscheiden und die Verantwortung übernehmen, dein Explorer will alle Optionen offen halten. Kombiniert führt das oft zu einer zu schnellen Zusage – ohne dass du geprüft hast, was du dabei an Freiheit aufgibst. Später fühlst du dich durch deine eigene Entscheidung eingesperrt."],["In Deadline-Phasen","Im Endspurt will der Explorer neue Loops drehen und Dinge im Feld ausprobieren – der Commander will den Sack zumachen. Du spürst den Drang, das Ziel dynamisch zu halten, erzeugst dabei aber Scope-Sprünge, die das Team verunsichern, kurz bevor alle nur noch fertig werden wollen."],["In schwierigen Feedbackgesprächen","Dein Explorer will locker und motivierend bleiben, dein Commander will Klartext reden. Diese Spannung führt dazu, dass die Kritik entweder zu weich verpackt wird – oder dass du zwischen kumpelhafter Ermutigung und harter Ansage wechselst, ohne beides wirklich zu verbinden."]]},"explorer_guardian":{"name":"Der Grounded Explorer","hook":"Du entdeckst neue Wege – ohne die Menschen hinter dir zu verlieren. Diese Kombination verbindet Neugier und Bewegungsfreude mit echter Fürsorge und Verlässlichkeit. Du bist nicht nur aufbruchsbereit – du bist ein Begleiter, dem andere wirklich vertrauen.","merk":[["Verantwortungsbewusste Freiheit.","Du verbindest Abenteuerlust mit tiefer Sorgfalt für dein Umfeld. Freiheit bedeutet für dich nicht, andere zurückzulassen – sondern sie mitzunehmen."],["Nachhaltiger Aufbruch.","Du erforschst neue Wege, ohne die Sicherheit des Bestehenden leichtfertig zu opfern. Du weißt: Ein guter Aufbruch schützt das, was bereits gut funktioniert."],["Empathische Flexibilität.","Du bleibst in der Sache beweglich und offen, achtest dabei sensibel auf die emotionalen Bedürfnisse des Teams. Anpassungsfähigkeit endet für dich nicht an der Sachebene."],["Berechenbare Spontaneität.","Du nutzt intuitive Impulse, sicherst sie aber durch verlässliche Routinen ab. Menschen wissen: Auch wenn du improvisierst, bist du da."],["Soziale Exploration.","Du öffnest Räume für Neues, in denen sich Menschen durch ein starkes Sicherheitsnetz aufgehoben fühlen. Das ist eine seltene Kombination aus Abenteuer und Zugehörigkeit."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Explorer einfach losziehen – dein Guardian zieht die Notbremse: Schuhe, Brotbox, Wetter-Check. Innerlich entsteht ein Konflikt zwischen Freiheitsdrang und dem Bedürfnis, es richtig zu machen. Nach außen: Ungeduld trifft auf Kontrolle."],["Bei komplexen Entscheidungen","Dein Explorer will die Bewegung nutzen und sofort ins Machen kommen, dein Guardian sorgt sich um Teambelastung und Qualität. Du steckst fest zwischen dem Drang, den Weg frei zu machen, und der Sorge, durch ein zu schnelles Ja Menschen oder Standards zu verbrennen."],["In Deadline-Phasen","Der Explorer will schnelle Loops drehen, der Guardian bekommt eine Qualitätspanik – noch einmal prüfen, absichern, Review-Schleifen drehen. Das Ergebnis: Das Team reagiert genervt, weil kurz vor dem Ziel wieder alles in Bewegung gerät."],["In schwierigen Feedbackgesprächen","Der Explorer will die Stimmung leicht halten, der Guardian sammelt unzählige Beispiele für eine wasserdichte Beweisführung. Das Ergebnis: Entweder zu weich – oder so viel Material, dass das Gegenüber sich erdrückt fühlt statt entwickelt."]]},"explorer_innovator":{"name":"Der Trailblazer","hook":"Du denkst nicht nur außerhalb der Box – du baust eine neue. Diese Kombination erzeugt eine ungewöhnliche Intensität aus kreativem Vorwärtsdrang und spielerischer Experimentierfreude. Du siehst Wege, die andere nicht einmal als möglich in Betracht ziehen.","merk":[["Erfinderischer Vorwärtsdrang.","Du erfindest direkt im Tun neue Wege und Optionen, die für andere unsichtbar bleiben. Du bist kein Planer – du bist ein Pfadfinder."],["Kreative Improvisation.","Du verknüpfst pragmatisches Handeln mit originellen Shortcuts und unkonventionellen Lösungen. Das Standardweg-Denken ist dir fremd."],["Spielerische Dynamik.","Du nutzt kreative Hacks und Challenges, um starre Routinen aufzubrechen und Bewegung zu erzeugen. Für dich ist jede Situation ein Spielfeld."],["Visionäre Offenheit.","Du erkennst während der Exploration ständig neue Potenziale und verknüpfst sie mit dem aktuellen Ziel. Andere sehen Probleme – du siehst Möglichkeiten dahinter."],["Mut zum Unkonventionellen.","Du kombinierst die Lust am einfachen Machen mit der Fähigkeit, den Standardweg radikal neuzudenken. Das macht dich in festgefahrenen Situationen außergewöhnlich wirksam."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, hat dein Innovator sofort eine Idee, wie man das smarter lösen könnte – ein Spiel, ein Hack, eine neue Routine. Dein Explorer findet das großartig. Aber wenn zu viele Hacks gleichzeitig laufen oder die Methode ständig wechselt, entsteht Chaos statt Tempo. Basics werden vergessen."],["Bei komplexen Entscheidungen","Dein Explorer will sofort ins Machen, dein Innovator sucht nach dem cleversten Weg. Zusammen erzeugt das oft einen „Ideen-Dschungel“ aus kreativen Alternativen, der das eigentliche Commitment verwässert. Du wirkst unzuverlässig – nicht aus Absicht, sondern weil die Entscheidung im Möglichkeitsraum verschwimmt."],["In Deadline-Phasen","Kurz vor der Ziellinie sieht dein Innovator die Chance, das Ergebnis noch einmal auf ein neues Level zu heben. Dein Explorer findet das verlockend. Das Ergebnis: Scope-Sprünge und späte Optimierungen, die das Team verunsichern und die Deadline gefährden."],["In schwierigen Feedbackgesprächen","Dein Explorer will locker und motivational bleiben, dein Innovator spricht lieber über Potenziale als das Problem zu benennen. Die Kritik wird in Visions-Sprech verpackt – spannend, inspirierend, aber ohne die nötige Klarheit darüber, was sich konkret ändern muss."]]},"explorer_sage":{"name":"Der Purpose Explorer","hook":"Du suchst nicht nur neue Wege – du suchst den richtigen. Diese Kombination verbindet Neugier und Bewegungsfreude mit tiefem Sinnverständnis und Integrität. Du willst nicht nur irgendwo ankommen – du willst wissen, warum es sich lohnt.","merk":[["Sinnzentrierte Exploration.","Du verbindest die Lust am Abenteuer mit der Suche nach tieferer Bedeutung. Entdeckung ist für dich kein Selbstzweck – sie führt dich zu echten Erkenntnissen."],["Reflektierte Spontaneität.","Du nutzt Erlebnisse und Entdeckungen als Material für persönliches Wachstum. Du lernst nicht nur im Tun – du machst aus dem Tun Prinzipien."],["Wertebasierte Flexibilität.","Du bleibst in der Sache beweglich, orientierst dich dabei aber an einem unbestechlichen inneren Kompass. Flexibilität endet für dich dort, wo Integrität beginnt."],["Authentischer Aufbruch.","Du suchst nicht den oberflächlichen Kick, sondern Wege, die mit deiner eigenen Wahrheit im Einklang stehen. Das macht dich besonders glaubwürdig – auch wenn du improvisierst."],["Ganzheitliches Lernen.","Du verknüpfst das einfache Machen mit der Fähigkeit, das Erlebte klug einzuordnen und daraus Prinzipien zu bilden. Du wirst nicht nur reicher an Erfahrung – sondern an Weisheit."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Explorer einfach losziehen – dein Sage hält inne und fragt: Wie machen wir das respektvoll? Was ist das Prinzip dahinter? Das ist wertvoll, aber im echten Zeitdruck erleben andere das als Prinzipienrede, während die Uhr tickt."],["Bei komplexen Entscheidungen","Dein Explorer will den Weg freihalten, dein Sage will sicherstellen, dass die Entscheidung fachlich korrekt und integer ist. Die Kombination kann dich in eine Prinzip-Blockade führen: Bevor du Ja sagst, muss alles stimmen – was dich unentschlossen wirken lässt."],["In Deadline-Phasen","Kurz vor dem Abschluss erkennt dein Sage eine fachliche Unschärfe – einen Widerspruch zur ursprünglichen Logik. Der Drang zur Korrektur ist stark. Dein Explorer sieht das als spannende letzte Runde. Das Ergebnis: entweder Scope-Chaos oder eine Analyse-Paralyse kurz vor dem Ziel."],["In schwierigen Feedbackgesprächen","Dein Explorer will locker und motivierend bleiben, dein Sage will die volle Wahrheit aussprechen und Haltung und Werte thematisieren. Die Kombination führt entweder zu einer zu weichen Botschaft – oder zu einer moralischen Standpauke, die das Gegenüber eher demotiviert als entwickelt."]]},"explorer_strategist":{"name":"Der Smart Adventurer","hook":"Du improvisierst – aber mit Methode. Diese Kombination verbindet spontane Beweglichkeit mit vorausschauender Planung. Du bist nicht nur schnell – du bist klug schnell. Deine Erfahrungen werden nicht nur erlebt, sondern verwandeln sich in belastbare Muster.","merk":[["Strukturierte Beweglichkeit.","Du verbindest die Spontaneität des Entdeckers mit der vorausschauenden Planung des Strategen. Du brauchst keine vollständige Karte – aber du weißt, welche Ankerpunkte du brauchst."],["Effiziente Erfahrung.","Du verwandelst Erlebnisse und Learning by Doing systematisch in bewährte Muster und Prozesse. Andere sammeln Erfahrungen – du machst daraus Methoden."],["Methodischer Vorwärtsdrang.","Du nutzt Struktur nicht als Bremse, sondern als Anker, um sicherer und schneller zu improvisieren. Dein Strategist gibt deinem Explorer die Starthilfe, nicht den Stopp."],["Priorisierte Flexibilität.","Du erkennst instinktiv den nächsten logischen Schritt, um unnötige Umwege bei der Exploration zu vermeiden. Du bist flexibel – aber nicht beliebig."],["Adaptive Planung.","Du entwickelst Konzepte, die robust genug für die Realität und flexibel genug für spontane Chancen sind. Das ist eine seltene Kombination aus Verlässlichkeit und Agilität."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Explorer einfach loslegen – dein Strategist fordert eine klare Reihenfolge und das Identifizieren von Engpässen. Du fühlst dich zerrissen. Versuchst du Abkürzungen zu nehmen, reagiert der Strategist-Teil in dir genervt, weil die fehlende Ordnung als Risiko wahrgenommen wird."],["Bei komplexen Entscheidungen","Dein Explorer will sofort liefern und die Dynamik nutzen, dein Strategist mahnt zur Vorsicht und will Trade-offs und Prioritäten klären. Du schwankst zwischen einem schnellen Ja und einem späten Blockieren – was beides Vertrauen kostet."],["In Deadline-Phasen","Der Explorer will schnelle Test-Loops drehen und im Tun optimieren – der Strategist schaltet in den Schutzmodus für den kritischen Pfad. Das Ergebnis: Scope-Sprünge durch neue Ideen gefährden die Deadline, weil die methodische Strenge durch den Drang nach Abwechslung verwässert wird."],["In schwierigen Feedbackgesprächen","Dein Explorer will locker und motivierend bleiben, dein Strategist verlangt Klarheit, Messbarkeit und einen konkreten Plan. Du schwankst zwischen kumpelhaftem Ton und fast technischer Kühle – und findest keinen Mittelpunkt, der beides wirklich verbindet."]]},"guardian_commander":{"name":"Der Firm Protector","hook":"Du führst konsequent – und hast dabei immer die Menschen im Blick. Diese Kombination verbindet echte Fürsorge mit klarer Kante in Bezug auf Grenzen und Standards. Du bist gleichzeitig fordernd und loyal – und das ist eine seltene Qualität.","merk":[["Schützende Entschlossenheit.","Du verbindest menschliche Fürsorge mit einer klaren Kante in Bezug auf Grenzen und Standards. Du bist nicht nett auf Kosten der Sache – du bist beides."],["Verantwortungsvolle Führung.","Du übernimmst in Krisen sofort das Steuer, um das Team vor Chaos und Fehlentscheidungen zu bewahren. Dein Schutz zeigt sich in Richtung, nicht nur in Wärme."],["Konsequente Loyalität.","Du bleibst hart in der Sache und zutiefst unterstützend gegenüber den Menschen. Diese Kombination macht dich zu einer Führungsperson, der andere wirklich vertrauen."],["Strukturiertes Momentum.","Du bringst Projekte durch klare Ansagen pünktlich ins Ziel, ohne die soziale Stabilität zu opfern. Bei dir entsteht Verbindlichkeit ohne Kälte."],["Pragmatische Fürsorge.","Du nutzt Führung als Werkzeug, um für das Team Sicherheit, Verlässlichkeit und klare Orientierung zu schaffen. Fürsorge ist für dich kein Gefühl – sie ist eine Handlung."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, prallen zwei Impulse aufeinander: Dein Guardian möchte alles ordentlich und sicher machen, dein Commander will sofort loslegen. Das Ergebnis: Du gibst sehr viele Anweisungen. Wenn Widerstand kommt oder die Zeit weiterläuft, wird dein Ton schärfer als beabsichtigt. Das Umfeld fühlt sich bevormundet statt geführt."],["Bei komplexen Entscheidungen","Dein Commander will entscheiden, dein Guardian will zusätzlich absichern, dass das Team nicht überlastet wird und keine Fehler entstehen. Diese Spannung kann dich in eine Dauernachkontrolle führen: Du triffst Entscheidungen, vertraust ihnen aber nicht ganz – was sowohl nach oben als auch nach unten Unsicherheit erzeugt."],["In Deadline-Phasen","Kurz vor dem Ziel bekommt dein Guardian eine Qualitätspanik – alles noch einmal prüfen, absichern, nichts Halbgares abliefern. Dein Commander will den Sack zumachen. Das Ergebnis: späte Review-Schleifen und Mikromanagement in der Endphase, die das Team verunsichern, kurz bevor alle nur noch ins Ziel wollen."],["In schwierigen Feedbackgesprächen","Du willst fair sein. Du sammelst Beispiele, um die Kritik wasserdicht zu machen. Dein Commander will Klartext. Das Ergebnis: das Feedback wirkt entweder zu hart – oder durch die Menge an Belegen so erdrückend, dass das Gegenüber sich angegriffen fühlt statt entwickelt."]]},"guardian_explorer":{"name":"Der Safe Adventurer","hook":"Du ermöglichst Wachstum und neue Erfahrungen, ohne die Essentials aus den Händen zu geben. Diese Kombination verbindet Offenheit und Beweglichkeit mit einem stabilen Sicherheitsnetz. Du bist der Begleiter, dem andere vertrauen, wenn sie etwas Neues wagen.","merk":[["Sicherer Komfortzonen-Austritt.","Du ermöglichst Wachstum und neue Erfahrungen, indem du die wesentlichen Grundlagen stets im Griff behältst. Neues fühlt sich bei dir sicher an."],["Pragmatische Verlässlichkeit.","Du nutzt Explorer-Tempo, um Guardian-Routinen effizienter zu gestalten, ohne die Sorgfalt zu verlieren. Schnell und verlässlich schließt sich bei dir nicht aus."],["Flexibler Schutz.","Du bleibst offen für spontane Lösungen und achtest dabei sensibel auf die Stabilität des Umfelds. Flexibilität endet für dich nicht auf Kosten der Sicherheit anderer."],["Kontrolliertes Loslassen.","Du findest die Balance zwischen lückenloser Absicherung und echtem Vertrauen in deine Improvisationskraft. Das ist eine Stärke, die viele nie entwickeln."],["Nachhaltige Neugier.","Du erkundest unbekanntes Terrain mit einem stabilen Sicherheitsnetz. Das schützt dich vor Überforderung – und macht deine Entdeckungen langfristig nutzbar."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Explorer einfach loslegen – dein Guardian will sicherstellen, dass nichts vergessen wird. Innerlich entsteht ein Konflikt: Du fühlst dich schlampig, wenn du abkürzst. Also kontrollierst du nach – und erzeugst genau den Stress, den du vermeiden wolltest."],["Bei komplexen Entscheidungen","Dein Explorer will sofort ins Machen, dein Guardian sorgt sich um Team und Qualität. Du steckst fest zwischen Vorwärtsdrang und der Angst, durch ein zu schnelles Ja jemanden zu enttäuschen. Das Ergebnis: entweder eine zu schnelle Zusage oder eine Blockade aus vager Sorge – beides kostet Vertrauen."],["In Deadline-Phasen","Der Explorer will schnelle Test-Loops drehen, der Guardian bekommt eine Qualitätspanik. Du schwankst zwischen spielerischem Ausprobieren und dem Drang, alles noch einmal zu prüfen. Das Ergebnis: Scope-Sprünge und späte Review-Schleifen, die das Team verunsichern und die Deadline gefährden."],["In schwierigen Feedbackgesprächen","Dein Explorer will locker und motivational bleiben, dein Guardian sammelt unzählige Beispiele für eine faire Beweisführung. Das Ergebnis: entweder zu weich (Botschaft kommt nicht an) oder durch zu viele Beispiele so schwer, dass das Gegenüber demotiviert statt entwickelt wird."]]},"guardian_innovator":{"name":"Der Modernizer","hook":"Du erneuerst – mit Rücksicht auf die Menschen, die den Wandel mittragen müssen. Diese Kombination verbindet Kreativität und Aufbruch mit dem echten Anspruch, niemanden zurückzulassen. Du bist derjenige, der Neues möglich macht, ohne das Fundament zu erschüttern.","merk":[["Stabilisierte Erneuerung.","Du erneuerst bestehende Systeme schrittweise, ohne das Fundament an Sicherheit und Vertrauen zu gefährden. Wandel fühlt sich bei dir tragfähig an."],["Verantwortungsbewusste Kreativität.","Du findest neue Wege, die nicht nur originell, sondern auch verlässlich für das Team sind. Innovation ist für dich kein Selbstzweck."],["Methodische Leichtigkeit.","Du nutzt kreative Hacks und spielerische Elemente, um starre Routinen aufzubrechen. Das reduziert Stress, ohne Sorgfalt zu opfern."],["Sicherheitsorientierte Vision.","Du entwickelst zukunftsgerichtete Lösungen mit einem stabilen Sicherheitsnetz. Deine Visionen haben Boden unter den Füßen."],["Empathische Optimierung.","Du verbesserst Prozesse mit dem Ziel, die Belastung für Menschen zu senken. Effizienz ist für dich ein Werkzeug der Fürsorge."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, versucht dein Innovator, den Druck durch ein Spiel oder einen kreativen Hack aufzulösen. Dein Guardian traut dem Hack nicht vollends und kontrolliert trotzdem nach. Das Ergebnis: Der Innovator will Leichtigkeit, der Guardian erzeugt durch Nachkontrolle neuen Stress. Das Umfeld reagiert genervt auf die Mischung aus Spielangebot und Kontrollzwang."],["Bei komplexen Entscheidungen","Dein Innovator sieht einen kreativen Shortcut, dein Guardian sorgt sich um die Belastbarkeit des Teams. Du gibst entweder zu schnell Ja, weil der Shortcut verlockend klingt – und bekommst dann Guardian-Panik, ob das Team das schafft. Oder du blockierst aus Vorsicht, was dich wenig dynamisch wirken lässt."],["In Deadline-Phasen","Dein Guardian will alles absichern und keine Überraschungen riskieren. Dein Innovator sieht kurz vor Schluss die Chance, das Ergebnis noch zu optimieren oder ein besseres Tool einzuführen. Das Ergebnis: gefährlicher Scope-Creep und eine gleichzeitige Qualitätspanik – ein erschöpftes Team und eine wackelnde Deadline."],["In schwierigen Feedbackgesprächen","Dein Guardian will fair sein und sammelt viele Beispiele. Dein Innovator will motivieren und Potenziale aufzeigen. Das Gespräch schwankt zwischen Mängelliste und visionärem Zukunftstalk – ohne klare Brücke zwischen beiden."]]},"guardian_sage":{"name":"Der Compassionate Stabilizer","hook":"Du gibst anderen nicht nur Sicherheit – du gibst ihnen Sinn. Diese Kombination verbindet Empathie und Fürsorge mit tiefer Klarheit und Integrität. Du bist derjenige, dem andere vertrauen, wenn es ums Wesentliche geht.","merk":[["Sinnstiftende Fürsorge.","Du verbindest praktische Unterstützung mit emotionaler Tiefe und echtem Verständnis für die Bedürfnisse anderer. Deine Fürsorge hat immer einen Sinn dahinter."],["Reflektierte Stabilität.","Du schaffst Sicherheit, die nicht nur auf Regeln, sondern auf innerer Klarheit und gemeinsamen Werten basiert. Das ist Stabilität, die trägt."],["Empathische Souveränität.","Du bleibst auch in Krisen besonnen und bietest anderen durch Sachlichkeit und Mitgefühl einen sicheren Halt. Beides gleichzeitig ist deine seltene Stärke."],["Integrität in der Gemeinschaft.","Du achtest darauf, dass das Handeln im Team stets mit dem moralischen Kompass im Einklang steht. Das schafft ein Fundament, auf dem andere aufbauen können."],["Behutsame Entwicklung.","Du begleitest Veränderungsprozesse durch kluge Einordnung und das Bewahren menschlicher Würde. Wandel braucht bei dir keine Opfer."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Guardian alles ordentlich machen – und dein Sage bringt die Ebene von Haltung und Sinn ein. Du willst nicht nur pünktlich loskommen, sondern dabei auch respektvoll bleiben. Das Ergebnis: Prinzipienreden, während die Uhr tickt. Das Umfeld reagiert mit Widerstand statt Kooperation."],["Bei komplexen Entscheidungen","Dein Guardian will die Teamstabilität schützen, dein Sage mahnt zur Integrität: Du willst nichts versprechen, was nicht der Wahrheit entspricht. Die Kombination führt zu einer Prinzip-Blockade – du wirkst unentschlossen, obwohl du eigentlich sehr klar bist."],["In Deadline-Phasen","Dein Guardian will absichern und Review-Schleifen drehen. Dein Sage entdeckt kurz vor Schluss eine fachliche Unschärfe. Du schwankst zwischen pünktlicher Lieferung und dem Drang nach einer fachlich lückenlosen Lösung. Das Ergebnis: eine Perfektionsspirale, die die Deadline gefährdet und das Team das Gefühl gibt, ihre bisherige Arbeit sei nicht gut genug gewesen."],["In schwierigen Feedbackgesprächen","Dein Guardian sammelt Beispiele für Fairness, dein Sage will die volle Wahrheit und das dahinterliegende Prinzip klären. Das Ergebnis: das Feedback wird zu lang, zu moralisch beladen, zu ernst. Der Mitarbeiter fühlt sich belehrt statt entwickelt."]]},"guardian_strategist":{"name":"Der Process Anchor","hook":"Du schaffst stabile Strukturen, die Menschen entlasten statt einengen. Diese Kombination verbindet menschliche Fürsorge mit methodischer Verlässlichkeit. Du bist derjenige, der ein System so aufbaut, dass es auch ohne ständigen Eingriff trägt.","merk":[["Systematische Verlässlichkeit.","Du verbindest menschliche Fürsorge mit stabilen, logisch durchdachten Abläufen. Bei dir ist Struktur kein Selbstzweck – sie dient den Menschen."],["Präventive Struktur.","Du erkennst Engpässe frühzeitig und etablierst Prozesse statt Feuerwehraktionen. Das gibt dem Team Stabilität vor dem Problem, nicht nach."],["Methodische Sorgfalt.","Du sicherst Qualität durch klare Standards und exzellente Priorisierung. Genauigkeit ist für dich eine Form von Respekt gegenüber anderen."],["Vorausschauende Stabilität.","Du schaffst Sicherheit durch kluge Szenarioplanung und das Verhandeln notwendiger Trade-offs. Du schützt das System, bevor es unter Druck gerät."],["Effiziente Routine.","Du verwandelst wiederkehrende Aufgaben in hocheffiziente Systeme, die dem gesamten Team Halt geben. Deine Routinen sind Fürsorge in strukturierter Form."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, schaltet dein Strategist sofort in Bottleneck-Denken: Reihenfolge identifizieren, Engpass lösen, Rollen delegieren. Dein Guardian will gleichzeitig sicherstellen, dass niemand überfordert wird. Das Ergebnis: zu rigide Vorgaben – und wenn andere dem optimierten Ablauf nicht folgen, reagierst du ungeduldig oder kühl-fordernd."],["Bei komplexen Entscheidungen","Dein Guardian sorgt sich um die Belastung des Teams, dein Strategist beginnt sofort mit der Verhandlung von Bedingungen und Trade-offs. Du steckst fest zwischen Loyalität und Logik – und neigst entweder zum stillen Schlucken der Mehrarbeit oder zu komplexen Risikoanalysen, die die Entscheidung blockieren."],["In Deadline-Phasen","Dein Guardian will absichern und Review-Schleifen drehen, dein Strategist fokussiert sich auf den kritischen Pfad. Beide wollen das Richtige – aber kombiniert entstehen späte Nachkontrolle und Scope-Creep, die das Team erschöpfen und die Deadline gefährden."],["In schwierigen Feedbackgesprächen","Dein Guardian will fair sein und sammelt Beispiele, dein Strategist will sofort einen messbaren Entwicklungsplan liefern. Das Ergebnis: das Feedback wirkt zu lang, zu korrekt, fast technisch. Die menschliche Ebene geht unter der Last von Beweisführung und Entwicklungsplan verloren. Das Gegenüber fühlt sich verwaltet statt gecoacht."]]},"innovator_commander":{"name":"Der Vision-Executor","hook":"Du denkst groß – und du setzt um. Diese Kombination verbindet das Öffnen neuer Räume mit dem entschlossenen Willen, sie auch zu betreten. Du bist nicht nur Ideengeber – du bist der Macher hinter der Vision.","merk":[["Visionäre Tatkraft.","Du verbindest das Großdenken mit einer konsequenten Umsetzung. Du weißt: Eine Idee, die nicht geliefert wird, verändert nichts."],["Entscheidungsfreudige Neuerung.","Du nutzt Führung und Verantwortung, um unkonventionelle Visionen in die Realität zu bringen. Du wartest nicht auf Erlaubnis – du schaffst Fakten."],["Fokussierte Inspiration.","Du schaffst einen klaren Cut zwischen kreativer Ideenfindung und der disziplinierten Lieferung von Ergebnissen. Das macht dich in Umsetzungsphasen außergewöhnlich wirksam."],["Durchsetzungsstarker Weitblick.","Du führst Teams mutig durch Veränderungsprozesse und hältst auch in komplexem Gelände den Kurs. Unsicherheit macht dich nicht langsamer – sie macht dich entschlossener."],["Ergebnisorientierte Agilität.","Du nutzt kreative Freiheit als Basis für schnelles Handeln und klare Meilensteine. Flexibilität und Lieferung schließen sich bei dir nicht aus."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, startest du locker-kreativ – und schaltest dann abrupt auf deinen Commander um: scharfe Ansagen, Druck auf Tempo. Das Umfeld erlebt einen Stimmungsbruch. Erst spielerisch, dann plötzlich fordernd – das erzeugt Verwirrung und Widerstand statt Kooperation."],["Bei komplexen Entscheidungen","Dein Innovator sieht neue Möglichkeiten, dein Commander will sofort Stärke zeigen und Verantwortung übernehmen. Kombiniert führt das zu zu schnellen Zusagen, ohne die Machbarkeit oder die Konsequenzen für das Team wirklich zu prüfen. Der Commander geht ins Commitment, bevor der Innovator die Idee kritisch hinterfragt hat."],["In Deadline-Phasen","Kurz vor dem Abschluss sieht dein Innovator die eigentlich guten Möglichkeiten – und dein Commander will den Sack zumachen. Du erzeugst durch den „letzten genialen Einfall“ Chaos im Team, während du gleichzeitig Verbindlichkeit für die Lieferung einforderst. Beides zusammen ist das, was Teams erschöpft."],["In schwierigen Feedbackgesprächen","Dein Innovator spricht über Potenziale und Visionen, dein Commander schiebt direkt harte Forderungen nach. Das Ergebnis: Das Feedback ist eine Mischung aus hohem Druck und visionärer Erwartung – zu viel auf einmal. Das Gegenüber spürt den Druck, weiß aber nicht, was der erste konkrete Schritt in der Realität ist."]]},"innovator_explorer":{"name":"Der Field Tester","hook":"Du willst nicht nur denken – du willst erleben. Diese Kombination bringt Ideen direkt in die Realität und lernt im Tun. Du validierst nicht in Präsentationen – du validierst im Feld.","merk":[["Pragmatische Neugier.","Du verbindest innovative Ideen direkt mit dem Drang, sie in der Realität auszuprobieren. Theorie ist für dich der Anfang – nicht das Ziel."],["Schnelles Feedback-Looping.","Du lernst am liebsten durch direktes Tun in der echten Welt statt durch Analyse. Deine Iterationsgeschwindigkeit ist außergewöhnlich."],["Improvisationsstarke Umsetzung.","Du findest kreative Lösungen oft spontan während des Gehens. Learning by Doing ist deine natürliche Arbeitsweise."],["Dynamische Beweglichkeit.","Du passt Visionen blitzschnell an neues Feedback an. Du hängst nicht an Ideen – du hängst an Ergebnissen."],["Ergebnisorientierter Realitätscheck.","Du validierst neue Konzepte durch mutiges Handeln und unmittelbares Erleben. Das gibt deinen Ideen ein Fundament, das andere Ideengeber oft vermissen."]],"mod":[["Im Alltag unter Zeitdruck","Du startest kreativ und willst einfach losziehen – Hauptsache in Bewegung, den Rest klärst du unterwegs. Das funktioniert oft. Aber Basics werden vergessen, und der Folgestress am Tag überholt die Leichtigkeit des Aufbruchs. Mitmenschen fühlen sich gehetzt statt mitgenommen."],["Bei komplexen Entscheidungen","Dein Innovator sagt schnell „Kriegen wir hin“, dein Explorer findet sofort einen kreativen Shortcut. Kombiniert führt das zu Zusagen ohne Absicherung und einer Richtung, die sich während der Umsetzung noch mehrfach ändert. Für andere wirkt das unzuverlässig – auch wenn es in dir einfach nur lebendig ist."],["In Deadline-Phasen","Der Innovator sieht Optimierungspotenzial, der Explorer will schnelle Field-Loops drehen. Zusammen entstehen ständig neue Test-Ideen – und am Ende wird viel ausprobiert, aber nichts fertig geshippt. Das Team verliert das Vertrauen in die Verbindlichkeit."],["In schwierigen Feedbackgesprächen","Dein Innovator spricht über Potenziale, dein Explorer hält die Stimmung locker und kumpelhaft. Das Ergebnis: gute Atmosphäre, aber keine messbare Verhaltensänderung danach. Die Dringlichkeit geht in der Leichtigkeit unter."]]},"innovator_guardian":{"name":"Der Safe Innovator","hook":"Du erneuerst – aber du lässt dabei niemanden zurück. Diese Kombination verbindet kreative Aufbruchsenergie mit echter Fürsorge für die Menschen, die den Wandel mittragen müssen. Du bist derjenige, der Neues möglich macht, ohne das Fundament zu erschüttern.","merk":[["Stabilisierte Erneuerung.","Du erneuerst bestehende Systeme schrittweise, ohne das Fundament an Sicherheit und Vertrauen zu gefährden. Wandel fühlt sich bei dir tragfähig an."],["Verantwortungsbewusste Kreativität.","Du findest neue Wege, die nicht nur originell, sondern auch verlässlich und tragfähig für das Team sind. Innovation ist für dich kein Selbstzweck."],["Methodische Leichtigkeit.","Du nutzt kreative Hacks und spielerische Elemente, um starre Routinen aufzubrechen und Stress zu reduzieren. Das ist Fürsorge in Innovationsform."],["Sicherheitsorientierte Vision.","Du entwickelst zukunftsgerichtete Lösungen mit einem stabilen Sicherheitsnetz für alle Beteiligten. Deine Visionen haben Boden unter den Füßen."],["Empathische Optimierung.","Du verbesserst Prozesse mit dem Ziel, die Belastung für Menschen zu senken. Effizienz ist für dich ein Werkzeug der Fürsorge, nicht der Kontrolle."]],"mod":[["Im Alltag unter Zeitdruck","Du startest kreativ und locker – und mitten im Prozess zieht dich dein Guardian in Sorgfalt und Absicherung. Du wirst ungeduldig, wenn andere deine Standards nicht teilen, oder kippst in kleinteilige Kontrolle, die die ursprüngliche Leichtigkeit zerstört."],["Bei komplexen Entscheidungen","Dein Innovator sieht sofort neue Möglichkeiten, dein Guardian sorgt sich um Team und Qualität. Kombiniert: entweder zu schnelles Ja mit anschließender Guardian-Panik, oder Blockade aus Vorsicht, die dich wenig dynamisch wirken lässt."],["In Deadline-Phasen","Der Innovator will den letzten Schliff, der Guardian will absolute Absicherung und Review-Schleifen. Beides zusammen erzeugt gefährlichen Scope-Creep und eine Late-Phase-Qualitätspanik. Das Team ist erschöpft, die Deadline wackelt."],["In schwierigen Feedbackgesprächen","Dein Innovator will inspirieren und Potenziale aufzeigen, dein Guardian sammelt unzählige Beispiele für eine faire Beweisführung. Das Gespräch schwankt zwischen visionärem Potenzial-Talk und schwerer Beweislast. Das Gegenüber fühlt sich entweder erdrückt oder die eigentliche Botschaft geht in den vielen Möglichkeiten verloren."]]},"innovator_sage":{"name":"Der Meaning Maker","hook":"Du erschaffst nicht nur Neues – du gibst ihm Sinn. Diese Kombination verbindet kreative Visionen mit intellektuellem Tiefgang und ethischer Substanz. Du bist nicht nur derjenige, der neue Wege öffnet – du bist derjenige, der erklärt, warum sie sich lohnen.","merk":[["Inspirierende Substanz.","Du verbindest kreative Visionen mit intellektuellem Tiefgang und fundierter Logik. Deine Ideen sind nicht nur neu – sie sind durchdacht."],["Reflektierte Erneuerung.","Du hinterfragst den Status quo nicht nur, um anders zu sein, sondern um eine tiefere Wahrheit zu finden. Das gibt deinen Ideen eine Qualität, die andere nicht einfach kopieren können."],["Wertebasierte Vision.","Du entwickelst Ideen, die nicht nur neuartig, sondern ethisch fundiert und langfristig stimmig sind. Das schafft Vertrauen in einer Zeit, in der viele misstrauen."],["Analytische Kreativität.","Du nutzt messerscharfe Mustererkennung, um aus komplexen Informationen völlig neue Konzepte zu formen. Tiefe und Breite gleichzeitig – das ist selten."],["Sinnstiftende Innovation.","Du erklärst und verankerst das Neue so, dass es für andere eine klare Orientierung bietet. Deine Visionen führen, statt zu verwirren."]],"mod":[["Im Alltag unter Zeitdruck","Du startest kreativ und locker – dann schaltet sich dein Sage ein und will mitten in der Hektik Sinn vermitteln: Grundsatzrede über Pünktlichkeit als Wertschätzung, während die Uhr tickt. Das Umfeld reagiert genervt. Ihr kommt trotz guter Absicht zu spät."],["Bei komplexen Entscheidungen","Dein Innovator will den Weg visionär freimachen, dein Sage mahnt zur Integrität und will keine Zusage geben, die nicht der Wahrheit entspricht. Die Kombination führt zu einer Wahrheitsblockade – du wirkst unentschlossen, obwohl du eigentlich sehr klar bist."],["In Deadline-Phasen","Der Innovator sieht neue Verbesserungsmöglichkeiten, der Sage will kurz vor Schluss die Grundlogik noch einmal auf Korrektheit prüfen. Das Ergebnis: gefährliche Late Corrections und Perfektionsschleifen, die die Deadline gefährden und das Team erschöpfen."],["In schwierigen Feedbackgesprächen","Dein Innovator spricht über Potenziale, dein Sage will die volle Wahrheit und das dahinterliegende Prinzip vermitteln. Das Gespräch wird philosophisch und moralisch aufgeladen. Das Gegenüber fühlt sich erkannt – aber weiß nicht, was es morgen früh konkret anders machen soll."]]},"innovator_strategist":{"name":"Der System-Designer","hook":"Du visionierst – und du baust das System, das deine Vision trägt. Diese Kombination verbindet kreative Kraft mit methodischer Präzision. Du bist nicht nur derjenige, der neue Ideen hat – du bist derjenige, der sie skalierbar macht.","merk":[["Strukturierte Vision.","Du verbindest kreative Ideen mit einer belastbaren Architektur und klaren Prioritäten. Deine Ideen haben nicht nur Flügel – sie haben Fundament."],["Systematische Innovation.","Du verwandelst unkonventionelle Sprünge in skalierbare und wiederholbare Prozesse. Das macht dich in Aufbauphasen außergewöhnlich wirksam."],["Analytische Hebelkraft.","Du identifizierst präzise die entscheidenden Engpässe, um Visionen effizient umzusetzen. Du siehst nicht nur den nächsten Schritt – du siehst den richtigen."],["Methodische Planung.","Du baust stabile Pfade für neue Konzepte durch Szenarioplanung und Logik. Wandel braucht bei dir kein Chaos als Begleiterscheinung."],["Logische Optimierung.","Du verbesserst Abläufe kontinuierlich, ohne den Blick für das große Ganze zu verlieren. Struktur und Richtung gehören bei dir zusammen."]],"mod":[["Im Alltag unter Zeitdruck","Du startest kreativ – dann schaltet dein Strategist sofort ins Bottleneck-Denken: Reihenfolge analysieren, Engpass identifizieren, Rollen delegieren. Du optimierst so lange an der Struktur, dass ihr den Moment zum Losgehen verpasst. Das Umfeld reagiert genervt auf die Mischung aus Spielangebot und prozessualer Strenge."],["Bei komplexen Entscheidungen","Dein Innovator will visionär vorangehen, dein Strategist will alle Abhängigkeiten klären. Du landest in einer Hebel-Blockade: zu viele Optionen, zu viele Szenarien, und der Entscheidungsmoment verstreicht. Für andere wirkst du unentschlossen – obwohl du in Wahrheit zu viel denkst."],["In Deadline-Phasen","Der Innovator sieht Last-Minute-Verbesserungen, der Strategist will die Abläufe kurz vor Schluss noch einmal straffen. Beides zusammen erzeugt entweder gefährliche Änderungen kurz vor der Deadline oder einen Plan-Overkill, der die eigentliche Ausführung lähmt."],["In schwierigen Feedbackgesprächen","Dein Innovator spricht über große Potenziale, dein Strategist will sofort ein strukturiertes Entwicklungs-Playbook liefern. Das Gespräch wird zu komplex: viele Frameworks, viele Ideen – aber kein klarer Text darüber, was aktuell falsch läuft. Die menschliche Ebene geht verloren."]]},"sage_commander":{"name":"Der Guiding Authority","hook":"Du denkst tief – und du setzt durch. Diese Kombination verbindet fundierte Erkenntnis mit entschlossener Führung. Du bist nicht nur derjenige, der die Wahrheit kennt – du bist derjenige, der ihr auch Wirkung verschafft.","merk":[["Fundierte Entscheidungskraft.","Du verbindest tiefes, logisches Abwägen mit der Fähigkeit, im entscheidenden Moment konsequent Position zu beziehen. Deine Entscheidungen haben Gewicht – weil sie Substanz haben."],["Wertebasierte Führung.","Du setzt klare Ziele, die auf einem festen Fundament aus Sinnhaftigkeit und Integrität stehen. Das gibt anderen nicht nur Richtung, sondern auch Vertrauen."],["Reflektierte Souveränität.","Du bleibst auch unter Druck besonnen – und kommst schneller aus dem Grübeln in eine sichtbare, leitende Rolle, als man dir zutraut."],["Integrität in Aktion.","Du garantierst Ergebnisse, die sowohl fachlich wahr als auch praktisch wirksam sind. Die Verbindung von beidem ist deine seltene Stärke."],["Klarheit durch Tiefe.","Du schaffst Orientierung für andere, indem du komplexe Zusammenhänge in einfache, entschlossene Handlungsschritte übersetzt."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Sage den tieferen Sinn klären – dein Commander übernimmt die Führung, um das Ziel zu retten. Das Ergebnis: Du wirkst abrupt streng. Das Umfeld erlebt dich als unvermittelt autoritär, weil der Übergang von Erklärung zu Ansage zu abrupt kommt – und du dich innerlich „unsauber“ fühlst, weil die Erklärung gefehlt hat."],["Bei komplexen Entscheidungen","Dein Sage will alle Perspektiven prüfen, bevor er etwas verspricht. Dein Commander will Stärke zeigen und sofort Verantwortung übernehmen. Du steckst fest zwischen dem Drang zur vollständigen Wahrheit und dem Druck zur Entschlossenheit – und landest entweder in zu langer Argumentation oder in einem Commitment, das du innerlich bereust."],["In Deadline-Phasen","Dein Sage will kurz vor Schluss noch Logikfehler ausräumen – das Ergebnis wäre sonst für ihn „wertlos“. Dein Commander will shippen. Kombiniert entstehen gefährliche Late Corrections, die das Team überfordern und die Lieferung gefährden."],["In schwierigen Feedbackgesprächen","Dein Sage will über Haltung und Prinzipien sprechen, dein Commander will klare Erwartungen setzen und Veränderung erzwingen. Das Gespräch schwankt zwischen philosophischer Schwere und hartem Leistungsdruck – und das Gegenüber fühlt sich moralisch bewertet statt professionell begleitet."]]},"sage_explorer":{"name":"Der Experiential Sage","hook":"Du suchst Wahrheit nicht nur im Denken – sondern im Erleben. Diese Kombination bringt deine Klarheit in Bewegung und gibt ihr den Realitätstest. Du bist nicht der Denker im Elfenbeinturm – du bist derjenige, der seine Erkenntnisse auf dem Weg findet.","merk":[["Geerdete Erkenntnis.","Du verknüpfst tiefe Reflexion und Sinnsuche mit realen Erfahrungen und praktischem Ausprobieren. Deine Einsichten haben Boden unter den Füßen."],["Pragmatische Klarheit.","Du nutzt Bewegung und Handeln, um aus dem rein Theoretischen in die wirksame Umsetzung zu kommen. Handeln ist für dich keine Alternative zum Denken – es ist seine Verlängerung."],["Bewegliche Wahrheit.","Du bleibst fachlich und moralisch integer, bist aber flexibel genug, um Lösungen im Tun anzupassen. Wahrheit ist für dich kein starres System, sondern ein Kompass."],["Authentische Neugier.","Du suchst nach Bedeutung nicht nur in der Analyse, sondern im aktiven Erleben. Das macht dein Lernen lebendig – und deine Erkenntnisse glaubwürdig."],["Souveräne Improvisation.","Du vertraust darauf, dass sich tiefere Einsichten oft erst im Prozess erschließen. Das gibt dir eine Leichtigkeit, die viele Sage-Typen nicht haben."]],"mod":[["Im Alltag unter Zeitdruck","Dein Sage will den Sinn von Regeln klären, dein Explorer zieht dich in Bewegung und Pragmatismus – „Raus hier, den Rest regeln wir unterwegs.“ Du fühlst dich innerlich unsauber, wenn die Erklärung fehlt. Wenn dann unterwegs Dinge vergessen werden, kippt die Stimmung in nachträgliche Strenge oder Grübelei."],["Bei komplexen Entscheidungen","Dein Explorer will den Weg freimachen und sofort ins Machen, dein Sage mahnt zur Integrität und will keine unhaltbaren Zusagen geben. Du steckst zwischen Drang und Bedenken – und landest entweder in einem zu schnellen Ja, das dich belastet, oder in einer zu komplexen Analyse, die dich unentschlossen wirken lässt."],["In Deadline-Phasen","Der Explorer will schnelle Test-Loops drehen und im Tun optimieren, der Sage will kein unsauberes Ergebnis abliefern. Kombiniert entstehen Scope-Sprünge und späte Korrekturen – du versuchst, das Ergebnis in letzter Sekunde noch wahrer zu machen, und gefährdest dabei die Lieferung."],["In schwierigen Feedbackgesprächen","Dein Explorer will locker und motivational bleiben, dein Sage will die volle Wahrheit ansprechen und über Prinzipien reden. Das Gespräch schwankt zwischen „ist doch alles nicht so wild“ und moralischer Schwere. Das Gegenüber weiß am Ende nicht, ob es ermutigt oder gerügt wurde."]]},"sage_guardian":{"name":"Der Steady Mentor","hook":"Du gibst anderen nicht nur Orientierung – du gibst ihnen Halt. Diese Kombination verbindet intellektuelle Klarheit mit menschlicher Wärme und Verlässlichkeit. Du bist derjenige, den andere in schwierigen Momenten suchen – weil du beides bist: klar und sicher.","merk":[["Empathische Führung.","Du verbindest tiefes menschliches Verständnis mit praktischer Fürsorge und Verlässlichkeit. Dein Denken ist nicht kalt – es ist mit Herz verbunden."],["Souveräne Stabilität.","Du schaffst in unsicheren Zeiten einen ruhigen, sicheren Raum, in dem sich Menschen gestärkt und orientiert fühlen. Das ist seltener als es klingt."],["Sinnstiftende Verlässlichkeit.","Du gibst Orientierung, die nicht nur auf Logik basiert, sondern auf stabilen Werten und sozialer Sicherheit. Menschen folgen dir, weil sie dir vertrauen – nicht nur weil du recht hast."],["Behutsame Begleitung.","Du führst Menschen durch Veränderungen, ohne sie zu drängen, und achtest auf deren Belastungsgrenzen. Das ist Führung mit langem Atem."],["Qualitätsorientierte Fürsorge.","Du behältst sowohl fachliche Wahrheit als auch die Stabilität der Beziehungen im Blick. Beides gleichzeitig ist deine seltene Stärke."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Sage den Sinn von Regeln klären – dein Guardian verlangt gleichzeitig Sorgfalt und Absicherung. Du wirst langsam durch das Verweilen in Details oder streng, wenn Regeln verletzt werden. Der Versuch, mitten im Zeitdruck Prinzipien zu vermitteln, erzeugt Widerstand statt der gewünschten Ruhe."],["Bei komplexen Entscheidungen","Dein Sage braucht fachliche Wahrheit, dein Guardian schützt die Teamstabilität. Kombiniert entsteht Angst vor dem falschen Ja: entweder verbiegst du die Wahrheit oder du verbrennst das Team. Das führt zu einem stillen Ja, bei dem am Ende die Qualität leidet – oder zu einem späten Blockieren, das Vertrauen kostet."],["In Deadline-Phasen","Dein Sage will fachliche Korrektheit, dein Guardian will zusätzlich lückenlose Absicherung und Review-Schleifen. Kombiniert entstehen endlose Prüfprozesse kurz vor dem Ziel – das Team ist erschöpft, die Deadline wackelt, und alle fragen sich, wann es endlich fertig ist."],["In schwierigen Feedbackgesprächen","Dein Sage will Wahrheit und Prinzipien ansprechen, dein Guardian sammelt unzählige Beispiele für Fairness. Das Ergebnis: zu lang, zu moralisch aufgeladen, zu viele Beispiele. Das Gegenüber fühlt sich eher belehrt als unterstützt."]]},"sage_innovator":{"name":"Der Insight Innovator","hook":"Du hinterfragst nicht nur – du erschaffst. Diese Kombination verbindet intellektuelle Tiefe mit kreativer Aufbruchsenergie. Du gibst Innovationen das Fundament, das sie tragfähig macht – und du gibst Erkenntnissen die Energie, die sie umsetzbar macht.","merk":[["Inspirierende Substanz.","Du verbindest kreative Visionen mit intellektuellem Tiefgang und fundierter Logik. Deine Ideen sind nicht nur neu – sie sind durchdacht und belastbar."],["Reflektierte Erneuerung.","Du hinterfragst den Status quo, um eine tiefere Wahrheit zu finden – nicht nur um anders zu sein. Das gibt deinen Ideen eine Qualität, die nicht einfach zu kopieren ist."],["Wertebasierte Vision.","Du entwickelst Ideen, die nicht nur neuartig, sondern ethisch fundiert und langfristig stimmig sind. In einer Zeit des schnellen Wandels ist das ein seltener Anker."],["Analytische Kreativität.","Du nutzt messerscharfe Mustererkennung, um aus komplexen Informationen völlig neue Konzepte zu formen. Tiefe und Breite gleichzeitig – das ist selten."],["Sinnstiftende Innovation.","Du erklärst und verankerst das Neue so, dass es für andere Orientierung bietet. Deine Visionen führen, statt zu verwirren."]],"mod":[["Im Alltag unter Zeitdruck","Dein Sage will Prinzipien sauber vermitteln, dein Innovator versucht gleichzeitig, den Druck durch eine spielerische Idee aufzulösen. Du wechselst zwischen pädagogisch und spielerisch – was auf andere unberechenbar wirkt. Mitten im Chaos hältst du noch eine Sinn-Erklärung, während die Zeit wegläuft."],["Bei komplexen Entscheidungen","Dein Sage will fachliche Wahrheit, dein Innovator sieht sofort einen kreativen Shortcut und will visionär vorangehen. Du steckst fest zwischen Vorwärtsdrang und Integritätssorge – und blockierst die Entscheidung durch zu komplexe Analyse der fachlichen Bedenken. Der Innovationsgeist wird durch die Wahrheitssuche gelähmt."],["In Deadline-Phasen","Dein Sage will fachliche Korrektheit, dein Innovator sieht kurz vor Schluss eine Möglichkeit zur massiven Optimierung. Kombiniert entstehen gefährliche späte Korrekturen und die Einführung neuer Tools – Perfektionismus und Last-Minute-Idee in einem. Das Team hat das Gefühl, dass die Regeln ständig geändert werden."],["In schwierigen Feedbackgesprächen","Dein Sage will Wahrheit und Prinzipien ansprechen, dein Innovator will inspirieren und Entwicklungsmöglichkeiten aufzeigen. Das Gespräch wird philosophisch und visionär – und das Gegenüber weiß am Ende nicht, was es morgen früh konkret anders machen soll."]]},"sage_strategist":{"name":"Der Systems Philosopher","hook":"Du verstehst die Welt – und du baust Systeme, die dieses Verständnis für andere nutzbar machen. Diese Kombination verbindet intellektuelle Tiefe mit methodischer Präzision. Du bist nicht nur derjenige, der die richtige Antwort kennt – du bist derjenige, der den Rahmen baut, in dem andere sie finden können.","merk":[["Strukturierte Erkenntnis.","Du übersetzt tiefe Einsichten in belastbare Rahmenwerke und klare Architektur. Deine Erkenntnisse bleiben nicht im Kopf – sie werden zum System."],["Analytische Integrität.","Du sicherst fachliche Wahrheit durch messerscharfe Logik und methodische Prüfung. Qualität ist für dich kein Ziel – sie ist Voraussetzung."],["Vorausschauende Besonnenheit.","Du bleibst unter Druck ruhig, weil du Situationen sofort in Modelle und Prioritäten einordnen kannst. Das gibt dir eine Souveränität, die andere Typen erst erarbeiten müssen."],["Logische Sinnstiftung.","Du erklärst den Sinn des Ganzen nicht nur philosophisch, sondern machst ihn durch Prozesse greifbar und umsetzbar. Das ist eine seltene Verbindung."],["Methodische Tiefe.","Du verbindest die Suche nach dem Wesentlichen mit der Fähigkeit, den effizientesten Weg dorthin zu entwerfen. Tiefe und Effizienz schließen sich bei dir nicht aus."]],"mod":[["Im Alltag unter Zeitdruck","Dein Sage will Prinzipien vermitteln, dein Strategist baut sofort einen optimierten Ablauf. Du wirst kühl oder technisch im Ton – „Das ist nur ein Prozessproblem“ – und optimierst so lange, dass du statt zu handeln weiter nachdenkst. Das erhöht den Stress, statt ihn zu senken."],["Bei komplexen Entscheidungen","Dein Sage will die absolut wahre Lösung, dein Strategist sucht den besten strategischen Hebel. Kombiniert landest du in einer Analyse-Paralyse: zu viele Optionen, zu viele Szenarien – du wirkst für andere kompliziert oder entscheidungsschwach, obwohl du in Wahrheit präziser denkst als alle anderen im Raum."],["In Deadline-Phasen","Dein Sage will fachliche Korrektheit, dein Strategist schützt den kritischen Pfad vor Verzettelung. Du versuchst kurz vor der Deadline, die Logik noch einmal zu korrigieren oder das System umzustellen – was das Team lähmt und die Lieferung paradoxerweise gefährdet."],["In schwierigen Feedbackgesprächen","Dein Sage will Wahrheit und Prinzipien vermitteln, dein Strategist will einen messbaren Entwicklungsweg liefern. Das Gespräch wird zu komplex: tiefe Reflexion plus strukturiertes Framework – der Mitarbeiter fühlt sich analysiert, aber nicht wirklich gehört."]]},"strategist_commander":{"name":"Der Decisive Strategist","hook":"Du planst präzise – und du setzt durch. Diese Kombination verbindet methodische Weitsicht mit unaufhaltsamer Umsetzungsenergie. Du bist nicht nur derjenige, der den besten Weg kennt – du bist auch derjenige, der ihn geht.","merk":[["Strukturierte Tatkraft.","Du verbindest methodische Weitsicht mit hoher Umsetzungsgeschwindigkeit. Qualität und Tempo schließen sich bei dir nicht aus – du weißt, wann es Zeit ist, von der Planung in die Ausführung zu wechseln."],["Entschlussfreudige Ordnung.","Du nutzt präzise Systeme nicht als Selbstzweck, sondern als Basis für schnelle Entscheidungen. Struktur ist bei dir kein Hemmnis – sie ist der Startblock."],["Radikaler Ergebnisfokus.","Du schneidest durch Komplexität hindurch, um den effizientesten Weg zum Ziel zu finden. Du weißt: Das beste Modell nützt nichts, wenn es nicht geliefert wird."],["Methodische Führung.","Du führst Teams durch klare Prozesse, kombiniert mit direkter, unverblümter Kommunikation. Bei dir weiß jeder, was gilt – und warum."],["Qualitäts-Momentum.","Du gewährleistest exzellente Ergebnisse, ohne dich in der Analyse-Falle zu verlieren. Das ist die seltene Fähigkeit, Durchdachtheit und Geschwindigkeit zu verbinden."]],"mod":[["Im Alltag unter Zeitdruck","Wenn es schnell gehen muss, will dein Strategist den Ablauf noch kurz optimieren – dein Commander will sofort loslegen und erzwingt das Ergebnis durch Willenskraft. Du wirst ungeduldig und scharf, wenn andere den Ablauf stören. Du überspringst Kommunikation und kompensierst fehlende Flexibilität mit Härte."],["Bei komplexen Entscheidungen","Dein Strategist will alle Risiken ausschließen und wartet auf die letzte Information. Dein Commander hasst Stillstand und will jetzt Richtung vorgeben. Du schwankst zwischen dem Wunsch nach 100 % Sicherheit und dem Bedürfnis, endlich einen Pflock einzuschlagen – und landest entweder in zu langer Verzögerung oder in einem impulsiven Commitment, das das Umfeld überrumpelt."],["In Deadline-Phasen","Dein Strategist schützt den kritischen Pfad, dein Commander will die Execution mit aller Kraft durchdrücken. Kombiniert entsteht Mikromanagement: Du greifst tief in die Aufgaben anderer ein, um letzte Fehler zu vermeiden. Das lähmt die Eigenverantwortung des Teams und erzeugt unnötigen Stress kurz vor dem Ziel."],["In schwierigen Feedbackgesprächen","Dein Strategist bereitet ein logisch lückenloses Dossier vor, dein Commander will direkt und ohne Umschweife ansprechen. Das Gespräch ist sachlich korrekt und direkt – blendet aber die emotionale Ebene des Gegenübers vollständig aus. Das Ergebnis: klinisch kalt, das Gegenüber fühlt sich wie ein defektes Rädchen, nicht wie ein Mensch."]]},"strategist_explorer":{"name":"Der Adaptive Planner","hook":"Du planst – und du bleibst beweglich. Diese Kombination verbindet methodische Stärke mit der Fähigkeit, im Tun zu lernen und Pläne an die Realität anzupassen. Du bist nicht starr – du bist solide und flexibel zugleich.","merk":[["Adaptive Planung.","Du entwickelst fundierte Pläne, die beweglich bleiben und auf Realitätsfeedback reagieren. Dein Plan ist kein Käfig – er ist ein Kompass."],["Pragmatisches Lernen.","Du findest Lösungen oft direkt im Tun, statt sie nur theoretisch zu durchdenken. Das gibt dir eine Erdung, die viele Planer vermissen."],["Experimentierfreude.","Du nutzt kurze Testphasen, um Konzepte frühzeitig zu validieren. Du weißt: Echte Daten aus der Realität schlagen das beste Modell am Schreibtisch."],["Dynamische Balance.","Du verbindest methodische Logik mit flexibler Anpassung an neue Gegebenheiten. Ordnung und Offenheit schließen sich bei dir nicht aus."],["Intuitive Agilität.","Du erkennst Chancen blitzschnell und integrierst sie effizient in bestehende Rahmenwerke. Das macht dich besonders wirksam in sich schnell verändernden Umgebungen."]],"mod":[["Im Alltag unter Zeitdruck","Dein Strategist will den optimalen Ablauf – dein Explorer will einfach losgehen und Details unterwegs klären. Wenn du ohne fertigen Plan losgehst, fühlst du dich innerlich unsauber. Die Angst, etwas zu vergessen, treibt dich nachher in einen extremen Kontrollmodus."],["Bei komplexen Entscheidungen","Dein Strategist will alle Szenarien durchspielen, dein Explorer drängt darauf, einfach zu testen, was in der Realität passiert. Du neigst zum Overplanning: perfekte Konzepte, die den Kontakt zur Realität verlieren, weil das Ausprobieren zu spät kommt."],["In Deadline-Phasen","Dein Strategist schützt den kritischen Pfad, dein Explorer sieht neue Möglichkeiten und Abkürzungen. Kombiniert entstehen Scope-Sprünge, die die ursprüngliche Planung verwässern und Stress im Team erzeugen."],["In schwierigen Feedbackgesprächen","Dein Strategist will eine glasklare Analyse und einen verbindlichen Verbesserungsplan, dein Explorer will locker und kumpelhaft bleiben, um die Beziehung nicht zu belasten. Das Ergebnis: Kritik wird so weich verpackt, dass die eigentliche Botschaft verloren geht. Gute Stimmung – aber keine Veränderung."]]},"strategist_guardian":{"name":"Der Reliable Builder","hook":"Du baust Systeme, die tragen – und in denen Menschen sich sicher fühlen. Diese Kombination verbindet methodische Verlässlichkeit mit echter Fürsorge. Du schaffst nicht nur Qualität – du schaffst Vertrauen.","merk":[["Verlässliche Struktur.","Du schaffst Systeme, die nicht nur logisch, sondern auch für Menschen sicher und tragfähig sind. Struktur ist bei dir keine Kontrolle – sie ist Fürsorge."],["Methodische Sorgfalt.","Du garantierst höchste Ausführungsqualität durch gründliche Absicherung und klare Standards. Menschen wissen bei dir: Was zugesagt wird, hält."],["Stabile Routinen.","Du baust Prozesse auf, die dem System langfristig Halt, Sicherheit und Orientierung geben. Deine Systeme tragen auch dann, wenn du nicht dabei bist."],["Präzise Unterstützung.","Du verbindest strategische Planung mit einer hohen Dienstleistungsbereitschaft. Du planst nicht nur für dich – du planst für andere."],["Harmonische Exzellenz.","Du strebst nach fehlerfreien Ergebnissen, die das Vertrauen und den Zusammenhalt im Team stärken. Qualität und Gemeinschaft sind für dich kein Widerspruch."]],"mod":[["Im Alltag unter Zeitdruck","Dein Strategist will den Ablauf optimieren, dein Guardian fordert absolute Gründlichkeit. Du verlierst Tempo durch ständige Detail-Checks. Wenn andere deine Standards nicht erfüllen, reagierst du scharf und ungeduldig."],["Bei komplexen Entscheidungen","Dein Strategist will alle Risiken durchspielen, dein Guardian will zusätzlich absichern und Konsens einholen, um niemanden zu enttäuschen. Entscheidungen werden hinausgezögert – das Team erlebt dich als Bremser, weil du versuchst, jedes Restrisiko durch noch mehr Information zu eliminieren."],["In Deadline-Phasen","Dein Strategist schützt den kritischen Pfad, dein Guardian bekommt kurz vor Schluss eine Qualitätspanik. Kombiniert entstehen späte Review-Schleifen und Last-Minute-Änderungen, die das Team erschöpfen und die Deadline gefährden."],["In schwierigen Feedbackgesprächen","Dein Strategist bereitet einen messbaren Plan vor, dein Guardian will fair sein und sammelt viele Belege. Das Gespräch wird zu lang, zu korrekt, zu formell. Die menschliche Wärme geht unter der Performance-Review-Struktur verloren."]]},"strategist_innovator":{"name":"Der Innovative Analyst","hook":"Du analysierst – und du denkst radikal neu. Diese Kombination verbindet strukturierte Logik mit kreativen Sprüngen jenseits des Offensichtlichen. Du machst aus Visionen skalierbare Realität.","merk":[["Adaptive Logik.","Du verbindest messerscharfe Analyse mit kreativen, unkonventionellen Sprüngen. Du weißt, wann Logik weiterführt – und wann ein Gedankensprung die Lösung bringt."],["Systematische Kreativität.","Du strukturierst neue, visionäre Ideen so um, dass sie in bestehende Rahmenwerke integriert werden können. Innovation braucht bei dir kein Chaos als Begleiterscheinung."],["Erweiterter Möglichkeitsraum.","Du findest durch unkonventionelle Hypothesen Lösungen, die jenseits der offensichtlichen Logik liegen. Das macht dich in festgefahrenen Situationen außergewöhnlich wertvoll."],["Visionäre Planung.","Du entwickelst Strategien, die nicht nur stabil sind, sondern auch zukünftige Trends antizipieren. Du planst nicht nur für heute – du planst für übermorgen."],["Kreativer Shortcut-Fokus.","Du nutzt innovative Ansätze, um komplexe Prozesse zu vereinfachen. Effizienz und Kreativität sind bei dir kein Widerspruch."]],"mod":[["Im Alltag unter Zeitdruck","Dein Strategist will den Ablauf durch eine feste Reihenfolge optimieren, dein Innovator kommt mit einem spontanen Hack um die Ecke. Wenn die neue Idee den Ablauf instabil macht, reagiert der Strategist genervt und kontrollierend. Die gute Idee wird zum Störfaktor statt zum Zeitgewinn."],["Bei komplexen Entscheidungen","Dein Strategist will alle Daten analysieren, dein Innovator drängt auf einen unkonventionellen Test. Kombiniert entstehen entweder Ideen-Overkill oder endlose Verzögerung – du lieferst dem Umfeld zu viele Optionen statt einer klaren, belastbaren Richtung."],["In Deadline-Phasen","Dein Strategist schützt den kritischen Pfad, dein Innovator sieht kurz vor Schluss die Möglichkeit zu einer massiven Verbesserung oder einem neuen Tool. Kombiniert entstehen Last-Minute-Änderungen und Plan-Overkill, die den Fokus zerstören und das Team in Widerstand treiben."],["In schwierigen Feedbackgesprächen","Dein Strategist will den Entwicklungsweg präzise strukturieren, dein Innovator spricht über große Potenziale und Zukunftsmöglichkeiten. Das Feedback bleibt vage: spannende Ideen, aber keine klare Botschaft darüber, was morgen konkret anders sein muss."]]},"strategist_sage":{"name":"Der Wise Architect","hook":"Du baust Systeme, die nicht nur funktionieren, sondern auch stimmen. Diese Kombination verbindet methodische Präzision mit intellektueller Tiefe und ethischer Substanz. Du bist nicht nur derjenige, der die effizienteste Lösung findet – du bist derjenige, der die richtige findet.","merk":[["Stimmige Systeme.","Du baust Strukturen, die nicht nur logisch funktionieren, sondern auch eine tiefe Bedeutung und ethische Basis haben. Deine Systeme tragen, weil sie nicht nur korrekt, sondern auch kohärent sind."],["Logische Tiefe.","Du verbindest präzise Ursache-Wirkungs-Modelle mit tiefgehender Reflexion. Das macht deine Analysen nicht nur scharf – sondern auch weise."],["Sinnorientierte Optimierung.","Du verbesserst Prozesse nicht nur für mehr Tempo, sondern für eine höhere Qualität im Ergebnis und im menschlichen Umgang. Effizienz und Bedeutung gehören bei dir zusammen."],["Präzise Ethik.","Du nutzt einen starken inneren Kompass, um sicherzustellen, dass deine Methoden mit höheren Werten übereinstimmen. Du weißt: Das beste System nützt nichts, wenn es das Falsche optimiert."],["Reflektierte Souveränität.","Du bewahrst auch in komplexen Lagen durch intellektuelle Tiefe und Sachlichkeit einen ruhigen, objektiven Überblick."]],"mod":[["Im Alltag unter Zeitdruck","Dein Strategist will den Ablauf optimieren, dein Sage bringt ein höheres Prinzip ins Spiel – Respekt, Würde, Haltung. Du willst gleichzeitig Effizienz und moralische Qualität sicherstellen, hältst mitten im Zeitdruck Prinzipienreden und erzeugst Stress statt Klarheit."],["Bei komplexen Entscheidungen","Dein Strategist will einen logischen Trade-off aushandeln, dein Sage beharrt auf der Wahrheit und intellektuellen Integrität der Lösung. Ein pragmatischer Mittelweg fühlt sich für dich oft unwahr oder nicht zu Ende gedacht an – und du blockierst Entscheidungen durch zu komplexe Argumentation."],["In Deadline-Phasen","Dein Strategist schützt den kritischen Pfad, dein Sage erkennt kurz vor Schluss einen Logikfehler oder eine Qualitätsmücke. Du schwankst zwischen Zeitplan und dem Drang, etwas wirklich Richtiges abzuliefern. Kombiniert entstehen späte Grundsatzdiskussionen, die die Deadline gefährden."],["In schwierigen Feedbackgesprächen","Dein Strategist baut einen logischen Entwicklungsplan, dein Sage will das zugrunde liegende Prinzip ansprechen. Das Gespräch wirkt wie eine Standpauke: der Mitarbeiter fühlt sich moralisch bewertet statt professionell gecoacht. Die konkreten nächsten Schritte verschwinden unter einer Schicht philosophischer Bewertung."]]}};


var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';
const PROFILE_FN='/.netlify/functions/profile';
const PROFILE_URL='https://app.6heroes.de/mein-bereich';
const HERO_COLOR={commander:'#0B63CE',explorer:'#F0672A',innovator:'#F2B705',guardian:'#1F9D62',sage:'#C0266A',strategist:'#475569'};
const HERO_LABEL={commander:'Commander',explorer:'Explorer',innovator:'Innovator',guardian:'Guardian',sage:'Sage',strategist:'Strategist'};
const ON_COLOR=k=>k==='innovator'?'#20293A':'#fff';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():'';
const blk=(l,p,cls,ul)=>'<div class="blk">'+(l?'<span class="bl '+(cls||'')+'">'+esc(l)+'</span>':'')+(p?'<p>'+esc(p)+'</p>':'')+(ul?'<ul>'+ul.map(x=>{const t=String(x).split('|');return t.length>1?'<li><b>'+esc(t[0])+'</b> '+esc(t.slice(1).join('|'))+'</li>':'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+'</div>';
const acc=(a,sub,inner,open)=>'<details'+(open?' open':'')+'><summary><span class="s1"><span class="a">'+esc(a)+'</span>'+(sub?'<span class="b">'+esc(sub)+'</span>':'')+'</span></summary><div class="body">'+inner+'</div></details>';
const lab=t=>'<div class="label">'+esc(t)+'</div>';
const topbar='<div class="topbar"><a href="'+PROFILE_URL+'" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mein Bereich</a></div>';
function postHeight(){const h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}
async function getProfile(){
  const p=new URLSearchParams(location.search);const email=(p.get('email')||'').trim();
  if(!email) return null;
  try{const r=await fetch(PROFILE_FN+'?email='+encodeURIComponent(email));if(!r.ok) throw new Error(r.status);return await r.json();}
  catch(e){console.warn('Profil-Fetch fehlgeschlagen:',e);return null;}
}
function boot(render){
  window.addEventListener('load',()=>{render().then(()=>{var w=document.querySelector('.wrap');if(w)w.classList.add('ready');postHeight();});});
  window.addEventListener('resize',postHeight);
  if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
  document.addEventListener('toggle',postHeight,true);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(postHeight);}
  [50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
}


async function render(){
  const q=new URLSearchParams(location.search);
  let basis=(q.get('basis')||'').trim().toLowerCase(), zweit=(q.get('zweit')||'').trim().toLowerCase();
  if(!(basis&&zweit)){const d=await getProfile();if(d){basis=basis||String(d.base||'').trim().toLowerCase();zweit=zweit||String(d.second||'').trim().toLowerCase();}}
  if(!KOMBI[basis+'_'+zweit]){basis='commander';zweit='explorer';}
  const k=KOMBI[basis+'_'+zweit];
  const root=document.documentElement.style;root.setProperty('--accent',HERO_COLOR[basis]);
  let html=topbar+'<div class="hero"><div class="emb2"><div class="emb" style="background:'+HERO_COLOR[basis]+';color:'+ON_COLOR(basis)+'">'+HERO_LABEL[basis][0]+'</div><div class="emb" style="background:'+HERO_COLOR[zweit]+';color:'+ON_COLOR(zweit)+'">'+HERO_LABEL[zweit][0]+'</div></div>'
    +'<span class="eyebrow">'+HERO_LABEL[basis]+' und '+HERO_LABEL[zweit]+'</span><h1>'+esc(k.name)+'</h1><p class="hook">'+esc(k.hook)+'</p></div>';
  html+=lab('Wie sich deine Helden färben')+'<div class="stack">'+acc('Deine fünf Kennzeichen','',k.merk.map(m=>blk(m[0].replace(/\.$/,''),m[1])).join(''),true)+'</div>';
  html+=lab('Im Alltag')+'<div class="stack">'+k.mod.map(m=>acc(m[0],'',blk(null,m[1]))).join('')+'</div>';
  html+='<div class="links"><a class="pill" href="https://app.6heroes.de/basisheld" target="_top">Mehr über deinen Basisheld</a><a class="pill" href="https://app.6heroes.de/zweitheld" target="_top">Mehr über deinen Zweitheld</a></div>';
  document.getElementById('app').innerHTML=html;
}
boot(render);

</script>
