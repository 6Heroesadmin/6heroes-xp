les Schlucken und unten brennt's."],["„Ich verspreche nichts, was nicht stimmt.“","„Das ist unfair fürs Team.“","„Ich brauche Priorisierung.“"]],["Deadline-Projekt",["Guardian will Absicherung, Sage will Wahrheit/Qualität.","Risiko|Review-Schleifen, späte Perfektionsspirale."],["„Wir dürfen nichts Halbgares liefern.“","„Nur kurz noch prüfen...“","„Das muss sauber sein.“"]],["Feedbackgespräch",["Guardian will fair, Sage will Wahrheit und Prinzip.","Risiko|zu moralisch oder zu lang (zu viele Beispiele)."],["„Ich will fair sein.“","„Es muss sich ändern.“","„Ich will nicht beschämen.“"]]]},"strategist":{"kern":"Guardian stabilisiert, sichert ab, hält Prozesse am Laufen. Strategist optimiert, strukturiert und baut planbare Systeme. Das Ergebnis ist oft: „Process Anchor“ – du vereinst Verlässlichkeit mit Systemdenken: weniger Feuerwehr, mehr vorbeugende Struktur.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Guardian: „Ordentlich, sicher, richtig – nichts vergessen.“ Strategist: „Wo ist der Engpass? Welche Reihenfolge spart wirklich Zeit?“","Du willst Absicherung/Standards, Strategist macht daraus einen stabilen Ablauf. Best-case: weniger Stress, weil die Routine sitzt. Risiko: du wirst zu rigide („so muss es laufen“) oder ihr optimiert so viel, dass es sich wie Militärplan anfühlt.",["„Wenn der Ablauf klar ist, fühlt sich alles sicherer an.“","„Wir lösen den Engpass, dann wird's ruhig.“","„Ich will Ordnung, aber ohne Härte.“"]],["Paar-Konflikt","Guardian: „Fairness, Verlässlichkeit, Anerkennung.“ Strategist: „Welche Regel verhindert Wiederholung? Wer macht was bis wann?“","Du bringst das Fairness-Thema, Strategist macht es konkret & messbar. Best-case: klare Entlastung. Risiko: es wird kalt/vertraglich; du fühlst dich nicht emotional gesehen – oder du sammelst „Beweise“, statt in Verbindung zu gehen.",["„Ich will nicht kämpfen – ich will Stabilität.“","„Fairness braucht Zuständigkeiten.“","„Wir müssen das so bauen, dass es im Alltag hält.“"]],["Urlaub planen / Familienlogistik","Guardian: „Budget, Sicherheit, Storno, kinderfreundlich.“ Strategist: „Kriterien zuerst, 3 Optionen, dann Entscheidung.“","Du definierst Sicherheitskriterien, Strategist reduziert Komplexität und entscheidet im Rahmen. Best-case: schnelle, sichere Buchung. Risiko: du addierst immer neue Risiken; Strategist wirkt dann pushy („wir entscheiden jetzt“).",["„Leitplanken reichen.“","„Risiko reduzieren, nicht Null-Risiko.“","„Wenn wir drei Optionen haben, ist es genug.“"]],["Besuch / Gastgeberrolle / Ordnung & Standards","Guardian: „Alle sollen sich wohlfühlen, genug da, ordentlich.“ Strategist: „Flow: Ankommen → Essen → Ausklingen. Aufgaben klar verteilen.“","Du hältst Versorgung/Standard, Strategist hält Ablauf/Timing. Best-case: entspannter Abend, weil nichts improvisiert werden muss. Risiko: du wirst kontrollierend („Checkliste-Modus“), die Verbindung leidet.",["„Flow ist Fürsorge.“","„Ein guter Rahmen entlastet mich.“","„Ich muss nicht alles selbst machen.“"]],["Gesundheit / Sport / Routinen","Guardian: „Sicher, nachhaltig, richtig – keine Verletzung.“ Strategist: „Plan, Rhythmus, Tracking – aber schlank.“","Du willst Sicherheit und Nachhaltigkeit, Strategist baut ein System, das hält. Best-case: langfristige Routine. Risiko: Overdesign (zu viele Regeln/KPIs) oder schlechtes Gewissen bei Abweichung.",["„Kontinuität schlägt Intensität.“","„Sicherheit ist Teil des Plans.“","„Plan light ist besser als Plan nie.“"]]],"sig":["„Sicherheit wird zur Struktur.“|Du beruhigst dich, wenn Rollen/Ablauf klar sind.","„Starkes Fairness-Radar.“|Ungleichgewicht triggert dich – Strategist macht es vertraglich.","„Gefahr: Regel-Überladung.“|Immer neue Regeln als Sicherheitsgefühl.","„Hohe Zuverlässigkeit – hoher Anspruch.“|Du erwartest „so wie vereinbart“.","„Beste Form: wenige klare Standards.“|Dann bist du warm UND stabil."],"warn":[["Wenn du in Überkontrolle rutschst",["„Nur kurz noch prüfen...“","„Ich muss das absichern.“","„Sonst gibt's später Probleme.“"]],["Wenn du in Regel-Strenge rutschst",["„So war das nicht vereinbart.“","„Ab jetzt gilt...“","„Das ist nicht verhandelbar.“"]],["Wenn du dich selbst überforderst",["„Wenn ich's nicht mache, macht's keiner.“","„Ich muss das tragen.“","„Ich darf keinen Fehler zulassen.“"]]],"beruf":[["Konflikt im Team",["Guardian schützt Fairness/Respekt, Strategist setzt Rollen/Prozess.","Risiko|Schuldfragen + Regelhammer."],["„Das ist unfair.“","„So arbeiten wir hier nicht.“","„Wir brauchen klare Regeln.“"]],["Druck von oben",["Guardian will Team schützen, Strategist verhandelt Trade-offs.","Risiko|stilles Schlucken oder Prinzip-Blockade."],["„Ohne Priorisierung ist das unfair.“","„Ich will nicht, dass das Team brennt.“","„Ich brauche eine Entscheidung.“"]],["Deadline-Projekt",["Guardian will Review/Absicherung, Strategist schützt kritischen Pfad.","Risiko|Review-Schleifen und Scope-Creep."],["„Keine Überraschungen.“","„Nur kurz noch prüfen...“","„Kritischer Pfad first.“"]],["Feedbackgespräch",["Guardian will fair + Beispiele, Strategist will Plan/Messbarkeit.","Risiko|zu lang, zu korrekt, zu wenig menschlich."],["„Ich will fair sein.“","„Es muss sich ändern.“","„Ohne Plan passiert nichts.“"]]]}},"explorer":{"commander":{"kern":"Explorer liefert Energie, Mut, Spontaneität und Realitätskontakt. Commander bringt Richtung, Entscheidungsstärke, Verantwortung und Führung. Das Ergebnis ist oft: „Expedition Leader“ – du bist freiheitsliebend, aber du führst; du nimmst andere mit, setzt Ziele und hältst Kurs im Gelände.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Explorer: „Komm – raus hier. Unterwegs regeln wir's.“ Commander: „Stopp. Zwei Checks. Dann gehen wir.“","Du willst Bewegung/Tempo, Commander bringt Struktur & klare Ansage. Best-case: du bist schnell und vergisst nichts Wichtiges. Risiko: Commander wirkt wie „Spaßbremse“, du fühlst dich kontrolliert und wirst trotzig („lass mich doch“), oder du wirst selbst scharf, wenn andere trödeln.",["„Tempo ja – aber mit zwei Ankern.“","„Ich führe kurz, dann wird's leicht.“","„Nicht diskutieren – nächster Schritt.“"]],["Paar-Konflikt","Explorer: „Lass kurz runterkommen – wir gehen raus.“ Commander: „Wir klären das jetzt und entscheiden.“","Du regulierst über Abstand/Bewegung, Commander drückt Abschluss. Best-case: schnell wieder handlungsfähig. Risiko: du fühlst dich überfahren, gehst auf Abstand (noch mehr), oder Commander interpretiert dein Bedürfnis nach Reset als Ausweichen.",["„Reset zuerst – dann Entscheidung.“","„Ich kann klar sein, ohne hart zu werden.“","„Eine Sache – ein Abschluss.“"]],["Urlaub planen / Familienlogistik","Explorer: „Freiheit! Spontan! Vor Ort entscheiden!“ Commander: „Wir entscheiden jetzt die Basics, dann ist Ruhe.“","Du willst Möglichkeiten offen halten, Commander will Verbindlichkeit. Best-case: ihr setzt Leitplanken und du hast danach Freiheit. Risiko: du fühlst dich eingeengt („zu fix“), oder ihr bucht zu schnell ohne genug Informationen und du ärgerst dich später.",["„Commit auf Basics, Freiheit im Rest.“","„Ein schneller Cut gibt mir Luft.“","„Nicht alles planen – nur das Wichtige.“"]],["Besuch / Gastgeberrolle","Explorer: „Locker, Spaß, Bewegung – kein steifes Ding.“ Commander: „Ich setze den Rahmen: Start, Essen, Ende – dann läuft's.“","Du bringst Leichtigkeit, Commander hält Struktur. Best-case: lebendig, aber nicht chaotisch. Risiko: du „performst“ (zu viel Action), Commander steuert zu hart („so machen wir's“), Gäste fühlen sich geführt statt eingeladen.",["„Rahmen ist Dienst, keine Kontrolle.“","„Ein Highlight reicht.“","„Ich gebe Raum – nicht Regie.“"]],["Gesundheit / Sport / Routinen","Explorer: „Challenge, Spaß, draußen – ich will's spüren.“ Commander: „Disziplin. Plan. Durchziehen.“","Du bist motiviert durch Erlebnis, Commander durch Ziel/Disziplin. Best-case: starke Umsetzung. Risiko: Überziehen (zu hart), Verletzung, oder All-or-nothing („wenn nicht perfekt, dann gar nicht“).",["„Bonus ist optional.“","„Ich trainiere klug, nicht nur hart.“","„Kontinuität schlägt Kick.“"]]],"sig":["„Action + Entscheidung.“|Du startest schnell und willst klare Cuts.","„Ungeduld mit Stillstand.“|Trödeln/Endlosreden triggert.","„Freiheit innerhalb von Rahmen.“|Wenn der Rahmen klar ist, bist du am besten.","„Gefahr: Überfahren.“|Tempo + Direktheit kann andere überrollen.","„Stress raus über Tun.“|Du regulierst durch Aktion, Commander macht es verbindlich."],"warn":[["Wenn du überfährst",["„Los jetzt.“","„Warum so kompliziert?“","„Einfach machen.“"]],["Wenn du ausweichst (Explorer)",["„Jetzt ist nicht der Moment.“","„Wir reden später.“","„Lass uns erstmal raus.“"]],["Wenn Commander zu hart wird",["„Keine Diskussion.“","„Ab jetzt gilt...“","„Das ist nicht verhandelbar.“"]]],"beruf":[["Konflikt im Team",["Du willst Spannung raus + weiter, Commander will Entscheidung/Standard.","Risiko|Betroffene fühlen sich überrollt oder nicht gehört."],["„Raus aus dem Drama.“","„Wir entscheiden das jetzt.“","„Weiterarbeiten!“"]],["Druck von oben",["Commander nimmt an, du gehst sofort ins Machen.","Risiko|zu schnelles Ja ohne Trade-off."],["„Gib mir 30 Minuten.“","„Wir finden einen Weg.“","„Nicht diskutieren – handeln.“"]],["Deadline-Projekt",["Commander baut Plan, du machst schnelle Field-Loops.","Risiko|Scope springt oder Team wird gehetzt."],["„Wir testen schnell.“","„Schritt 1 jetzt.“","„Kein Stillstand.“"]],["Feedbackgespräch",["Commander ist direkt, du willst motivieren/leicht halten.","Risiko|zu hart oder zu locker."],["„Ich will motivieren.“","„Es muss klar sein.“","„Eine Sache ändern.“"]]]},"guardian":{"kern":"Explorer will los, entdecken, variieren und sich nicht einengen lassen. Guardian bringt Sicherheit, Sorgfalt, Verlässlichkeit und Verantwortung für andere. Das Ergebnis ist oft: „Grounded Explorer“ – du bleibst frei, aber du wirst berechenbarer; Abenteuer mit Sicherheitsnetz und höherer Nachhaltigkeit.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Explorer: „Komm – raus hier. Unterwegs regeln wir's.“ Guardian: „Stopp: Schuhe, Brotbox, Wetter, Sicherheit – richtig machen.“","Du willst Tempo/Bewegung, Guardian bringt Sicherheit & Ordnung. Best-case: ihr kommt raus, ohne dass Chaos nachrollt (vergessen/zu spät). Risiko: du fühlst dich gebremst und wirst ungeduldig; Guardian wird nervös und kontrollierend („ich muss das absichern“).",["„Sicherheit ist nicht Bremse – sie ist Nachsorge.“","„Zwei Checks reichen.“","„Ich will frei sein, ohne Nachstress.“"]],["Paar-Konflikt","Explorer: „Lass runterkommen – wir gehen raus.“ Guardian: „Wir brauchen Fairness und eine klare Regel, sonst passiert es wieder.“","Du willst Spannung raus, Guardian will Stabilität durch Abmachung. Best-case: erst Deeskalation, dann Verbindlichkeit. Risiko: du erlebst Guardian als „kontrollierend“, Guardian erlebt dich als „ausweichend“ – das triggert Strenge oder Flucht.",["„Reset ist okay – aber ich committe mich danach.“","„Eine klare Regel schützt uns.“","„Ich will nicht weglaufen, ich will's leicht lösen.“"]],["Urlaub planen / Familienlogistik","Explorer: „Freiheit, spontan, vor Ort entscheiden.“ Guardian: „Budget, Sicherheit, Storno, kindertauglich – bitte sauber.“","Du willst Möglichkeiten offen halten, Guardian will Risiken minimieren. Best-case: Leitplanken geben dir Freiheit ohne Angst. Risiko: Guardian macht aus Planung Kontrolle; du rebellierst und entscheidest impulsiv.",["„Leitplanken geben mir Freiheit.“","„Ein Risiko bewusst – nicht zehn unbewusst.“","„Ich will Abenteuer, aber keine Nachsorge-Panik.“"]],["Besuch / Gastgeberrolle","Explorer: „Locker, Spaß, Bewegung.“ Guardian: „Alle sollen sich wohlfühlen – genug da, Ordnung, Rücksicht.“","Du bringst Leichtigkeit, Guardian sorgt für Versorgung/Standards. Best-case: warm, entspannt, gut organisiert. Risiko: Guardian übernimmt alles („ich trage es“), du unterschätzt Bedürfnisse anderer; dann kommt Kritik oder passiver Groll.",["„Ich kann helfen, ohne mich einsperren zu lassen.“","„Versorgung ist Liebe – aber nicht alles muss perfekt sein.“","„Ich will mittragen, nicht nur genießen.“"]],["Gesundheit / Sport / Routinen","Explorer: „Challenge, draußen, Spaß – komm, geht noch!“ Guardian: „Stopp: Technik, Sicherheit, Nachhaltigkeit.“","Du willst Push und Erlebnis, Guardian schützt. Best-case: du bleibst beweglich ohne Verletzung. Risiko: du fühlst dich ausgebremst und ignorierst Warnsignale; oder Guardian wird ängstlich, du verlierst Motivation.",["„Technik vor Tempo.“","„Kontinuität ist mein Abenteuer.“","„Stopp ist Stärke, nicht Schwäche.“"]]],"sig":["„Freiheit + Sicherheitsradar.“|Du willst los, Guardian will absichern.","„Spannung: Flucht vs. Klammer.“|Du gehst raus, Guardian hält fest.","„Nachstress-Vermeidung.“|Guardian hilft dir, den Preis von Spontanität zu senken.","„Trigger: Kontrollton.“|Wenn Guardian streng wird, geht dein Widerstand hoch.","„Beste Form: Essentials + klare Aufgaben.“|Dann bist du frei UND zuverlässig."],"warn":[["Wenn du rebellierst",["„Warum so kompliziert?“","„Ich will einfach los.“","„Wird schon.“"]],["Wenn Guardian überkontrolliert",["„Nur kurz noch prüfen...“","„Sonst gibt's später Probleme.“","„Ich muss das absichern.“"]],["Wenn ihr euch verpasst",["„Wir reden später.“ (Explorer)","„So geht das nicht.“ (Guardian)","„Wenn wir es nicht regeln, passiert es wieder.“ (Guardian)"]]],"beruf":[["Konflikt im Team",["Du willst Spannung raus + weiter, Guardian will Fairness/Respekt schützen.","Risiko|Konflikt wird wegbewegt oder moralisch/streng."],["„Raus aus dem Drama.“","„Das war unfair.“","„Wir klären später.“"]],["Druck von oben",["Du willst schnell liefern, Guardian schützt Team/Qualität.","Risiko|zu schnelles Ja oder Blockade aus Sorge."],["„Wir finden einen Weg.“","„Ich will das Team nicht verbrennen.“","„Ich brauche Priorisierung.“"]],["Deadline-Projekt",["Du willst schnelle Loops, Guardian will Absicherung/Review.","Risiko|Scope springt oder Quality-Panik."],["„Ein Loop noch.“","„Keine Überraschungen.“","„Nur kurz noch prüfen...“"]],["Feedbackgespräch",["Du willst motivieren/leicht halten, Guardian will fair + klar.","Risiko|zu weich oder zu streng."],["„Ich will motivieren.“","„Ich will fair bleiben.“","„Es muss sich ändern.“"]]]},"innovator":{"kern":"Explorer bringt Bewegung, Abenteuer, Erfahrung und „einfach machen“. Innovator bringt Ideenreichtum, Neudenken und kreative Alternativen. Das Ergebnis ist oft: „Trailblazer“ – du probierst nicht nur aus, du erfindest unterwegs neue Wege und Optionen, die andere nicht sehen.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Explorer: „Komm – wir gehen los, unterwegs regeln wir's.“ Innovator: „Ich hab 'ne Idee: Spiel/Timer/Challenge – dann klappt's ohne Stress.“","Du gehst in Bewegung, Innovator macht daraus ein kreatives System. Best-case: es wird leicht, spaßig und trotzdem effizient. Risiko: ihr habt zu viele Hacks, wechselt ständig, vergesst Basics (Schlüssel, Brotbox), und du wirst ungeduldig, wenn Innovation „zusätzliche Schritte“ erzeugt.",["„Mach's leicht – aber bitte nicht kompliziert.“","„Ein guter Hack spart Nerven.“","„Wir brauchen nur den nächsten Schritt.“"]],["Paar-Konflikt","Explorer: „Lass uns kurz runterkommen / rausgehen.“ Innovator: „Wir designen eine neue Lösung – smarter, leichter, gerechter.“","Du regulierst über Bewegung, Innovator über neue Optionen. Best-case: Konflikt wird schnell in eine kreative Lösung geführt. Risiko: ihr überspringt Gefühl/Verletzung („lösungsflucht“), und der Partner erlebt es als nicht gesehen; oder ihr macht eine fancy Lösung, die nicht stabil bleibt.",["„Erst runterfahren, dann Lösung.“","„Eine kleine Änderung reicht.“","„Nicht perfekt – nur besser.“"]],["Urlaub planen / Familienlogistik","Explorer: „Freiheit, spontan, vor Ort entscheiden.“ Innovator: „Hidden gems! Neues Konzept! Ungewöhnliche Route!“","Du liebst Offenheit, Innovator erweitert Möglichkeiten noch mehr. Best-case: genialer, lebendiger Urlaub. Risiko: Entscheidungschaos, zu viele Optionen, kein Commitment, oder du buchst impulsiv ohne Anker.",["„Freiheit braucht 2 Anker.“","„Eine Wild Card reicht.“","„Erst grob committen, dann entdecken.“"]],["Besuch / Gastgeberrolle","Explorer: „Locker, Spaß, Bewegung – kein steifes Ding.“ Innovator: „Wir machen einen Wow-Moment: Motto/Spiel/Überraschung.“","Du machst es leicht, Innovator macht es besonders. Best-case: super Atmosphäre. Risiko: zu viel Programm, zu viele Ortswechsel, Gäste werden müde, und du „performst“ statt präsent zu sein.",["„Ein Highlight reicht.“","„Flow ist besser als Show.“","„Ich muss nicht liefern – nur Raum geben.“"]],["Gesundheit / Sport / Routinen","Explorer: „Draußen, Abwechslung, Challenge – ich will's spüren.“ Innovator: „Gamification! Neues Training! Tracker/Challenge!“","Du bleibst dran, wenn es Spaß macht; Innovator liefert ständig neue Reize. Best-case: hohe Motivation. Risiko: zu viel Wechsel (keine Progression) oder Überziehen (noch eine Challenge...).",["„Neues ja – aber mit Linie.“","„Kontinuität schlägt Kick.“","„Bonus ist optional.“"]]],"sig":["„Dopamin-Drive.“|Bewegung + neue Ideen = extrem hochdynamisch.","„Starten ist leicht, Dranbleiben ist die Kunst.“","„Risiko: Overchoice.“|Zu viele Optionen killen Umsetzung.","„Konflikte werden schnell 'wegkreativisiert'.“|Gefühl wird übersprungen.","„Beste Form: 2 Anker + 1 Experiment.“"],"warn":[["Wenn du zerstreust/ausweichst",["„Lass uns was anderes machen.“","„Wir schauen später.“","„Ist doch nicht so schlimm.“"]],["Wenn Innovator überlädt",["„Noch eine Idee...“","„Das machen wir auch noch.“","„Wir könnten doch...“"]],["Wenn du überziehst",["„Komm, geht noch.“","„Wir improvisieren einfach.“","„Wird schon.“"]]],"beruf":[["Konflikt im Team",["Du willst Spannung raus + vorwärts; Innovator will Reframing/Neues Setup.","Risiko|Konflikt wird „umdesignt“, Betroffene fühlen sich nicht gehört."],["„Raus aus dem Drama.“","„Wir brauchen einen Reset.“","„Wir machen's einfach anders.“"]],["Druck von oben",["Du reagierst schnell („kriegen wir hin“), Innovator sucht Shortcut/Creative Deal.","Risiko|zu schnelles Ja ohne Absicherung."],["„Gib mir 30 Minuten.“","„Wir finden einen Weg.“","„Nicht diskutieren, handeln.“"]],["Deadline-Projekt",["Du willst schnelle Loops; Innovator will verbessern/neu bauen.","Risiko|Scope springt, Fokus leidet."],["„Wir testen schnell.“","„Noch besser wäre...“","„Ein Loop geht noch.“"]],["Feedbackgespräch",["Du hältst es locker/motivational; Innovator spricht Potenzial.","Risiko|zu weich/zu vage, keine Konsequenz."],["„Ich will motivieren.“","„Das kriegen wir easy hin.“","„Nicht zu schwer machen.“"]]]},"sage":{"kern":"Explorer sucht Freiheit, Vielfalt und lebendige Erfahrung. Sage bringt Reflexion, Sinn und Integration des Erlebten. Das Ergebnis ist oft: „Purpose Explorer“ – du suchst nicht nur den Kick, sondern entwickelst aus Erlebnissen klare Werte, Richtung und persönliche Wahrheit.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Explorer: „Komm – raus hier. Unterwegs regeln wir's.“ Sage: „Stopp: Ton & Werte. Wie machen wir das respektvoll – ohne Stress?“","Du willst Bewegung/Tempo, Sage bringt Haltung, Ruhe und Sinn. Best-case: du bleibst leichter, aber weniger hektisch; weniger Überfahren. Risiko: du fühlst dich gebremst („zu viel Gerede“), oder Sage wird moralisch („so macht man das nicht“), was bei dir Widerstand auslöst.",["„Tempo ja – aber nicht auf Kosten des Tons.“","„Ein Satz reicht, dann los.“","„Leichtigkeit kann auch respektvoll sein.“"]],["Paar-Konflikt","Explorer: „Lass kurz raus – dann reden wir.“ Sage: „Worum geht's wirklich? Respekt, Vertrauen, Wertschätzung?“","Du regulierst über Distanz/Bewegung, Sage sucht Wahrheit/Bedeutung. Best-case: erst Deeskalation, dann echte Verbindung. Risiko: du empfindest es als „zu tief/zu schwer“, willst ausweichen; oder Sage hält dich fest, bis du „es fühlst“, und du wirst ungeduldig.",["„Erst runterfahren, dann Wahrheit.“","„Eine Wahrheit + eine Bitte reicht.“","„Ich kann bleiben, ohne mich gefangen zu fühlen.“"]],["Urlaub planen / Familienlogistik","Explorer: „Freiheit, spontan, vor Ort entscheiden.“ Sage: „Was passt wirklich zu uns – und was ist nur Reiz/Flucht?“","Du willst Erlebnis, Sage will Stimmigkeit. Best-case: Reisen, die wirklich nähren statt nur „kicken“. Risiko: du fühlst dich beurteilt („Flucht?“), oder du kommst ins Grübeln und verlierst Schwung.",["„Stimmigkeit macht Freiheit besser.“","„Ich committe die Basics, dann erlebe ich.“","„Nicht alles muss Sinn haben – aber es sollte passen.“"]],["Besuch / Gastgeberrolle","Explorer: „Locker, Spaß, Bewegung – kein steifes Ding.“ Sage: „Verbindung > Programm. Raum für echte Gespräche.“","Du bringst Dynamik, Sage bringt Tiefe und Präsenz. Best-case: warm, lebendig, verbunden. Risiko: du wirst zum Animateur (zu viel Action), oder Sage wird zu ernst und killt Leichtigkeit.",["„Ein Highlight reicht – dann Raum.“","„Tiefe ist optional, nicht Pflicht.“","„Ich muss nicht liefern – nur da sein.“"]],["Gesundheit / Sport / Routinen","Explorer: „Abwechslung, draußen, Challenge – ich will's spüren.“ Sage: „Was tut dir langfristig gut – und was ist nur Kick?“","Du willst Erlebnis, Sage bringt Nachhaltigkeit und Selbstmitgefühl. Best-case: du bleibst dran ohne zu überziehen. Risiko: du fühlst dich „moralisch“ begrenzt, oder du wirst inkonsequent, weil du Sinn-Diskussionen vermeidest.",["„Trend statt Tag.“","„Ich trainiere für Leben, nicht nur für Kick.“","„Leichtigkeit darf gesund sein.“"]]],"sig":["„Bewegung + Bedeutung.“|Du wirst reifer: Spaß bleibt, aber mit innerem Kompass.","„Stress-Regulation über Distanz.“|Du brauchst Reset, Sage braucht danach Wahrheit.","„Trigger: moralischer Ton.“|Wenn Sage zu „richtig/falsch“ wird, gehst du weg.","„Gefahr: Tiefe vermeiden.“|Du kannst Konflikte „wegbewegen“.","„Beste Form: Reset → 1 Wahrheit → 1 Schritt.“"],"warn":[["Wenn du ausweichst",["„Jetzt ist nicht der Moment.“","„Wir reden später.“","„Lass uns erstmal raus.“"]],["Wenn Sage moralisch wird (oder du es so erlebst)",["„So macht man das nicht.“","„Das ist respektlos.“","„Das ist nicht okay.“"]],["Wenn du überziehst",["„Komm, geht noch.“","„Wird schon.“","„Wir improvisieren einfach.“"]]],"beruf":[["Konflikt im Team",["Du willst Spannung raus + weiter, Sage will Wahrheit/Prinzip.","Risiko|Konflikt wird wegbewegt oder moralisch aufgeladen."],["„Raus aus dem Drama.“","„Was ist hier fair/respektvoll?“","„Wir klären später.“"]],["Druck von oben",["Du willst schnell liefern, Sage will Integrität (nichts Unwahres versprechen).","Risiko|zu schnelles Ja oder Prinzip-Blockade."],["„Wir finden einen Weg.“","„Ich verspreche nichts, was nicht stimmt.“","„Ich brauche einen Trade-off.“"]],["Deadline-Projekt",["Du willst schnelle Loops, Sage schützt Wahrheit/Qualität.","Risiko|Scope springt oder „Quatsch“ wird shipped."],["„Ein Loop noch.“","„Was ist wahr genug für V1?“","„Nicht verzetteln.“"]],["Feedbackgespräch",["Du willst es leicht/motivierend, Sage will Wahrheit/Prinzip.","Risiko|zu weich oder zu ernst."],["„Ich will motivieren.“","„Ich muss ehrlich sein.“","„Ein nächster Schritt.“"]]]},"strategist":{"kern":"Explorer sammelt Erfahrungen, reagiert schnell und lernt durch Tun. Strategist gibt Struktur, Prioritäten, Muster und vorausschauende Planung. Das Ergebnis ist oft: „Smart Adventurer“ – du bleibst beweglich, aber vermeidest unnötige Umwege, weil du aus Erfahrung System machst.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Explorer: „Komm – raus hier. Unterwegs regeln wir's.“ Strategist: „Stopp: Reihenfolge. Engpass raus. Dann sind wir schneller.“","Du willst Bewegung, Strategist bringt Ablauf & Engpass-Denken. Best-case: du bist schnell ohne Chaos, und die Morgen werden stabiler. Risiko: du fühlst dich „eingeengt“ durch zu viele Schritte; Strategist kann genervt reagieren, wenn du Abkürzungen nimmst.",["„Wenn die Reihenfolge klar ist, bin ich freier.“","„Ich brauche Anker – dann kann ich improvisieren.“","„Ein Mini-Plan spart Diskussion.“"]],["Paar-Konflikt","Explorer: „Lass kurz runterkommen – wir gehen raus.“ Strategist: „Okay – aber wir brauchen am Ende eine klare Abmachung.“","Du regulierst über Bewegung, Strategist will Abschluss/Mechanik. Best-case: erst Deeskalation, dann klare Regel. Risiko: du fühlst dich kontrolliert („jetzt muss ich liefern“), oder Strategist empfindet dich als ausweichend und wird drückend.",["„Reset ist okay – aber ich committe mich danach.“","„Eine kleine Regel reicht.“","„Nicht endlos reden – eine Entscheidung.“"]],["Urlaub planen / Familienlogistik","Explorer: „Freiheit, spontan, vor Ort entscheiden.“ Strategist: „Leitplanken: Budget, Schlafen, Transfers – dann Freiheit.“","Du willst Offenheit, Strategist will Planbarkeit. Best-case: du bekommst Freiheit innerhalb eines Rahmens. Risiko: du empfindest Rahmen als Käfig oder Strategist empfindet Spontanität als Risiko und zieht die Zügel zu fest.",["„Rahmen ist nicht Gefängnis – er macht Freiheit möglich.“","„Wir committen die Basics, der Rest ist Abenteuer.“","„Drei Optionen reichen.“"]],["Besuch / Gastgeberrolle","Explorer: „Locker, Spaß, Bewegung.“ Strategist: „Flow: Ankommen → Essen → Ausklingen. Ein Highlight.“","Du bringst Dynamik, Strategist hält Ablauf. Best-case: lebendig, aber nicht zerfasert. Risiko: du fühlst dich in ein Programm gepresst; Strategist wird genervt, wenn du spontan umsteuerst.",["„Flow ist besser als Plan.“","„Ein Highlight reicht.“","„Ich halte Rahmen – nicht Regie.“"]],["Gesundheit / Sport / Routinen","Explorer: „Abwechslung, Challenge, draußen – ich will's spüren.“ Strategist: „Plan, Rhythmus, Tracking – aber schlank.“","Du liebst Varianz, Strategist liebt Kontinuität. Best-case: du bleibst dran, weil es einen Rahmen gibt, und Strategist erlaubt dir Variation. Risiko: du wechselst zu oft (kein Fortschritt) oder der Plan wird zu streng und du brichst aus.",["„Varianz ja – innerhalb eines Blocks.“","„Kontinuität schlägt Kick.“","„Bonus ist optional.“"]]],"sig":["„Freiheit durch Struktur.“|Du bist am freiesten, wenn Basics geregelt sind.","„Spannung: spontanes Umsteuern vs. Plan-Treue.“","„Du startest schnell – Strategist macht es haltbar.“","„Risiko: Frust über 'zu viele Regeln'.“|Dann kommt innerer Widerstand.","„Beste Form: Leitplanken + Spontanblock.“"],"warn":[["Wenn du dich eingeengt fühlst",["„Warum so kompliziert?“","„Das killt die Spontanität.“","„Ich will einfach los.“"]],["Wenn du ausweichst",["„Wir reden später.“","„Jetzt ist nicht der Moment.“","„Lass erstmal raus.“"]],["Wenn du in Chaos rutschst",["„Wir improvisieren einfach.“","„Wird schon.“","„Komm, geht noch.“"]]],"beruf":[["Konflikt im Team",["Du willst Spannung raus + weiterarbeiten, Strategist will Rollen/Prozess klären.","Risiko|Konflikt wird wegbewegt oder zu „prozessig“."],["„Raus aus dem Drama.“","„Wir brauchen Klarheit.“","„Weiter jetzt.“"]],["Druck von oben",["Du willst schnell liefern, Strategist braucht Trade-offs.","Risiko|zu schnelles Ja oder spätes Blocken."],["„Wir finden einen Weg.“","„Ohne Priorisierung geht's nicht.“","„Engpass first.“"]],["Deadline-Projekt",["Du willst schnelle Loops, Strategist schützt kritischen Pfad.","Risiko|Scope springt, Fokus leidet."],["„Ein Loop noch.“","„Kritischer Pfad first.“","„Nicht verzetteln.“"]],["Feedbackgespräch",["Du willst es leicht/motivierend, Strategist will konkret/planbar.","Risiko|zu weich oder zu technisch."],["„Ich will motivieren.“","„Es braucht Klarheit.“","„Ein nächster Schritt.“"]]]}}};
const TIEFER={"commander":[["Antrieb und Bedürfnisse","Was du brauchst",[["Wie du dich siehst","Du definierst dich über Wirkung, Kontrolle, Stärke, Effizienz, Einfluss und die Übernahme von Verantwortung. Dein innerer Grundsatz lautet: „Wenn ich es nicht entscheide, passiert es nicht.“ Du glaubst an Klarheit statt Komplexität und daran, dass Führung eine Pflicht ist, kein Wunsch: „Wenn niemand führt, führt Chaos.“","",null],["Deine wichtigsten Bedürfnisse","Autonomie, Einfluss, Entscheidungshoheit, Klarheit, Tempo, Effizienz, Durchsetzungskraft und die Kontrolle über das Resultat.","",null],["Was dich motiviert",null,"",["Macht, nicht als Ego, sondern als Verantwortung: „Ich trage die Entscheidung.“","Wirksamkeit: „Ich will sehen, dass etwas passiert.“","Klarheit: „Was ist der nächste Schritt?“","Tempo: „Es muss vorangehen.“","Verantwortung: „Ich übernehme das – lass mich machen.“"]]]],["Was du fühlst","Dein emotionales Profil",[[null,"Deine Energie wirkt hart. Die Wahrheit dahinter: Du fühlst intensiv, zeigst es aber nur selten. Du hast eine starke innere Loyalität, bist emotional stabil und schützt andere.","",null],["Deine Grundgefühle",null,"",["Sicherheit, wenn du führst","Unruhe, wenn du passiv bist","Frustration, wenn Dinge ineffizient laufen"]],["Negative Gefühle entstehen bei",null,"warn",["Unklarheit","Zögern","unfairer Kritik","Machtspielen","Ineffizienz"]]]],["Wie du kommunizierst","Im Normalfall und unter Stress",[["Im Normalfall","Du kommunizierst klar, direkt, ohne Umwege, strukturiert, handlungsorientiert, kurz und knapp, ohne emotionalen Überschwang.","",null],["Typische Sätze",null,"",["„Was ist der Plan?“","„Was brauchen wir, um das zu lösen?“","„Mach das bitte bis morgen.“","„Ich übernehme.“"]],[null,"Dein Stil ist effektiv – aber nicht immer diplomatisch.","",null],["Unter Stress","Du wirst hart, ungeduldig, impulsiv, konfrontativ und überdirekt. Typische Signale sind schnelles Reden, eine lautere Stimme, klare Ansagen, Unterbrechungen und null Toleranz für Ineffizienz.","warn",null],["Bei anhaltendem Stress","Es kommt zu Überkontrolle, Selbstüberlastung und emotionaler Abkapselung.","warn",null]]],["Was dich triggert","Deine Reizpunkte",[[null,null,"",["Zögern und Unentschlossenheit: „Kann mir jemand eine Entscheidung geben?!“","Ineffizienz: „Warum dauert das so lange?“","Unklare Kommunikation: „Was willst du sagen? Komm zum Punkt.“","Überregulierung: „Das dauert zu lange – ich mach’s selbst.“","Emotionale Dramen: Du hasst es, wenn Emotion über Logik steht."]]]],["Wie du im Konflikt bist","Und wenn deine Energie kippt",[["Dein Konfliktverhalten","Direkte Konfrontation, klare Ansagen, lösungsorientierter Druck, Fokus auf Effektivität, wenig Diplomatie. Du bist konfliktfähig – aber nicht immer konfliktklug.","",null],["Konflikte eskalieren, wenn",null,"warn",["jemand sich verweigert","klare Entscheidungen fehlen","dir ohne Argument widersprochen wird"]],["Wenn deine Energie kippt","Dann zeigen sich Dominanz, Härte, Ungeduld, Machtkampf, Druckverhalten, Sturheit und Impulsivität. Der schlimmste Zustand klingt so: „Ich mache alles selbst, weil niemand es gut genug macht.“","warn",null]]]],"strategist":[["Antrieb und Bedürfnisse","Was du brauchst",[["Wie du dich siehst","Du definierst dich über Ordnung, Sicherheit, Struktur, Methoden, Effizienz und Systemdenken. Dein innerer Grundsatz lautet: „Wenn ich etwas kontrollieren kann, geht es nicht schief.“ Deine Identität ruht auf Kompetenz, Präzision, Verlässlichkeit, Stabilität und Expertise. Du willst die Dinge nicht nur verstehen, sondern perfekt organisieren.","",null],["Deine drei Grundmuster",null,"",["Kontrolle|Für dich heißt Kontrolle Sicherheit, und Sicherheit heißt Entspannung.","Ordnungsbedürfnis|Innere und äußere Unordnung erzeugt bei dir Stress.","Leistungsbezogene Selbstbewertung|„Ich bin wertvoll, wenn meine Arbeit hochwertig ist.“"]],["Was dich antreibt",null,"",["Ordnung|Chaos frisst deine Energie.","Exzellenz|Du willst Dinge korrekt machen, nicht irgendwie.","Sicherheit|Planbarkeit gibt dir Ruhe.","Verantwortung|Du bist oft die Person, die den Laden zusammenhält.","Struktur|Klare Abläufe machen dich stark."]],["Was du dafür brauchst","Stabilität, klare Regeln, definierte Prozesse, Planbarkeit, Effizienz, hohe Qualität, Verlässlichkeit und Kontrolle über den Ablauf.","",null]]],["Wie du denkst","Dein Kopf bei der Arbeit",[["Dein Denkstil","Du denkst linear, logisch, sequenziell, präzise, faktenbasiert und strukturbildend.","",null],["Deine kognitiven Stärken",null,"ok",["Prozessdenken|Du erkennst sofort: Was sind die Schritte? Was fehlt?","Fehlererkennung|Du siehst Fehler, bevor andere sie erahnen.","Optimierungslogik|Du verbesserst Systeme, immer.","Systemintegration|Du verstehst, wie die Dinge zusammenspielen.","Entscheidungsstabilität|Du triffst klare, sichere Entscheidungen."]],["Das Risiko dahinter","Perfektionismus und Überstruktur.","warn",null]]],["Was du fühlst","Dein emotionales Profil",[[null,"Du wirkst ruhig, bist innerlich aber angespannt, wenn Strukturen fehlen. Du bist von Verantwortung getrieben, empfindlich für Chaos und kaum tolerant gegenüber Inkonsequenz.","",null],["Deine Grundgefühle",null,"",["Ruhe, wenn alles organisiert ist","Anspannung, wenn Unordnung herrscht","Stolz auf Qualität","Unbehagen bei Unklarheit"]],["Negative Gefühle entstehen bei",null,"warn",["Chaos","spontanen Richtungswechseln","fehlenden Vorgaben","unzuverlässigen Menschen"]]]],["Wie du kommunizierst","Im Normalfall und unter Stress",[["Im Normalfall","Du sprichst klar, sachlich, geordnet, strukturiert, konkret und methodisch, meist ohne Emotionen. Du kommunizierst präzise, zuverlässig und korrekt.","",null],["Typische Sätze",null,"",["„Was genau ist der Prozess?“","„Lass uns das strukturieren.“","„Was ist Schritt 1, 2 und 3?“","„Ich brauche eine klare Reihenfolge.“"]],["Unter Stress","Du wirst perfektionistisch, kontrollierend, kleinteilig, korrigierend, regelzentriert und hart in der Kommunikation. Typische Sätze sind dann „Das ist nicht korrekt!“, „So kann man nicht arbeiten.“, „Wir müssen uns an die Regeln halten.“ und „Das ist viel zu unstrukturiert.“","warn",null],["Bei anhaltendem Stress","Es kommt zu Mikromanagement, starrem Verhalten und unflexibler Kommunikation.","warn",null]]],["Was dich triggert","Deine Reizpunkte",[[null,null,"",["Chaos|„Das ist völlig unstrukturiert.“","Unzuverlässigkeit|„Warum wurde das nicht wie vereinbart gemacht?“","Spontane Änderungen|„Wir ändern das jetzt einfach?“ – das setzt dich unter Stress.","Fehlende Standards|„Wie ist der Prozess dazu?“","Unklare Kommunikation|„Was genau meinst du damit?“"]]]],["Wie du im Konflikt bist","Und wenn deine Energie kippt",[["Dein Konfliktverhalten","Du forderst Korrektheit ein, betonst die Logik, blendest Emotionen aus, bleibst starr und gibst nicht schnell nach. Du argumentierst, du emotionalisierst nicht. Du fühlst dich sicher, wenn die Fakten auf deiner Seite sind.","",null],["Konflikte eskalieren, wenn",null,"warn",["jemand Regeln bricht","Unordnung entsteht","du spontan überrumpelt wirst"]],["Wenn deine Energie kippt","Dann zeigen sich Perfektionismus, Kontrolle, Mikromanagement, Unbeweglichkeit, Kritikdominanz, Schwere und Starrheit. Du kannst den Projektfluss blockieren, wenn du zu streng wirst.","warn",null]]],["Wie du führst","Und wie dein Körper es zeigt",[["Dein Führungsstil","Du führst über Prozesse, Kompetenz, Ordnung, Qualität und Struktur. Du bist gewissenhaft, vorbereitet, verlässlich, anspruchsvoll und detailorientiert. Dafür hast du wenig Flexibilität, einen hohen Perfektionsdruck und wenig emotionale Wärme. Trotzdem bist du der stabilste aller Führungstypen.","",null],["Körperlich","Du bewegst dich ruhig und kontrolliert, mit minimaler Gestik, aufrechter Haltung, präzisem Timing, langsamem, geordnetem Rhythmus und tiefer, regelmäßiger Atmung. Dein Körper wirkt kontrolliert, funktional und stabil.","",null]]]],"sage":[["Antrieb und Bedürfnisse","Was du brauchst",[["Wie du dich siehst","Dein Kern ist Verstehen. Du definierst dich nicht über Emotionen, Status oder Macht, sondern über Richtigkeit, Wahrheit, Erkenntnis und Kohärenz. Dein Grundsatz lautet: „Ich denke tief, damit die Welt klarer wird.“ Du fühlst dich erst sicher, wenn alles logisch zusammenpasst.","",null],["Deine drei Grundmuster",null,"",["Ordnungsdrang im Kopf|Die Welt wird für dich erst sicher, wenn du sie verstanden hast.","Distanz zur Überflutung|Emotionen sind nicht dein Feind, aber sie sind laut. Du brauchst Abstand, um klar zu denken.","Rationaler Selbstwert|„Ich bin wertvoll, wenn ich klug, präzise und analytisch bin.“"]],["Was dich antreibt",null,"",["Wahrheit|Du trägst einen inneren Wahrheitssensor.","Klarheit|Du hasst Unklarheit, Chaos und doppeldeutiges Verhalten.","Verstehen|Du willst Muster, Zusammenhänge und Systeme erkennen.","Kompetenz|Du willst fachlich unangefochten sein.","Stabilität|Du brauchst Ruhe, um deine Denkkraft zu nutzen."]],["Was du dafür brauchst","Zeit zum Denken, tiefe Gespräche, intellektuelle Herausforderungen, logische Ordnung, Fakten statt Drama, Zugang zu Wissen und stabile Rahmenbedingungen.","",null],["Wenn Analyse zur Selbstwertquelle wird","Dann entstehen Überdenken, Selbstkritik, Entscheidungsverlust und Perfektionismus im Denken. In gesunder Form wirst du zu tiefer Weisheit, Klarheit und durchdachten Entscheidungen.","warn",null]]],["Wie du denkst","Dein Kopf bei der Arbeit",[["Dein Denkstil","Du denkst in Mustern, Systemen und Zusammenhängen. Kein Held denkt so tief wie du.","",null],["Deine kognitiven Stärken",null,"ok",["Deduktives Denken|Vom Allgemeinen zum Besonderen, logisch und strukturiert.","Induktives Denken|Du erkennst Muster, wo andere Chaos sehen.","Analytisches Denken|Du zerlegst Probleme, bis sie verstanden sind.","Tiefenreflexion|Du gehst Dingen auf den Grund.","Meta-Denken|Du denkst über das Denken selbst nach."]],["Das Risiko dahinter","Gedankenschleifen und Overthinking. Deine Stärke bleibt dabei Genauigkeit, Klugheit und nüchterne Brillanz.","warn",null]]],["Was du fühlst","Dein emotionales Profil",[[null,"Du wirkst emotional distanziert, aber das stimmt nicht: Du fühlst tief, zeigst es nur selten. Deine Logik dabei: Gefühle analysierst du, bei Stress gehst du auf Distanz, Nähe reflektierst du, und Konflikte betrachtest du logisch.","",null],["Deine Grundgefühle",null,"",["Ruhe","Ernsthaftigkeit","Klarheit","innere Konzentration","Sinnbedürfnis"]],["Negative Gefühle entstehen bei",null,"warn",["Unklarheit","Chaos","emotionaler Lautstärke","Unlogik","fehlender Orientierung"]]]],["Wie du kommunizierst","Im Normalfall und unter Stress",[["Im Normalfall","Du kommunizierst präzise, sachlich, logisch, ruhig, geordnet, faktenbasiert und strukturiert. Du bist ein ruhiger, aber sehr kraftvoller Kommunikator.","",null],["Typische Sätze",null,"",["„Lass uns das durchdenken.“","„Was ist die Logik dahinter?“","„Wir sollten die Annahmen prüfen.“","„Welche Daten haben wir dazu?“"]],["Unter Stress","Du wirst zu detailliert, zu analytisch, zu langsam, überkritisch, schweigsam und distanziert. Typische Signale sind „Ich brauche mehr Zeit.“, „Ich bin noch nicht sicher.“ und „Das ist nicht sauber genug.“ Oft ziehst du dich zurück.","warn",null],["Bei anhaltendem Stress","Es kommt zu emotionaler Lähmung, Analyseblockaden und Entscheidungsvermeidung.","warn",null]]],["Was dich triggert","Deine Reizpunkte",[[null,null,"",["Unlogik|„Weil wir das immer so gemacht haben.“","Emotionale Überflutung|„Wir müssen das jetzt FÜHLEN!“","Zeitdruck|„Entscheide einfach JETZT!“","Sprunghaftigkeit|„Wir machen mal einfach ...“","Oberflächlichkeit|„Ist doch egal – mach einfach.“"]]]],["Wie du im Konflikt bist","Und wenn deine Energie kippt",[["Dein Konfliktverhalten","Du vermeidest lauten Konflikt und verarbeitest ihn intern statt extern. Typisch sind Rückzug, Schweigen, Analyse statt Reaktion, Distanz und Verlangsamung. Zur Lösung brauchst du Ruhe, Fakten, Struktur, Raum und Zeit.","",null],["Wenn deine Energie kippt","Dann zeigen sich Overthinking, Entscheidungslähmung, Perfektionismus, Rückzug, Kritikverhalten, Kühle, Isolation und Zweifel. Der schlimmste Zustand ist ein Gedankengefängnis ohne Bewegung.","warn",null]]],["Wie du führst","Und wie dein Körper es zeigt",[["Dein Führungsstil","Du führst bedacht, rational, analytisch, präzise, langfristig und sachlich. Du bevorzugst Struktur, Klarheit, Daten, saubere Entscheidungen, wenig Drama und schriftliche Kommunikation. Du bist der strategische Navigator und der intellektuelle Anker deines Teams.","",null],["Körperlich","Du bewegst dich ruhig, mit geringer Gestik, klarer, präziser Haltung, nach innen gerichtetem Blick, ausdrucksarmer Mimik und langsamem Atem. Es ist die ruhigste Körperenergie der sechs Helden.","",null]]]],"innovator":[["Antrieb und Bedürfnisse","Was du brauchst",[["Wie du dich siehst","Dein Grundsatz lautet: „Ich erschaffe Zukunft, indem ich das Bekannte infrage stelle.“ Du definierst dich nicht über das, was ist, sondern über das, was entstehen könnte. Freiheit steht bei dir vor Struktur, Ideen vor Regeln, Kreativität vor Konformität, Exploration vor Sicherheit und Inspiration vor Stabilität. Du erlebst die Welt als formbar, gestaltbar und offen.","",null],["Deine drei Grundmuster",null,"",["Möglichkeitsorientierung|Du denkst in möglichen Zukünften statt in aktuellen Realitäten.","Nonkonformismus|Du misstraust starren Strukturen, Normen und Traditionen.","Neuheitsdrang|Dein Gehirn sucht nach Neuem, Komplexem und Unbekanntem."]],["Was dich antreibt",null,"",["Freiheit|Keine äußere Einschränkung, keine starren Vorgaben.","Kreativität|Du willst Ideen ausdrücken dürfen.","Bedeutung|Du willst spüren, dass die Zukunft durch dich besser wird.","Expansion|Du willst wachsen, erweitern und Neues erschaffen.","Inspiration|Du willst in einem Umfeld arbeiten, das Energie gibt und nicht entzieht."]],["Was du dafür brauchst","Freiheit, Unabhängigkeit, Offenheit, Abwechslung, intellektuelle Stimulation, Kreativitätsräume, Mitgestaltungsmöglichkeiten und Ungebundenheit von Routinen.","",null],["Unter Stress kippt das in","Übererregung, Ideenexplosion, Impulsivität und Gedankenchaos. Im gesunden Zustand wird dieselbe Energie zu unvergleichlicher Kreativität, disruptivem Denken und innovativer Kraft.","warn",null]]],["Wie du denkst","Dein Kopf bei der Arbeit",[["Deine kognitiven Stärken",null,"ok",["Netzartiges Denken|Du verknüpfst Dinge, die scheinbar nichts miteinander zu tun haben.","Divergentes Denken|Du erzeugst viele Möglichkeiten, aus denen neue Konzepte entstehen.","Szenariodenken|Du simulierst alternative Zukünfte im Kopf.","Kreatives Reframing|Du brichst Probleme auf ungewöhnliche Weise auf.","Hohe Ideenproduktion|Du produzierst in einer Stunde mehr Ideen als andere in einer Woche."]],["Das Risiko dahinter","Verzettelung, Prioritätsverlust und Überkomplexität.","warn",null]]],["Was du fühlst","Dein emotionales Profil",[[null,"Du fühlst intensiv, aber oft ungerichtet.","",null],["Deine Grundgefühle",null,"",["Inspiration","Neugier","Enthusiasmus","inneres Brennen","Drang nach Freiheit","Gestaltungswille"]],["Negative Gefühle entstehen, wenn",null,"warn",["du kontrolliert wirst","du eingeschränkt wirst","du in Routine erstickst","deine Ideen kleingemacht werden"]],["Typisches Stressgefühl","„Ich stecke fest – ich brauche Raum.“","warn",null]]],["Wie du kommunizierst","Im Normalfall und unter Stress",[["Im Normalfall","Du kommunizierst inspirierend, visionär, bildhaft, schnell, ideenreich und enthusiastisch. Du sprichst in Möglichkeiten („Was wäre, wenn ...“), in Zukunftsbildern („Ich sehe da etwas ...“), in Metaphern und Konzepten. Du sagst selten „So ist es“, eher „So könnte es sein“.","",null],["Unter Stress","Du wirst sprunghaft, unstrukturiert, überfordernd, schnell – zu schnell –, von Ideen überflutet, unklar ohne Prioritäten, ungeduldig und teilweise impulsiv. Typische Sätze sind „Wir könnten doch auch ... und außerdem ...!“, „Mir fällt gerade noch etwas ein ...“ und „Es gibt so viele Möglichkeiten!“","warn",null],["Bei anhaltendem Stress","Es kommt zu Ideenchaos, Verzettelung und der Flucht in neue Projekte.","warn",null]]],["Was dich triggert","Deine Reizpunkte",[[null,null,"",["Enge Regeln|„Das muss so gemacht werden.“","Mikromanagement|„Du musst erst X tun, bevor du Y darfst.“","Routine|Wiederkehrende, monotone Abläufe ersticken dich.","Kritische Bewertung deiner Ideen|„Das funktioniert eh nicht.“","Engstirnigkeit|„So haben wir es immer gemacht.“ – der größte Feind deiner Psyche."]]]],["Wie du im Konflikt bist","Und wenn deine Energie kippt",[["Dein Konfliktverhalten","Typisch sind geistige Flucht, Distanz, Ideenüberladung, impulsive Einfälle und Vermeidung. Manchmal deutest du den Konflikt zu einem „Möglichkeitsraum“ um.","",null],["Wenn deine Energie kippt","Dann zeigen sich Ideenchaos, Prioritätsverlust, impulsive Entscheidungen, fehlende Ausdauer, Abbruch von Projekten, Distanzierung, Überforderung anderer, Zukunft ohne Struktur und emotionale Instabilität. Im Extrem wird daraus chronische Verzettelung.","warn",null]]],["Wie du führst","Und wie dein Körper es zeigt",[["Dein Führungsstil","Du führst inspirierend, visionär, experimentell, mutig und unkonventionell. Du schaffst Räume, in denen Neues entsteht, Kreativität blüht, Ideen wachsen und Menschen sich entfalten. Schwerer fallen dir Struktur, Konsequenz, Umsetzung, Prioritäten und Erwartungsmanagement. Du brauchst Teams, die dich nicht einschränken, sondern formen.","",null],["Körperlich","Du bewegst dich schnell, mit lebendiger Gestik und kreativer Mimik. Deine Energie ist rastlos, die Haltung wechselt, das Energiemuster ist unregelmäßig. Dein Körper zeigt dein Denken: sprunghaft, lebendig, in Bewegung.","",null]]]],"guardian":[["Antrieb und Bedürfnisse","Was du brauchst",[["Wie du dich siehst","Du definierst dich über Beziehungen, Zugehörigkeit, Kooperation, Nähe und zwischenmenschliche Stabilität. Dein Grundsatz lautet: „Ich sorge dafür, dass wir gut miteinander sind.“ Tief in dir glaubst du: „Ich bin wertvoll, wenn es anderen gut geht“, „Ich darf niemanden enttäuschen“ und „Harmonie ist die Grundlage von allem.“ Du bist der soziale Anker deines Teams.","",null],["Deine drei Grundmuster",null,"",["Bindung|Du denkst in Beziehungen, nicht in Aufgaben.","Harmonieorientierung|Streit bedeutet für dich Stress, Nähe bedeutet Sicherheit.","Wertemuster|Du hast starke innere Standards für Loyalität, Fairness und Unterstützung."]],["Was dich antreibt",null,"",["Verbindung|Menschen sind dein Energietank.","Fürsorge geben|Helfen macht dich stark, aber auch verletzlich.","Anerkennung für Loyalität|Du willst für das gesehen werden, was du für andere tust.","Stabilität|Du hasst abrupte Veränderungen."]],["Was du dafür brauchst","Anerkennung, Sicherheit im sozialen Umfeld, Harmonie, Wertschätzung, klare Beziehungen, ein Teamgefühl, emotionale Stabilität und Zugehörigkeit.","",null],["Im Schatten","Dann kippt deine Wärme in Selbstaufgabe, Überanpassung und Unsicherheit. Im gesunden Zustand bist du warm, zuverlässig, tragend und emotional intelligent.","warn",null]]],["Wie du denkst","Dein Kopf bei der Arbeit",[["Dein Denkstil","Du denkst relational.","",null],["Deine kognitiven Stärken",null,"ok",["Soziale Mustererkennung|Du spürst Stimmungen, bevor andere sie wahrnehmen.","Empathische Logik|Du verstehst Gefühle und Beziehungen intuitiv.","Fürsorgelogik|Du fragst: „Was brauchen die Menschen hier?“","Konfliktsensibilität|Du erkennst Spannungen im Team sofort.","Bedürfnisorientierung|Du bewertest Situationen nach ihren menschlichen Auswirkungen."]],["Das Risiko dahinter","Du nimmst Menschen manchmal wichtiger als Fakten. Deine Stärke ist dafür das emotionale Management.","warn",null]]],["Was du fühlst","Dein emotionales Profil",[[null,"Deine Energie ist warm, weich, freundlich, stabilisierend und fürsorglich. Du bist der emotional sensibelste Held.","",null],["Deine Grundgefühle",null,"",["Empathie","Wertschätzung","Verbundenheit","Verantwortung","Zugehörigkeit"]],["Negative Gefühle entstehen bei",null,"warn",["der Angst, jemanden zu enttäuschen","Verlustgefühl","Konfliktangst","innerer Instabilität","Selbstzweifel"]]]],["Wie du kommunizierst","Im Normalfall und unter Stress",[["Im Normalfall","Du kommunizierst freundlich, unterstützend, weich, empathisch und beziehungsorientiert. Du stellst Menschen in den Mittelpunkt.","",null],["Typische Sätze",null,"",["„Wie geht es dir damit?“","„Ich bin für dich da.“","„Lass uns das gemeinsam lösen.“","„Ich möchte, dass wir uns alle wohlfühlen.“"]],["Unter Stress","Du wirst unsicher, entschuldigend, überangepasst, konfliktvermeidend und emotional verletzlich. Typisch sind übermäßige Rücksicht, Schuldgefühle, Selbstkritik und sozialer Rückzug. Auch Weinen kann dazugehören, nicht aus Schwäche, sondern aus Überlastung.","warn",null],["Bei anhaltendem Stress","Es kommt zu emotionaler Instabilität, Selbstzweifeln und Angst vor Ablehnung.","warn",null]]],["Was dich triggert","Deine Reizpunkte",[[null,null,"",["Kälte|„Mir ist egal, wie es den Leuten geht.“","Härte und Dominanz|„Mach es einfach, keine Diskussion.“","Kritik ohne Empathie|„Das ist schlecht.“ – das tut dir weh.","Konflikte|Lauter Streit löst bei dir Stress aus.","Unzuverlässigkeit|Du gibst viel, Enttäuschung verletzt dich."]]]],["Wie du im Konflikt bist","Und wenn deine Energie kippt",[["Dein Konfliktverhalten","Typisch sind Rückzug, Beschwichtigung, Überanpassung, Schuldgefühle und emotionale Verletzlichkeit. Du weichst aus, statt zu konfrontieren. Zur Lösung brauchst du Sicherheit, Ruhe, Empathie, Zeit und sanfte Klarheit.","",null],["Wenn deine Energie kippt","Dann zeigen sich Selbstaufgabe, Überanpassung, Bedürftigkeit, Entscheidungsschwäche, Konfliktvermeidung, emotionale Abhängigkeit und unterschwellige Kränkbarkeit. Der schlimmste Zustand: unsichtbar werden, um nicht im Weg zu sein.","warn",null]]],["Wie du führst","Und wie dein Körper es zeigt",[["Dein Führungsstil","Du führst unterstützend, kooperativ, wertschätzend, empathisch, teamorientiert und stabilisierend. Du bist fürsorglich, geduldig, verständnisvoll und menschenzentriert. Dafür bist du manchmal zu weich, setzt zu wenig Grenzen und hast zu viel Harmoniebedürfnis. Dafür schaffst du einzigartige Teamkulturen.","",null],["Körperlich","Du bewegst dich weich, mit runder Körperhaltung, offener Gestik, freundlichem Blick und ruhigem, sanftem Ton. Du suchst körperliche Nähe, ohne aufdringlich zu sein. Deine Präsenz ist warm, einladend und sicher.","",null]]]],"explorer":[["Antrieb und Bedürfnisse","Was du brauchst",[["Wie du dich siehst","Du definierst dich über Freiheit, Autonomie, Bewegung, Spontaneität, Abwechslung und die Entdeckung neuer Sichtweisen. Dein innerer Grundsatz lautet: „Ich brauche Raum.“ Du bist frei, neugierig, unabhängig, offen für Neues und ein Entdecker. Deine Botschaft: „Es gibt immer einen anderen Weg.“ Du öffnest Türen, die andere nicht einmal sehen.","",null],["Deine drei Grundmuster",null,"",["Autonomie|Zwang führt bei dir zu Rebellion, jede Form von Einschränkung spürst du sofort.","Neugier|Neue Erfahrungen erzeugen Energie und Begeisterung.","Bewegung|Du denkst beim Tun, nicht beim Sitzen."]],["Was dich antreibt",null,"",["Autonomie|Du musst das Gefühl haben, selbst entscheiden zu können.","Entdeckung|Du willst Dinge erforschen, nicht erfüllen.","Leichtigkeit|Schwere Energien erdrücken dich.","Spontaneität|Routinen frustrieren dich.","Vielfalt|Monotonie bedeutet für dich Energieverlust."]],["Was du dafür brauchst","Freiheit, Raum, Flexibilität, Abenteuer, neue Reize, Veränderung, Abwechslung, Unabhängigkeit und inspirierende Umgebungen.","",null],["Wenn es kippt","Im gesunden Zustand bist du flexibel, lernbereit, anpassungsfähig und wagemutig. Im ungesunden Zustand wirst du flüchtig, unzuverlässig und bindungsmeidend.","warn",null]]],["Wie du denkst","Dein Kopf bei der Arbeit",[["Dein Denkstil","Du denkst erfahrungsorientiert, flexibel, offen, experimentell, intuitiv und beweglich.","",null],["Deine kognitiven Stärken",null,"ok",["Adaptives Denken|Du passt dich sofort neuen Situationen an.","Improvisation|Wenn andere stecken bleiben, findest du neue Wege.","Kreativer Pragmatismus|Nicht planen, sondern ausprobieren.","Erfahrungslernen|Tun, lernen, verbessern.","Mentale Beweglichkeit|Du wechselst schnell von einem Gedanken zum nächsten."]],["Das Risiko dahinter","Zerstreuung und Unfokussiertheit.","warn",null]]],["Was du fühlst","Dein emotionales Profil",[[null,"Dein Emotionsprofil ist lebendig, spontan, leicht, frei und beweglich. Du bist der emotional freiheitsliebendste Held.","",null],["Deine Grundgefühle",null,"",["Begeisterung","Neugier","Abenteuerlust","Möglichkeit","Freiheit","Aufbruchsenergie"]],["Negative Gefühle entstehen bei",null,"warn",["Eingesperrtsein","Langeweile","emotionaler Enge","Erwartungsdruck","Kontrolle"]]]],["Wie du kommunizierst","Im Normalfall und unter Stress",[["Im Normalfall","Du kommunizierst locker, leicht, humorvoll, offen, begeistert, assoziativ, schnell wechselnd und von Ideen sprudelnd. Du sprichst, um zu erkunden, nicht um festzulegen.","",null],["Typische Sätze",null,"",["„Lass uns einfach ausprobieren!“","„Was wäre, wenn wir ...?“","„Ich hab eine spontane Idee.“","„Wir können doch auch so ...“"]],["Unter Stress","Du ziehst dich zurück, gehst auf Distanz, vermeidest, lenkst dich ab, spürst Freiheitsdrang und kühlst emotional ab. Typisch sind Termine ghosten, nicht antworten, das Gespräch wechseln, Aufgaben verlassen und „Ich brauche Abstand“.","warn",null],["Bei anhaltendem Stress","Es kommt zu impulsiver Flucht, Orientierungslosigkeit und Entscheidungsschwäche.","warn",null]]],["Was dich triggert","Deine Reizpunkte",[[null,null,"",["Überkontrolle|„Mach es GENAU SO!“","Monotonie|Wiederholung kostet dich Energie.","Zu viele Regeln|Prozesszwang macht dich nervös.","Starre Menschen|„Wir machen das schon immer so.“","Emotionale Abhängigkeit anderer|„Du MUSST für mich da sein!“"]]]],["Wie du im Konflikt bist","Und wenn deine Energie kippt",[["Dein Konfliktverhalten","Typisch sind Flucht, Distanz, Themenwechsel, Ablenkung, Humor als Schutz und Rückzug. Härte und Konfrontation meidest du. Zur Lösung brauchst du Sicherheit, offene Wahlmöglichkeiten, respektvolle Kommunikation, keine Kontrolle und Zeit zum Durchatmen.","",null],["Wenn deine Energie kippt","Dann zeigen sich Unzuverlässigkeit, Unbeständigkeit, Abbruch von Projekten, mangelnde Tiefe, Vermeidung, Entscheidungsschwäche, fehlende Verbindlichkeit und impulsiver Rückzug. Der schlimmste Zustand: nicht greifbar und nicht führbar.","warn",null]]],["Wie du führst","Und wie dein Körper es zeigt",[["Dein Führungsstil","Du führst kreativ, offen, leicht, freiheitsfördernd, inspirierend und experimentell. Du bist nicht dogmatisch, nicht hierarchisch und nicht kontrollierend. Dafür bist du nicht immer konsequent, strukturiert und planbar. Du schaffst Räume, in denen Innovation entstehen kann.","",null],["Körperlich","Du bewegst dich schnell, flexibel und spontan, mit offenen Armen, lebendiger Mimik und viel Energie. Typisch sind leichte Schritte, ein fließender Bewegungsstil, unruhige Hände, schnelle Reaktionen und ungerichtete Energie. Du wirkst wie ein Wind, der neue Impulse bringt.","",null]]]]};


var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';
const PROFILE_FN='/.netlify/functions/profile';
const PROFILE_URL='https://app.6heroes.de/mein-bereich';
const HERO_COLOR={commander:'#0B63CE',explorer:'#F0672A',innovator:'#F2B705',guardian:'#1F9D62',sage:'#C0266A',strategist:'#475569'};
const HERO_LABEL={commander:'Commander',explorer:'Explorer',innovator:'Innovator',guardian:'Guardian',sage:'Sage',strategist:'Strategist'};
const ON_COLOR=k=>k==='innovator'?'#20293A':'#fff';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():'';
const blk=(l,p,cls,ul)=>'<div class="blk">'+(l?'<span class="bl '+(cls||'')+'">'+esc(l)+'</span>':'')+(p?'<p>'+esc(p)+'</p>':'')+(ul?'<ul>'+ul.map(x=>{const t=String(x).split('|');return t.length>1?'<li><b>'+esc(t[0])+'</b> '+esc(t.slice(1).join('|'))+'</li>':'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+'</div>';
const acc=(a,sub,inner,open)=>'<details'+(open?' open':'')+'><summary><span class="s1"><span class="a">'+esc(a)+'</span>'+(sub?'<span class="b">'+esc(sub)+'</span>':'')+'</span></summary><div class="body">'+inner+'</div></details>';
const lab=t=>'<div class="label">'+esc(t)+'</div>';
const topbar='<div class="topbar"><a href="'+PROFILE_URL+'" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mein Bereich</a></div>';
function postHeight(){const h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}
async function getProfile(){
  const p=new URLSearchParams(location.search);const email=(p.get('email')||'').trim();
  if(!email) return null;
  try{const r=await fetch(PROFILE_FN+'?email='+encodeURIComponent(email));if(!r.ok) throw new Error(r.status);return await r.json();}
  catch(e){console.warn('Profil-Fetch fehlgeschlagen:',e);return null;}
}
function boot(render){
  window.addEventListener('load',()=>{render().then(()=>{var w=document.querySelector('.wrap');if(w)w.classList.add('ready');postHeight();});});
  window.addEventListener('resize',postHeight);
  if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
  document.addEventListener('toggle',postHeight,true);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(postHeight);}
  [50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
}


function profilBlocks(h){
  return h.profil.map((p,i)=>acc(p[0],p[1],p[2].map(b=>blk(b[0],b[1],b[2])).join(''),i===0)).join('');
}
function staerken(h){return '<div class="card">'+h.staerken.map(s=>blk(s[0],s[1],'ok')).join('')+'</div>';}
async function render(){
  const q=new URLSearchParams(location.search);
  const rolle=(q.get('rolle')||'basis').toLowerCase()==='zweit'?'zweit':'basis';
  let key=(q.get('hero')||'').trim().toLowerCase();
  let basis=(q.get('basis')||'').trim().toLowerCase();
  if(!key||(rolle==='zweit'&&!basis)){
    const d=await getProfile();
    if(d){
      if(!key) key=String((rolle==='zweit'?d.second:d.base)||'').trim().toLowerCase();
      if(!basis) basis=String(d.base||'').trim().toLowerCase();
    }
  }
  if(!PLATT[key]) key=(rolle==='zweit')?'explorer':'commander';
  if(!basis) basis='commander';
  const h=PLATT[key];
  const root=document.documentElement.style;root.setProperty('--accent',HERO_COLOR[key]);
  let html=topbar+'<div class="hero"><div class="emb" style="background:'+HERO_COLOR[key]+';color:'+ON_COLOR(key)+'">'+HERO_LABEL[key][0]+'</div>'
    +'<span class="eyebrow">Dein '+(rolle==='zweit'?'Zweitheld':'Basisheld')+'</span><h1>Der <span class="accent">'+HERO_LABEL[key]+'</span></h1><p class="hook">'+esc(h.hook)+'</p></div>';
  if(rolle==='basis'){
    html+=lab('Deine drei Kernstärken')+staerken(h);
    html+=lab('Dein Profil')+'<div class="stack">'+profilBlocks(h)+'</div>';
    html+=lab('Im Alltag')+'<div class="stack">'+LIFE[key].map(l=>acc(l[0],'',blk(null,l[1]))).join('')+'</div>';
    if(TIEFER[key]){
      html+=lab('Noch tiefer')+'<div class="stack">'+TIEFER[key].map(t=>acc(t[0],t[1],t[2].map(b=>blk(b[0],b[1],b[2],b[3])).join(''))).join('')+'</div>';
    }
  }else{
    const z=(ZB[basis]&&ZB[basis][key])||null;
    if(z){
      html+=lab('Dein Zweitheld im Zusammenspiel')+'<div class="stack">'
        +acc('Wie '+HERO_LABEL[key]+' zu deinem '+HERO_LABEL[basis]+' passt','Kernidee und fünf Signaturen',blk(null,z.kern)+blk('Woran du dich erkennst',null,'',z.sig),true)+'</div>';
    }
    html+=lab('Die drei Kernstärken des '+HERO_LABEL[key])+staerken(h);
    html+=lab('Profil des '+HERO_LABEL[key])+'<div class="stack">'+profilBlocks(h)+'</div>';
    html+=lab('Im Alltag')+'<div class="stack">'+LIFE[key].map(l=>acc(l[0],'',blk(null,l[1]))).join('')+'</div>';
    if(z){
      html+=lab('Privat')+'<div class="stack">'+z.privat.map(x=>acc(x[0],'',blk('Zwei Stimmen in dir',x[1])+blk('Typisches Verhalten',x[2])+blk('Innere Sätze',null,'',x[3]))).join('')+'</div>';
      html+=lab('Im Beruf')+'<div class="stack">'+z.beruf.map(x=>acc(x[0],'',blk('Typisches Muster',null,'',x[1])+blk('Innere Sätze',null,'',x[2]))).join('')+'</div>';
      html+=lab('Zum Erkennen')+'<div class="stack">'+acc('Deine Warnlampen','Innere Sätze, die dich verraten',z.warn.map(w=>blk(w[0],null,'warn',w[1])).join(''))+'</div>';
    }
  }
  document.getElementById('app').innerHTML=html;
}
boot(render);

</script>
