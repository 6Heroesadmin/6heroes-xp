]],["Feedbackgespräch",["Explorer macht es locker/motivational, Strategist will Klarheit/Plan.","Risiko|zu weich oder zu kumpelhaft ohne Konsequenz."],["„Ich will motivieren, aber nicht verwässern.“","„Es braucht einen klaren nächsten Schritt.“","„Eine Sache ändern, nicht fünf.“"]]]},"guardian":{"kern":"Strategist strukturiert, standardisiert, plant und reduziert Fehler. Guardian sorgt für Stabilität, Sorgfalt, Verlässlichkeit und menschliche Sicherheit. Das Ergebnis ist oft: „Reliable Builder“ – du kombinierst kluge Struktur mit hoher Ausführungsqualität und tragfähigen Routinen.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Strategist: „Engpass, Reihenfolge, Plan – dann läuft's.“ Guardian: „Aber bitte ordentlich, sicher, richtig – nichts vergessen.“","Du willst Effizienz, Guardian will Absicherung/Standards. Best-case: strukturiert und verlässlich. Risiko: du verlierst Tempo durch Detail-Checks oder wirst scharf, wenn jemand Standards reißt („so geht das nicht“).",["„Schnell ist gut – aber nicht auf Kosten von Sicherheit.“","„Wenn wir es sauber machen, sparen wir später Zeit.“","„Ich will Stabilität, nicht Chaos.“"]],["Paar-Konflikt","Strategist: „Wir brauchen eine Regel, damit es stabil wird.“ Guardian: „Ich will Fairness, Verlässlichkeit, Anerkennung.“","Du willst System/Regeln, Guardian will Schutz und Fairness. Risiko: das Gespräch wird sehr „vertraglich“ (kühl) oder du gehst in „Standard-Richtermodus“ statt Verbindung.",["„Fairness braucht klare Zuständigkeiten.“","„Wenn wir das nicht regeln, passiert es wieder.“","„Ich will, dass es für beide tragbar ist.“"]],["Urlaub planen / Familienlogistik","Strategist: „Kriterien, Vergleich, Entscheidung.“ Guardian: „Budget, Storno, Sicherheit, kinderfreundlich, Risiken.“","Du strukturierst Auswahl, Guardian prüft Risiken. Best-case: sehr sichere, saubere Entscheidung. Risiko: Entscheidungsstau (zu viele Sicherheitschecks) oder Overplanning (alles ist durchgetaktet).",["„Leitplanken reichen – wir müssen nicht alles absichern.“","„Ich will Risiko reduzieren, nicht Null-Risiko.“","„Ein Plan darf atmen.“"]],["Besuch / Gastgeberrolle","Strategist: „Flow/Dramaturgie – damit es rund läuft.“ Guardian: „Alle sollen sich wohlfühlen, genug da, Ordnung.“","Du organisierst Ablauf, Guardian sorgt für Versorgung/Standards. Risiko: du wirst kontrollierend (alles muss stimmen) oder du bist mehr „Manager“ als Gastgeber.",["„Wenn ich es nicht halte, kippt es.“","„Ich will, dass sich alle sicher und gesehen fühlen.“","„Perfektion ist nicht nötig – Versorgung reicht.“"]],["Gesundheit / Sport / Routinen","Strategist: „Plan, Tracking, Fortschritt.“ Guardian: „Sicher, nachhaltig, keine Verletzung – sauber.“","Du optimierst und trackst, Guardian schützt Stabilität. Risiko: zu viele Regeln (Overdesign), zu wenig Spaß; oder du wirst streng, wenn du abweichst.",["„Kontinuität schlägt Intensität.“","„Sicherheit ist Teil des Plans.“","„Ich muss nicht perfekt sein, nur verlässlich.“"]]],"sig":["„Stabilität durch Regeln.“|Du beruhigst dich über klare Standards.","„Effizienz + Absicherung.“|Schnell, aber nur, wenn es sauber ist.","„Hoher Anspruch an Verlässlichkeit.“|Unzuverlässigkeit triggert stark.","„Gefahr: Überkontrolle.“|Wenn Risiko steigt, steigen Checks/Regeln.","„Manager-Mode.“|Du führst über Prozess + Fürsorge, manchmal zu viel."],"warn":[["Wenn du in Überkontrolle rutschst",["„Ich muss das absichern.“","„Nur kurz noch prüfen...“","„Sonst gibt's später Probleme.“"]],["Wenn du zu streng wirst",["„Das geht so nicht.“","„So machen wir das ab jetzt.“","„Das ist nicht verhandelbar.“"]],["Wenn du dich selbst überforderst",["„Wenn ich's nicht mache, macht's keiner.“","„Ich muss das tragen.“","„Ich darf keinen Fehler zulassen.“"]]],"beruf":[["Konflikt im Team",["Strategist will Rollen/Prozess, Guardian will Fairness/Schutz/Standards.","Risiko|Schuldfragen, Richtermodus, moralischer Ton."],["„Das ist nicht fair.“","„So arbeiten wir hier nicht.“","„Wir brauchen klare Regeln.“"]],["Druck von oben",["Guardian will Team/Qualität schützen, Strategist verhandelt Trade-offs.","Risiko|blocken aus Sorge oder stilles „alles schlucken“ und unten brennt's."],["„Das ist ohne Priorisierung nicht machbar.“","„Ich muss das Team schützen.“","„Ich brauche eine Entscheidung.“"]],["Deadline-Projekt",["Strategist schützt kritischen Pfad, Guardian will Review/Absicherung.","Risiko|Review-Schleifen, Scope-Creep, späte Qualitätspanik."],["„Wir dürfen nichts Halbgares liefern.“","„Nur kurz noch prüfen...“","„Keine Überraschungen.“"]],["Feedbackgespräch",["Guardian will fair sein und viele Beispiele, Strategist will Plan und Messbarkeit.","Risiko|zu lang, zu korrekt, zu wenig menschlich."],["„Ich will fair sein, also brauche ich Belege.“","„Es braucht einen Plan.“","„Standards müssen stehen.“"]]]},"innovator":{"kern":"Strategist liefert Analyse, Struktur, Mustererkennung und Planbarkeit. Innovator bringt unkonventionelle Hypothesen, kreative Sprünge und neue Optionen. Das Ergebnis ist oft: „Innovative Analyst“ – du bleibst logisch, aber erweiterst den Möglichkeitsraum und findest Lösungen jenseits des Offensichtlichen.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Strategist: „Reihenfolge, Engpass, Plan – dann läuft's.“ Innovator: „Ich hab 'ne Idee: Wir machen ein Spiel / einen Hack, dann geht's schneller.“","Du startest mit Ablauf und Rollen; Innovator bringt Leichtigkeit und kreative Shortcuts. Best-case: schnell UND entspannt. Risiko: Innovator wirft den Ablauf um („neue Idee!“), du wirst genervt oder kontrollierend, weil der Plan instabil wird.",["„Wenn wir den Ablauf ständig ändern, wird's chaotisch.“","„Eine gute Idee ist nur gut, wenn sie wiederholbar ist.“","„Ich will Tempo – aber stabil.“"]],["Paar-Konflikt","Strategist: „Was ist das Muster? Welche Regel verhindert Wiederholung?“ Innovator: „Wir lösen das komplett anders – neue Aufteilung, neues System.“","Du willst Stabilität und klare Mechanik; Innovator bringt viele Optionen und Reframings. Risiko: es wird zu verkopft (zu viel System + zu viele Optionen) oder du fühlst dich von Ideen überrollt.",["„Wir brauchen eine Lösung, die sich halten lässt.“","„Optionen sind gut – aber bitte entscheidbar.“","„Wenn es nicht im Alltag funktioniert, ist es Theorie.“"]],["Urlaub planen / Familienlogistik","Strategist: „Kriterien, Vergleich, Entscheidung.“ Innovator: „Hidden gems! Ungewöhnlich! Lass uns was Besonderes machen.“","Du baust Kriterien und Shortlist; Innovator erweitert den Suchraum. Risiko: die Shortlist wird wieder aufgerissen, du verlierst Abschluss – oder du drückst zu schnell durch und Innovator fühlt sich „eingesperrt“.",["„Wir brauchen einen Cut, sonst endlos.“","„Besonders ja – aber innerhalb von Leitplanken.“","„Entscheidung ist Teil des Erfolgs.“"]],["Besuch / Gastgeberrolle","Strategist: „Flow: Ankommen – Essen – Ausklingen.“ Innovator: „Highlight! Spiel! Motto! Überraschung!“","Du willst ruhigen Ablauf und gute Dramaturgie; Innovator will Momente mit Wow-Effekt. Risiko: Überladung (zu viel Programm) oder Frust, wenn Innovator spontan umwirft.",["„Ein Highlight reicht.“","„Flow schlägt Show.“","„Spontan ist okay – aber nicht auf Kosten des Abends.“"]],["Gesundheit / Sport / Routinen","Strategist: „Plan, Periodisierung, Kontinuität.“ Innovator: „Neues Programm! Neue App! Neue Challenge!“","Du willst Stabilität und Fortschritt; Innovator liefert Motivation durch Neues. Risiko: „Shiny object“ (zu oft wechseln) oder Overengineering (zu viel Tracking/Setup).",["„Kontinuität schlägt Perfektion.“","„Neues ist okay, wenn der Kurs gleich bleibt.“","„Plan light ist besser als Plan nie.“"]]],"sig":["„System + Kreativschub.“|Du baust stabile Rahmen, Innovator bringt Momentum.","„Ideen werden erst akzeptiert, wenn sie repeatable sind.“","„Gefahr: Endlos-Optimierung.“|Strategist perfektioniert, Innovator erweitert.","„Spannung: Cut vs. Explore.“|Du willst Abschluss, Innovator will Optionen.","„Beste Form: Innovation in Leitplanken.“|Dann wirst du sehr wirksam."],"warn":[["Wenn du in Analyse/Overdesign rutschst",["„Wir brauchen noch mehr Infos.“","„Lass uns das sauber modellieren.“","„Wenn das System perfekt ist, wird's gut.“"]],["Wenn du von Ideen genervt bist",["„Nicht schon wieder was Neues.“","„Das reißt uns nur raus.“","„Wir verlieren den Faden.“"]],["Wenn du zu hart cuttest",["„Genug – wir entscheiden jetzt.“","„Keine weitere Option.“","„So machen wir's, fertig.“"]]],"beruf":[["Konflikt im Team",["Strategist baut Entscheidungsweg/Regeln, Innovator reframed („eigentlich Setup-Problem“).","Risiko|zu taktisch/kühl oder „neue Methode“ statt echtes Klären."],["„Das ist ein Prozessproblem.“","„Wir brauchen ein neues Working Model.“","„Eine Regel, dann Ruhe.“"]],["Druck von oben",["Innovator sucht Hebel/Shortcut, Strategist verhandelt Trade-offs.","Risiko|zu schnelles „Ja“ auf Hoffnung oder zu komplexes „Es kommt drauf an“."],["„Ich brauche einen klaren Trade-off.“","„Ich finde einen Hebel, aber ich muss ihn validieren.“","„Ohne Priorisierung ist das nicht machbar.“"]],["Deadline-Projekt",["Strategist schützt kritischen Pfad, Innovator will kurz vor Schluss verbessern.","Risiko|last-minute Umstellen oder Plan-Overkill."],["„Kein Scope-Sprung mehr.“","„Der kritische Pfad entscheidet.“","„Ideen ja – aber nicht jetzt.“"]],["Feedbackgespräch",["Innovator inspiriert („Potenzial“), Strategist strukturiert Entwicklungsweg.","Risiko|zu viel Framework, zu wenig Klartext – oder zu viele Ideen."],["„Es braucht einen klaren Plan.“","„Eine Sache ändern, nicht fünf.“","„Messbar machen, sonst passiert nichts.“"]]]},"sage":{"kern":"Strategist liefert Logik, Modelle, Ursache-Wirkung und Optimierung. Sage bringt Sinnrahmen, Reflexion, ethische Einordnung und Erkenntnistiefe. Das Ergebnis ist oft: „Wise Architect“ – du baust nicht nur effiziente Systeme, sondern auch stimmige, tragfähige Systeme mit Bedeutung.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Strategist: „Reihenfolge, Engpass, Plan – dann läuft's.“ Sage: „Was ist hier wirklich wichtig? Welche Haltung wollen wir leben?“","Du optimierst Ablauf, Sage bringt Prinzip & Ton rein („ruhig bleiben“, „Respekt“, „nicht beschämen“). Best-case: effizient und menschlich. Risiko: du hältst mitten im Stress noch „Prinzipreden“ (Sage) oder du wirst zu streng, wenn Regeln missachtet werden.",["„Tempo ohne Würde ist nicht mein Stil.“","„Der Ton ist Teil des Ergebnisses.“","„Wir lösen den Engpass – ohne Druck.“"]],["Paar-Konflikt","Strategist: „Regel + System, damit es stabil wird.“ Sage: „Worum geht es wirklich – Vertrauen, Respekt, Fairness?“","Du willst Mechanik, Sage will Bedeutung/Wahrheit. Best-case: ihr macht ein System, das sich stimmig anfühlt. Risiko: du wirkst „prozessierend“; Sage wirkt moralisch (richtig/falsch), wenn getriggert.",["„Ich will fair sein, nicht gewinnen.“","„Struktur ohne Verbindung hält nicht.“","„Wahrheit ohne Urteil.“"]],["Urlaub planen / Familienlogistik","Strategist: „Kriterien, Vergleich, beste Option.“ Sage: „Stimmigkeit: passt es wirklich zu uns?“","Du baust Vergleichslogik, Sage prüft Sinn/Passung. Risiko: Entscheidungsstau (Sage sucht „tiefe Stimmigkeit“, Strategist sucht „optimale Option“). Oder du entscheidest zu nüchtern und es fühlt sich hinterher leer an.",["„Stimmigkeit ist ein Kriterium.“","„80% Fit reicht.“","„Wir entscheiden bewusst, nicht perfekt.“"]],["Besuch / Gastgeberrolle","Strategist: „Flow: Ankommen – Essen – Ausklingen.“ Sage: „Qualität der Verbindung – nicht Programm.“","Du führst Ablauf, Sage hält Tiefe/Wärme. Risiko: du wirst zu kontrollierend (alles getaktet) oder Sage wird zu ernst/belehrend.",["„Flow ist ein Dienst – nicht Kontrolle.“","„Menschen vor Plan.“","„Weniger ist mehr.“"]],["Gesundheit / Sport / Routinen","Strategist: „Plan, KPIs, Fortschritt.“ Sage: „Was ist langfristig wahr und gut für dich?“","Du trackst und optimierst; Sage sorgt für Integrität/Nachhaltigkeit. Risiko: du wirst zu streng (KPI = Identität) oder du verlierst Freude, weil alles „gemessen“ ist.",["„Trend statt Tag.“","„Disziplin ohne Selbstmitgefühl wird hart.“","„Ich bin mehr als meine Kennzahlen.“"]]],"sig":["„System mit Ethik.“|Du optimierst, aber mit klaren Prinzipien.","„Hohe Standards, hoher Anspruch an Ton.“|„Richtig“ ist auch „wie“.","„Gefahr: Moral + Prozess = Druck.“|Kann belehrend wirken.","„Wahrheit wird zur Regel.“|Du machst aus Erkenntnis schnell ein Standard.","„Stabilität entsteht durch Sinn.“|Wenn es Sinn hat, hält es."],"warn":[["Wenn du in Moral/Belehrung rutschst",["„So macht man das nicht.“","„Das ist respektlos.“","„Das ist doch offensichtlich.“"]],["Wenn du in Overdesign rutschst",["„Wir müssen das sauber aufsetzen.“","„Noch ein Kriterium...“","„Erst wenn es perfekt ist...“"]],["Wenn du zu hart zu dir wirst",["„Ich darf nicht nachlassen.“","„Ich muss konsequent sein.“","„Das ist schwach.“"]]],"beruf":[["Konflikt im Team",["Strategist will Rollen/Prozess, Sage will Wahrheit/Standards.","Risiko|Gerichtssaal oder „zu korrekt“ → Leute machen zu."],["„Das ist ein Standardthema.“","„Wir brauchen Klarheit.“","„So soll es hier nicht laufen.“"]],["Druck von oben",["Sage schützt Integrität, Strategist verhandelt Trade-offs.","Risiko|zu komplexe Argumentation oder Prinzip-Blockade."],["„Ich verspreche nichts Unwahres.“","„Ohne Trade-off geht's nicht.“","„Ich brauche eine Entscheidung.“"]],["Deadline-Projekt",["Strategist schützt kritischen Pfad, Sage schützt Wahrheit/Qualität.","Risiko|Perfektionismus + späte Korrekturen."],["„Was ist 'wahr genug' für V1?“","„Kritischer Pfad first.“","„Keine Scope-Sprünge mehr.“"]],["Feedbackgespräch",["Sage spricht Prinzip/Wahrheit, Strategist baut Plan.","Risiko|zu ernst/belehrend oder zu viel Framework."],["„Ich will ehrlich sein.“","„Es braucht einen Plan.“","„Eine Sache ändern, nicht fünf.“"]]]}},"sage":{"commander":{"kern":"Sage denkt tief, wägt ab, ordnet ein und sucht Wahrheit. Commander bringt Entscheidung, Klarheit, Durchsetzung und Führung. Das Ergebnis ist oft: „Guiding Authority“ – du bleibst bedacht, aber du kommst in klare Positionen und vertrittst sie sichtbar.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Sage: „Was ist hier wirklich wichtig? Welche Regel zählt?“ Commander: „Jetzt sofort: Schuhe an, raus. Keine Diskussion.“","Du willst Sinn/Prinzip klären, Commander zieht dich in Tempo & Ansage. Das kann helfen, nicht in Erklärungen zu versinken. Risiko: du wirkst abrupt streng (weil Commander übernimmt), oder du fühlst dich innerlich „unsauber“, weil keine Zeit für Erklärung ist.",["„Wir können das später erklären – jetzt zählt Handlung.“","„Zeit ist Respekt – ich setze den Rahmen.“","„Ich muss kurz die Führung übernehmen.“"]],["Paar-Konflikt","Sage: „Was bedeutet das über Vertrauen/Fairness?“ Commander: „Wir entscheiden jetzt, was ab morgen gilt.“","Du gehst in Tiefe (Werte, Muster). Commander bringt Abschluss & Verbindlichkeit. Risiko: du gehst in „Gerichtssaal-Ton“ (Sage urteilt + Commander setzt durch), oder du löst zu schnell und übergehst das Bedürfnis nach Verständnis.",["„Wahrheit ohne Urteil.“","„Wir brauchen jetzt eine konkrete Regel.“","„Ich will das fair lösen, nicht gewinnen.“"]],["Urlaub planen / Familienlogistik","Sage: „Was passt zu uns? Was ist der Sinn des Urlaubs?“ Commander: „Kriterien festlegen, entscheiden, buchen.“","Du suchst Stimmigkeit, Commander sorgt für Entscheidung & Abschluss. Risiko: du fühlst dich innerlich gedrängt (zu früh buchen), oder du wirst starr („wenn es nicht 100% stimmt, dann nicht“).",["„Stimmigkeit reicht auch bei 80%.“","„Wir entscheiden bewusst – und dann committen wir.“","„Die perfekte Wahl gibt es nicht.“"]],["Besuch / Gastgeberrolle","Sage: „Ich will echte Gespräche, Qualität, Verbindung.“ Commander: „Ich setze den Rahmen, damit es rund läuft.“","Du moderierst Tiefe, Commander steuert Ablauf/Flow. Risiko: du wirst zu bestimmend („wir reden jetzt über...“) oder korrigierst Aussagen (Sage) und setzt dann Grenzen (Commander) → wirkt dominant.",["„Menschen vor Wahrheit im Moment.“","„Ich halte Raum, nicht Kontrolle.“","„Flow ist wichtiger als Perfektion.“"]],["Gesundheit / Sport / Routinen","Sage: „Was ist langfristig wahr und gut für mich?“ Commander: „Plan, Disziplin, Umsetzung.“","Du willst nachhaltige Wahrheit; Commander macht daraus Ritual & Konsequenz. Risiko: du wirst hart zu dir (Identität = Leistung) oder machst aus Selbstfürsorge ein „Muss“.",["„Strenge ist kein Beweis von Stärke.“","„Ritual schlägt Motivation.“","„Ich darf flexibel sein und trotzdem integer.“"]]],"sig":["„Wahrheit → Entscheidung.“|Du willst Klarheit, Commander sorgt, dass daraus Handeln wird.","„Prinzipien mit Kante.“|Wenn Werte getriggert sind, wirst du sehr konsequent.","„Tiefe kann in Strenge kippen.“|Sage erklärt, Commander setzt durch → Gefahr „Predigt + Urteil“.","„Hoher Anspruch an Sprache und Verhalten.“|Unpräzision und Regelbruch triggern doppelt.","„Integrität durch Umsetzung.“|Du fühlst dich am besten, wenn du nicht nur weißt, sondern tust."],"warn":[["Wenn du moralisch + hart wirst",["„So macht man das nicht.“","„Das ist respektlos.“","„Keine Diskussion.“"]],["Wenn du dich in Tiefe verlierst und dann explodierst",["„Ich muss das erst komplett verstehen...“","„Das ist komplex...“","„Jetzt reicht's.“"]],["Wenn du gegen dich streng wirst",["„Ich darf nicht inkonsequent sein.“","„Ich muss das schaffen.“","„Wenn ich das breche, verliere ich mich.“"]]],"beruf":[["Konflikt im Team",["Sage will Wahrheit/Prinzipien („was ist fair/sauber?“), Commander entscheidet und setzt Standards.","Risiko|„Gerichtssaal“-Vibe, Schuldfragen statt Lernprozess."],["„Das ist ein Wertebruch.“","„Wir müssen das klar benennen.“","„Ab jetzt gilt ein Standard.“"]],["Druck von oben",["Sage schützt Integrität („nichts Unwahres versprechen“), Commander verhandelt und commitet.","Risiko|entweder blocken aus Prinzip oder zu hartes „Nein“ ohne Alternative."],["„Ich will nichts versprechen, was nicht stimmt.“","„Ich muss klar sein.“","„Ich brauche einen Trade-off.“"]],["Deadline-Projekt",["Sage will fachliche Korrektheit, Commander will shippen.","Risiko|Perfektionismus oder späte Korrekturen + Stress."],["„Wenn das falsch ist, ist es wertlos.“","„Wir shippen keinen Quatsch.“","„Wir müssen jetzt entscheiden, was ‚wahr genug' ist.“"]],["Feedbackgespräch",["Sage spricht Wahrheit/Prinzip, Commander setzt Erwartung/Plan.","Risiko|moralisch, zu ernst, zu viel Druck."],["„Ich muss ehrlich sein.“","„Das ist eine Frage von Haltung.“","„Ich will, dass es sich ändert.“"]]]},"explorer":{"kern":"Sage denkt nach innen: Bedeutung, Einsicht, Integration. Explorer bringt Erfahrung, Bewegung, Neugier im Außen und „Learning by living“. Das Ergebnis ist oft: „Experiential Sage“ – du machst Erkenntnis an realen Erfahrungen fest und bleibst dadurch weniger verkopft, mehr geerdet.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Sage: „Was ist hier wirklich wichtig? Welche Regel zählt?“ Explorer: „Komm – wir gehen einfach los. Unterwegs regeln wir den Rest.“","Du willst Klarheit/Prinzip, Explorer zieht dich in Bewegung & Pragmatismus. Das kann dich vor Grübeln retten – Risiko: du fühlst dich innerlich „unsauber“ (zu wenig Struktur), oder ihr vergesst Dinge und du wirst nachträglich streng.",["„Handeln bringt oft mehr Ruhe als Erklären.“","„Wir brauchen jetzt Bewegung, nicht Theorie.“","„Hauptsache raus – dann sortiert es sich.“"]],["Paar-Konflikt","Sage: „Was bedeutet das über Respekt/Fairness/Vertrauen?“ Explorer: „Lass erstmal runterkommen. Geh'n wir kurz raus.“","Du willst verstehen und benennen, Explorer reguliert über Distanz/Bewegung. Best-case: Deeskalation. Risiko: du erlebst es als Ausweichen („wir reden nie richtig“), oder du gehst in moralischen Ton, weil du dich nicht gehört fühlst.",["„Ich will nicht nachjagen – ich will Verbindung.“","„Wenn wir ruhiger sind, können wir fair reden.“","„Ich brauche erst einen Reset, dann Wahrheit.“"]],["Urlaub planen / Familienlogistik","Sage: „Was passt zu uns? Was ist der Sinn dieses Urlaubs?“ Explorer: „Lass Freiheit drin – nicht alles durchplanen.“","Du suchst Stimmigkeit, Explorer sucht Offenheit und Erlebnis. Risiko: ihr vermeidet Commitment („wir schauen dann“) oder du wirst unruhig, weil du keinen inneren Rahmen hast.",["„Freiheit ist gut – aber ich brauche Anker.“","„Stimmigkeit entsteht auch im Erleben, nicht nur im Plan.“","„Ein bisschen Struktur schützt die Leichtigkeit.“"]],["Besuch / Gastgeberrolle","Sage: „Ich will echte Verbindung, gute Gespräche.“ Explorer: „Locker, Spaß, Bewegung – komm, wir machen's leicht.“","Du willst Tiefe/Qualität, Explorer bringt Leichtigkeit und Dynamik. Risiko: du wirst zu ernst (killst Flow) oder Explorer springt ständig (wenig Ruhe für echte Gespräche).",["„Verbindung braucht manchmal Ruhe.“","„Leichtigkeit ist auch Beziehung.“","„Ich muss nicht alles vertiefen.“"]],["Gesundheit / Sport / Routinen","Sage: „Was ist langfristig wahr und gut für mich?“ Explorer: „Draußen, Abwechslung, Spaß – Hauptsache Bewegung.“","Du willst nachhaltige Selbstfürsorge, Explorer hält dich über Erlebnis in Bewegung. Risiko: du überziehst (zu spontan/zu viel) oder du verlierst Routine (zu wenig Wiederholung).",["„Bewegung ist Medizin – nicht Leistung.“","„Ich darf spielerisch sein.“","„Ich brauche einen kleinen Rahmen, damit es bleibt.“"]]],"sig":["„Tiefe + Flucht in Bewegung.“|Wenn es emotional eng wird, gehst du raus/weg.","„Wahrheit braucht Timing.“|Du willst Klarheit, aber nicht im Peak-Stress.","„Leichtigkeit kann Wahrheit ermöglichen.“|Erst entspannen, dann reden.","„Gefahr: Unerledigtes bleibt hängen.“|Bewegung ersetzt manchmal Abschluss.","„Sage wird streng, wenn Explorer ausweicht.“|Dann kommt moralischer Ton."],"warn":[["Wenn du ausweichst (Explorer übernimmt)",["„Jetzt ist nicht der Moment zu reden.“","„Lass uns erstmal was anderes machen.“","„Wir regeln das später.“"]],["Wenn du danach streng wirst (Sage schlägt zurück)",["„So geht das nicht.“","„Wir müssen das jetzt klären.“","„Das ist respektlos.“"]],["Wenn du überziehst",["„Komm, geht noch.“","„Ist doch nicht so schlimm.“","„Wir improvisieren einfach.“"]]],"beruf":[["Konflikt im Team",["Sage will Wahrheit/Prinzip, Explorer will Spannung raus und weiterarbeiten.","Risiko|Konflikt wird „wegbewegt“; Betroffene fühlen sich nicht gesehen."],["„Wir hängen fest – wir brauchen einen Reset.“","„Raus aus dem Drama, rein in die Arbeit.“","„Wir reden später.“"]],["Druck von oben",["Explorer reagiert schnell („wir finden einen Weg“), Sage will sauber bleiben.","Risiko|zu schnelle Zusage ohne Wahrheit oder zu spätes Klären."],["„Ich will ehrlich bleiben und trotzdem handlungsfähig.“","„Erst Bewegung, dann Klarheit.“","„Ich brauche einen Trade-off.“"]],["Deadline-Projekt",["Explorer will schnelle Loops, Sage will korrekt.","Risiko|Scope springt oder Wahrheit/Qualität leidet."],["„Wir lösen das im Tun.“","„Aber wir dürfen keinen Quatsch shippen.“","„Was ist 'wahr genug' für V1?“"]],["Feedbackgespräch",["Explorer macht es locker/motivational, Sage will Wahrheit/Prinzip.","Risiko|zu weich/unpräzise oder zu ernst/moralisch."],["„Ich will motivieren, ohne zu verwässern.“","„Ich muss ehrlich sein.“","„Es braucht einen konkreten nächsten Schritt.“"]]]},"guardian":{"kern":"Sage liefert Empathie, Reflexion und Orientierung im Menschlichen. Guardian bringt Fürsorge, Stabilität, Sicherheit und Verlässlichkeit. Das Ergebnis ist oft: „Steady Mentor“ – du hältst Räume, stärkst Menschen und führst ruhig durch Unsicherheit, ohne zu drängen.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Sage: „Was ist hier wirklich wichtig? Welche Regel zählt?“ Guardian: „Ordentlich, sicher, richtig – Jacke, Brotbox, Helm, Regeln.“","Du willst Sinn/Prinzip sauber vermitteln, Guardian will Absicherung und „richtig machen“. Das wirkt oft sehr verantwortungsvoll – Risiko: du wirst langsam durch Details oder streng, wenn Regeln gebrochen werden („so geht das nicht“).",["„Wenn wir das jetzt schlampig machen, wird's später stressig.“","„Ich will das richtig vermitteln – nicht nur schnell.“","„Sicherheit und Respekt sind nicht verhandelbar.“"]],["Paar-Konflikt","Sage: „Was bedeutet das für Fairness, Respekt, Vertrauen?“ Guardian: „Ich will Verlässlichkeit, klare Regeln, Anerkennung.“","Du analysierst Werte und Muster, Guardian will konkrete Absprachen und Schutz vor Wiederholung. Risiko: du wirkst moralisch/urteilend (Sage) und gleichzeitig „regelnd“ (Guardian) – dein Gegenüber fühlt sich bewertet statt verstanden.",["„Das ist ein Fairness-Thema.“","„Wenn wir das nicht klar regeln, passiert es wieder.“","„Ich will verbinden – und gleichzeitig Grenzen setzen.“"]],["Urlaub planen / Familienlogistik","Sage: „Was passt zu uns? Was ist der Sinn des Urlaubs?“ Guardian: „Budget, Sicherheit, Storno, kindertauglich, Planbarkeit.“","Du definierst Intent/Prinzipien, Guardian prüft Risiken und will Absicherung. Risiko: Entscheidungsstau (zu viele Sicherheitsfragen) oder du wirst hart („wir müssen das sauber machen“), wodurch Leichtigkeit verloren geht.",["„Ich will stimmig und sicher.“","„Lieber einmal gründlich als später Stress.“","„Wenn ich das nicht prüfe, bin ich nachher verantwortlich.“"]],["Besuch / Gastgeberrolle","Sage: „Ich will echte Verbindung, gute Gespräche.“ Guardian: „Alle sollen sich wohlfühlen, genug da sein, Ordnung, Rücksicht.“","Du schaffst Tiefe und Atmosphäre, Guardian sorgt für Versorgung/Komfort. Risiko: du wirst perfektionistisch (alles soll „stimmig“ sein) oder kontrollierst Details, statt präsent zu sein.",["„Es soll für alle gut sein.“","„Wenn ich's nicht mache, macht's keiner.“","„Ich will nicht, dass jemand sich unwohl fühlt.“"]],["Gesundheit / Sport / Routinen","Sage: „Was ist langfristig wahr und gut für mich?“ Guardian: „Nachhaltig, sicher, keine Verletzung – bitte sauber.“","Du willst Sinn und Integrität, Guardian schützt Körper und Stabilität. Risiko: du wirst streng, wenn du abweichst („ich darf nicht“), oder du überkontrollierst (zu viele Regeln, zu wenig Freude).",["„Ich will meinem Körper gerecht werden.“","„Disziplin ist Fürsorge.“","„Wenn ich's mache, dann richtig.“"]]],"sig":["„Werte + Verantwortung.“|Du führst über Prinzipien und Fürsorge.","„Hoher Anspruch an Fairness/Respekt.“|Regelbrüche triggern stark.","„Sicherheit wird zum Maßstab.“|Risiko-Scan kann Leichtigkeit kosten.","„Moralischer Ton möglich.“|Wenn getriggert: „so macht man das nicht“.","„Stabilität beruhigt dich.“|Entspannung kommt, wenn Dinge geregelt sind."],"warn":[["Wenn du in Strenge rutschst",["„Das geht so nicht.“","„So macht man das nicht.“","„Das ist nicht okay.“"]],["Wenn du in Überkontrolle rutschst",["„Ich muss das absichern.“","„Nur kurz noch prüfen...“","„Sonst gibt's später Probleme.“"]],["Wenn du dich selbst überforderst",["„Ich muss das für alle richtig machen.“","„Ich darf keinen Fehler zulassen.“","„Wenn ich nachlasse, wird's chaotisch.“"]]],"beruf":[["Konflikt im Team",["Sage will Wahrheit/Prinzip, Guardian will Fairness/Schutz/Standards.","Risiko|Richtermodus, Schuldfragen, moralischer Ton."],["„Das ist ein Wertebruch.“","„So behandeln wir uns hier nicht.“","„Ich muss das schützen.“"]],["Druck von oben",["Sage will ehrlich bleiben, Guardian will Team/Qualität schützen.","Risiko|blocken aus Sorge oder stilles „Schultern nehmen“."],["„Ich will nichts versprechen, was nicht stimmt.“","„Das ist unfair fürs Team.“","„Ohne Absicherung brennt das unten.“"]],["Deadline-Projekt",["Sage will korrekt, Guardian will Qualität/Review/Absicherung.","Risiko|Review-Schleifen und Scope-Creep → Verzögerung."],["„Wir dürfen nichts Halbgares liefern.“","„Nur kurz noch prüfen...“","„Wenn das schiefgeht, trifft es alle.“"]],["Feedbackgespräch",["Sage spricht Wahrheit/Prinzip, Guardian will fair sein und Beispiele sammeln.","Risiko|zu viele Beispiele, moralischer Ton."],["„Ich will fair sein, also brauche ich alle Beispiele.“","„Das ist nicht okay – es schadet dem Team.“","„Standards müssen stehen.“"]]]},"innovator":{"kern":"Sage liefert Reflexion, Sinn, Erkenntnis und Orientierung. Innovator bringt kreative Perspektiven, Neugier und Mut zum Neudenken. Das Ergebnis ist oft: „Insight Innovator“ – du erzeugst neue Ideen, die nicht nur neu sind, sondern auch begründet und sinnstiftend.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Sage: „Was ist hier wirklich wichtig? Welche Regel zählt?“ Innovator: „Ich hab eine Idee – wir machen's als Spiel, dann geht's schneller.“","Du willst Klarheit/Prinzip, Innovator bringt Tempo über Kreativität (Timer-Game, Challenge, neue Routine). Risiko: du wechselst zwischen „pädagogisch“ und „spielerisch“ und wirkst dadurch unberechenbar – oder du hältst mitten im Chaos noch eine Sinn-Erklärung.",["„Wir müssen es nicht schwer machen – es geht auch leicht.“","„Wenn ich es gut frame, klappt es ohne Druck.“","„Ich will das Prinzip halten, aber ohne Strenge.“"]],["Paar-Konflikt","Sage: „Was bedeutet das über Fairness/Respekt/Vertrauen?“ Innovator: „Lass uns das neu denken – wir finden eine bessere Lösung.“","Du willst Wahrheit & Bedeutung, Innovator will Reframing & Optionen. Best-case: ihr findet eine elegante Lösung ohne Drama. Risiko: du wirkst, als würdest du Gefühle „weg-innovieren“ oder du gehst in Grundsatzdebatten, während Innovator schon die nächste Idee pusht.",["„Ich will verstanden werden – nicht nur gelöst.“","„Es gibt sicher einen Weg, der für uns beide stimmig ist.“","„Wahrheit ja – aber ohne verletzend zu werden.“"]],["Urlaub planen / Familienlogistik","Sage: „Was ist der Sinn dieses Urlaubs? Was brauchen wir wirklich?“ Innovator: „Lass es besonders machen – hidden gems, neue Route!“","Du definierst Sinn/Intent, Innovator liefert Inspiration und Optionen. Risiko: du suchst die „perfekt stimmige“ Entscheidung und Innovator füttert ständig neue Alternativen → Endlosschleife.",["„Stimmigkeit ist wichtiger als Perfektion.“","„Ich will eine Wahl, die sich gut anfühlt – und dann committen.“","„Zu viele Optionen machen mich unruhig.“"]],["Besuch / Gastgeberrolle","Sage: „Ich will echte Verbindung, gute Gespräche.“ Innovator: „Ich hab 'ne geniale Idee für einen Moment – Fragekarten/Motto/Story.“","Du bringst Tiefe, Innovator bringt lebendige Impulse. Risiko: du wirst zu „deep“ oder Innovator überlädt (zu viele Aktivitäten). Oder du korrigierst Aussagen (Sage) und killst damit Innovator-Leichtigkeit.",["„Menschen vor Wahrheit im Moment.“","„Ein guter Abend braucht nicht viel – nur echtes Interesse.“","„Ich will inspirieren, ohne zu dominieren.“"]],["Gesundheit / Sport / Routinen","Sage: „Was ist langfristig wahr und gut für mich?“ Innovator: „Lass es spannend machen – neue Methode, Challenge, Gamification.“","Du suchst Sinn und Nachhaltigkeit, Innovator hält Motivation über Abwechslung. Risiko: du wirst zu hart (Identität/Prinzip) oder du springst zu viel (Innovator), sodass Kontinuität leidet.",["„Ritual schlägt Motivation.“","„Neues darf sein – aber das Ziel bleibt gleich.“","„Ich bin integer, auch wenn ich nicht perfekt bin.“"]]],"sig":["„Tiefe + Ideenfluss.“|Du findest Sinn und neue Perspektiven.","„Reframing mit Prinzip.“|Du willst Lösungen, die sich „richtig“ anfühlen.","„Gefahr: zu viel Denken in zwei Richtungen.“|Sage vertieft, Innovator erweitert → Overwhelm.","„Wahrheit kann leichter werden.“|Du kannst Klarheit ohne Härte schaffen.","„Korrigieren vs. Inspirieren.“|Wenn du zu genau wirst, verliert Innovator Leichtigkeit."],"warn":[["Wenn du dich in Tiefe + Optionen verlierst",["„Ich muss das erst komplett verstehen.“","„Es gibt bestimmt noch eine bessere Option.“","„Bevor ich entscheide, brauche ich...“"]],["Wenn du moralisch/kühl wirst",["„So macht man das nicht.“","„Das stimmt so nicht.“","„Das ist doch logisch.“"]],["Wenn du gegen dich streng wirst",["„Ich darf nicht inkonsequent sein.“","„Ich muss das richtig machen.“","„Wenn ich abweiche, verliere ich meinen Standard.“"]]],"beruf":[["Konflikt im Team",["Sage will Wahrheit/Standards, Innovator will Reframing & neue Arbeitsweise.","Risiko|„Gerichtssaal“ (Sage) oder „weg-innovieren“ (Innovator) – Emotionen bleiben ungelöst."],["„Wir müssen das klar benennen.“","„Das ist ein Werte-/Standardthema.“","„Es gibt eine bessere Art, das zu lösen.“"]],["Druck von oben",["Sage schützt Integrität (keine falschen Zusagen), Innovator sucht Hebel/Shortcut.","Risiko|entweder blocken aus Prinzip oder zu früh „Ja“ mit Hoffnungslösung."],["„Ich verspreche nichts Unwahres.“","„Ich finde einen Hebel – aber ich muss ihn validieren.“","„Ich will sauber bleiben und trotzdem liefern.“"]],["Deadline-Projekt",["Sage will korrekt/sauber, Innovator will verbessern/optimieren.","Risiko|Perfektionismus + Last-minute „geniale Idee“."],["„Wir shippen keinen Quatsch.“","„Das könnte noch besser gehen...“","„Was ist 'wahr genug' für V1?“"]],["Feedbackgespräch",["Sage bringt Wahrheit/Prinzip, Innovator inspiriert/zeigt Möglichkeiten.","Risiko|zu philosophisch oder zu „visionär“ ohne klare Erwartung."],["„Ich will ehrlich sein.“","„Ich will motivieren, nicht demütigen.“","„Es braucht einen klaren nächsten Schritt.“"]]]},"strategist":{"kern":"Sage bringt Weisheit, Metaperspektive und Sinnzusammenhänge. Strategist liefert Struktur, Modelle, Prioritäten und Umsetzungslogik. Das Ergebnis ist oft: „Systems Philosopher“ – du übersetzt Erkenntnis in Architektur: von Idee zu Rahmenwerk, von Sinn zu System.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Sage: „Was ist hier wirklich wichtig? Welche Regel zählt?“ Strategist: „Wo ist der Engpass? Welche Reihenfolge spart wirklich Zeit?“","Du willst Sinn/Prinzip, Strategist baut sofort Ablauf & Sequenz (Bottleneck, Rollen, Reihenfolge). Best-case: klare, ruhige Führung ohne Drama. Risiko: du wirst kühl/technisch („nur ein Prozessproblem“), oder du optimierst zu lange statt einfach zu handeln.",["„Wenn wir den Engpass lösen, wird es leichter.“","„Wir brauchen Klarheit, nicht Diskussion.“","„Ein guter Ablauf ist Respekt für alle.“"]],["Paar-Konflikt","Sage: „Was bedeutet das über Fairness/Respekt/Vertrauen?“ Strategist: „Welche Regel verhindert Wiederholung? Welche Struktur schützt uns?“","Du gehst in Tiefe (Werte), Strategist übersetzt in System (Zuständigkeiten, Rhythmus, Definition of Done). Risiko: dein Gegenüber fühlt sich „prozessiert“ oder du wirst im Ton zu rational und verlierst Wärme.",["„Das ist ein Muster – wir müssen es stabil lösen.“","„Fairness braucht Struktur.“","„Wenn es klar ist, gibt es weniger Verletzung.“"]],["Urlaub planen / Familienlogistik","Sage: „Was passt zu uns? Was ist der Sinn dieses Urlaubs?“ Strategist: „Kriterien zuerst. 3 Optionen. Dann entscheiden.“","Du definierst Intent/Leitprinzipien, Strategist macht daraus Kriterien & Entscheidung. Risiko: du suchst „stimmig“ und Strategist sucht „optimal“ → Analyse-Schleife; oder du fühlst dich gedrängt, wenn Strategist zu schnell rationalisiert.",["„Stimmigkeit ist ein Kriterium.“","„Wir brauchen weniger Optionen, nicht mehr.“","„Entscheidung ist auch Fürsorge.“"]],["Besuch / Gastgeberrolle","Sage: „Ich will echte Verbindung, gute Gespräche.“ Strategist: „Ich halte Flow: Ankommen – Essen – Ausklingen.“","Du moderierst Tiefe, Strategist steuert Dramaturgie. Risiko: du wirst zu ernst (Sage) oder zu kontrollierend im Ablauf (Strategist); Gäste fühlen sich „geführt“.",["„Wenn der Flow stimmt, entsteht Verbindung.“","„Weniger ist mehr.“","„Ich halte Raum, nicht Kontrolle.“"]],["Gesundheit / Sport / Routinen","Sage: „Was ist langfristig wahr und gut für mich?“ Strategist: „Plan, Periodisierung, Messsystem, Review.“","Du suchst Sinn/Integrität, Strategist macht daraus Plan & Tracking. Risiko: du wirst zu streng (Identität + KPI), oder du planst so sauber, dass die Leichtigkeit fehlt.",["„Ritual ist Wahrheit in Handlung.“","„Trend statt Tag.“","„Ich bleibe integer, ohne perfektionistisch zu werden.“"]]],"sig":["„Prinzipien → Systeme.“|Sage gibt Sinn, Strategist macht es stabil.","„Klarheit wird zur Struktur.“|Du wirst ruhiger, aber manchmal kühl.","„Hoher Anspruch an Konsistenz.“|Werte + Regeln = starke Standards.","„Overdesign-Gefahr.“|Ihr baut Systeme, wo ein Satz reichen würde.","„Sicherheit durch Plan.“|Entspannung kommt, wenn Ablauf klar ist."],"warn":[["Wenn du in Analyse/Overdesign rutschst",["„Wir brauchen noch mehr Informationen.“","„Wir müssen das einmal sauber aufsetzen.“","„Wenn das System steht, wird es gut.“"]],["Wenn du zu kühl wirst",["„Das ist nur ein Prozessproblem.“","„Gefühle helfen hier nicht.“","„Es ist doch logisch.“"]],["Wenn du zu streng wirst",["„So machen wir das ab jetzt.“","„Das ist nicht verhandelbar.“","„Das ist der Standard.“"]]],"beruf":[["Konflikt im Team",["Sage will Wahrheit/Standards, Strategist setzt Entscheidungsweg/Rollen.","Risiko|„Gerichtssaal“ oder zu taktisch; Emotionen werden übersprungen."],["„Wir müssen das sauber klären.“","„Das ist ein Standardthema.“","„Wenn Rollen klar sind, ist Ruhe.“"]],["Druck von oben",["Sage schützt Integrität, Strategist verhandelt Trade-offs (Scope/Timing/Resourcen).","Risiko|zu komplexe Argumentation oder stilles „Alles schlucken“."],["„Ich will nichts Unwahres versprechen.“","„Ohne Trade-off ist das nicht realistisch.“","„Ich brauche eine Entscheidung, nicht mehr Druck.“"]],["Deadline-Projekt",["Sage will korrekt, Strategist schützt kritischen Pfad.","Risiko|Perfektionismus + zu späte Qualitätsprüfung oder Plan-Overkill."],["„Was ist 'wahr genug' für V1?“","„Der kritische Pfad entscheidet.“","„Wir dürfen jetzt nicht springen.“"]],["Feedbackgespräch",["Sage bringt Wahrheit/Prinzip, Strategist baut Entwicklungsweg.","Risiko|zu viel Framework, zu wenig Wärme – oder zu „Karriere-Taktik“."],["„Ich will, dass es wirklich ankommt.“","„Wir brauchen einen Plan, sonst ändert sich nichts.“","„Das muss messbar werden.“"]]]}},"innovator":{"commander":{"kern":"Innovator liefert Vision, neue Ansätze, „Warum nicht anders?“. Commander bringt Entscheidungskraft, Richtung, Verantwortung und Durchsetzung. Das Ergebnis ist oft: „Vision-Executor“ – du denkst groß, aber du setzt auch hart um und führst konsequent in die Umsetzung.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Innovator: „Wir machen das anders / spielerisch – ich hab 'ne Idee!“ Commander: „Stopp. Jetzt klare Reihenfolge. Wir müssen los.“","Du startest kreativ (Spiel/Challenge), merkst dann Zeitdruck und schaltest auf Ansagen, Reihenfolge, Tempo. Risiko: abrupter Wechsel – erst locker, dann plötzlich streng; Kinder/Partner erleben es als „Stimmungsbruch“.",["„Okay, genug gespielt – jetzt wird umgesetzt.“","„Wir verlieren Zeit, ich übernehme.“","„Ich brauche jetzt Kontrolle, sonst klappt's nicht.“"]],["Paar-Konflikt","Innovator: „Lass uns neu denken – wir könnten...“ Commander: „Wir entscheiden jetzt und machen ab morgen X.“","Du bringst viele Optionen und Perspektiven, Commander will daraus eine Entscheidung + klare Zuständigkeit machen. Risiko: du wirkst dominanter als du willst („Jetzt reicht's“), oder du drückst den anderen in eine Lösung, bevor er sich gesehen fühlt.",["„Wir reden zu lange – wir brauchen eine Entscheidung.“","„Ich kann nicht noch 5 Optionen durchgehen.“","„Ab jetzt machen wir das so.“"]],["Urlaub planen / Familienlogistik","Innovator: „Oh wow, schau mal diese abgefahrene Option!“ Commander: „Welche nehmen wir? Heute buchen.“","Du recherchierst begeistert, sammelst Inspiration, Commander will Commitment. Risiko: du fühlst dich eingeengt („zu früh entscheiden“) oder du buchst impulsiv und bereust, weil Innovator noch nicht „ausgespielt“ hat.",["„Ich will noch kurz weiter schauen...“","„Aber wenn wir nicht buchen, verlieren wir's.“","„Okay, Entscheidung – wir machen's einfach.“"]],["Besuch / Gastgeberrolle","Innovator: „Lass uns was Besonderes machen – Motto, Spiel, neue Drinks!“ Commander: „Ich setze den Rahmen, dann läuft's.“","Du planst Highlights, Commander organisiert Ablauf/Timing. Risiko: du übersteuerst (zu viel Programm) und wirst dann streng, wenn's nicht „funktioniert“.",["„Ich will, dass es ein Highlight wird.“","„Okay, Fokus – sonst wird's chaotisch.“","„Ich muss den Abend jetzt führen.“"]],["Gesundheit / Sport / Routinen","Innovator: „Neues Programm! Neue App! Neue Challenge!“ Commander: „Wir ziehen jetzt 6 Wochen durch.“","Du startest mit Begeisterung, Commander gibt dir Disziplin und Struktur. Risiko: du machst es zu hart (zu ambitionierte Challenge), dann Rebound/Abbruch – oder du wirst streng mit dir, wenn du abweichst.",["„Dieses Mal ziehe ich's durch.“","„Keine Ausreden – Plan ist Plan.“","„Wenn ich einmal raus bin, war's das.“"]]],"sig":["„Viele Ideen – dann harte Entscheidung.“|Du gehst von Möglichkeiten plötzlich auf Klartext/Commit.","„Ich kann kreativ sein UND durchziehen.“|Wenn Commander gut dosiert ist, wird aus Idee Umsetzung.","„Ungeduld mit Endlosschleifen.“|Du tolerierst Brainstorm – aber irgendwann kommt „jetzt reicht's“.","„Moduswechsel kann abrupt wirken.“|Locker → streng, wenn Zeit/Stress hochgeht.","„Ich setze mir große Ziele – und kann zu hart werden.“|Commander bringt Disziplin, aber auch Selbstkritik."],"warn":[["Wenn du zu hart wirst",["„Jetzt ist Schluss mit lustig.“","„Keine Diskussion.“","„Ich mache das jetzt einfach.“"]],["Wenn du impulsiv entscheidest",["„Egal, wir nehmen das jetzt.“","„Hauptsache entschieden.“","„Wir fixen das später.“"]],["Wenn du dich selbst unter Druck setzt",["„Ich darf nicht nachlassen.“","„Ich muss das beweisen.“","„Wenn ich's nicht schaffe, bin ich inkonsequent.“"]]],"beruf":[["Konflikt im Team",["Innovator reframed („eigentlich ist das ein Missverständnis/Prozessproblem“). Commander setzt Grenze und entscheidet.","Risiko|Du wirkst erst locker-relativierend und dann plötzlich hart; oder du überspringst Emotionen zugunsten von „Lösung“."],["„Wir verlieren Zeit – ich entscheide das jetzt.“","„Genug diskutiert, wir machen's so.“","„Das ist lösbar, aber wir brauchen Klarheit.“"]],["Druck von oben",["Innovator sucht Hebel/Shortcut, Commander sagt zu (oder setzt Bedingungen).","Risiko|Zu schnelle Zusage auf Basis eines „Hacks“, der noch nicht validiert ist."],["„Ich kann das drehen – gib mir kurz.“","„Ich sag erstmal zu, wir finden den Weg.“","„Wir müssen liefern, egal wie.“"]],["Deadline-Projekt",["Innovator will kurz vor Schluss verbessern, Commander will freeze & liefern.","Risiko|Last-minute Changes oder zu starres Festhalten, obwohl ein kleiner Pivot nötig wäre."],["„Wenn wir das jetzt noch ändern, wird's besser.“","„Nein, wir shippen das jetzt.“","„Wir brauchen einen sauberen Cut.“"]],["Feedbackgespräch",["Innovator inspiriert („Vision“), Commander setzt klare Erwartungen/Standards.","Risiko|Feedback wird „zu viel“ (Vision + Druck) oder zu direkt ohne Warm-up."],["„Ich will die Person pushen – da ist so viel Potenzial.“","„Ich muss das klar sagen, sonst ändert sich nichts.“","„Wir brauchen einen Plan.“"]]]},"explorer":{"kern":"Innovator liefert Ideen, Optionen und Lust auf Experimente. Explorer bringt Bewegung, Erfahrung, Spontaneität und Realitätskontakt. Das Ergebnis ist oft: „Field Tester“ – du denkst neu und gehst direkt ins Ausprobieren, um schnell zu lernen, was wirklich funktioniert.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Innovator: „Wir machen's spielerisch – ich hab 'ne Idee!“ Explorer: „Komm, wir gehen einfach los – unterwegs regeln wir das.“","Du startest kreativ, Explorer macht daraus Bewegung & Improvisation: schnell raus, Frühstück to go, weniger Perfektion. Risiko: ihr vergesst Dinge (Brotdose/Wechselklamotten), oder andere fühlen sich überfahren („zu hektisch“).",["„Hauptsache raus aus dem Haus – dann läuft's.“","„Nicht zu viel denken, einfach machen.“","„Wir lösen das unterwegs.“"]],["Paar-Konflikt","Innovator: „Wir können das neu lösen – ganz anders!“ Explorer: „Lass erstmal runterkommen – wir gehen kurz raus.“","Du willst Ideen, Explorer will Spannung raus über Aktivität. Das kann deeskalieren – Risiko: der Partner erlebt es als Ausweichen („du gehst weg statt zu reden“).",["„Wir drehen uns im Kreis – wir brauchen einen Reset.“","„Wenn wir ruhiger sind, finden wir eine Lösung.“","„Ich will nicht im Konflikt festhängen.“"]],["Urlaub planen / Familienlogistik","Innovator: „Hidden gems! Abenteuer! Neues!“ Explorer: „Lass Freiheit drin – nicht alles festzurren.“","Ihr wollt Neues + Freiheit: spontane Entdeckungen, flexible Pläne, wenig Festlegung. Risiko: zu wenig Struktur führt zu Stress (v.a. mit Kindern) oder zu „Entscheidungsflucht“ („wir schauen dann mal“).",["„Zu viel Plan killt das Abenteuer.“","„Wir finden vor Ort was Cooleres.“","„Ich will Möglichkeiten offen halten.“"]],["Besuch / Gastgeberrolle","Innovator: „Wir machen was Besonderes – Motto/Spiel/Überraschung!“ Explorer: „Locker, Spaß, Bewegung – komm wir machen einfach.“","Du bringst kreative Impulse, Explorer sorgt für Leichtigkeit. Risiko: zu viel Programm (du willst „wow“, Explorer will „flow“), oder der Abend wird unruhig, wenn ständig Neues gestartet wird.",["„Ich will, dass es memorable wird.“","„Wenn wir in Bewegung kommen, wird's automatisch gut.“","„Keine steife Nummer.“"]],["Gesundheit / Sport / Routinen","Innovator: „Neues Training, neue Challenge!“ Explorer: „Draußen, Erlebnis, Abwechslung – Hauptsache Action.“","Du bleibst dran über Neues + Erlebnis. Risiko: du springst zu oft (kein roter Faden) oder überziehst („noch schnell...“), weil es sich gut anfühlt.",["„Wenn's sich wie Abenteuer anfühlt, bleib ich dran.“","„Ich will mich spüren – nicht nur tracken.“","„Komm, geht noch!“"]]],"sig":["„Ideen + Bewegung = Momentum.“|Ihr kommt schnell ins Tun.","„Freiheit first.“|Ihr hasst starre Regeln – Risiko: zu wenig Stabilität.","„Stress raus durch Aktion.“|Ihr reguliert über Tun, nicht über lange Gespräche.","„Spontanität kann Entscheidungen ersetzen.“|Gefahr: „Wir schauen dann“ statt committen.","„Shiny experiences.“|Ihr jagt Erlebnis/Neues – Risiko: Fokusverlust."],"warn":[["Wenn du ausweichst (Commitment-Flucht)",["„Lass uns erstmal schauen.“","„Das entscheiden wir später.“","„Wir finden vor Ort was.“"]],["Wenn du überziehst",["„Komm, geht noch.“","„Ist doch nicht so schlimm.“","„Wir machen einfach weiter.“"]],["Wenn du andere überfährst",["„Los, nicht so kompliziert.“","„Einfach machen.“","„Wir verlieren Zeit.“"]]],"beruf":[["Konflikt im Team",["Innovator reframed, Explorer will Spannung raus und weiterarbeiten.","Risiko|Konflikt wird „wegbewegt“; Betroffene fühlen sich nicht gesehen."],["„Wir hängen fest – wir brauchen Bewegung.“","„Raus aus dem Drama, rein in die Lösung.“","„Lasst uns resetten und weiter.“"]],["Druck von oben",["Ihr sucht schnelle Hebel/Deals („wir kriegen das schon hin“).","Risiko|Zusage zu früh, zu viel parallel, wenig Absicherung."],["„Gib mir 30 Minuten, ich mach das klar.“","„Wir finden einen Weg.“","„Nicht diskutieren, handeln.“"]],["Deadline-Projekt",["Schnelle Iterationen, viele Field-Loops, viel Bewegung.","Risiko|Scope springt; Fokus leidet."],["„Wir lösen das im Tun.“","„Lass uns schnell testen statt planen.“","„Ein schneller Loop bringt uns weiter.“"]],["Feedbackgespräch",["Locker, motivierend, viel „Potenzial“, wenig harte Kante.","Risiko|Kritik wird zu weich/unpräzise."],["„Ich will motivieren, nicht runterziehen.“","„Das kriegen wir easy hin.“","„Nicht zu schwer machen.“"]]]},"guardian":{"kern":"Innovator will Neues schaffen und Grenzen verschieben. Guardian sorgt für Sicherheit, Qualität, Stabilität und Verlässlichkeit. Das Ergebnis ist oft: „Safe Innovator“ – du erneuerst, ohne zu überrollen, und bringst Menschen kontrolliert in Veränderung.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Innovator: „Wir machen's spielerisch / anders – ich hab 'ne Idee!“ Guardian: „Aber bitte ordentlich, sicher, mit allem dabei: Jacke, Brotbox, Regeln.“","Du startest locker-kreativ, Guardian zieht dich in Sorgfalt & Absicherung. Das kann super stabilisieren – Risiko: du fühlst dich „gebremst“ und wirst ungeduldig, oder du kippst in Kontroll-Details („Wo ist...? Hast du...?“).",["„Wenn wir das nicht sauber machen, wird's nachher stressig.“","„Ich will Spaß – aber ich will auch, dass es klappt.“","„Warum müssen wir jetzt an jedem Detail hängen?“"]],["Paar-Konflikt","Innovator: „Wir lösen das neu – lass kreativ denken!“ Guardian: „Ich will Fairness, Verlässlichkeit, klare Absprachen.“","Du pitchst neue Lösungen; Guardian prüft: „Ist das zuverlässig? Ist das fair? Kann ich mich drauf verlassen?“ Risiko: du erlebst Guardian als „Bremse“ und argumentierst dich leer; oder du wirst streng, weil du das Gefühl hast, alles tragen zu müssen.",["„Ich will eine Lösung, die sich für beide fair anfühlt.“","„Wenn wir das nicht verbindlich regeln, passiert es wieder.“","„Ich kann nicht ständig improvisieren – ich brauche Stabilität.“"]],["Urlaub planen / Familienlogistik","Innovator: „Hidden gems! Neues Abenteuer!“ Guardian: „Budget, Sicherheit, Storno, kindertauglich, Planbarkeit.“","Du willst etwas Besonderes, Guardian will Absicherung. Risiko: du bleibst in Recherche-Schleifen hängen oder wirst genervt („zu ängstlich“). Best-case: ihr findet „kreativ, aber safe“.",["„Es soll besonders sein – aber ich will keinen Stress.“","„Ich will nicht, dass wir nachher Probleme ausbaden.“","„Ich brauche Leitplanken, dann kann ich frei sein.“"]],["Besuch / Gastgeberrolle","Innovator: „Lass was Besonderes machen – neues Menü, Motto!“ Guardian: „Bitte so, dass alle sich wohlfühlen: genug Essen, Ordnung, Rücksicht.“","Du planst Highlights, Guardian sorgt für Wohlgefühl & Verlässlichkeit (für alle etwas dabei, niemand wird überfordert). Risiko: du wirst perfektionistisch (alles soll stimmen) oder du fühlst dich eingeengt.",["„Ich will überraschen – aber niemanden stressen.“","„Es muss stimmig sein.“","„Wenn ich's nicht absichere, geht was schief.“"]],["Gesundheit / Sport / Routinen","Innovator: „Neue Challenge! Neues Programm!“ Guardian: „Aber nachhaltig, ohne Verletzung, realistisch.“","Du willst Abwechslung, Guardian schützt: Warm-up, Regeneration, „nicht übertreiben“. Risiko: du fühlst dich gedämpft oder verlierst Motivation – oder Guardian wird streng („du darfst nicht schleifen“).",["„Ich will Fortschritt, aber ich will mich nicht kaputt machen.“","„Wenn ich's mache, dann richtig – aber sicher.“","„Ich brauche ein System, das ich halten kann.“"]]],"sig":["„Kreativität mit Sicherheitsgurt.“|Du willst neu – aber bitte verlässlich und sauber.","„Ideen werden zu Regeln.“|Innovator erzeugt Optionen, Guardian macht daraus Standards.","„Innere Spannung: frei vs. sicher.“|Freiheit begeistert dich – Risiko beruhigt dich.","„Hoher Anspruch an Fairness.“|Du willst, dass Dinge nicht nur funktionieren, sondern „richtig“ sind.","„Wenn's wackelt, gehst du in Kontrolle.“|Dann kommt Checklisten- und Absicherungsmodus."],"warn":[["Wenn Guardian dich übersteuert (Kontrolle/Strenge)",["„Das muss abgesichert sein.“","„Sonst gibt's später Probleme.“","„Ich kann mich auf niemanden verlassen.“"]],["Wenn Innovator rebelliert (Unruhe/Genervtsein)",["„Boah, das ist so kleinlich.“","„Wir zerreden das.“","„Warum so kompliziert?“"]],["Wenn du dich selbst überforderst",["„Ich muss das für alle richtig machen.“","„Ich darf keinen Fehler zulassen.“","„Ich muss das tragen.“"]]],"beruf":[["Konflikt im Team",["Innovator reframed („Missverständnis/Setup“), Guardian prüft Fairness/Respekt/Standards.","Risiko|Du wirkst wie Richter („richtig/falsch“) oder du springst zu schnell zur Regel ohne Emotion zu halten."],["„So geht man hier nicht miteinander um.“","„Wir brauchen klare Regeln.“","„Ich will, dass es fair bleibt.“"]],["Druck von oben",["Innovator sucht Hebel/Shortcut, Guardian warnt: Risiko, Qualität, Team-Schutz.","Risiko|Du sagst zu schnell Ja (Innovator) oder blockst zu vorsichtig (Guardian)."],["„Ich will liefern, aber nicht auf Kosten des Teams.“","„Das ist riskant/unfair, wenn wir es so machen.“","„Ich brauche Absicherung, bevor ich zusage.“"]],["Deadline-Projekt",["Innovator will verbessern, Guardian will Qualität/Absicherung/Review.","Risiko|Scope-Creep durch „noch besser“ + Review-Schleifen → Verzögerung."],["„Wir dürfen nichts Halbgares liefern.“","„Wenn das schiefgeht, trifft es alle.“","„Nur kurz noch prüfen...“"]],["Feedbackgespräch",["Innovator will motivieren und Möglichkeiten zeigen, Guardian will Standards schützen und fair sein.","Risiko|Feedback wird zu lang (zu viele Beispiele) oder zu moralisch („das macht man nicht“)."],["„Ich will fair sein, also brauche ich alle Beispiele.“","„Das ist nicht okay – das schadet dem Team.“","„Ich will helfen, aber Standards müssen stehen.“"]]]},"sage":{"kern":"Innovator bringt Neugier, Experiment und Veränderungsdrang. Sage bringt Tiefgang, Sinn, Erkenntnis und reflektierte Einordnung. Das Ergebnis ist oft: „Meaning Maker“ – du innovierst nicht nur, du erklärst und verankerst Neues mit Substanz und Orientierung.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Innovator: „Wir machen's als Spiel / ich hab eine Idee!“ Sage: „Was ist hier der Kern? Welche Regel/Prinzip zählt wirklich?“","Du startest kreativ, Sage bringt Prinzip + Klarheit („Wir respektieren Zeit / wir handeln jetzt“). Risiko: du wechselst von locker zu „pädagogisch“ und hältst kurze Grundsatzreden, während die Uhr läuft.",["„Es geht nicht nur ums Loskommen, sondern um Haltung.“","„Wenn wir jetzt nachgeben, lernen wir das falsche Muster.“","„Ich will das sauber vermitteln.“"]],["Paar-Konflikt","Innovator: „Wir könnten das komplett neu denken...“ Sage: „Was bedeutet das für Fairness, Respekt, Vertrauen?“","Du bringst viele Optionen; Sage prüft sie gegen Werte und Wahrheit. Das kann klärend sein – Risiko: es kippt in Moral/Urteil oder in „zu viel Tiefe“ statt konkreter Lösung.",["„Das ist ein Wertethema.“","„Ich will ehrlich sein – ohne Ausreden.“","„Wenn wir das nicht wirklich anschauen, kommt es wieder.“"]],["Urlaub planen / Familienlogistik","Innovator: „Hidden gems! Neues Land! Ungewöhnlich!“ Sage: „Was passt zu uns? Was ist der Sinn dieses Urlaubs?“","Du sammelst inspirierende Optionen; Sage sorgt für Stimmigkeit: „Erholung vs. Abenteuer vs. Verbindung“. Risiko: du suchst „die perfekte, stimmige Wahl“ zu lange und kommst nicht ins Buchen.",["„Was ist das Ziel – was brauchen wir wirklich?“","„Ich will nichts buchen, das sich falsch anfühlt.“","„Die Entscheidung soll stimmig sein.“"]],["Besuch / Gastgeberrolle","Innovator: „Wir machen was Besonderes – Motto, Fragenkarten, Story!“ Sage: „Qualität der Verbindung statt Show.“","Du willst besondere Momente schaffen; Sage lenkt auf echte Gespräche. Risiko: du wirst zu „deep“ oder korrigierst Aussagen (wenn ungenau), was Stimmung killen kann.",["„Ich will echte Verbindung, nicht Oberfläche.“","„Das ist unpräzise – so stimmt das nicht.“","„Ein guter Abend hat Tiefe.“"]],["Gesundheit / Sport / Routinen","Innovator: „Neues Programm! Neue Challenge!“ Sage: „Was ist langfristig wahr und gut für dich – körperlich und mental?“","Du willst Neues; Sage prüft auf Sinn, Nachhaltigkeit, Identität („Ich bin jemand, der gut für sich sorgt“). Risiko: du wirst hart zu dir, wenn du abweichst („ich bin inkonsequent“).",["„Das ist Teil meiner Identität.“","„Ich will verstehen, was mein Körper wirklich braucht.“","„Ich will nicht nur pushen, sondern richtig leben.“"]]],"sig":["„Ideen mit Gewissen.“|Du bist kreativ, aber willst, dass es „richtig“ ist.","„Reframing + Prinzip.“|Du findest neue Sichtweisen und gibst ihnen Sinn/Leitplanken.","„Hoher Anspruch an Wahrheit.“|Du hasst Bullshit – auch deinen eigenen.","„Tiefe kann Flow bremsen.“|Du willst verstehen und klären, bevor du entscheidest.","„Gefahr: moralischer Ton.“|Wenn Werte getriggert sind, wirst du streng/urteilend."],"warn":[["Wenn du moralisch wirst",["„So macht man das nicht.“","„Das ist respektlos/unfair.“","„Das sagt viel über...“"]],["Wenn du dich in Tiefe verlierst",["„Ich muss das erst komplett verstehen.“","„Was steckt da wirklich dahinter?“","„Das ist komplexer als es wirkt.“"]],["Wenn du hart zu dir wirst",["„Ich darf nicht inkonsequent sein.“","„Das ist schwach.“","„Ich verliere meinen Standard.“"]]],"beruf":[["Konflikt im Team",["Innovator reframed („eigentlich ein Setup-Problem“), Sage setzt Werte/Truth („was ist fair/sauber?“).","Risiko|Grundsatzdebatte oder „Gerichtssaal“-Vibe."],["„Das ist ein Wertebruch.“","„Wir müssen die Wahrheit aussprechen.“","„Ich will nicht, dass das hier normal wird.“"]],["Druck von oben",["Innovator sucht Hebel, Sage schützt Integrität („nichts versprechen, was nicht wahr ist“).","Risiko|entweder zu schnell Ja (Innovator) oder blocken aus Prinzip (Sage)."],["„Ich will nichts versprechen, was nicht stimmt.“","„Ich muss klar sagen, was realistisch ist.“","„Integrität ist nicht verhandelbar.“"]],["Deadline-Projekt",["Innovator will verbessern, Sage will korrekt/sauber („wir shippen keinen Quatsch“).","Risiko|Perfektionismus oder späte Korrekturen kurz vor Schluss."],["„Wenn das fachlich nicht stimmt, ist es wertlos.“","„Wir dürfen uns nicht selbst belügen.“","„Lieber später als falsch.“"]],["Feedbackgespräch",["Innovator inspiriert, Sage spricht Wahrheit/Prinzip („Haltung“).","Risiko|zu philosophisch oder zu moralisch statt konkret."],["„Ich will, dass die Person es wirklich versteht.“","„Das ist eine Frage von Haltung.“","„Ich muss ehrlich sein.“"]]]},"strategist":{"kern":"Innovator erzeugt Möglichkeiten, kreative Sprünge und ungewöhnliche Lösungen. Strategist strukturiert, priorisiert, testet Annahmen und baut einen belastbaren Pfad. Das Ergebnis ist oft: „System-Designer“ – du verbindest Idee und Architektur, bis aus Innovation ein skalierbares System wird.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Innovator: „Wir machen's spielerisch / anders – ich hab eine Idee!“ Strategist: „Welche Reihenfolge spart wirklich Zeit? Wo ist der Engpass?“","Du startest kreativ (Spiel/Challenge), Strategist zieht es in Ablauf/Sequenz: „Erst anziehen, dann Frühstück“, Rollen verteilen, Bottleneck lösen. Risiko: du wirst ungeduldig, wenn der Plan nicht eingehalten wird – oder du optimierst zu viel statt einfach loszugehen.",["„Das ist ein Ablaufproblem – nicht die Kinder.“","„Wenn wir die Reihenfolge fix haben, läuft's.“","„Ich brauche einen Plan, sonst verzetteln wir uns.“"]],["Paar-Konflikt","Innovator: „Wir könnten das komplett neu denken...“ Strategist: „Welche Regel verhindert, dass es nächste Woche wieder passiert?“","Du bringst Perspektiven, Strategist baut daraus ein System (Zuständigkeiten, Wiederholrhythmus, Kriterien). Risiko: der Partner fühlt sich „prozessiert“; oder du gehst in Kopf-Logik und überspringst Gefühle.",["„Wir brauchen ein System, nicht nur gute Vorsätze.“","„Es gibt ein Muster – wir müssen den Hebel finden.“","„Wenn wir das klären, ist Ruhe.“"]],["Urlaub planen / Familienlogistik","Innovator: „Hidden gems! Neue Route! Ungewöhnlich!“ Strategist: „Kriterien zuerst. 3 Optionen. Dann Entscheidung.“","Du sammelst viele kreative Optionen. Strategist reduziert auf vergleichbare Alternativen und trifft Entscheidung nach Kriterien. Risiko: du fühlst dich eingeschränkt („zu rational“), oder ihr landet in Analyse-Schleifen.",["„Es gibt eine beste Option – ich finde sie.“","„Wenn wir Kriterien haben, ist es leicht.“","„Zu viele Optionen machen mich unruhig.“"]],["Besuch / Gastgeberrolle","Innovator: „Wir machen ein Motto / neues Menü / Spiel!“ Strategist: „Dramaturgie: Ankommen – Essen – Ausklingen. Mehr braucht's nicht.“","Du willst Highlights, Strategist sorgt für Flow & Timing (nicht überladen). Risiko: du willst zu viel, Strategist bremst; oder du wirst perfektionistisch im Ablauf.",["„Ich will, dass es memorable ist – aber nicht chaotisch.“","„Wenn der Flow stimmt, wird's automatisch gut.“","„Wir dürfen uns nicht verzetteln.“"]],["Gesundheit / Sport / Routinen","Innovator: „Neues Programm, neue App, neue Challenge!“ Strategist: „Periodisierung. 6 Wochen. 2 KPIs. Review.“","Du hast viele Ideen, Strategist macht daraus Plan & System. Risiko: du planst zu viel und startest zu spät; oder du wirst starr und verlierst Freude.",["„Ohne System ist es Zufall.“","„Ich brauche einen Plan, sonst springe ich.“","„Wenn ich's tracke, bleibe ich dran.“"]]],"sig":["„Ideen → Struktur → Entscheidung.“|Du denkst breit, Strategist macht es schmal und umsetzbar.","„Kriterien statt Bauchgefühl.“|Du wirst objektiver, aber riskierst, Freude/Intuition zu verlieren.","„Hebel-Denken.“|Ihr sucht den 20%-Hebel mit 80% Wirkung.","„Ungeduld mit Chaos & Unklarheit.“|Wenn Dinge schwammig sind, wirst du schnell „kontrollierend“.","„Overdesign-Gefahr.“|Ihr baut Systeme, wo eine simple Regel reichen würde."],"warn":[["Wenn du in Analyse/Overdesign rutschst",["„Wir brauchen noch mehr Infos.“","„Ich will die optimale Lösung.“","„Lass uns das einmal sauber modellieren.“"]],["Wenn du zu kühl wirst",["„Das ist nur ein Prozessproblem.“","„Gefühle bringen uns hier nicht weiter.“","„Es ist doch logisch.“"]],["Wenn du dich festfährst",["„Erst wenn der Plan perfekt ist, starte ich.“","„Wenn wir das nicht sauber machen, knallt's.“"]]],"beruf":[["Konflikt im Team",["Innovator reframed („eigentlich ist das ein Missverständnis/Setup“). Strategist baut Entscheidungsweg & Regeln.","Risiko|Emotionen werden übersprungen; oder du wirkst „zu taktisch“."],["„Das ist ein Systemfehler, kein People-Problem.“","„Wenn wir Rollen klären, ist Ruhe.“","„Ich muss das sauber orchestrieren.“"]],["Druck von oben",["Innovator sucht Hebel/Shortcut, Strategist verhandelt Trade-offs (Scope/Timing/Ressourcen).","Risiko|zu komplexe Argumentation nach oben oder „silent burden“ (alles schlucken)."],["„Ich brauche einen Hebel, um Ja zu sagen.“","„Wir müssen das richtig framen.“","„Ohne Trade-off ist das nicht realistisch.“"]],["Deadline-Projekt",["Innovator will verbessern, Strategist schützt kritischen Pfad.","Risiko|kurz vor Deadline neue Ideen oder Plan-Overkill."],["„Das geht schneller, wenn wir umstellen.“","„Der kritische Pfad entscheidet alles.“","„Wir dürfen jetzt nicht springen.“"]],["Feedbackgespräch",["Innovator inspiriert, Strategist strukturiert Entwicklungsweg.","Risiko|zu viel Framework, zu wenig Klartext; oder zu „Karriere-Taktik“."],["„Ich will der Person einen klaren Weg geben.“","„Das braucht ein Development-Playbook.“","„Wir müssen das messbar machen.“"]]]}},"guardian":{"commander":{"kern":"Guardian sorgt für Schutz, Qualität, Verlässlichkeit und Ordnung. Commander bringt Klarheit, Durchsetzung und schnelle Entscheidungen. Das Ergebnis ist oft: „Firm Protector“ – du bleibst fürsorglich, aber wirst deutlich kantiger in Grenzen, Standards und Konsequenz.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Guardian: „Ordentlich, sicher, richtig – nichts vergessen.“ Commander: „Jetzt: Schuhe an. Wir gehen.“","Du willst Absicherung/Qualität, Commander drückt Tempo und klare Ansagen. Best-case: du kommst aus Überprüfen raus und ihr werdet pünktlich. Risiko: du wirst scharf, wenn Standards nicht eingehalten werden (Kontroll- + Befehlston), oder du nimmst zu viel Verantwortung („ich muss das retten“).",["„Sicherheit ja – aber wir müssen jetzt los.“","„Wenn ich nicht führe, wird's Chaos.“","„Ich will klar sein, ohne hart zu werden.“"]],["Paar-Konflikt","Guardian: „Fairness, Verlässlichkeit, Anerkennung.“ Commander: „Wir entscheiden das jetzt und setzen es um.“","Du willst Schutz und faire Regeln, Commander will Abschluss. Best-case: klare Abmachung, weniger Wiederholung. Risiko: du wirkst fordernd/streng („so muss das sein“) und dein Gegenüber fühlt sich gedrückt statt eingeladen.",["„Ich will nicht kämpfen – ich will Verlässlichkeit.“","„Wenn wir es nicht regeln, passiert es wieder.“","„Ich muss klar sein, damit es fair bleibt.“"]],["Urlaub planen / Familienlogistik","Guardian: „Budget, Sicherheit, Storno, kindertauglich.“ Commander: „Entscheiden, buchen, fertig.“","Du willst absichern, Commander will Cut. Best-case: du setzt Leitplanken, Commander entscheidet darin. Risiko: du fühlst dich überfahren („zu schnell“) oder du blockierst so lange, dass Commander ungeduldig wird.",["„Ich brauche Leitplanken – dann kann ich committen.“","„Besser eine gute Entscheidung als endlos.“","„Risiko reduzieren, nicht Null-Risiko.“"]],["Besuch / Gastgeberrolle / Ordnung & Standards","Guardian: „Alle sollen sich wohlfühlen – vorbereitet, genug da.“ Commander: „Ich verteile Aufgaben, setze Timing.“","Du sorgst für Versorgung/Standards, Commander organisiert Menschen. Best-case: super Gastgeber. Risiko: du wirst zum „Haus-Manager“, korrigierst andere, wirkst kontrollierend.",["„Wenn ich's nicht halte, kippt's.“","„Ich will, dass es für alle gut ist.“","„Ich muss nicht alles steuern.“"]],["Gesundheit / Sport / Routinen","Guardian: „Sicher, nachhaltig, richtig – keine Verletzung.“ Commander: „Disziplin. Durchziehen.“","Du willst schützen, Commander will pushen. Best-case: du bleibst dran mit klarer Struktur. Risiko: Überforderung (zu hart), Schuldgefühle bei Ausfällen, oder du ignorierst Warnsignale.",["„Disziplin ist Fürsorge – nicht Strafe.“","„Ich darf konsequent sein, ohne brutal zu sein.“","„Schutz ist Teil des Plans.“"]]],"sig":["„Schutz + Durchsetzung.“|Du setzt Standards konsequent durch.","„Hohe Reaktivität auf Regelbruch.“|Unzuverlässigkeit triggert Härte.","„Überverantwortung.“|Du nimmst zu viel auf dich und wirst dann streng.","„Tempo im Dienst der Sicherheit.“|Du willst schnell sein, damit es nicht chaotisch wird.","„Gefahr: Eltern-/Richterton.“|Besonders unter Stress."],"warn":[["Wenn du in Strenge rutschst",["„Das geht so nicht.“","„Ab jetzt gilt...“","„Keine Diskussion.“"]],["Wenn du in Überkontrolle rutschst",["„Nur kurz noch prüfen...“","„Ich muss das absichern.“","„Sonst gibt's später Probleme.“"]],["Wenn du dich selbst überforderst",["„Wenn ich es nicht mache, macht's keiner.“","„Ich muss das tragen.“","„Ich darf nicht nachlassen.“"]]],"beruf":[["Konflikt im Team",["Guardian schützt Fairness/Respekt, Commander setzt Entscheidung/Standard.","Risiko|Schuldfragen, Richtermodus, Angst im Team."],["„So arbeiten wir hier nicht.“","„Das ist unfair.“","„Ich setze jetzt den Standard.“"]],["Druck von oben",["Commander nimmt Druck, Guardian will Team/Qualität schützen.","Risiko|zu schnelles „Ja“ und unten brennt's."],["„Ich will das Team nicht verbrennen.“","„Ich kann liefern – aber nur mit Priorisierung.“","„Ohne Trade-off ist das unfair.“"]],["Deadline-Projekt",["Guardian will Review/Absicherung, Commander treibt Execution.","Risiko|Mikromanagement oder späte Quality-Panik."],["„Keine Überraschungen.“","„Wir müssen das sauber liefern.“","„Jetzt durchziehen.“"]],["Feedbackgespräch",["Guardian will fair + Beispiele, Commander ist direkt.","Risiko|zu hart oder zu belehrend."],["„Ich muss klar sein.“","„Das ist nicht okay.“","„Es muss sich ändern.“"]]]},"explorer":{"kern":"Guardian will Sicherheit, Routine, Absicherung und „nichts vergessen“. Explorer bringt Tempo, Freiheit, Improvisation und Mut zur Bewegung. Das Ergebnis ist oft: „Safe Adventurer“ – du gehst raus aus der Komfortzone, aber mit Essentials im Griff; Wachstum ohne Leichtsinn.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Guardian: „Ordentlich, sicher, richtig – nichts vergessen.“ Explorer: „Komm – raus hier. Unterwegs regeln wir den Rest.“","Du willst Absicherung, Explorer bringt Tempo & Pragmatismus. Best-case: du kommst pünktlich raus, weniger Grübeln. Risiko: du fühlst dich innerlich unsicher („zu schnell/zu schlampig“), vergisst etwas → danach Kontrollmodus oder Ärger („so geht das nicht“).",["„Tempo ist okay – wenn die Essentials sitzen.“","„Ich kann loslassen, ohne fahrlässig zu sein.“","„Erst raus – dann sortieren.“"]],["Paar-Konflikt","Guardian: „Fairness, Verlässlichkeit, Anerkennung.“ Explorer: „Lass erstmal runterkommen – wir gehen kurz raus.“","Du willst Verbindung + klare Abmachung; Explorer reguliert über Bewegung und vermeidet Peak-Emotion. Best-case: Deeskalation. Risiko: du erlebst es als Ausweichen („wir reden nie richtig“), wirst strenger oder klammerst dich an Regeln.",["„Reset ist okay – aber ich brauche ein echtes Gespräch.“","„Ich will nicht jagen – ich will Sicherheit.“","„Wenn wir's nicht festhalten, passiert es wieder.“"]],["Urlaub planen / Familienlogistik","Guardian: „Budget, Sicherheit, Storno, kinderfreundlich.“ Explorer: „Lass Freiheit drin – nicht alles durchplanen.“","Du baust Sicherheit, Explorer bringt Erlebnis und Offenheit. Best-case: Leitplanken + Spontanität. Risiko: du wirst nervös bei zu viel Offenheit (Kontrollimpuls), oder Explorer fühlt sich eingeengt und „flüchtet“ in Spontanentscheidungen.",["„Freiheit ist okay – wenn No-Gos klar sind.“","„Ich reduziere Risiko, nicht Lebendigkeit.“","„Ein Plan darf atmen.“"]],["Besuch / Gastgeberrolle / Ordnung & Standards","Guardian: „Alle sollen sich wohlfühlen – vorbereitet, genug da.“ Explorer: „Locker bleiben – Spaß, Bewegung, kein Perfektionsstress.“","Du sorgst für Versorgung/Ordnung, Explorer sorgt für Leichtigkeit. Best-case: warm und entspannt. Risiko: du wirst zum Manager, während Explorer „läuft“ – oder du fühlst dich nicht unterstützt („ich trage alles“).",["„Ich darf es leicht machen.“","„Versorgung reicht – Perfektion nicht nötig.“","„Ich muss nicht alles alleine tragen.“"]],["Gesundheit / Sport / Routinen","Guardian: „Sicher, nachhaltig – keine Verletzung.“ Explorer: „Abwechslung, draußen, Challenge – Hauptsache Bewegung.“","Explorer macht dich beweglicher und motivierter, Guardian hält dich sicher. Risiko: Explorer überzieht („komm, geht noch“), du bekommst Angst/Strenge oder brichst ab, weil es sich riskant anfühlt.",["„Spaß ja – aber mit Stop-Regeln.“","„Technik vor Tempo.“","„Kontinuität schlägt Intensität.“"]]],"sig":["„Sicherheitskern + Bewegungsdrang.“|Du willst Stabilität, Explorer will Freiheit.","„Reset über Action.“|Explorer deeskaliert durch Bewegung – du brauchst danach Abschluss.","„Gefahr: 'Freiheit' fühlt sich wie Risiko an.“|Dann kommt Kontrollimpuls.","„Ich trage alles“-Gefühl.|Wenn Explorer locker ist, fühlst du dich allein verantwortlich.","„Beste Form: Essentials + Spontanblock.“|Dann ist es sicher UND leicht."],"warn":[["Wenn Explorer ausweicht",["„Wir reden später.“","„Jetzt ist nicht der Moment.“","„Lass uns erstmal was anderes machen.“"]],["Wenn du streng wirst",["„So geht das nicht.“","„Das ist nicht okay.“","„Ab jetzt gilt...“"]],["Wenn du in Überkontrolle rutschst",["„Nur kurz noch prüfen...“","„Ich muss das absichern.“","„Sonst gibt's später Probleme.“"]]],"beruf":[["Konflikt im Team",["Guardian schützt Fairness/Respekt, Explorer will Spannung raus und weiterarbeiten.","Risiko|Konflikt wird „wegbewegt“, Betroffene fühlen sich nicht gesehen."],["„Das war unfair.“","„Raus aus dem Drama.“","„Wir klären das später.“"]],["Druck von oben",["Explorer sucht schnellen Weg, Guardian will Team/Qualität schützen.","Risiko|zu schnelles „Ja“ oder Blockade aus Sorge."],["„Ich will das Team nicht verbrennen.“","„Ich kann liefern – aber nicht um jeden Preis.“","„Ich brauche Priorisierung.“"]],["Deadline-Projekt",["Explorer will schnelle Loops, Guardian will Absicherung/Review.","Risiko|Scope springt oder Quality-Panik."],["„Wir dürfen nichts Halbgares liefern.“","„Wir lösen das im Tun.“","„Nur kurz noch prüfen...“"]],["Feedbackgespräch",["Explorer hält es locker/motivational, Guardian will fair + klar.","Risiko|zu weich oder zu moralisch/streng."],["„Ich will motivieren, aber nicht verwässern.“","„Es muss sich ändern.“","„Ich will fair bleiben.“"]]]},"innovator":{"kern":"Guardian liefert Stabilität, Sicherheit, Verantwortung und Fürsorge. Innovator bringt neue Ansätze, Verbesserungen und Mut zur Veränderung. Das Ergebnis ist oft: „Modernizer“ – du hältst das Fundament stabil und erneuerst es schrittweise, ohne Vertrauen zu riskieren.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Guardian: „Ordentlich, sicher, richtig – nichts vergessen.“ Innovator: „Ich hab einen Hack: Timer-Spiel / Checkpoint-System – dann geht's leichter.“","Du willst Sicherheit/Qualität, Innovator bringt Leichtigkeit und kreative Abkürzungen. Best-case: weniger Druck, trotzdem sauber. Risiko: du vertraust dem Hack nicht („zu chaotisch“), kontrollierst nach, wirst genervt – oder du springst zu oft auf neue Ideen und es entsteht keine stabile Routine.",["„Gute Ideen sind super – wenn sie zuverlässig sind.“","„Wir brauchen Sicherheit, aber ohne Stress.“","„Ich will es richtig machen – aber nicht verbissen.“"]],["Paar-Konflikt","Guardian: „Fairness, Verlässlichkeit, Anerkennung – klare Regeln.“ Innovator: „Lass uns das neu designen: smartere Aufteilung, neues System.“","Du willst Schutz und Verbindlichkeit, Innovator will neue Lösungen. Best-case: ihr findet eine elegante, entlastende Struktur. Risiko: Innovator wirkt wie „Lösungsflucht“ (zu früh), während du erst gesehen werden willst; oder du blockst neue Ideen aus Angst vor Instabilität.",["„Ich will nicht nur eine Idee – ich will Verlässlichkeit.“","„Wenn wir es testen, kann ich es akzeptieren.“","„Ich brauche Anerkennung, bevor wir neu planen.“"]],["Urlaub planen / Familienlogistik","Guardian: „Budget, Sicherheit, Storno, kindertauglich – bitte sauber.“ Innovator: „Hidden gems! Kreative Route! Wir machen's besonders.“","Du definierst Leitplanken, Innovator erweitert den Möglichkeitsraum. Risiko: Entscheidungsstau (zu viele Optionen) oder du wirst streng („zu riskant“) und killst die Freude.",["„Besonders ist okay – innerhalb von Leitplanken.“","„Sicherheit ist Fürsorge.“","„Wir brauchen einen Cut, sonst wird's endlos.“"]],["Besuch / Gastgeberrolle / Ordnung & Standards","Guardian: „Alle sollen sich wohlfühlen – vorbereitet, genug da, ordentlich.“ Innovator: „Lass einen Wow-Moment reinbringen: Motto/Spiel/Überraschung.“","Du sorgst für Stabilität und Versorgung, Innovator für Leichtigkeit und Highlights. Risiko: Überladung (zu viel Programm) oder du wirst perfektionistisch („es muss stimmig sein“) und bist mehr am Managen als am Dabeisein.",["„Ein Highlight reicht – der Rest darf einfach sein.“","„Ich muss nicht alles kontrollieren.“","„Versorgung ist wichtiger als Perfektion.“"]],["Gesundheit / Sport / Routinen","Guardian: „Sicher, nachhaltig, richtig – keine Verletzung.“ Innovator: „Mach's spannend: Challenge, neue Methode, Gamification.“","Du hältst Stabilität und Gesundheit hoch, Innovator hält Motivation hoch. Risiko: du wechselst zu oft (keine Kontinuität) oder du übertreibst in Challenges und Guardian wird ängstlich/kontrollierend.",["„Kontinuität schlägt Intensität.“","„Neues ja – aber dosiert.“","„Schutz ist Teil von Erfolg.“"]]],"sig":["„Sicherheitsrahmen + Kreativimpuls.“|Du wirst leichter, ohne Verantwortung zu verlieren.","„Ideenprüfung auf Verlässlichkeit.“|Nicht jede Idee bekommt ein Ticket.","„Spannung: Stabilität vs. Abwechslung.“|Du willst Routine, Innovator will Neuheit.","„Perfektionismus kann in ‚Overdesign' kippen.“|Zu viele Regeln + zu viele Ideen.","„Beste Form: Leitplanken + Pilot.“|Dann fühlst du dich sicher und offen."],"warn":[["Wenn du blockst/zu vorsichtig wirst",["„Das ist mir zu riskant.“","„So klappt das nie.“","„Wir machen das lieber wie immer.“"]],["Wenn du in Überkontrolle rutschst",["„Nur kurz noch prüfen...“","„Ich muss das absichern.“","„Sonst gibt's später Probleme.“"]],["Wenn Innovator dich zerstreut",["„Schon wieder was Neues...“","„Wir verlieren den Faden.“","„Das ist unnötig kompliziert.“"]]],"beruf":[["Konflikt im Team",["Guardian schützt Fairness/Respekt, Innovator will Reframing („neues Working Model“).","Risiko|zu schnelles „System ändern“ ohne Anerkennung der Verletzung."],["„Das war unfair.“","„Wir brauchen klare Regeln.“","„Wir müssen das anders aufsetzen.“"]],["Druck von oben",["Guardian will Team/Qualität schützen, Innovator sucht Hebel/Shortcut.","Risiko|zu schnelles „Ja“ auf Hoffnung oder zu starres „Nein“ aus Schutz."],["„Ich will das Team nicht verbrennen.“","„Ich kann liefern – aber sauber.“","„Ich brauche Priorisierung.“"]],["Deadline-Projekt",["Guardian will Review/Absicherung, Innovator will verbessern/optimieren.","Risiko|Scope-Creep + späte Quality-Panik."],["„Wir dürfen nichts Halbgares liefern.“","„Das könnte noch besser...“","„Nur kurz noch prüfen...“"]],["Feedbackgespräch",["Guardian will fair + konkret, Innovator will motivieren und Möglichkeiten zeigen.","Risiko|zu viele Beispiele oder zu viel „Potenzial-Talk“ ohne klare Erwartung."],["„Ich will fair sein.“","„Es muss sich ändern.“","„Ich will motivieren, nicht beschämen.“"]]]},"sage":{"kern":"Guardian trägt, schützt, sorgt und hält Beziehungen stabil. Sage bringt Reflexion, Sinn, Empathie und Orientierung. Das Ergebnis ist oft: „Compassionate Stabilizer“ – du bist nicht nur praktisch unterstützend, sondern auch emotional-klärend und sinnstiftend.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Guardian: „Ordentlich, sicher, richtig – nichts vergessen.“ Sage: „Was ist hier wirklich wichtig – und wie bleiben wir respektvoll?“","Du willst Absicherung/Standards, Sage bringt Haltung, Ton, Sinn rein. Best-case: du bleibst ruhig und würdevoll, auch unter Stress. Risiko: du wirst moralisch/belehrend („so macht man das nicht“), oder du verlierst Tempo, weil du erst „richtig erklären“ willst.",["„Sicherheit ja – aber nicht mit Druck.“","„Der Ton ist Teil der Fürsorge.“","„Ich will führen, ohne zu beschämen.“"]],["Paar-Konflikt","Guardian: „Fairness, Verlässlichkeit, Anerkennung.“ Sage: „Worum geht es wirklich – Respekt, Vertrauen, Wertschätzung?“","Du bringst das Bedürfnis nach Stabilität, Sage ordnet es in Werte ein. Best-case: tiefe Verbindung + klare Regeln. Risiko: das Gespräch wird zu grundsätzlich (viel Bedeutung, wenig Umsetzung) oder du nutzt „Werte“ als Druckmittel.",["„Ich will gesehen werden, nicht nur geregelt.“","„Wahrheit ohne Urteil.“","„Fairness ist Liebe in Handlung.“"]],["Urlaub planen / Familienlogistik","Guardian: „Budget, Sicherheit, Storno, kindertauglich.“ Sage: „Stimmigkeit: passt es zu uns – oder nur zu meiner Angst?“","Du willst Risiken minimieren, Sage prüft, ob Sicherheit aus Fürsorge oder aus Angst kommt. Best-case: du triffst Entscheidungen, die wirklich entlasten. Risiko: du overthinkst („ist das jetzt Angst?“) und kommst nicht ins Handeln.",["„Sicherheit ist gut – aber ich darf auch leben.“","„Stimmig heißt nicht perfekt.“","„Welche Sorge ist real – welche nur Vorstellung?“"]],["Besuch / Gastgeberrolle / Ordnung & Standards","Guardian: „Alle sollen sich wohlfühlen, genug da, ordentlich.“ Sage: „Verbindung > Perfektion.“","Du kümmerst dich, Sage bringt Präsenz und Wärme. Best-case: du bist Gastgeber und Mensch. Risiko: du wirst trotzdem zum Manager und moralisch streng, wenn andere „rücksichtslos“ wirken.",["„Ich muss nicht beweisen, dass ich gut bin.“","„Fürsorge ist auch Loslassen.“","„Ich darf genießen.“"]],["Gesundheit / Sport / Routinen","Guardian: „Sicher, nachhaltig, richtig – keine Verletzung.“ Sage: „Was tut dir wirklich gut – und warum?“","Du willst Schutz und Stabilität, Sage stärkt Selbstmitgefühl und Sinn. Best-case: du bleibst konstant ohne Selbsthärte. Risiko: du machst aus Gesundheit einen Moralstandard („ich muss“), dann entsteht Druck/Schuld.",["„Disziplin ist Fürsorge, keine Strafe.“","„Trend statt Tag.“","„Ich darf freundlich konsequent sein.“"]]],"sig":["„Fürsorge mit Prinzip.“|Du führst über Schutz + Werte.","„Starkes Fairness-/Respekt-Radar.“|Verletzungen triggern sofort.","„Gefahr: moralischer Ton.“|Wenn du dich bedroht fühlst, wird's „richtig/falsch“.","„Tiefe Loyalität.“|Wenn Menschen „deins“ sind, beschützt du sie stark.","„Beste Form: warm + klar.“|Grenzen setzen ohne Schärfe."],"warn":[["Wenn du moralisch wirst",["„So macht man das nicht.“","„Das ist respektlos.“","„Das ist nicht okay.“"]],["Wenn du in Überkontrolle rutschst",["„Ich muss das absichern.“","„Nur kurz noch prüfen...“","„Sonst gibt's später Probleme.“"]],["Wenn du dich selbst beschämst",["„Ich müsste doch...“","„Ich darf nicht nachlassen.“","„Ich bin nicht konsequent genug.“"]]],"beruf":[["Konflikt im Team",["Guardian schützt Fairness/Respekt, Sage bringt Prinzip/Wahrheit.","Risiko|moralischer Ton, Schuld statt Lösung."],["„So reden wir hier nicht.“","„Das war unfair.“","„Ich muss das schützen.“"]],["Druck von oben",["Guardian will Team schützen, Sage will Integrität (nichts Unwahres versprechen).","Risiko|Prinzip-Blockade oder stil
