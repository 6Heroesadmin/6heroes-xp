<!DOCTYPE html>

<head>

<style>
  :root {
    --navy:#20293A; --navy-soft:#283248; --gold:#F2B705;
    --ink:#F4F1E9; --ink-dim:#AEB6C6; --ink-faint:#717C92;
    --line:rgba(255,255,255,0.07);
    --accent:#1F9D62; --accent-soft:rgba(31,157,98,0.10); --accent-line:rgba(31,157,98,0.45);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--navy); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.65; }
  .wrap { max-width:680px; margin:0 auto; padding:0 24px 88px; }


  .hero { text-align:center; padding:40px 0 4px; }
  .hero-img-wrap { width:190px; height:190px; margin:0 auto 30px; border-radius:50%; background:var(--accent-soft); border:1px solid var(--accent-line); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .hero-img-wrap img { width:100%; height:100%; object-fit:cover; }
  .hero-img-placeholder { font-family:'DM Serif Display',serif; font-size:64px; color:var(--accent); }
  .eyebrow { font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:18px; }
  .hero h1 { font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(44px,11vw,72px); line-height:1.0; letter-spacing:-.015em; margin-bottom:16px; }
  .hero h1 .accent { color:var(--accent); font-style:italic; }
  .hero .tagline { font-size:17px; color:var(--ink-dim); }

  .hook { margin:52px 0 0; text-align:center; }
  .hook p { font-family:'DM Serif Display',serif; font-size:clamp(24px,5.5vw,33px); line-height:1.34; color:var(--ink); letter-spacing:-.01em; }
  .hook .accent { color:var(--accent); font-style:italic; }

  section { padding-top:64px; scroll-margin-top:70px; }
  .block { padding-left:22px; border-left:2px solid var(--line); }
  .block.is-accent { border-left-color:var(--accent); }
  .block .label { font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px; }
  .block.is-accent .label { color:var(--accent); }
  .block p { font-size:18px; line-height:1.7; color:var(--ink-dim); }

  h2 { font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(28px,7vw,40px); line-height:1.1; letter-spacing:-.01em; margin-bottom:28px; text-align:center; }
  .life-item { padding:22px 0; border-bottom:1px solid var(--line); }
  .life-item:last-child { border-bottom:none; }
  .life-item h4 { font-size:17px; font-weight:600; margin-bottom:6px; display:flex; gap:12px; align-items:baseline; }
  .life-item h4 .n { font-family:'DM Serif Display',serif; color:var(--accent); font-size:18px; }
  .life-item p { font-size:16px; color:var(--ink-dim); padding-left:30px; }
  .placeholder-note { font-size:14px; color:var(--ink-faint); font-style:italic; padding:18px 20px; border:1px dashed var(--line); border-radius:14px; text-align:center; }

  .action { margin-top:16px; padding:34px 30px; border-radius:22px; background:var(--accent-soft); border:1px solid var(--accent-line); }
  .action h3 { font-family:'DM Serif Display',serif; font-size:22px; line-height:1.3; margin-bottom:22px; color:var(--ink); }
  .step { display:flex; gap:14px; margin-bottom:16px; align-items:flex-start; }
  .step .dot { flex:0 0 auto; width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--navy); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .step p { font-size:16px; color:var(--ink); }
  .exercise { margin-top:24px; padding:22px; border-radius:16px; background:rgba(0,0,0,0.18); }
  .exercise .x-title { font-weight:600; font-size:13px; letter-spacing:.04em; color:var(--accent); margin-bottom:10px; text-transform:uppercase; }
  .exercise p { font-size:16px; color:var(--ink-dim); line-height:1.7; }

  .cta-quests { display:inline-flex; align-items:center; gap:8px; margin-top:28px; font-size:16px; font-weight:600; color:var(--navy); background:var(--gold); text-decoration:none; padding:15px 28px; border-radius:999px; transition:transform .15s,filter .15s; }
  .cta-quests:hover { transform:translateY(-1px); filter:brightness(1.05); }

  .bridge { display:block; text-align:center; margin-top:44px; font-size:13px; color:var(--ink-faint); text-decoration:none; }
  .bridge:hover { color:var(--ink-dim); }
  .bridge span { color:var(--accent); }

  @media (max-width:480px){ .hero-img-wrap{width:150px;height:150px;} .action{padding:26px 22px;} }

  /* Kompaktprofil-Module */
  #module h2 { margin-bottom:30px; }
  .mod-card { background:var(--navy-soft); border:1px solid var(--line); border-radius:20px; padding:28px 26px; margin-bottom:18px; }
  .mod-card .m-num { font-family:'DM Serif Display',serif; font-size:14px; color:var(--accent); letter-spacing:.05em; margin-bottom:4px; }
  .mod-card .m-title { font-family:'DM Serif Display',serif; font-size:24px; line-height:1.2; margin-bottom:3px; }
  .mod-card .m-sub { font-size:13px; color:var(--ink-faint); letter-spacing:.03em; margin-bottom:16px; }
  .mod-card .m-beschr { font-size:16px; color:var(--ink-dim); line-height:1.7; margin-bottom:20px; }
  .m-states { display:grid; gap:10px; margin-bottom:20px; }
  .m-state { display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:start; }
  .m-state .s-lab { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding-top:2px; }
  .m-state.gesund .s-lab { color:var(--accent); }
  .m-state.stress .s-lab { color:#D2607A; }
  .m-state.emo .s-lab { color:var(--ink-faint); }
  .m-state p { font-size:15px; color:var(--ink-dim); line-height:1.6; }
  .m-goal { border-left:2px solid var(--accent); padding-left:16px; margin-bottom:18px; }
  .m-goal .g-lab { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
  .m-goal p { font-size:15px; color:var(--ink); line-height:1.6; }
  .m-ex { background:rgba(0,0,0,0.18); border-radius:14px; padding:18px 20px; }
  .m-ex .x-title { font-weight:600; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  .m-ex .x-name { font-weight:600; font-size:15px; margin-bottom:8px; }
  .m-ex p { font-size:15px; color:var(--ink-dim); line-height:1.65; }
  @media(max-width:480px){ .m-state{grid-template-columns:1fr;gap:3px;} .mod-card{padding:22px 18px;} }

</style>
</head>

<script>
const HERO_DATA = {
  guardian:{accent:"#1F9D62",initial:"G",name:"Der <span class=\"accent\">Guardian</span>",tagline:"Dein Kern. Dein Fundament.",hook:"Du definierst dich über <span class=\"accent\">Verbindung</span> – über das lebendige Miteinander zwischen Menschen. Dein innerer Motor ist Fürsorge.",identity:"Verbindung und das lebendige Miteinander zwischen Menschen bilden den Kern deiner Identität. Du fühlst dich am stärksten, wenn es den Menschen um dich herum gut geht und du weißt, dass deine Anwesenheit dazu beigetragen hat. Beziehungen, Zugehörigkeit und gegenseitige Unterstützung geben dir Orientierung und Bedeutung.",strength:"Du bildest das stabile Fundament, auf dem andere ihr Bestes geben können. Du erkennst Spannungen früh, bevor sie eskalieren, nimmst Bedürfnisse wahr, die andere leicht übersehen, und schaffst eine Atmosphäre, in der Menschen sich gesehen und angenommen fühlen. Du führst über Vertrauen, nicht über Druck.",pattern:"In Momenten, in denen deine Fürsorge nicht erwidert wird oder Harmonie gefährdet scheint, entsteht ein Muster: Du gibst weiter, auch wenn du selbst leer bist. Du vermeidest notwendige Konflikte, stellst eigene Bedürfnisse zurück oder übernimmst Verantwortung für die Gefühle anderer – und trägst den Preis dafür häufig allein.",growth:"Selbstfürsorge nicht als Egoismus erleben, sondern als Voraussetzung für eine gesunde Fürsorge für andere. Deine Verbindung zu anderen wird nicht schwächer, wenn du Grenzen setzt – sie wird ehrlicher, weil auch deine eigenen Bedürfnisse darin einen Platz bekommen.",life:[{title:"Wenn sich die Stimmung im Raum verändert",text:"Du bemerkst oft früh, wenn zwischen Menschen etwas nicht stimmt – noch bevor jemand es offen anspricht. Ein anderer Tonfall, ein Rückzug oder eine kleine Spannung reichen aus, damit deine Aufmerksamkeit zur Beziehung wandert. Häufig versuchst du intuitiv, wieder Verbindung herzustellen und dafür zu sorgen, dass sich alle gesehen fühlen."},{title:"Wenn jemand dich braucht",text:"Wenn ein Mensch in deinem Umfeld Unterstützung braucht, bist du schnell da. Du hörst zu, übernimmst etwas oder stellst deine eigenen Pläne zurück, ohne lange darüber nachzudenken. Deine Stärke ist echte Fürsorge – herausfordernd wird es, wenn aus „Ich möchte helfen“ unbemerkt „Ich muss helfen“ wird und deine eigenen Bedürfnisse keinen Platz mehr bekommen."},{title:"Wenn ein Konflikt entsteht",text:"Spannungen zwischen Menschen lassen dich selten kalt. Du kannst unterschiedliche Seiten gut verstehen und schaffst es oft, Menschen wieder miteinander ins Gespräch zu bringen. Betrifft der Konflikt dich selbst, besteht jedoch die Gefahr, dass du deine eigene Position abschwächst oder zu lange schweigst, damit die Beziehung keinen Schaden nimmt."},{title:"Wenn du eigentlich Nein sagen möchtest",text:"Du merkst häufig sehr genau, dass dir etwas zu viel wird – sagst aber trotzdem Ja, weil du niemanden enttäuschen möchtest. Kurzfristig schützt du damit die Harmonie, langfristig kann daraus Erschöpfung oder stille Enttäuschung entstehen. Dein Wachstum beginnt dort, wo du erkennst: Eine klare Grenze beendet Verbindung nicht – sie macht ehrliche Verbindung erst möglich."}],actionLead:"Dein Guardian wird stark, wenn du lernst, zuerst auch für dich zu sorgen. Diese Woche:",steps:["Bemerke einmal täglich, wann du gibst, obwohl du selbst eigentlich Ruhe, Unterstützung oder Raum brauchst – zunächst nur wahrnehmen, nicht verändern.","Formuliere in einer konkreten Situation eine kleine Bitte oder Grenze, die dein eigenes Bedürfnis schützt.","Beobachte anschließend, was tatsächlich mit der Beziehung passiert – und ob du danach mehr oder weniger Energie hast, für andere da zu sein."],exTitle:"Übung · Die Bedürfnis-Balance",exText:"Notiere eine Situation, in der du dich gerade stark um einen anderen Menschen kümmerst oder eigene Bedürfnisse zurückstellst. Beantworte dann ehrlich: Was brauche ich gerade selbst, um mich sicher, respektiert oder unterstützt zu fühlen? Formuliere daraus eine konkrete Bitte oder eine Grenze. Beobachte anschließend nicht nur die Reaktion des anderen, sondern auch deine eigene Energie. Du kannst für andere besonders gut da sein, wenn auch deine eigenen Bedürfnisse Raum bekommen.",questCategory:"stress",bridge:"https://6heroes.de/helden.html"},
  commander:{accent:"#0B63CE",initial:"C",name:"Der <span class=\"accent\">Commander</span>",tagline:"Dein Kern. Dein Fundament.",hook:"Du definierst dich über <span class=\"accent\">Wirkung</span> – über Handeln, Entscheiden und Verantwortung. Dein innerer Motor ist Fortschritt.",identity:"Wirkung entsteht für dich durch Handeln, Entscheiden und das Übernehmen von Verantwortung. Du fühlst dich am stärksten, wenn etwas vorangeht und du erkennst, dass dein Einsatz einen konkreten Unterschied macht. Aus Unsicherheit eine klare Richtung zu schaffen, gehört für dich nicht nur zum Tun, sondern zu deinem Selbstverständnis.",strength:"Du erzeugst Momentum, wenn andere noch diskutieren. In unklaren oder schwierigen Situationen schaffst du Orientierung, setzt Prioritäten und übernimmst Verantwortung, wenn sie gebraucht wird. Menschen können sich auf deine Entschlossenheit verlassen – besonders dann, wenn ein System unter Druck gerät und jemand vorne stehen muss.",pattern:"Wenn Entscheidungen ausbleiben, Abläufe langsam werden oder andere nicht so handeln, wie du es für notwendig hältst, entsteht ein Muster: Du erhöhst den Druck und übernimmst immer mehr selbst. Deine Klarheit wird härter, aus Verantwortung wird Kontrolle – und irgendwann entsteht das Gefühl, dass ohne dich nichts funktioniert.",growth:"Deine Stärke nicht kleiner machen, sondern präziser einsetzen: Wirkung entsteht nicht nur dadurch, dass du selbst entscheidest, sondern auch dadurch, dass andere durch dich Verantwortung übernehmen können.",life:[{title:"Wenn niemand eine Entscheidung trifft",text:"Eine Diskussion dreht sich im Kreis, alle Argumente liegen auf dem Tisch und trotzdem übernimmt niemand Verantwortung. Genau hier wirst du wach: Du bündelst das Wesentliche, setzt einen Punkt und bringst die Gruppe wieder in Bewegung. Deine Stärke ist Orientierung – dein Risiko beginnt dort, wo Geschwindigkeit wichtiger wird als das Einbeziehen der anderen."},{title:"Wenn es plötzlich ernst wird",text:"Ein Projekt gerät aus der Spur, auf einer Reise läuft etwas schief oder im Alltag muss schnell eine Lösung her. Während andere noch sortieren, gehst du ins Handeln. Du priorisierst, verteilst Aufgaben und sorgst dafür, dass wieder Kontrolle entsteht – Situationen mit echtem Handlungsdruck können deshalb eine deiner stärksten Seiten sichtbar machen."},{title:"Wenn andere langsamer sind als du",text:"Du siehst längst, was getan werden müsste, während jemand anderes noch abwägt, erklärt oder Details klärt. Dann steigt deine Ungeduld und du bist versucht, Gespräch und Aufgabe gleichzeitig an dich zu ziehen. Was sich für dich wie Effizienz anfühlt, kann beim Gegenüber jedoch als Übergehen erlebt werden – und genau hier liegt eines deiner wichtigsten Wachstumsfelder."},{title:"Wenn nicht alles nach deinem Plan läuft",text:"Auch privat übernimmst du schnell die Führung: Du organisierst, löst Probleme und sorgst dafür, dass Dinge funktionieren. Ändert jemand spontan den Plan oder entscheidet anders, kann es schwerfallen, nicht sofort korrigierend einzugreifen. Dein stärkster Commander zeigt sich dann, wenn du unterscheiden kannst: Wo braucht es wirklich Führung – und wo darf etwas einfach anders laufen, als du es selbst gemacht hättest?"}],actionLead:"Dein Commander wird stark, wenn du Wirkung nicht mit Kontrolle verwechselst. Diese Woche:",steps:["Bemerke einmal täglich den Moment, in dem du denkst: „Dann mache ich es eben selbst“ – und halte kurz inne.","Gib in einer konkreten Situation nicht die Lösung vor, sondern frage: „Wie würdest du hier entscheiden?“","Überlasse eine Entscheidung bewusst einem anderen Menschen und beobachte, ob wirklich das Ergebnis schlechter wird – oder nur der Weg ein anderer ist."],exTitle:"Übung · Der Wirkungsraum",exText:"Notiere drei Situationen, in denen du gerade viel Kontrolle hältst. Frage dich bei jeder: Muss ich das Ergebnis selbst kontrollieren – oder reicht es, Ziel, Rahmen und Verantwortung klarzumachen? Wähle eine Situation aus und gib die Entscheidung bewusst ab. Deine Aufgabe ist nicht, dich herauszuhalten, sondern einen klaren Rahmen zu schaffen und anschließend auszuhalten, dass jemand anderes seinen eigenen Weg zum Ergebnis nimmt.",questCategory:"wachsen",bridge:"https://6heroes.de/helden.html"},
  innovator:{accent:"#F2B705",initial:"I",name:"Der <span class=\"accent\">Innovator</span>",tagline:"Dein Kern. Dein Fundament.",hook:"Du definierst dich über <span class=\"accent\">Möglichkeiten</span> – über das Erschaffen von etwas Neuem. Dein innerer Motor ist Zukunft.",identity:"Möglichkeiten, Zukunft und das Erschaffen von etwas Neuem bilden den Kern deiner Identität. Du fühlst dich lebendig, wenn du Bestehendes infrage stellst, unerwartete Verbindungen erkennst und aus einer Idee ein Zukunftsbild entsteht, das vorher noch niemand gesehen hat. Die Welt ist für dich weniger etwas Festes als etwas, das gestaltet werden kann.",strength:"Du öffnest gedankliche Räume, in denen andere nur Grenzen sehen. Unterschiedliche Informationen, Trends und Ideen verbindest du zu neuen Möglichkeiten und kannst Menschen für ein Bild begeistern, das noch nicht Realität ist. Deine besondere Kraft liegt darin, Zukunft nicht nur vorherzusehen, sondern sie vorstellbar zu machen.",pattern:"Wenn Alltag, Routine oder enge Vorgaben deine Beweglichkeit begrenzen, entsteht ein Muster: Eine neue Idee wirkt plötzlich attraktiver als die konsequente Umsetzung der alten. Du öffnest weitere Möglichkeiten, wechselst die Richtung oder erhöhst die Komplexität – und verlierst dabei genau die Idee aus dem Blick, die eigentlich Wirkung entfalten könnte.",growth:"Nicht weniger Ideen entwickeln, sondern lernen, einer guten Idee lange genug treu zu bleiben, damit aus Möglichkeit Wirklichkeit werden kann.",life:[{title:"Wenn etwas ganz neu entsteht",text:"Ein leeres Blatt, ein neues Produkt, ein Konzept oder ein ungelöstes Problem kann bei dir mehr Energie auslösen als ein fast fertiges Projekt. Wo noch nichts feststeht, beginnst du Möglichkeiten zu kombinieren, ungewöhnliche Verbindungen herzustellen und Alternativen zu sehen. Genau in dieser frühen Phase bist du häufig der Mensch, der aus „Wir wissen noch nicht wie“ ein begeisterndes „Was wäre, wenn …?“ macht."},{title:"Wenn alle nur den bestehenden Weg sehen",text:"Ein Team sagt: „Das haben wir immer so gemacht“, oder eine Situation scheint nur zwei offensichtliche Lösungen zu bieten. Für dich ist das eher Einladung als Grenze. Du stellst Annahmen infrage und suchst nach einer dritten, vierten oder völlig anderen Möglichkeit – eine Stärke, die Innovation erzeugen kann, aber andere überfordert, wenn jede gefundene Lösung sofort wieder durch eine neue ersetzt wird."},{title:"Wenn die spannende Phase vorbei ist",text:"Die Idee steht, jetzt folgen Abstimmung, Dokumentation, Wiederholung und konsequente Umsetzung. Genau hier kann deine Energie deutlich sinken. Plötzlich tauchen neue Projekte auf, die wieder aufregender wirken. Dein Wachstumsfeld zeigt sich darin, die vermeintlich langweilige zweite Hälfte nicht als Ende der Kreativität zu erleben, sondern als den Teil, durch den eine Idee überhaupt erst Wirkung bekommt."},{title:"Wenn du zu viele Möglichkeiten gleichzeitig siehst",text:"Ob neues Hobby, beruflicher Weg, Urlaub oder persönliches Projekt – du kannst in kurzer Zeit zahlreiche attraktive Varianten entwickeln. Das fühlt sich zunächst nach Freiheit an, kann Entscheidungen aber paradoxerweise schwerer machen. Dein stärkster Innovator zeigt sich nicht daran, wie viele Türen du erkennst, sondern daran, welche Tür du bewusst auswählst und lange genug offen hältst, um herauszufinden, was dahinter liegt."}],actionLead:"Dein Innovator wird stark, wenn aus vielen Möglichkeiten eine echte Entscheidung entsteht. Diese Woche:",steps:["Sammle neue Ideen weiterhin – aber parke jede neue Möglichkeit zunächst, statt ihr sofort zu folgen.","Entscheide dich für eine einzige Idee, die aktuell den größten Unterschied machen könnte.","Definiere dafür eine bewusst kleine Version 1.0 und bring genau diese zu einem sichtbaren Ergebnis, bevor du sie weiterentwickelst."],exTitle:"Übung · Die eine Möglichkeit",exText:"Schreibe drei Ideen auf, die dich gerade begeistern. Frage dich nicht, welche davon am spannendsten klingt, sondern welche davon jetzt die größte reale Bedeutung entfalten könnte. Entscheide dich für eine. Formuliere anschließend die kleinstmögliche Version, mit der diese Idee innerhalb kurzer Zeit sichtbar oder testbar wird. Alles Weitere kommt auf eine „Später“-Liste. Deine kreative Freiheit geht dadurch nicht verloren – sie bekommt eine Richtung.",questCategory:"wachsen",bridge:"https://6heroes.de/helden.html"},
  strategist:{accent:"#94A3B8",initial:"S",name:"Der <span class=\"accent\">Strategist</span>",tagline:"Dein Kern. Dein Fundament.",hook:"Du definierst dich über <span class=\"accent\">Struktur</span> – über Verlässlichkeit und Qualität. Dein innerer Motor ist Klarheit im System.",identity:"Struktur, Verlässlichkeit und Qualität geben dir Orientierung und Sicherheit. Du fühlst dich besonders wirksam, wenn du aus Komplexität ein klares System schaffst, Abläufe beherrschbar machst und dafür sorgst, dass Ergebnisse einem hohen Standard entsprechen. Kompetenz bedeutet für dich, Dinge so zu gestalten, dass man sich auf sie verlassen kann.",strength:"Du erkennst Lücken, Risiken und Unklarheiten, bevor sie später zu Problemen werden. Wo andere nur einzelne Aufgaben sehen, erkennst du Abläufe, Abhängigkeiten und notwendige Standards. Deine Stärke schafft Stabilität: Was durch deine Hände geht, ist durchdacht, vorbereitet und belastbar.",pattern:"Wenn Strukturen wegbrechen, Pläne kurzfristig geändert werden oder Fehler entstehen, steigt dein Bedürfnis nach Kontrolle. Du gehst tiefer ins Detail, prüfst noch einmal und erhöhst die Standards – bis Genauigkeit nicht mehr Sicherheit schafft, sondern dich und andere ausbremst.",growth:"Qualität nicht mit Fehlerfreiheit verwechseln: Deine Struktur ist am stärksten, wenn sie Orientierung schafft und gleichzeitig genug Raum für Realität, Menschen und Veränderung lässt.",life:[{title:"Wenn aus Chaos ein Plan werden muss",text:"Ein Projekt hat viele Beteiligte, Termine und offene Abhängigkeiten. Während andere die Komplexität als Belastung erleben, beginnst du zu sortieren: Was gehört zusammen? Was muss zuerst passieren? Wo liegt ein Risiko? Situationen wie diese bringen deine Stärke besonders gut zur Geltung, weil du aus vielen Einzelteilen eine belastbare Struktur bauen kannst."},{title:"Kurz bevor etwas fertig ist",text:"Eine Präsentation, ein Angebot oder ein wichtiges Ergebnis ist eigentlich bereit – doch du entdeckst noch eine Formulierung, eine Zahl oder ein Detail, das besser sein könnte. Deine Qualitätsorientierung schützt vor Fehlern, kann aber dazu führen, dass du unverhältnismäßig viel Energie in die letzten Prozent investierst. Die entscheidende Frage lautet dann: Wird das Ergebnis wirklich besser – oder nur perfekter?"},{title:"Wenn sich ein Plan kurzfristig ändert",text:"Ein Termin fällt aus, jemand improvisiert oder eine sorgfältig vorbereitete Planung funktioniert plötzlich nicht mehr. Solche Situationen können deutlich mehr innere Anspannung auslösen, als andere von außen erkennen. Dein erster Impuls ist häufig, möglichst schnell wieder Ordnung herzustellen. Wachstum bedeutet hier, nicht auf Struktur zu verzichten, sondern auch vorübergehende Unordnung aushalten zu können."},{title:"Wenn andere andere Standards haben",text:"Im Team, in der Partnerschaft oder im gemeinsamen Haushalt fällt dir schnell auf, wenn jemand Dinge weniger sorgfältig oder systematisch erledigt als du. Was für den anderen „völlig ausreichend“ ist, kann sich für dich unfertig anfühlen. Deine Stärke wird dann zur Belastung, wenn dein persönlicher Qualitätsstandard zum Maßstab für alle wird. Entlastung entsteht, wenn ihr gemeinsam definiert, was tatsächlich notwendig ist – und was lediglich deine bevorzugte Art ist."}],actionLead:"Dein Strategist wird stark, wenn du bewusst entscheidest, wie viel Qualität wirklich notwendig ist. Diese Woche:",steps:["Wähle eine Aufgabe und definiere vor Beginn, wie ein perfektes 100%-Ergebnis aussehen würde.","Lege anschließend fest, welches 80%-Ergebnis den eigentlichen Zweck bereits vollständig erfüllt.","Stoppe bewusst beim vereinbarten Niveau und beobachte, was tatsächlich passiert, wenn du die letzten Prozent nicht optimierst."],exTitle:"Übung · Der Gut-genug-Vertrag",exText:"Nimm eine Aufgabe, bei der du normalerweise leicht ins Optimieren gerätst. Schreibe zunächst drei Kriterien auf, die für ein wirklich gutes Ergebnis unverzichtbar sind. Alles andere markierst du als „nice to have“. Sobald die drei Kernkriterien erfüllt sind, gilt die Aufgabe als abgeschlossen. Beobachte anschließend nicht nur das Ergebnis, sondern auch die gewonnene Zeit und Energie. So trainierst du, Qualität bewusst zu steuern, statt von ihr gesteuert zu werden.",questCategory:"wachsen",bridge:"https://6heroes.de/helden.html"},
  explorer:{accent:"#F0672A",initial:"E",name:"Der <span class=\"accent\">Explorer</span>",tagline:"Dein Kern. Dein Fundament.",hook:"Du definierst dich über <span class=\"accent\">Freiheit</span> – über Bewegung und eigene Wege. Dein innerer Motor ist Entdeckung.",identity:"Freiheit, Bewegung und die Möglichkeit, eigene Wege zu entdecken, bilden den Kern deiner Identität. Du fühlst dich lebendig, wenn du wählen, Neues ausprobieren und Erfahrungen unmittelbar selbst machen kannst. Unbekanntes weckt deine Neugier, weil du darin Möglichkeiten siehst, die sich erst zeigen, wenn man tatsächlich losgeht.",strength:"Du findest Handlungsspielräume, wo andere sich festgefahren fühlen. Neue Situationen schrecken dich selten lange ab: Du improvisierst, probierst aus und reagierst flexibel auf das, was tatsächlich passiert. Deine Offenheit für Erfahrungen macht dich zu einem natürlichen Pionier, besonders dort, wo es noch keinen fertigen Weg gibt.",pattern:"Wenn Verpflichtungen eng werden, Routinen sich wiederholen oder andere zu stark kontrollieren, entsteht ein Muster: Abstand fühlt sich plötzlich attraktiver an als Auseinandersetzung. Du öffnest Hintertüren, wechselst das Thema oder suchst die nächste Möglichkeit – nicht unbedingt weil das Alte falsch ist, sondern weil es sich nicht mehr frei anfühlt.",growth:"Freiheit nicht nur darin finden, jederzeit gehen zu können, sondern darin, sich bewusst für etwas zu entscheiden und dieser Entscheidung auch dann treu zu bleiben, wenn sie vorübergehend unbequem wird.",life:[{title:"Wenn du Neuland betrittst",text:"Eine unbekannte Stadt, ein neues Umfeld, eine neue Aufgabe oder eine Situation ohne fertige Anleitung aktiviert häufig deine beste Seite. Während andere zunächst Sicherheit suchen, beginnst du zu erkunden. Du lernst durch Erfahrung, passt dich schnell an und findest häufig Wege, die auf keinem ursprünglichen Plan standen."},{title:"Wenn jeder Tag gleich aussieht",text:"Was für andere angenehm vorhersehbar ist, kann bei dir zunehmend Energie ziehen. Wiederholung, starre Abläufe oder das Gefühl, nur noch dieselben Schritte abzuarbeiten, erzeugen innere Unruhe. Dann wird Veränderung schnell zum Selbstzweck. Dein Wachstumsfeld liegt darin, unterscheiden zu lernen: Brauche ich wirklich einen neuen Weg – oder brauche ich lediglich mehr Spielraum auf dem bestehenden?"},{title:"Wenn andere Verbindlichkeit erwarten",text:"In Beziehungen, Freundschaften oder Teams können feste Erwartungen plötzlich wie eine Einschränkung wirken. Je stärker du das Gefühl bekommst, etwas „zu müssen“, desto größer kann der Wunsch nach Abstand werden. Sagst du nicht, welchen Freiraum du brauchst, erleben andere deine Distanz möglicherweise als Unzuverlässigkeit. Reife Freiheit bedeutet deshalb auch, Bedürfnisse früh auszusprechen, statt erst zu verschwinden, wenn es zu eng wird."},{title:"Wenn plötzlich alles anders kommt",text:"Pläne funktionieren nicht, Bedingungen ändern sich oder eine Situation entwickelt sich völlig anders als erwartet. Hier besitzt du oft einen natürlichen Vorteil: Du hängst weniger am ursprünglichen Weg und findest schnell eine Alternative. Wo andere zunächst den verlorenen Plan betrauern, fragst du bereits: „Okay – was können wir jetzt daraus machen?“"}],actionLead:"Dein Explorer wird stark, wenn du innerhalb von Verbindlichkeit deinen eigenen Spielraum findest. Diese Woche:",steps:["Bemerke eine Situation, in der du am liebsten aussteigen, verschieben oder etwas völlig anderes machen möchtest.","Frage dich: „Welche Wahlmöglichkeiten habe ich innerhalb dieses Rahmens, ohne die Verpflichtung aufzugeben?“","Entscheide dich für einen Weg und bleibe bis zu einem vorher festgelegten Punkt dabei – erst danach entscheidest du neu."],exTitle:"Übung · Der Freiheits-Rahmen",exText:"Wähle eine Verpflichtung, die sich gerade eng oder schwer anfühlt. Schreibe zuerst auf, was daran tatsächlich feststeht und was lediglich wie eine Einschränkung wirkt. Suche anschließend mindestens zwei Möglichkeiten, wie du innerhalb des bestehenden Rahmens selbstbestimmt handeln kannst. Entscheide dich bewusst für eine davon und formuliere: „Ich muss das nicht auf diese Weise tun – ich entscheide mich für diesen Weg.“ Freiheit entsteht damit nicht außerhalb der Verpflichtung, sondern innerhalb deiner eigenen Wahl.",questCategory:"energie",bridge:"https://6heroes.de/helden.html"},
  sage:{accent:"#C0266A",initial:"S",name:"Der <span class=\"accent\">Sage</span>",tagline:"Dein Kern. Dein Fundament.",hook:"Du definierst dich über <span class=\"accent\">Verstehen</span> – über Erkenntnis und innere Klarheit. Dein innerer Motor ist Tiefe.",identity:"Verstehen, Erkenntnis und innere Klarheit bilden den Kern deiner Identität. Du fühlst dich besonders sicher, wenn Zusammenhänge logisch werden, ein Thema Tiefe bekommt und du nicht nur weißt, was passiert, sondern auch warum. Bedeutung entsteht für dich dort, wo aus Informationen ein schlüssiges Gesamtbild wird.",strength:"Du erkennst Muster, Widersprüche und Konsequenzen, die anderen leicht entgehen. Komplexität schreckt dich nicht – im Gegenteil: Du kannst Informationen ordnen, Annahmen prüfen und aus vielen Einzelteilen ein schlüssiges Bild entwickeln. Deine Ruhe und gedankliche Tiefe schaffen Klarheit dort, wo andere vorschnell vereinfachen.",pattern:"Wenn Informationen fehlen, Argumente nicht zusammenpassen oder du unter Zeitdruck entscheiden sollst, entsteht ein Muster: Du suchst nach noch mehr Klarheit. Aus Analyse wird weitere Analyse, aus einer offenen Frage entstehen drei neue – bis das Bedürfnis, richtig zu entscheiden, genau die Entscheidung verhindert.",growth:"Nicht weniger tief denken, sondern früher erkennen, wann genügend verstanden ist: Klarheit wird erst wirksam, wenn aus Erkenntnis irgendwann eine Handlung wird.",life:[{title:"Wenn eine Entscheidung komplex wird",text:"Eine größere Anschaffung, eine berufliche Weichenstellung oder eine strategische Frage hat viele Variablen. Wo andere aus dem Bauch entscheiden, beginnst du Zusammenhänge zu prüfen, Informationen zu vergleichen und Konsequenzen weiterzudenken. Diese Tiefe schützt vor vorschnellen Entscheidungen – solange du erkennst, wann zusätzliche Informationen die Richtung kaum noch verändern."},{title:"Wenn eine Argumentation nicht stimmt",text:"In einem Gespräch klingt etwas zunächst überzeugend, aber eine Annahme passt nicht zur Schlussfolgerung. Solche Brüche fallen dir schnell auf. Du stellst Fragen, differenzierst und bringst Sachlichkeit in die Diskussion. Herausfordernd wird es, wenn dein Wunsch nach Präzision beim Gegenüber als Korrektur oder Belehrung ankommt, obwohl du eigentlich nur verstehen möchtest."},{title:"Wenn jemand vor allem emotional reagiert",text:"Ein Mensch erzählt dir von einem Problem, und du erkennst schnell Ursachen, Widersprüche oder mögliche Lösungen. Dein natürlicher Impuls ist, das Problem gedanklich zu ordnen. Manchmal braucht dein Gegenüber in diesem Moment jedoch weniger Analyse als Resonanz. Dein Wachstum liegt darin, zuerst zu erkennen, was gerade gebraucht wird: eine Lösung – oder ein Mensch, der einfach versteht, wie es sich anfühlt."},{title:"Wenn du entscheiden musst, bevor alles klar ist",text:"Zeitdruck und unvollständige Informationen können besonders unangenehm sein, weil dein Qualitätsmaßstab im Denken nicht vollständig erfüllt werden kann. Dein Reflex kann sein, dich zurückzuziehen oder die Entscheidung aufzuschieben. Dein stärkster Sage zeigt sich dann, wenn du Unsicherheit ausdrücklich benennst, eine begründete Hypothese formulierst und trotzdem handelst: nicht weil du alles weißt, sondern weil du weißt, was für den nächsten Schritt ausreicht."}],actionLead:"Dein Sage wird stark, wenn du zwischen notwendiger Erkenntnis und zusätzlicher Sicherheit unterscheiden kannst. Diese Woche:",steps:["Wähle eine Entscheidung, über die du bereits länger nachdenkst, und notiere die drei Informationen, die wirklich entscheidend sind.","Prüfe ehrlich, welche dieser Informationen bereits ausreichend geklärt sind und welche nur zusätzliche Sicherheit liefern würden.","Triff die Entscheidung, sobald du die Richtung sachlich begründen kannst – auch wenn noch nicht jede Frage beantwortet ist."],exTitle:"Übung · Die 70%-Klarheit",exText:"Nimm ein Thema, das du gerade immer weiter analysierst. Schreibe auf, was du sicher weißt, welche Annahmen du triffst und welche offenen Fragen die Entscheidung tatsächlich verändern könnten. Wenn du ungefähr genug Informationen hast, um eine vernünftige Richtung zu begründen, formuliere eine Entscheidung als vorläufige Hypothese: „Auf Basis dessen, was ich heute weiß, gehe ich diesen Weg.“ Du gibst damit Genauigkeit nicht auf – du akzeptierst, dass manche Erkenntnisse erst durch Handeln entstehen.",questCategory:"wachsen",bridge:"https://6heroes.de/helden.html"}
};

function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
function render(){
  const key=(new URLSearchParams(location.search).get("hero")||"guardian").toLowerCase();
  const rolle=(new URLSearchParams(location.search).get("rolle")||"basis").toLowerCase();
  document.getElementById("heroRole").textContent = (rolle==="zweit") ? "Dein Zweitheld" : "Dein Basisheld";
  const d=HERO_DATA[key]||HERO_DATA.guardian;
  const r=document.documentElement.style;
  r.setProperty("--accent",d.accent);r.setProperty("--accent-soft",hexToRgba(d.accent,0.10));r.setProperty("--accent-line",hexToRgba(d.accent,0.45));
  document.getElementById("heroInitial").textContent=d.initial;
  document.getElementById("heroName").innerHTML=d.name;
  document.getElementById("heroTagline").textContent=d.tagline;
  document.getElementById("heroHook").innerHTML=d.hook;
  const lifeList=document.getElementById("lifeList");
  if(d.life&&d.life.length){lifeList.innerHTML=d.life.map((it,i)=>`<div class="life-item"><h4><span class="n">${String(i+1).padStart(2,"0")}</span> ${it.title}</h4><p>${it.text}</p></div>`).join("");}
  else{lifeList.innerHTML=`<div class="placeholder-note">Lebenssituationen für „${key}" folgen – hier kommen 3–4 konkrete Alltags- und Arbeitsszenen hin, in denen sich dieser Held zeigt.</div>`;}
  const mods=(KOMPAKT[key]||[]);
  document.getElementById("moduleList").innerHTML=mods.map((m,i)=>{
    return '<div class="mod-card">'+
      '<div class="m-num">Kraft '+(i+1)+'</div>'+
      '<div class="m-title">'+m.title+'</div>'+
      '<div class="m-sub">'+m.subtitle+'</div>'+
      '<p class="m-beschr">'+m.beschr+'</p>'+
      '<div class="m-states">'+
        '<div class="m-state gesund"><div class="s-lab">Deine Stärke</div><p>'+m.gesund+'</p></div>'+
        '<div class="m-state stress"><div class="s-lab">Unter Druck</div><p>'+m.stress+'</p></div>'+
        '<div class="m-state emo"><div class="s-lab">Dein Trigger</div><p>'+m.emo+'</p></div>'+
      '</div>'+
      '<div class="m-goal"><div class="g-lab">Dein Coachingziel</div><p>'+m.ziel+'</p></div>'+
      '<div class="m-ex"><div class="x-title">Übung</div><div class="x-name">'+m.exName+'</div><p>'+m.exText+'</p></div>'+
    '</div>';
  }).join("");
  document.getElementById("ctaQuests").href=QUEST_LINKS[d.questCategory]||"#";
  document.getElementById("bridge").href=d.bridge||"#";
}
function postHeight(){const h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);parent.postMessage({type:"6heroes:setHeight",height:h},"*");}
window.addEventListener("load",()=>{render();postHeight();});
window.addEventListener("resize",postHeight);
if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
