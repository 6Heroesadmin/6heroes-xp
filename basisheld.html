<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Held – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--ok:#1F9D62;--warn:#B4471B;--gold:#F2B705;--accent:#0B63CE;--accent2:#F0672A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 72px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.topbar svg{width:20px;height:20px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 6px}
.emb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'DM Serif Display',Georgia,serif;font-size:38px}
.emb2{display:flex}
.emb2 .emb{width:68px;height:68px;border-radius:34px;font-size:30px;border:3px solid var(--bg)}
.emb2 .emb+.emb{margin-left:-14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.15}
h1 .accent{color:var(--accent)}
.hook{font-size:16px;line-height:1.6;color:var(--mute);max-width:54ch}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
details[open]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s1{display:flex;flex-direction:column;gap:1px}
summary .a{font-size:15.5px;font-weight:600;line-height:1.35}
summary .b{font-size:12.5px;color:var(--mute)}
summary:after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details[open] summary:after{transform:rotate(45deg)}
.body{padding:2px 18px 20px;display:flex;flex-direction:column;gap:18px}
.blk{display:flex;flex-direction:column;gap:6px}
.bl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bl.ok{color:var(--ok)}.bl.warn{color:var(--warn)}
p{font-size:15.5px;line-height:1.7}
ul{padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:15.5px;line-height:1.6}
.card{display:flex;flex-direction:column;gap:18px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding-top:30px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.pill:hover{border-color:var(--ink)}
@media (max-width:480px){.wrap{padding:8px 16px 56px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const PLATT={"commander":{"hook":"Du redest nicht lange – du machst. Während andere noch diskutieren, hast du längst entschieden und bist unterwegs. Das ist keine Ungeduld. Das ist Klarheit.","staerken":[["Du gibst Richtung.","In Momenten, in denen andere zögern, übernimmst du Verantwortung. Nicht weil du musst – sondern weil du weißt, dass jemand es tun muss. Das gibt anderen Orientierung und Sicherheit."],["Du lieferst.","Nicht irgendwann, nicht ungefähr – sondern konkret, messbar, fertig. Für dich sind Ergebnisse kein Versprechen, sondern eine Selbstverständlichkeit."],["Du siehst den Hebel.","Komplexe Situationen, viele Meinungen, Unklarheit – du findest instinktiv den Punkt, der wirklich etwas bewegt, und gehst genau dorthin."]],"profil":[["Deine Identität","Was dich antreibt",[[null,"Du definierst dich über Wirkung. Nicht über Planung, nicht über Absichten – über das, was am Ende wirklich passiert ist. Dein innerer Motor ist Handeln: Du fühlst dich am stärksten, wenn du entscheidest, gestaltest und das Ruder in der Hand hast.",""],[null,"Das ist eine seltene Qualität. Du bist der Mensch, den andere in schwierigen Momenten anrufen. Du bringst Energie in den Raum, wenn alle anderen noch in Erklärungen versinken.",""],["Wenn du in deiner Kraft bist","Du führst mit einer Klarheit, die andere aufatmen lässt. Du erzeugst ein Momentum, das mitreißt. Du schützt dein Team nach außen – durch Entschlossenheit, nicht durch Worte.","ok"],["Wenn es herausfordernd wird","In Momenten, wo du keine Kontrolle hast, entsteht Unruhe. Und manchmal reagierst du darauf mit mehr Druck, mehr Tempo, mehr Direktheit – auch dann, wenn Innehalten eigentlich mehr bewirken würde.","warn"],["Dein Wachstumsfeld","Delegation nicht als Kontrollverlust erleben, sondern als eine Form von Führung, die deine Wirkung vervielfacht.",""]]],["Dein Denken und deine Präsenz","Wie du wirkst",[[null,"Du denkst in Klarheit, nicht in Komplexität. Informationen filtert du sofort: Was ist relevant? Was bringt uns weiter? Was lenkt ab?",""],[null,"Diese Fähigkeit macht dich in Gesprächen, Meetings und Entscheidungssituationen außergewöhnlich wirksam. Du kommunizierst ohne Umwege. Deine Stimme hat Gewicht. Dein Auftreten gibt anderen das Gefühl: Jemand hat hier den Überblick.",""],["Wenn du in deiner Kraft bist","Du räumst Hindernisse aus dem Weg, bevor andere sie überhaupt bemerkt haben. Du gibst dem System Sicherheit – durch Fokus, nicht durch Lautstärke.","ok"],["Wenn es herausfordernd wird","Manchmal ist deine Direktheit so stark, dass andere sich nicht mehr trauen, eine andere Sicht einzubringen. Du bekommst dann weniger Feedback – und damit auch weniger von den Informationen, die du eigentlich bräuchtest.","warn"],["Dein Wachstumsfeld","Deine Direktheit durch echtes Zuhören ergänzen – nicht als Kompromiss, sondern weil es deine Entscheidungen besser macht.",""]]],["Deine Resilienz und dein Schatten","Belastbarkeit und Stress",[[null,"Du bist außergewöhnlich belastbar. In Momenten, wo andere wackeln, wirst du ruhiger. Du funktionierst unter Druck – oft sogar besser als in ruhigen Phasen.",""],[null,"Dein emotionaler Trigger sind Situationen, in denen du dich nicht wirksam fühlst: Fehler im System, zögerliche Entscheidungen, mangelnde Verbindlichkeit. In solchen Momenten kann aus deiner Stärke eine Reaktion werden, die mehr Distanz erzeugt als Lösung.",""],[null,"Der tiefere Mechanismus ist einfach: Wenn du keine Kontrolle hast, entsteht Unruhe. Und die vertraute Antwort darauf ist: mehr Druck. Was oft kurzfristig funktioniert – aber langfristig Vertrauen kostet.",""],["Dein Wachstumsfeld","Situationen, die sich deiner Kontrolle entziehen, als Teil des Prozesses annehmen – nicht als persönliches Scheitern.",""]]],["Deine Wirkung im Team","Wie du führst",[[null,"Du führst durch Klarheit und Verbindlichkeit. Dein Stil gibt Orientierung – besonders in Phasen, wo andere nicht wissen, wo es langgeht. Menschen wissen bei dir: Die Richtung ist klar. Die Verantwortung ist klar. Es wird geliefert.",""],["Wenn es herausfordernd wird","Wenn Entscheidungen nur von dir kommen, entsteht manchmal eine stille Abhängigkeit. Menschen liefern – aber nicht aus eigener Überzeugung, sondern weil du es so gesagt hast. Echter Führungserfolg zeigt sich darin, dass dein Team auch ohne dich stark ist.","warn"],["Dein Wachstumsfeld","Verbindlichkeit nicht nur durch klare Ansagen, sondern durch echte Einbindung erzeugen.",""]]]]},"explorer":{"hook":"Du brichst auf, wenn andere noch überlegen. Dein inneres Navigationssystem heißt Neugier – und es führt dich dorthin, wo andere gar nicht erst hinschauen. Freiheit ist für dich kein Bonus. Sie ist die Grundbedingung, unter der du dein Bestes gibst.","staerken":[["Du findest den Weg.","Komplexe, offene Situationen lähmen dich nicht – sie aktivieren dich. Du passt dich in Echtzeit an, weil du weißt: Der erste Schritt schafft mehr Klarheit als jede Analyse im Voraus. Du siehst Möglichkeiten, bevor sie für andere sichtbar werden."],["Du improvisierst brillant.","Dort, wo andere Sackgassen sehen, siehst du Umwege. Deine Stärke liegt nicht im perfekten Plan – sondern in der Fähigkeit, im Tun Lösungen zu finden, die kein Vordenken hätte antizipieren können."],["Du öffnest den Raum.","Dein Führungsstil basiert auf Vertrauen, nicht auf Kontrolle. In deiner Nähe entfalten sich Menschen – weil du ihnen den Spielraum lässt, den du selbst brauchst."]],"profil":[["Deine Identität","Was dich antreibt",[[null,"Du definierst dich über Bewegung. Nicht über Pläne, nicht über Systeme – über das lebendige Erleben von Möglichkeiten. Dein innerer Motor ist Neugier: Du fühlst dich am stärksten, wenn du etwas entdeckst, das noch niemand so gesehen hat, und dich frei genug fühlst, dem zu folgen.",""],[null,"Das ist eine seltene Qualität. Du bist der Mensch, der eine feststeckende Situation mit einem einzigen impulsiven Schritt wieder in Fluss bringt. Du bringst Leichtigkeit in Räume, die sich längst festgefahren haben.",""],["Wenn du in deiner Kraft bist","Du führst durch Möglichkeiten, nicht durch Vorgaben. Du schaffst eine Energie der Offenheit, in der andere aufatmen und sich trauen, auszuprobieren.","ok"],["Wenn es herausfordernd wird","In Momenten, wo Erwartungsdruck entsteht oder Verbindlichkeiten schwer werden, aktiviert sich ein Muster in dir: der Impuls zur Flucht. Du wirst unscharf in der Kommunikation oder lässt Dinge fallen, die dir eigentlich wichtig sind.","warn"],["Dein Wachstumsfeld","Freiheit nicht als Abwesenheit von Verpflichtung erleben, sondern als die Fähigkeit, innerhalb eines gewählten Rahmens autonom zu handeln.",""]]],["Dein Denken und deine Präsenz","Wie du wirkst",[[null,"Du denkst in Bewegung, nicht in Modellen. Ideen entstehen bei dir nicht am Schreibtisch – sondern im Tun, im Gespräch, im Experiment. Deine kognitive Stärke liegt in blitzschneller Intuition und der Fähigkeit, Chancen zu erfassen, bevor andere sie überhaupt formulieren können.",""],[null,"Du kommunizierst bildhaft, einladend, spielerisch. Deine Sprache öffnet – sie erklärt nicht, sie lädt ein. Das macht dich in Ideengesprächen, in Krisen und in Teams mit festgefahrenen Mustern außergewöhnlich wirksam.",""],["Wenn du in deiner Kraft bist","Du findest spielerisch Lösungen für Probleme, die andere als Sackgassen erleben. Du bist der Mensch, der eine neue Perspektive einbringt, wenn alle anderen bereits aufgehört haben zu suchen.","ok"],["Wenn es herausfordernd wird","Das Denken wird oberflächlich. Du springst von Thema zu Thema, verlierst den roten Faden – und manchmal auch andere unterwegs, die nicht wissen, wohin das gerade führt.","warn"],["Dein Wachstumsfeld","Deine intuitive Kraft auf ein Ziel lenken – statt sie in zu vielen parallelen Entdeckungen zu zerstreuen.",""]]],["Deine Resilienz und dein Schatten","Belastbarkeit und Stress",[[null,"Du bist außergewöhnlich anpassungsfähig. In offenen, unklaren Situationen wirst du produktiv, wo andere erstarren. Du hältst Ambiguität aus – meistens sogar mit Leichtigkeit.",""],[null,"Dein emotionaler Trigger sind Situationen, in denen du dich festgestellt oder kontrolliert fühlst: Mikromanagement, starre Regeln, zu enge Erwartungen. In solchen Momenten kann aus deiner Leichtigkeit eine Reaktion werden, die mehr Distanz erzeugt als Lösung – ein inneres oder äußeres Verschwinden.",""],[null,"Der tiefere Mechanismus: Wenn Freiheit bedroht ist, entsteht ein Fluchtimpuls. Die vertraute Antwort ist Rückzug, Vagheit oder Abbruch. Was kurzfristig Erleichterung bringt – aber langfristig Vertrauen kostet.",""],["Dein Wachstumsfeld","Druck als Signal wahrnehmen – nicht als Zwang. Standhaftigkeit als aktive Wahl erleben, nicht als Verlust von Freiheit.",""]]],["Deine Wirkung im Team","Wie du führst",[[null,"Du führst durch Möglichkeiten und Vertrauen. Dein Stil gibt Menschen Raum – besonders dort, wo andere zu eng führen. Bei dir fühlen sich Menschen gesehen, nicht kontrolliert. Du schaffst eine Atmosphäre, in der Experimente erlaubt sind und Fehler zum Lernen gehören.",""],["Wenn es herausfordernd wird","Wenn Verbindlichkeiten zu lose formuliert sind, entsteht manchmal eine stille Unklarheit. Menschen arbeiten – aber niemand weiß genau, wer wofür verantwortlich ist. Echter Führungserfolg zeigt sich darin, dass dein Team weiß, wohin es geht – auch wenn du gerade woanders bist.","warn"],["Dein Wachstumsfeld","Vertrauen und Klarheit nicht als Gegensatz erleben. Den Rahmen definieren – und darin wirklich loslassen.",""]]]]},"guardian":{"hook":"Du weißt, dass Menschen Halt brauchen – und du gibst ihn. Nicht laut, nicht durch Ansagen, sondern durch deine Verlässlichkeit, deine Präsenz und die Art, wie du für andere da bist. Das ist keine Schwäche. Das ist eine seltene Stärke.","staerken":[["Du hältst zusammen.","Während andere auf Ziele schauen, schaust du auf Menschen. Du spürst, wer gerade Unterstützung braucht – und du handelst. Diese Fähigkeit, echte Verbindung herzustellen, ist der Grundstein für Teams, denen andere vertrauen."],["Du schaffst Sicherheit.","Deine Verlässlichkeit ist keine Selbstverständlichkeit – sie ist ein Geschenk. Menschen wissen bei dir: Was du zusagst, hältst du. Das gibt anderen Orientierung, gerade wenn alles im Fluss ist."],["Du erkennst, was wirklich gebraucht wird.","Du liest Räume, Stimmungen und Bedürfnisse, bevor sie ausgesprochen werden. Diese soziale Intelligenz macht dich in Momenten der Unsicherheit zum natürlichen Anker."]],"profil":[["Deine Identität","Was dich antreibt",[[null,"Du definierst dich über Verbindung. Nicht über Ergebnisse, nicht über Systeme – über das lebendige Miteinander zwischen Menschen. Dein innerer Motor ist Fürsorge: Du fühlst dich am stärksten, wenn es den Menschen um dich herum gut geht und wenn du weißt, dass deine Anwesenheit dazu beigetragen hat.",""],[null,"Das ist eine seltene Qualität. Du bist der Mensch, den andere anrufen, wenn sie sich nicht sicher sind – nicht weil du Antworten hast, sondern weil du wirklich zuhörst. Du schaffst Räume, in denen sich Menschen gesehen fühlen.",""],["Wenn du in deiner Kraft bist","Du bildest das stabile Fundament, auf dem andere ihr Bestes geben können. Du erkennst Spannungen früh, bevor sie eskalieren. Du führst über Vertrauen, nicht über Druck.","ok"],["Wenn es herausfordernd wird","In Momenten, wo deine Fürsorge nicht erwidert wird oder du zwischen eigenen Bedürfnissen und denen anderer wählen musst, entsteht ein Muster: Du gibst weiter, auch wenn du selbst leer bist. Du vermeidest notwendige Konflikte, um Harmonie zu schützen – und trägst den Preis allein.","warn"],["Dein Wachstumsfeld","Selbstfürsorge nicht als Egoismus erleben, sondern als die Voraussetzung für eine gesunde Fürsorge für andere.",""]]],["Dein Denken und deine Präsenz","Wie du wirkst",[[null,"Du denkst in Beziehungen, nicht in Modellen. Du erfasst soziale Dynamiken intuitiv – wer gerade Abstand braucht, wer Nähe, wo eine Spannung unausgesprochen brodelt. Diese emotionale Intelligenz ist keine weiche Kompetenz, sie ist ein hochpräzises Wahrnehmungsinstrument.",""],[null,"Du kommunizierst einladend, wertschätzend und fragend. Deine Art zu führen schafft psychologische Sicherheit – Menschen trauen sich in deiner Nähe, ehrlich zu sein. Das ist in den meisten Umgebungen das, was am stärksten fehlt.",""],["Wenn du in deiner Kraft bist","Du wirkst als emotionaler Kompass. Du erkennst Spannungen, bevor sie ausbrechen, und deeskalierst durch deine bloße Anwesenheit.","ok"],["Wenn es herausfordernd wird","Deine Sensibilität kann zur Übernahme werden. Du nimmst die Emotionen anderer ungefiltert auf, fühlst dich für die Stimmung im Raum verantwortlich – und verlierst dabei deine sachliche Distanz.","warn"],["Dein Wachstumsfeld","Emotionaler Beobachter bleiben, statt zum emotionalen Schwamm zu werden.",""]]],["Deine Resilienz und dein Schatten","Belastbarkeit und Stress",[[null,"Du bist außergewöhnlich belastbar – solange du dich gebraucht und verbunden fühlst. Was dir Energie raubt, ist nicht Arbeit, sondern Kälte: Ignoranz, harte Konfrontation, das Gefühl, dass deine Fürsorge nicht gesehen wird.",""],[null,"Dein emotionaler Trigger sind Situationen, in denen du Ablehnung riskierst oder jemanden enttäuschen musst. In solchen Momenten vermeidest du den Konflikt – nicht aus Feigheit, sondern aus tiefer Überzeugung, dass Reibung die Verbindung zerstört. Der Preis: Spannungen werden verschleppt, nicht gelöst.",""],[null,"Der tiefere Mechanismus ist einfach: Harmonie fühlt sich wie Sicherheit an. Und die vertraute Antwort auf Bedrohung ist: anpassen, nachgeben, versöhnen. Was kurzfristig den Frieden sichert – aber langfristig zur eigenen Erschöpfung führt.",""],["Dein Wachstumsfeld","Konflikte nicht als Beziehungsbedrohung erleben, sondern als den mutigsten Ausdruck von Fürsorge.",""]]],["Deine Wirkung im Team","Wie du führst",[[null,"Du führst über Vertrauen und Verbindung. Dein Stil gibt Menschen das Gefühl, gesehen zu werden – und das ist das Fundament jeder echten Leistungskultur. In Krisenzeiten bist du derjenige, dem andere ihre Unsicherheit zeigen, weil sie wissen, dass du nicht urteilst.",""],["Wenn es herausfordernd wird","Wenn du Konflikte zu lang vermeidest oder Minderleistung aus falsch verstandener Loyalität schützt, erodiert das Vertrauen derjenigen, die liefern. Echter Führungserfolg zeigt sich nicht darin, dass alle zufrieden sind – sondern darin, dass alle wachsen können.","warn"],["Dein Wachstumsfeld","Menschliche Nähe und sachliche Führung als zwei Seiten derselben Münze erleben.",""]]]]},"innovator":{"hook":"Du siehst Möglichkeiten, wo andere Grenzen sehen. Während andere noch überlegen, ob etwas möglich ist, hast du bereits das nächste Bild im Kopf. Das ist keine Ungeduld. Das ist Vorstellungskraft – und sie ist deine größte Stärke.","staerken":[["Du öffnest neue Räume.","Du stellst Fragen, die andere sich nicht trauen. Du fragst nicht „Warum?“ – du fragst „Warum eigentlich nicht?“ Diese Fähigkeit, das Bekannte radikal infrage zu stellen, macht dich zum Treiber von Veränderungen, die wirklich etwas bewegen."],["Du begeisterst.","Deine Energie ist ansteckend. Wenn du eine Idee siehst, zieht das andere mit – nicht weil du überzeugst, sondern weil du ein Bild zeichnest, dem man folgen will. Du machst Zukunft sichtbar, bevor sie existiert."],["Du findest den unkonventionellen Weg.","Dort, wo andere in Systemen denken, denkst du in Möglichkeiten. Engpässe, Routinen, starre Strukturen – du umgehst sie nicht, du gestaltest sie neu."]],"profil":[["Deine Identität","Was dich antreibt",[[null,"Du definierst dich über Möglichkeiten. Nicht über das, was ist – sondern über das, was sein könnte. Dein innerer Motor ist Neugier gepaart mit dem tiefen Glauben, dass die Welt formbar ist: Du fühlst dich am stärksten, wenn du etwas in Frage stellst, das alle für selbstverständlich halten, und einen neuen Weg siehst.",""],[null,"Das ist eine seltene Qualität. Du bist der Mensch, den andere rufen, wenn das Alte nicht mehr funktioniert. Du bringst Energie und Richtung in Räume, die sich festgefahren haben.",""],["Wenn du in deiner Kraft bist","Du öffnest Türen, die andere nicht einmal sehen. Du motivierst durch Bilder und Visionen, nicht durch Kontrolle. Du schaffst eine Kultur, in der Fehler zum Lernen gehören – und in der Menschen wagen, was sie allein nicht wagen würden.","ok"],["Wenn es herausfordernd wird","In Momenten, wo Routine oder Verbindlichkeit gefragt sind, entsteht ein Sog in dir: der Drang, weiterzuziehen, bevor etwas fertig ist. Neue Ideen überlagern das Bestehende, Prioritäten verschwimmen – und andere verlieren den Faden, weil die Richtung sich ständig verändert.","warn"],["Dein Wachstumsfeld","Kreative Freiheit und strukturierte Umsetzung nicht als Gegensätze erleben, sondern als zwei Phasen desselben Prozesses.",""]]],["Dein Denken und deine Präsenz","Wie du wirkst",[[null,"Du denkst assoziativ, netzartig, in Höchstgeschwindigkeit. Du verbindest Konzepte, die für andere nichts miteinander zu tun haben – und siehst in dieser Verbindung das, was als nächstes kommen wird. Das macht dich zu einem außergewöhnlichen Gesprächspartner in Momenten, wo neue Antworten gefragt sind.",""],[null,"Du kommunizierst bildhaft und visionär. Du bist der Storyteller, der komplexe Ideen so übersetzt, dass andere sie nicht nur verstehen, sondern fühlen. Dein Auftreten hat Energie – es lädt ein, mitzudenken.",""],["Wenn du in deiner Kraft bist","Du agierst als intellektuelles Raketentriebwerk. Du findest unkonventionelle Lösungen für Probleme, an denen andere scheitern – und du begeisterst dabei durch Charisma statt Druck.","ok"],["Wenn es herausfordernd wird","Die kognitive Geschwindigkeit wird zur Komplexitätsfalle. Du verzettelt dich in Möglichkeiten, verlierst die Prioritäten aus dem Blick – und überfordert andere durch sprunghafte Gedankengänge, die für sie nicht anschlussfähig sind.","warn"],["Dein Wachstumsfeld","Deine assoziative Kraft filtern und destillieren – nicht um weniger zu denken, sondern um mehr zu bewegen.",""]]],["Deine Resilienz und dein Schatten","Belastbarkeit und Stress",[[null,"Du bist außergewöhnlich resilient in Situationen des Aufbruchs. Du brauchst keine Sicherheit, um loszugehen – du brauchst Weite. Wo andere auf Garantien warten, bist du schon in Bewegung.",""],[null,"Dein emotionaler Trigger sind Enge, Mikromanagement und Routine. In solchen Momenten entsteht ein Sog: der Impuls, das Projekt abzubrechen, die Richtung zu wechseln oder sich mental zu entfernen – auch wenn das nach außen als Unzuverlässigkeit wirkt.",""],[null,"Der tiefere Mechanismus: Wenn Freiheit eingeschränkt wird, entsteht das Gefühl des Eingesperrtseins. Und die vertraute Antwort darauf ist: Flucht nach vorne, in die nächste Idee. Was kurzfristig Erleichterung bringt – aber langfristig Vertrauen kostet.",""],["Dein Wachstumsfeld","Routinen und Verbindlichkeiten nicht als Feind der Kreativität erleben, sondern als das Fundament, auf dem echte Wirkung entsteht.",""]]],["Deine Wirkung im Team","Wie du führst",[[null,"Du führst durch Visionen und Möglichkeiten. Dein Stil schafft eine Kultur, in der Fehler als Lernchancen gelten und Menschen sich trauen, mehr zu wagen. In Phasen des Wandels bist du unersetzlich – du gibst dem Neuen eine Sprache.",""],["Wenn es herausfordernd wird","Wenn die Richtung sich zu oft ändert oder Entscheidungen im Vagen bleiben, verlieren Menschen den Faden. Echter Führungserfolg zeigt sich nicht nur in der Qualität der Ideen – sondern darin, dass das Team weiß, wohin es morgen geht.","warn"],["Dein Wachstumsfeld","Vom Möglichkeitsraum in den Umsetzungsraum übersetzen – nicht einmal, sondern konsequent.",""]]]]},"sage":{"hook":"Du denkst tiefer als andere. Während die meisten weitermachen, hältst du inne und fragst: Was steckt wirklich dahinter? Diese Fähigkeit ist nicht Zögerlichkeit. Sie ist Klarheit – und sie macht dich zu einem der wertvollsten Gesprächspartner, die es gibt.","staerken":[["Du siehst, was andere übersehen.","Du erkennst Muster, bevor sie für andere sichtbar werden. Komplexe Zusammenhänge, versteckte Abhängigkeiten, die Frage hinter der Frage – du findest den Kern dort, wo andere noch an der Oberfläche kratzen."],["Du schaffst Orientierung.","In Momenten der Unklarheit bist du derjenige, dem andere vertrauen. Nicht weil du laut bist, sondern weil deine Einschätzung Gewicht hat. Du gibst dem System Sinn – und das ist es, was Menschen wirklich brauchen."],["Du hast Integrität.","Du sagst, was du denkst – und du meinst, was du sagst. Diese Kohärenz zwischen Denken, Sprechen und Handeln ist selten. Sie macht dich zu jemandem, dem Menschen langfristig vertrauen."]],"profil":[["Deine Identität","Was dich antreibt",[[null,"Du definierst dich über Erkenntnis. Nicht über Geschwindigkeit, nicht über Lautstärke – über das Durchdringen von Zusammenhängen und das Finden von Wahrheit. Dein innerer Motor ist Klarheit: Du fühlst dich am stärksten, wenn alles logisch zusammenpasst und du weißt, warum etwas so ist, wie es ist.",""],[null,"Das ist eine seltene Qualität. Du bist der Mensch, den andere rufen, wenn sie wirklich verstehen wollen – nicht nur eine Antwort, sondern die richtige. Du gibst Orientierung in einer Zeit, in der viele einfach weitermachen, ohne zu fragen.",""],["Wenn du in deiner Kraft bist","Du erkennst komplexe Muster, bevor sie für andere sichtbar werden. Du schaffst intellektuelle Durchbrüche und gibst dem System einen Rahmen, in dem Entscheidungen wirklich Sinn machen.","ok"],["Wenn es herausfordernd wird","In Momenten von Zeitdruck oder Unklarheit entsteht ein Muster: Du kannst nicht aufhören zu denken. Der Wunsch nach vollständiger Wahrheit hält dich in der Analyse – und im Außen wirkt das wie Zögerlichkeit, obwohl es in dir intensive Arbeit ist.","warn"],["Dein Wachstumsfeld","Den Übergang vom Verstehen zum Handeln beschleunigen – nicht weil Genauigkeit unwichtig ist, sondern weil eine Entscheidung bei 70 % der Information oft mehr bewegt als das Warten auf die letzten 30 %.",""]]],["Dein Denken und deine Präsenz","Wie du wirkst",[[null,"Du denkst systematisch, tiefenorientiert, mit einer Geduld, die andere nicht aufbringen. Du trennst Wesentliches von Unwesentlichem mit einer Präzision, die in komplexen Situationen außergewöhnlich wirksam ist. Kognitive Ruhe ist deine Stärke – du wirst klarer, wenn andere unruhiger werden.",""],[null,"Du kommunizierst präzise und überlegt. Du sprichst erst, wenn du fertig gedacht hast – das gibt deinen Aussagen ein Gewicht, das andere selten erreichen. In Räumen, die in Aktionismus versinken, bist du der, der die entscheidende Frage stellt.",""],["Wenn du in deiner Kraft bist","Du bist der objektive Ratgeber, der durch Ruhe und Sachlichkeit Sicherheit vermittelt. In Krisen gibst du anderen das Gefühl: Jemand denkt hier wirklich nach.","ok"],["Wenn es herausfordernd wird","Die kognitive Tiefe wird zur Distanz. Du wirkst auf andere wie „der Professor“ – klug, aber schwer erreichbar. Die Komplexität deiner Gedanken überfordert, statt zu orientieren.","warn"],["Dein Wachstumsfeld","Deine Erkenntnisse so übersetzen, dass sie für andere sofort anschlussfähig sind – nicht weniger denken, sondern klarer kommunizieren.",""]]],["Deine Resilienz und dein Schatten","Belastbarkeit und Stress",[[null,"Du bist außergewöhnlich belastbar durch geistige Distanz. In Momenten, wo andere emotional reagieren, behältst du den Überblick. Deine Ruhe ist keine Gleichgültigkeit – sie ist das Ergebnis einer tiefen Überzeugung, dass Klarheit wichtiger ist als Reaktion.",""],[null,"Dein emotionaler Trigger ist Druck zur Unlogik: Entscheidungen, die aus dem Bauch kommen, Argumente, die nicht stimmen, Zeitdruck, der kein Nachdenken erlaubt. In solchen Momenten zieht dich dein Schatten in den Rückzug – kühl, distanziert, überkritisch. Was als Schutzmechanismus beginnt, wirkt nach außen als Arroganz.",""],[null,"Der tiefere Mechanismus: Wenn Kontrolle über das Denken verloren geht, entsteht inneres Chaos. Und die vertraute Antwort ist: Rückzug in den Kopf. Was kurzfristig Klarheit bringt – aber langfristig Verbindung kostet.",""],["Dein Wachstumsfeld","Den Moment erkennen, in dem Analyse in Grübeln umschlägt – und bewusst den Schritt in die Handlung wählen.",""]]],["Deine Wirkung im Team","Wie du führst",[[null,"Du führst über Kompetenz, Fachwissen und Sinn. Dein Stil gibt dem Team einen Rahmen, in dem Entscheidungen logisch und nachvollziehbar sind. In Projekten mit hoher Komplexität bist du derjenige, der verhindert, dass alles im blinden Aktionismus versandet.",""],["Wenn es herausfordernd wird","Wenn Prozesse zu lange geprüft werden oder Konflikte nur auf der Sachebene geführt werden, verlieren Menschen die Verbindung. Echter Führungserfolg zeigt sich nicht nur in der Qualität der Analyse – sondern darin, dass das Team auch emotional weiß, wohin es geht.","warn"],["Dein Wachstumsfeld","Geschwindigkeit und emotionale Intelligenz als Ergänzung zur Tiefe, nicht als deren Gegenteil.",""]]]]},"strategist":{"hook":"Du weißt, wie Dinge wirklich funktionieren. Während andere improvisieren, hast du bereits den nächsten Schritt durchdacht – und den übernächsten. Das ist keine Pedanterie. Das ist Kompetenz, auf die andere sich verlassen können.","staerken":[["Du schaffst Ordnung, wo andere nur Chaos sehen.","Du erkennst Strukturfehler sofort. Du weißt, welcher Schritt als nächstes kommen muss – und du sorgst dafür, dass er kommt. Diese Verlässlichkeit ist in einer Welt der halben Lösungen ein seltenes Gut."],["Du lieferst, was du versprichst.","Für dich sind Qualität und Verbindlichkeit keine Verhandlungssache. Was du zusagst, hältst du – sauber, durchdacht, vollständig. Das gibt anderen das Fundament, auf dem sie aufbauen können."],["Du siehst den kritischen Pfad.","In komplexen Projekten erkennst du intuitiv, wo der eigentliche Engpass liegt. Du verschwendest keine Energie – du setzt sie gezielt dort ein, wo sie am meisten bewegt."]],"profil":[["Deine Identität","Was dich antreibt",[[null,"Du definierst dich über Exzellenz. Nicht über Schnelligkeit, nicht über Popularität – über die Qualität dessen, was du tust. Dein innerer Motor ist Ordnung: Du fühlst dich am stärksten, wenn Strukturen funktionieren, Abläufe klar sind und das Ergebnis dem entspricht, was du dir vorgestellt hast.",""],[null,"Das ist eine seltene Qualität. Du bist der Mensch, auf den andere zählen, wenn es wirklich zuverlässig sein muss. Du schaffst Umgebungen, in denen Qualität der Standard ist – nicht die Ausnahme.",""],["Wenn du in deiner Kraft bist","Du schaffst hocheffiziente Systeme, in denen jeder weiß, was zu tun ist. Du findest sofort den nächsten logischen Schritt und gibst dem Team die Sicherheit, die es braucht, um sein Bestes zu geben.","ok"],["Wenn es herausfordernd wird","In Momenten von Chaos, Unvorbereitetheit oder impulsiven Richtungswechseln entsteht ein Muster: Das Bedürfnis nach Kontrolle steigt. Du gehst tiefer in die Details, erhöhst die Anforderungen – und was als Qualitätssicherung beginnt, wirkt auf andere wie Mikromanagement.","warn"],["Dein Wachstumsfeld","Fehler nicht als Bedrohung deines Wertes erleben, sondern als Information im Prozess. Und lernen, dass „gut genug“ manchmal die klügste Entscheidung ist.",""]]],["Dein Denken und deine Präsenz","Wie du wirkst",[[null,"Du denkst systematisch, logisch, in klaren Abfolgen. Du erkennst Strukturfehler, bevor andere sie bemerken – und du weißt instinktiv, welcher Hebel das System stabilisiert. Diese analytische Kraft macht dich zu einem außergewöhnlichen Partner in Situationen, die Verlässlichkeit und Durchdachtheit fordern.",""],[null,"Du kommunizierst präzise, sachlich, faktenbasiert. Deine Sprache folgt einem roten Faden. Das gibt anderen Orientierung – und in chaotischen Situationen das Gefühl: Jemand hier hat wirklich nachgedacht.",""],["Wenn du in deiner Kraft bist","Du findest sofort den nächsten logischen Schritt. Deine Qualitätskriterien schaffen Sicherheit für das gesamte System.","ok"],["Wenn es herausfordernd wird","Die kognitive Stärke wird zur Rigidität. Du verlierst das große Ganze aus dem Blick, weil du tief in Details gegangen bist. Für andere wirkst du dann unflexibel oder bremsend.","warn"],["Dein Wachstumsfeld","Deine methodische Stärke für andere öffnen – statt sie als Standard vorauszusetzen, den alle erfüllen müssen.",""]]],["Deine Resilienz und dein Schatten","Belastbarkeit und Stress",[[null,"Du bist außergewöhnlich belastbar, solange du Ordnung hast. Du kannst unter hohem Druck liefern – weil du weißt, wie. Klar definierte Aufgaben, verlässliche Prozesse, messbare Ziele: Das ist dein Betriebsmodus, in dem du aufblühst.",""],[null,"Dein emotionaler Trigger ist Kontrollverlust: Chaos, Fehler, unstrukturierte Meetings, impulsive Entscheidungen ohne Grundlage. In solchen Momenten steigt die innere Anspannung – und die vertraute Antwort ist: mehr Kontrolle, mehr Korrekturen, mehr Standards. Was kurzfristig Sicherheit bringt – aber langfristig das Team erschöpft und dich isoliert.",""],[null,"Der tiefere Mechanismus: Wenn Fehler passieren, entsteht das Gefühl persönlichen Versagens. Und die Reaktion darauf ist: noch genauer werden. Was die Fehlerrate senkt – aber die Fehlertoleranz auch.",""],["Dein Wachstumsfeld","Die Erfahrung machen, dass Sicherheit auch ohne totale Fehlerfreiheit existiert – und dass ein Team, dem du vertraust, oft besser liefert als eines, das du kontrollierst.",""]]],["Deine Wirkung im Team","Wie du führst",[[null,"Du führst über Systeme und Prozesse. Dein Stil gibt Teams das, was sie in chaotischen Umgebungen am meisten brauchen: Verlässlichkeit, klare Erwartungen, nachvollziehbare Abläufe. Bei dir weiß jeder, woran er ist.",""],["Wenn es herausfordernd wird","Wenn alles durch die Brille der Fehlerfreiheit bewertet wird, verlieren kreative und beziehungsorientierte Menschen ihre Energie. Echter Führungserfolg zeigt sich nicht nur in Qualität der Ergebnisse – sondern darin, dass das Team auch in unvollständigen Momenten sein Bestes gibt.","warn"],["Dein Wachstumsfeld","Zwischenmenschliche Wärme und Akzeptanz von Spontaneität als Ergänzung zur Methodik – nicht als deren Gegenteil.",""]]]]}};
const LIFE={"commander":[["Wenn niemand eine Entscheidung trifft","Eine Diskussion dreht sich im Kreis, alle Argumente liegen auf dem Tisch und trotzdem übernimmt niemand Verantwortung. Genau hier wirst du wach: Du bündelst das Wesentliche, setzt einen Punkt und bringst die Gruppe wieder in Bewegung. Deine Stärke ist Orientierung – dein Risiko beginnt dort, wo Geschwindigkeit wichtiger wird als das Einbeziehen der anderen."],["Wenn es plötzlich ernst wird","Ein Projekt gerät aus der Spur, auf einer Reise läuft etwas schief oder im Alltag muss schnell eine Lösung her. Während andere noch sortieren, gehst du ins Handeln. Du priorisierst, verteilst Aufgaben und sorgst dafür, dass wieder Kontrolle entsteht – Situationen mit echtem Handlungsdruck können deshalb eine deiner stärksten Seiten sichtbar machen."],["Wenn andere langsamer sind als du","Du siehst längst, was getan werden müsste, während jemand anderes noch abwägt, erklärt oder Details klärt. Dann steigt deine Ungeduld und du bist versucht, Gespräch und Aufgabe gleichzeitig an dich zu ziehen. Was sich für dich wie Effizienz anfühlt, kann beim Gegenüber jedoch als Übergehen erlebt werden – und genau hier liegt eines deiner wichtigsten Wachstumsfelder."],["Wenn nicht alles nach deinem Plan läuft","Auch privat übernimmst du schnell die Führung: Du organisierst, löst Probleme und sorgst dafür, dass Dinge funktionieren. Ändert jemand spontan den Plan oder entscheidet anders, kann es schwerfallen, nicht sofort korrigierend einzugreifen. Dein stärkster Commander zeigt sich dann, wenn du unterscheiden kannst: Wo braucht es wirklich Führung – und wo darf etwas einfach anders laufen, als du es selbst gemacht hättest?"]],"explorer":[["Wenn du Neuland betrittst","Eine unbekannte Stadt, ein neues Umfeld, eine neue Aufgabe oder eine Situation ohne fertige Anleitung aktiviert häufig deine beste Seite. Während andere zunächst Sicherheit suchen, beginnst du zu erkunden. Du lernst durch Erfahrung, passt dich schnell an und findest häufig Wege, die auf keinem ursprünglichen Plan standen."],["Wenn jeder Tag gleich aussieht","Was für andere angenehm vorhersehbar ist, kann bei dir zunehmend Energie ziehen. Wiederholung, starre Abläufe oder das Gefühl, nur noch dieselben Schritte abzuarbeiten, erzeugen innere Unruhe. Dann wird Veränderung schnell zum Selbstzweck. Dein Wachstumsfeld liegt darin, unterscheiden zu lernen: Brauche ich wirklich einen neuen Weg – oder brauche ich lediglich mehr Spielraum auf dem bestehenden?"],["Wenn andere Verbindlichkeit erwarten","In Beziehungen, Freundschaften oder Teams können feste Erwartungen plötzlich wie eine Einschränkung wirken. Je stärker du das Gefühl bekommst, etwas „zu müssen“, desto größer kann der Wunsch nach Abstand werden. Sagst du nicht, welchen Freiraum du brauchst, erleben andere deine Distanz möglicherweise als Unzuverlässigkeit. Reife Freiheit bedeutet deshalb auch, Bedürfnisse früh auszusprechen, statt erst zu verschwinden, wenn es zu eng wird."],["Wenn plötzlich alles anders kommt","Pläne funktionieren nicht, Bedingungen ändern sich oder eine Situation entwickelt sich völlig anders als erwartet. Hier besitzt du oft einen natürlichen Vorteil: Du hängst weniger am ursprünglichen Weg und findest schnell eine Alternative. Wo andere zunächst den verlorenen Plan betrauern, fragst du bereits: „Okay – was können wir jetzt daraus machen?“"]],"guardian":[["Wenn sich die Stimmung im Raum verändert","Du bemerkst oft früh, wenn zwischen Menschen etwas nicht stimmt – noch bevor jemand es offen anspricht. Ein anderer Tonfall, ein Rückzug oder eine kleine Spannung reichen aus, damit deine Aufmerksamkeit zur Beziehung wandert. Häufig versuchst du intuitiv, wieder Verbindung herzustellen und dafür zu sorgen, dass sich alle gesehen fühlen."],["Wenn jemand dich braucht","Wenn ein Mensch in deinem Umfeld Unterstützung braucht, bist du schnell da. Du hörst zu, übernimmst etwas oder stellst deine eigenen Pläne zurück, ohne lange darüber nachzudenken. Deine Stärke ist echte Fürsorge – herausfordernd wird es, wenn aus „Ich möchte helfen“ unbemerkt „Ich muss helfen“ wird und deine eigenen Bedürfnisse keinen Platz mehr bekommen."],["Wenn ein Konflikt entsteht","Spannungen zwischen Menschen lassen dich selten kalt. Du kannst unterschiedliche Seiten gut verstehen und schaffst es oft, Menschen wieder miteinander ins Gespräch zu bringen. Betrifft der Konflikt dich selbst, besteht jedoch die Gefahr, dass du deine eigene Position abschwächst oder zu lange schweigst, damit die Beziehung keinen Schaden nimmt."],["Wenn du eigentlich Nein sagen möchtest","Du merkst häufig sehr genau, dass dir etwas zu viel wird – sagst aber trotzdem Ja, weil du niemanden enttäuschen möchtest. Kurzfristig schützt du damit die Harmonie, langfristig kann daraus Erschöpfung oder stille Enttäuschung entstehen. Dein Wachstum beginnt dort, wo du erkennst: Eine klare Grenze beendet Verbindung nicht – sie macht ehrliche Verbindung erst möglich."]],"innovator":[["Wenn etwas ganz neu entsteht","Ein leeres Blatt, ein neues Produkt, ein Konzept oder ein ungelöstes Problem kann bei dir mehr Energie auslösen als ein fast fertiges Projekt. Wo noch nichts feststeht, beginnst du Möglichkeiten zu kombinieren, ungewöhnliche Verbindungen herzustellen und Alternativen zu sehen. Genau in dieser frühen Phase bist du häufig der Mensch, der aus „Wir wissen noch nicht wie“ ein begeisterndes „Was wäre, wenn …?“ macht."],["Wenn alle nur den bestehenden Weg sehen","Ein Team sagt: „Das haben wir immer so gemacht“, oder eine Situation scheint nur zwei offensichtliche Lösungen zu bieten. Für dich ist das eher Einladung als Grenze. Du stellst Annahmen infrage und suchst nach einer dritten, vierten oder völlig anderen Möglichkeit – eine Stärke, die Innovation erzeugen kann, aber andere überfordert, wenn jede gefundene Lösung sofort wieder durch eine neue ersetzt wird."],["Wenn die spannende Phase vorbei ist","Die Idee steht, jetzt folgen Abstimmung, Dokumentation, Wiederholung und konsequente Umsetzung. Genau hier kann deine Energie deutlich sinken. Plötzlich tauchen neue Projekte auf, die wieder aufregender wirken. Dein Wachstumsfeld zeigt sich darin, die vermeintlich langweilige zweite Hälfte nicht als Ende der Kreativität zu erleben, sondern als den Teil, durch den eine Idee überhaupt erst Wirkung bekommt."],["Wenn du zu viele Möglichkeiten gleichzeitig siehst","Ob neues Hobby, beruflicher Weg, Urlaub oder persönliches Projekt – du kannst in kurzer Zeit zahlreiche attraktive Varianten entwickeln. Das fühlt sich zunächst nach Freiheit an, kann Entscheidungen aber paradoxerweise schwerer machen. Dein stärkster Innovator zeigt sich nicht daran, wie viele Türen du erkennst, sondern daran, welche Tür du bewusst auswählst und lange genug offen hältst, um herauszufinden, was dahinter liegt."]],"sage":[["Wenn eine Entscheidung komplex wird","Eine größere Anschaffung, eine berufliche Weichenstellung oder eine strategische Frage hat viele Variablen. Wo andere aus dem Bauch entscheiden, beginnst du Zusammenhänge zu prüfen, Informationen zu vergleichen und Konsequenzen weiterzudenken. Diese Tiefe schützt vor vorschnellen Entscheidungen – solange du erkennst, wann zusätzliche Informationen die Richtung kaum noch verändern."],["Wenn eine Argumentation nicht stimmt","In einem Gespräch klingt etwas zunächst überzeugend, aber eine Annahme passt nicht zur Schlussfolgerung. Solche Brüche fallen dir schnell auf. Du stellst Fragen, differenzierst und bringst Sachlichkeit in die Diskussion. Herausfordernd wird es, wenn dein Wunsch nach Präzision beim Gegenüber als Korrektur oder Belehrung ankommt, obwohl du eigentlich nur verstehen möchtest."],["Wenn jemand vor allem emotional reagiert","Ein Mensch erzählt dir von einem Problem, und du erkennst schnell Ursachen, Widersprüche oder mögliche Lösungen. Dein natürlicher Impuls ist, das Problem gedanklich zu ordnen. Manchmal braucht dein Gegenüber in diesem Moment jedoch weniger Analyse als Resonanz. Dein Wachstum liegt darin, zuerst zu erkennen, was gerade gebraucht wird: eine Lösung – oder ein Mensch, der einfach versteht, wie es sich anfühlt."],["Wenn du entscheiden musst, bevor alles klar ist","Zeitdruck und unvollständige Informationen können besonders unangenehm sein, weil dein Qualitätsmaßstab im Denken nicht vollständig erfüllt werden kann. Dein Reflex kann sein, dich zurückzuziehen oder die Entscheidung aufzuschieben. Dein stärkster Sage zeigt sich dann, wenn du Unsicherheit ausdrücklich benennst, eine begründete Hypothese formulierst und trotzdem handelst: nicht weil du alles weißt, sondern weil du weißt, was für den nächsten Schritt ausreicht."]],"strategist":[["Wenn aus Chaos ein Plan werden muss","Ein Projekt hat viele Beteiligte, Termine und offene Abhängigkeiten. Während andere die Komplexität als Belastung erleben, beginnst du zu sortieren: Was gehört zusammen? Was muss zuerst passieren? Wo liegt ein Risiko? Situationen wie diese bringen deine Stärke besonders gut zur Geltung, weil du aus vielen Einzelteilen eine belastbare Struktur bauen kannst."],["Kurz bevor etwas fertig ist","Eine Präsentation, ein Angebot oder ein wichtiges Ergebnis ist eigentlich bereit – doch du entdeckst noch eine Formulierung, eine Zahl oder ein Detail, das besser sein könnte. Deine Qualitätsorientierung schützt vor Fehlern, kann aber dazu führen, dass du unverhältnismäßig viel Energie in die letzten Prozent investierst. Die entscheidende Frage lautet dann: Wird das Ergebnis wirklich besser – oder nur perfekter?"],["Wenn sich ein Plan kurzfristig ändert","Ein Termin fällt aus, jemand improvisiert oder eine sorgfältig vorbereitete Planung funktioniert plötzlich nicht mehr. Solche Situationen können deutlich mehr innere Anspannung auslösen, als andere von außen erkennen. Dein erster Impuls ist häufig, möglichst schnell wieder Ordnung herzustellen. Wachstum bedeutet hier, nicht auf Struktur zu verzichten, sondern auch vorübergehende Unordnung aushalten zu können."],["Wenn andere andere Standards haben","Im Team, in der Partnerschaft oder im gemeinsamen Haushalt fällt dir schnell auf, wenn jemand Dinge weniger sorgfältig oder systematisch erledigt als du. Was für den anderen „völlig ausreichend“ ist, kann sich für dich unfertig anfühlen. Deine Stärke wird dann zur Belastung, wenn dein persönlicher Qualitätsstandard zum Maßstab für alle wird. Entlastung entsteht, wenn ihr gemeinsam definiert, was tatsächlich notwendig ist – und was lediglich deine bevorzugte Art ist."]]};
const ZC={"explorer":{"kern":"Commander liefert Richtung, Entscheidung, Verantwortung. Explorer bringt Freiheit, Erfahrung, Spontaneität, Mut zum Ausprobieren, „raus aus dem Kopf – rein ins Tun“. Das Ergebnis ist oft: „Action-Leader“ – du willst voran, aber nicht nur über Pläne, sondern über Bewegung, Erleben, direkten Kontakt zur Realität.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Commander: „Los, wir müssen jetzt.“ Explorer: „Komm – wir machen's schnell, improvisieren, raus hier.“","Du beschleunigst über Bewegung: Schuhe „irgendwie“, Frühstück „to go“, losfahren. Du tolerierst mehr Unordnung, solange es klappt. Risiko: Partner/Kind fühlt sich überfahren („zu hektisch“) oder wichtige Dinge werden vergessen.",["„Hauptsache wir kommen raus – dann läuft's.“","„Nicht so viel reden, einfach machen.“","„Wir kriegen das unterwegs gelöst.“"]],["Paar-Konflikt","Commander: will klären, entscheiden, abschließen. Explorer: will raus aus dem Reden, rein ins Erleben („Lass erstmal runterkommen.“)","Du wirst ungeduldig bei langen Gesprächen und versuchst Konflikte über Aktivität zu entschärfen (Spaziergang, rausgehen, Themenwechsel). Das kann deeskalieren – Risiko: der Partner erlebt es als „Ausweichen“.",["„Wir drehen uns im Kreis – wir müssen raus aus der Situation.“","„Wenn die Stimmung besser ist, lösen wir das.“","„Ich will keinen Dauer-Konflikt zu Hause.“"]],["Urlaub planen / Familienlogistik","Commander: „Entscheiden, buchen, fertig.“ Explorer: „Lass Freiheit drin – nicht alles durchplanen – Abenteuer!“","Du entscheidest schneller als andere, weil Explorer dich mutiger macht. Du lässt Lücken im Plan, setzt auf spontane Entdeckungen. Risiko: andere Familienmitglieder brauchen mehr Sicherheit; dann wirkst du zu „laissez-faire“ oder „zu schnell“.",["„Zu viel Plan macht's kaputt.“","„Wir finden vor Ort was Besseres.“","„Ich will Möglichkeiten offen halten.“"]],["Besuch / Gastgeberrolle","Commander: reibungsloser Ablauf. Explorer: Lockerheit, Spaß, Bewegung, „komm wir machen einfach“.","Du schaffst Atmosphäre über Aktivität (Spiel, Walk, Grill, spontaner Tapetenwechsel). Risiko: du übersteuerst mit „Programm“, wenn du Stimmung kontrollieren willst.",["„Wenn wir in Bewegung kommen, wird's automatisch gut.“","„Ich will, dass es leicht ist.“","„Keine steife Nummer.“"]],["Gesundheit / Sport / Routinen","Commander: Ziele, Disziplin, Fortschritt. Explorer: Abwechslung, draußen, Challenge, spielerischer Wettkampf.","Du hältst eher durch, wenn es erlebnisorientiert ist (Outdoor, Sport mit Freunden, neue Strecken). Risiko: du überschätzt dich („noch schnell...“) oder trainierst zu hart, weil Explorer dich pusht.",["„Wenn's sich wie Abenteuer anfühlt, bleib ich dran.“","„Ich will mich spüren – nicht nur zählen.“","„Komm, geht noch!“"]]],"sig":["„Entscheiden – und dann sofort los.“|Du willst nicht lange diskutieren, sondern Bewegung.","„Regeln sind gut – Freiheit ist besser.“|Du hältst Rahmen, aber brauchst Spielraum.","„Stress raus über Aktion.“|Du regulierst Emotionen eher über Tun als über Reden.","„Mut zu Risiko (manchmal zu viel).“|Explorer macht dich schneller und wagemutiger.","„Ungeduld mit Stillstand.“|Lange Meetings/Endlosgespräche sind triggernd."],"warn":[["Wenn du ausweichst",["„Lass uns erstmal was anderes machen.“","„Jetzt ist nicht der Moment zu reden.“","„Wir regeln das später.“"]],["Wenn du überziehst",["„Komm, geht noch.“","„Ist doch nicht so schlimm.“","„Wir improvisieren einfach.“"]],["Wenn du andere überfährst",["„Los jetzt, wir verlieren Zeit.“","„Warum so kompliziert?“","„Einfach machen.“"]]],"beruf":[["Konflikt im Team",["Commander will klären/entscheiden.","Explorer will Spannung rausnehmen, Tempo reinbringen („Lasst uns resetten und weiter.“)","Risiko: Konflikt wird „wegbewegt“ statt geklärt; Betroffene fühlen sich nicht gesehen."],["„Wir hängen fest – wir brauchen Bewegung.“","„Das ist zu viel Drama.“","„Lass uns wieder produktiv werden.“"]],["Druck von oben",["Commander nimmt's an, Explorer sucht schnellen Deal/Shortcut („Ich rufe sofort XY an.“)","Risiko: zu schnelle Zusage ohne Absicherung; Team wird überrollt."],["„Gib mir 30 Minuten, ich mach das klar.“","„Wir finden einen Weg – notfalls kreativ.“","„Nicht diskutieren, handeln.“"]],["Deadline-Projekt",["Commander baut Plan.","Explorer will „Field moves“: schnelle Iteration, direkt zu Kunden/Stakeholdern, schnelle Prototypen.","Risiko: Scope springt; Fokus leidet."],["„Wir lösen das im Tun.“","„Lass uns schnell testen statt planen.“","„Ein schneller Loop bringt uns weiter.“"]],["Feedbackgespräch",["Commander ist direkt.","Explorer macht es locker, humorvoll, motivierend („Du packst das!“)","Risiko: Kritik wird zu weich/zu vage, oder zu „Kumpelhaft“ ohne Konsequenz."],["„Ich will, dass die Person motiviert bleibt.“","„Das kriegen wir easy hin.“","„Nicht zu schwer machen.“"]]]},"guardian":{"kern":"Commander treibt voran, entscheidet, fordert Ergebnisse. Guardian stabilisiert, sichert Qualität, achtet auf Menschen und Prozesse. Das Ergebnis ist oft: „Protective Commander“ – du bleibst streng in der Sache, aber verlässlich im Rahmen: klare Leistung bei hoher Fürsorge- und Qualitätskante.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Commander: „Los, wir müssen jetzt.“ Guardian: „Aber ordentlich, richtig, sicher – Schuhe, Brotbox, Wetter, Regeln.“","Du wirst sehr strukturierend, gibst klare Ansagen, korrigierst Details („Jacke zu, Zähne, Helm!“). Wenn Widerstand kommt, steigt die Schärfe.",["„Wenn ich jetzt nicht führe, wird's Chaos.“","„Ich muss dafür sorgen, dass alles klappt – sonst hat nachher jeder Stress.“","„Warum dauert das so lange, das ist doch einfach.“"]],["Paar-Konflikt","Commander: will klären, entscheiden, abschließen. Guardian: will Fairness, Anerkennung, Verlässlichkeit, „Regeln“ für die Zukunft.","Du argumentierst logisch, definierst „was jetzt gilt“, machst Vorschläge mit klarer Struktur. Kann aber kalt wirken, wenn der andere Emotionen will.",["„Wir brauchen eine Lösung, nicht noch eine Runde Gefühle.“","„Wenn wir das nicht sauber regeln, passiert es wieder.“","„Ich will fair sein – aber ich kann nicht alles tragen.“"]],["Urlaub planen / Familienlogistik","Commander: „Wir entscheiden heute, buchen, fertig.“ Guardian: „Was ist mit Sicherheit, Budget, Storno, kindertauglich, Risiken?“","Du wirst zum Projektmanager, willst Verbindlichkeit, machst Tabellen/Pläne. Bei Unklarheit: Ungeduld + Kontrollieren.",["„Wenn wir das nicht jetzt festzurren, endet es im Stress.“","„Ich will nicht wieder derjenige sein, der alles ausbadet.“","„Lieber einmal gründlich als später Chaos.“"]],["Besuch / Gastgeberrolle / Ordnung & Standards","Commander: will reibungslosen Ablauf. Guardian: will „es muss stimmig sein“, Rücksicht, perfekte Vorbereitung.","Du organisierst, korrigierst, machst „Quality Control“. Wenn andere entspannter sind, kannst du innerlich werten.",["„Ich will, dass es für alle gut ist.“","„Wenn ich das nicht mache, macht's keiner.“","„Das ist mir peinlich, wenn es nicht passt.“"]],["Gesundheit / Sport / Routinen","Commander: Ziele, Leistung, Disziplin. Guardian: Schutz, Nachhaltigkeit, „richtig machen“, keine Verletzung.","Du setzt dir strenge Routinen, hast hohe Standards. Gefahr: „All-or-nothing“ (wenn nicht perfekt, dann gar nicht) oder zu hart zu dir.",["„Wenn ich das mache, dann richtig.“","„Disziplin ist Nicht-Verhandelbar.“","„Ich darf nicht nachlassen.“"]]],"sig":["„Ich übernehme – und dann bestimme ich den Standard.“|Du gehst rein, ziehst Verantwortung an dich, definierst Regeln/Qualität.","„Schnell entscheiden – aber bitte ohne Risiko.“|Du willst Tempo, aber dein Guardian scannt Gefahren → inneres Hin-und-Her.","„Fairness-Radar + Konsequenz.“|Du reagierst stark auf Unzuverlässigkeit, Unfairness, „schlampig“.","„Ich bin am entspanntesten, wenn alles geregelt ist.“|Entspannung kommt nicht durch Loslassen, sondern durch Stabilität.","„Ich helfe – aber dann erwarte ich Mitziehen.“|Wenn andere nicht liefern, kommt Ärger/Strenge."],"warn":[["Wenn du strenger wirst",["„Das geht so nicht.“","„Ich kann mich auf niemanden verlassen.“","„Wenn ich es nicht mache, macht's keiner.“"]],["Wenn du in Überkontrolle rutschst",["„Ich muss das absichern.“","„Nur kurz noch prüfen...“","„Sonst gibt's später Probleme.“"]],["Wenn du emotional zumachst",["„Wir brauchen Lösungen, nicht Drama.“","„Das ist doch logisch.“","„Können wir bitte einfach entscheiden?“"]]],"beruf":[["Konflikt im Team",["Du gehst schnell in Klärung + Entscheidung („Wir regeln das jetzt.“)","Guardian schaltet „Fairness/Schutz“ dazu: wer hat Recht, wer verletzt Standards, wer wird unfair behandelt","Risiko: Du wirkst richterlich (Urteil) statt moderierend (Prozess)"],["„Das muss jetzt beendet werden, sonst frisst es das Team.“","„Ich lasse nicht zu, dass hier unfair gespielt wird.“","„Wir brauchen Regeln – keine Eitelkeiten.“"]],["Druck von oben",["Commander nimmt Druck auf die Schultern: „Okay, ich liefere.“","Guardian scannt Risiken: „Das ist unsauber/unklar/unfair – Team wird überfahren.“","Risiko: Du gehst in Überverantwortung (alles selbst ziehen) + wirst härter im Downstream"],["„Wenn ich das nicht halte, ist mein Standing weg.“","„Ich muss das Team schützen, aber es muss geliefert werden.“","„Das ist nicht sauber – aber diskutieren kostet Zeit.“"]],["Deadline-Projekt",["Commander: „Plan, Ownership, Meilensteine, Durchziehen.“","Guardian: „Qualität, Absicherung, Review, keine bösen Überraschungen.“","Risiko: Entweder Scope-Creep (alles muss perfekt) oder Mikromanagement („Ich prüfe nochmal“)"],["„Wir kriegen das hin – aber nicht chaotisch.“","„Wenn das schiefgeht, trifft es mein Team.“","„Lieber einmal richtig als später Schaden.“"]],["Feedbackgespräch",["Commander ist direkt, klar, schnell beim Punkt.","Guardian will fair sein, belegt mit Beispielen, will Standards schützen.","Risiko: Feedback wird zu hart (Moral/Standard-Ton) oder zu umfangreich (Beweisführung)"],["„Ich muss das klar sagen, sonst ändert sich nichts.“","„Das ist nicht okay – das schadet dem Team.“","„Ich will fair sein, also brauche ich alle Beispiele.“"]]]},"innovator":{"kern":"Commander liefert Führung, Entscheidung, Verantwortung und Tempo. Innovator bringt neue Wege, mutige Perspektivwechsel und kreative Optionen. Das Ergebnis ist oft: „Disruptive Leader“ – du führst hart, aber nicht linear; du öffnest neue Türen und setzt sie konsequent durch.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Commander: „Los, wir müssen jetzt.“ Innovator: „Wir machen das spielerisch / anders / schneller – ich hab eine Idee!“","Du versuchst Tempo über kreative Hacks zu erhöhen (Rennen-Spiel, Challenge, neue Routine). Kann super funktionieren – oder du wechselst zu oft die Methode und erzeugst Unruhe.",["„Das muss doch smarter gehen.“","„Wenn ich's als Spiel frame, ziehen alle mit.“","„Warum klappt die Routine nicht – ich finde eine bessere.“"]],["Paar-Konflikt","Commander: will klären, entscheiden, abschließen. Innovator: will Perspektivwechsel, neue Modelle, „Lass uns das ganz anders lösen.“","Du pitchst Lösungen wie ein Produkt: „Was wäre, wenn...?“ Das wirkt erfrischend – kann aber auch emotional ausweichend wirken („Du redest dich raus in Ideen“).",["„Wir müssen das nicht schwer machen – es gibt eine bessere Lösung.“","„Wenn wir das neu denken, ist es sofort entspannter.“","„Warum bleiben wir im alten Muster hängen?“"]],["Urlaub planen / Familienlogistik","Commander: „Wir entscheiden heute, buchen, fertig.“ Innovator: „Lass was Neues machen – hidden gems – ungewöhnliche Route!“","Du willst Erlebnis + Effizienz: außergewöhnlich, aber ohne Risiko. Gefahr: du planst zu viel „Optimierung“ und machst den Urlaub zum Projekt.",["„Wenn wir schon fahren, dann richtig besonders.“","„Es gibt bestimmt eine bessere Option als 08/15.“","„Ich will maximalen Outcome aus der Zeit.“"]],["Besuch / Gastgeberrolle","Commander: will reibungslosen Ablauf. Innovator: will Überraschung, Atmosphäre, etwas Neues („Theme“, neues Rezept, Spiel, Story).","Du willst beeindrucken + führen. Risiko: du überlädst den Abend (zu viele Programmpunkte) oder wechselst spontan den Plan → Unruhe.",["„Das muss memorable werden.“","„Ich hab eine coole Idee – das machen wir noch!“","„Wenn es Standard ist, ist es langweilig.“"]],["Gesundheit / Sport / Routinen","Commander: Ziele, Disziplin, Fortschritt. Innovator: Variation, neue Trainingsmethoden, Gadgets, Challenges.","Du bist motiviert durch Neues + Progress. Risiko: du springst zwischen Programmen („Shiny object“) oder setzt zu ambitionierte Challenges.",["„Wenn ich's neu mache, bleib ich dran.“","„Das muss effizienter gehen.“","„Ich brauch ein System, das Spaß macht.“"]]],"sig":["„Ich führe – und ich optimiere.“|Du willst nicht nur liefern, sondern besser/cleverer liefern.","„Tempo durch Ideen.“|Du beschleunigst über neue Ansätze, Tools, Abkürzungen.","„Ungeduld mit Wiederholung.“|Standardprozesse nerven schnell → Gefahr: zu früh umwerfen.","„Vision + Execution.“|Du kannst Menschen mitnehmen, weil du Richtung und spannende Möglichkeiten lieferst.","„Wenn's stockt, erfinde ich neu.“|Bei Reibung gehst du eher in Reframing als in Aushalten."],"warn":[["Wenn du zu schnell umwirfst",["„Das geht doch besser – wir machen's anders.“","„Ich hab eine neue Idee, die alles löst.“","„Warum machen wir das überhaupt so?“"]],["Wenn du dich verzettelst",["„Nur kurz noch diese Option prüfen...“","„Wenn wir das kombinieren, wird's perfekt.“","„Ich brauche noch ein Tool/Framework.“"]],["Wenn du Druck mit Kreativität kompensierst",["„Ich löse das mit einem cleveren Hack.“","„Wir pivoten einfach.“","„Details später – erstmal Richtung.“"]]],"beruf":[["Konflikt im Team",["Commander will klären/entscheiden.","Innovator will reframen („Vielleicht ist das gar kein Konflikt, sondern ein Prozessproblem.“)","Risiko: Du wirkst so, als würdest du Konflikt weg-innovieren, statt Emotionen anzuerkennen."],["„Das ist lösbar, wenn wir es anders aufsetzen.“","„Wir brauchen ein neues Working Model.“","„Lasst uns aus dem Drama raus in die Lösung.“"]],["Druck von oben",["Commander übernimmt und verspricht.","Innovator sucht cleveren Shortcut (Tool, Prozess, Deal, Narrativ).","Risiko: Du machst zu viele Moves gleichzeitig („Pivot-Overload“) oder versprichst „Magic“."],["„Wir drehen das – ich finde einen Hebel.“","„Wenn wir es anders positionieren, kriegen wir das hin.“","„Es gibt einen Shortcut.“"]],["Deadline-Projekt",["Commander baut Plan & Ownership.","Innovator will währenddessen noch verbessern („lass uns das Tool wechseln / Prozess neu“).","Risiko: kurz vor Deadline kommt der „letzte geniale Einfall“ → Chaos."],["„Wir könnten das automatisieren, dann sind wir schneller.“","„Wenn wir jetzt umstellen, sparen wir morgen Zeit.“","„Das wird viel besser, wenn wir...“"]],["Feedbackgespräch",["Commander ist direkt.","Innovator macht es „kreativ“ (Metaphern, Vision, neue Rollen).","Risiko: Feedback wird unkonkret („Big picture“) oder wirkt wie „Pitch“ statt Klartext."],["„Ich will ihn/sie inspirieren, nicht nur korrigieren.“","„Wenn die Person das anders framen würde, wäre alles besser.“","„Ich gebe eine Vision, dann kommt die Veränderung.“"]]]},"sage":{"kern":"Commander bringt Kraft, Klarheit, Verantwortung und „wir liefern“. Sage ergänzt Reflexion, Werteorientierung, Perspektivenwechsel und Sinn. Das Ergebnis ist oft: „Principled Leader“ – du führst nicht nur effektiv, sondern auch begründet, integer und mit Orientierung für andere.","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Commander: „Los, wir müssen jetzt.“ Sage: „Was ist wirklich wichtig? Welche Regel dient uns – und welche nicht?“","Du wirst sehr klar und „pädagogisch“: du erklärst Prinzipien („Wir respektieren Zeit“), ordnest ein, definierst Sinn/Regeln. Risiko: du hältst eine Mini-Rede, während die Uhr tickt – oder du wirst streng, weil „Prinzip“ verletzt wird.",["„Es geht nicht nur ums Loskommen – es geht um Haltung.“","„Wenn wir jetzt nachgeben, lernen wir das falsche Muster.“","„Ich will das richtig vermitteln.“"]],["Paar-Konflikt","Commander: will klären, entscheiden, abschließen. Sage: will verstehen: Werte, Bedürfnisse, Muster, „was bedeutet das über uns?“","Du gehst in tiefes Gespräch, analysierst Motive, bringst Moral/Prinzipien („Fairness, Respekt“). Risiko: es wirkt wie „Gericht“ oder wie eine Grundsatzdebatte statt konkreter Lösung.",["„Ich will das wirklich verstehen, nicht nur patchen.“","„Das ist ein Wertethema.“","„Wenn wir das nicht ehrlich anschauen, kommt es wieder.“"]],["Urlaub planen / Familienlogistik","Commander: „Entscheiden, buchen, fertig.“ Sage: „Was passt zu uns? Was ist das Ziel dieses Urlaubs – Erholung, Abenteuer, Verbindung?“","Du stellst die richtigen Fragen, definierst „Warum“ und Leitprinzipien, entscheidest dann klar. Risiko: du suchst nach der „stimmigen“ Entscheidung zu lange, weil es sich perfekt anfühlen soll.",["„Was ist der Sinn dahinter?“","„Ich will nichts buchen, das sich falsch anfühlt.“","„Wir sollten bewusst wählen, nicht zufällig.“"]],["Besuch / Gastgeberrolle","Commander: reibungsloser Ablauf. Sage: echte Gespräche, Sinn, Verbindung, „Qualität statt Lautstärke“.","Du steuerst den Abend in Richtung „gute Gespräche“, bringst Fragen, moderierst subtil. Risiko: du wirst zu „serious“ oder korrigierst Aussagen, wenn sie ungenau sind.",["„Ich will echte Verbindung, nicht Small Talk.“","„Das ist unpräzise – das stimmt so nicht.“","„Ein guter Abend hat Tiefe.“"]],["Gesundheit / Sport / Routinen","Commander: Ziele, Disziplin, Output. Sage: langfristige Wahrheit: Körper, Sinn, Identität („Warum mache ich das?“)","Du baust Routinen, die zu deinem Selbstbild passen („Ich bin jemand, der...“). Das kann extrem stabil machen. Risiko: du wirst hart, wenn du „gegen deine Identität“ handelst („Ich bin inkonsequent“).",["„Das ist Teil meiner Identität.“","„Ich will meinen Körper verstehen, nicht nur pushen.“","„Wenn ich das breche, verliere ich mich.“"]]],"sig":["„Ich führe über Wahrheit.“|Du willst Klarheit, Präzision, Substanz.","„Prinzip vor Komfort.“|Wenn Werte verletzt werden, wirst du konsequent.","„Tiefe statt Oberfläche.“|Du suchst Sinn und Ursachen, nicht nur Symptome.","„Hoher Anspruch an Sprache.“|Unklare Aussagen triggern (du willst sauber denken/sprechen).","„Entscheidungen sollen stimmig sein.“|Nicht nur wirksam – auch „richtig“ im Sinne deiner Werte."],"warn":[["Wenn du moralisch wirst",["„So macht man das nicht.“","„Das ist respektlos/unfair.“","„Das sagt viel über...“"]],["Wenn du dich in Tiefe verlierst",["„Ich muss das erst komplett verstehen.“","„Was steckt da wirklich dahinter?“","„Das ist komplexer als es wirkt.“"]],["Wenn du hart gegen dich wirst",["„Ich darf nicht inkonsequent sein.“","„Das ist schwach.“","„Ich verliere meinen Standard.“"]]],"beruf":[["Konflikt im Team",["Commander will klären/entscheiden.","Sage will Wahrheit/Prinzipien: Fairness, Integrität, „was ist richtig?“","Risiko: du wirst zum Richter, oder du führst eine Grundsatzdebatte statt schnelle Entspannung + Regel."],["„Das ist ein Wertebruch.“","„Wir müssen die Wahrheit aussprechen.“","„Ich will nicht, dass das hier normal wird.“"]],["Druck von oben",["Commander will liefern, Standing sichern.","Sage will Integrität: „Was ist wahr? Was ist sauber? Was ist verantwortbar?“","Risiko: du sagst zu schnell Ja (Commander) oder blockierst aus Prinzip (Sage)."],["„Ich will nichts versprechen, was nicht wahr ist.“","„Ich muss klar sagen, was realistisch ist.“","„Meine Integrität ist nicht verhandelbar.“"]],["Deadline-Projekt",["Commander pusht Execution.","Sage pusht Korrektheit, saubere Logik, „wir dürfen keinen Quatsch shippen“.","Risiko: Perfektionismus oder „late corrections“ kurz vor Schluss."],["„Wenn das fachlich nicht stimmt, ist es wertlos.“","„Wir dürfen uns hier nicht selbst belügen.“","„Lieber später als falsch.“"]],["Feedbackgespräch",["Commander ist direkt.","Sage liefert Sinn, Werte, Identität („So wirst du die Person, die...“)","Risiko: Feedback wird zu philosophisch oder zu moralisch."],["„Ich will, dass die Person es wirklich versteht.“","„Das ist eine Frage von Haltung.“","„Ich muss ehrlich sein.“"]]]},"strategist":{"kern":"Commander gibt Drive, Entscheidung, Umsetzung. Strategist bringt Systemdenken, Priorisierung, Szenarien, Timing, politische/organisatorische Klugheit. Das Ergebnis ist oft: „präziser Macher“ – du lieferst nicht nur schnell, sondern gezielt (mit Plan, Hebeln und Timing).","privat":[["Familienmorgen / Kinder fertig machen / Zeitdruck","Commander: „Los, wir müssen jetzt.“ Strategist: „Wenn wir die Reihenfolge ändern, klappt's stabil. Wo ist der Engpass?“","Du optimierst Ablauf/Sequenz (Bottleneck-Denken): erst Kleidung, dann Frühstück, dann Zähne – oder umgekehrt. Du delegierst, definierst Rollen („Du machst X, ich Y“). Risiko: du wirst sehr „prozessig“ und ungeduldig, wenn andere nicht dem Ablauf folgen.",["„Das ist ein Prozessproblem, kein Willensproblem.“","„Wir verlieren Zeit am falschen Punkt.“","„Wenn jeder seinen Part macht, läuft's.“"]],["Paar-Konflikt","Commander: will Entscheidung & Abschluss. Strategist: will Ursachen, Muster, Regeln, die dauerhaft funktionieren.","Du gehst in „Systemdesign“: Listen, Standards, Wochenplan, Zuständigkeiten. Kann sehr hilfreich sein – Risiko: der Partner fühlt sich „gemanagt“, nicht gesehen.",["„Wir brauchen ein System, nicht nur guten Willen.“","„Das Problem wiederholt sich, weil es keine klare Regel gibt.“","„Wenn wir das sauber definieren, ist Ruhe.“"]],["Urlaub planen / Familienlogistik","Commander: „Entscheiden, buchen, fertig.“ Strategist: „Welche Option minimiert Risiko und maximiert Nutzen? Szenarien!“","Du machst Risiko-/Nutzenvergleich: Budget, Anreise, Kinderfreundlichkeit, Storno, Zeitfenster. Sehr effizient – Risiko: Analyse wird zur Endlosschleife („Optimale Option“) und killt Vorfreude.",["„Es gibt eine beste Entscheidung – ich finde sie.“","„Wenn ich das durchdenke, vermeiden wir Ärger.“","„Wir brauchen Kriterien, dann ist es objektiv.“"]],["Besuch / Gastgeberrolle","Commander: reibungsloser Ablauf. Strategist: Timing, Dramaturgie, Planbarkeit („Ablaufplan“ im Kopf).","Du orchestrierst unauffällig: wer sitzt wo, wann Essen, wann Kids schlafen, wann Gespräch. Risiko: du bist mehr Regisseur als Gast und kannst schwer abschalten.",["„Wenn ich das Timing halte, wird es ein guter Abend.“","„Ich muss den Flow steuern.“","„Sonst kippt's in Chaos.“"]],["Gesundheit / Sport / Routinen","Commander: Ziele, Disziplin, Output. Strategist: Trainingsplan, Periodisierung, Messsystem, langfristige Nachhaltigkeit.","Du baust ein System (Plan, Tracking, Regeln). Risiko: du optimierst so lange (Plan/Apps), dass Umsetzung leidet – oder du wirst hart, wenn du vom Plan abweichst.",["„Ohne System ist es Zufall.“","„Wenn ich's messe, kontrolliere ich's.“","„Abweichungen kosten Momentum.“"]]],"sig":["„Ich entscheide – basierend auf Hebeln.“|Du suchst den 20%-Hebel, der 80% Wirkung bringt.","„Ich führe über Prioritäten.“|Nicht alles ist gleich wichtig – du machst Rangfolgen.","„Szenario-Denken unter Druck.“|Du spielst Varianten im Kopf durch (A/B/C).","„Ungeduld mit ineffizientem Verhalten.“|Wenn Menschen nicht nach Logik handeln, steigt Druck/Schärfe.","„Kontrolle durch Struktur.“|Entspannung kommt, wenn der Plan steht und Rollen klar sind."],"warn":[["Wenn du in Overthinking rutschst",["„Wir brauchen noch mehr Informationen.“","„Ich will die optimale Lösung.“","„Ich kann erst entscheiden, wenn...“"]],["Wenn du zu kalt/technisch wirst",["„Das ist nur ein Prozessproblem.“","„Gefühle helfen hier nicht.“","„Es ist doch logisch.“"]],["Wenn du hart wirst",["„Wer nicht mitzieht, behindert das Ganze.“","„Das ist ineffizient.“","„So kann man nicht arbeiten.“"]]],"beruf":[["Konflikt im Team",["Commander: schnell klären, Autorität rein, Entscheidung.","Strategist: Muster erkennen (Rollen, Incentives, Schnittstellen, Entscheidungswege).","Risiko: Du wirkst wie „Schachspieler“ (zu taktisch) oder du erklärst Konflikt zu sehr als Strukturproblem und übergehst Emotionen."],["„Das ist ein Systemfehler, kein People-Problem.“","„Wenn wir Rollen/Entscheidungspfad klären, ist Ruhe.“","„Ich muss das sauber orchestrieren.“"]],["Druck von oben",["Commander will liefern und schützt das Standing.","Strategist will Verhandlung über Trade-offs (Scope, Ressourcen, Timing) und Positionierung.","Risiko: Du gehst in „Silent burden“ (alles schlucken, intern umsortieren) oder in zu komplexe Argumentation nach oben."],["„Ich muss das richtig framen, sonst verlieren wir.“","„Ich brauche den Hebel, um Ja zu sagen ohne zu sterben.“","„Wenn ich das schlau spiele, gewinnen wir Zeit/Ressourcen.“"]],["Deadline-Projekt",["Commander: Plan, Accountability, Push.","Strategist: kritischer Pfad, Abhängigkeiten, Sequenz, Ressourcen.","Risiko: Plan wird zu komplex oder du änderst zu oft die Strategie, statt einfach zu exekutieren."],["„Der kritische Pfad entscheidet alles.“","„Wenn ich die Abhängigkeiten nicht kläre, knallt es.“","„Wir müssen das intelligent timen.“"]],["Feedbackgespräch",["Commander: direkt, klar, Erwartung.","Strategist: Positionierung, Karrierepfad, „so kommst du weiter“, strukturiertes Development.","Risiko: Feedback wird zu taktisch („so spielst du das“) oder zu „Performance-Design“ ohne menschliche Wärme."],["„Ich will der Person einen klaren Weg geben.“","„Wenn ich das strukturiere, wird es umgesetzt.“","„Wir brauchen ein Development-Playbook.“"]]]}};
const TIEFER_COMMANDER=[["Antrieb und Bedürfnisse","Was du brauchst",[["Wie du dich siehst","Du definierst dich über Wirkung, Kontrolle, Stärke, Effizienz, Einfluss und die Übernahme von Verantwortung. Dein innerer Grundsatz lautet: „Wenn ich es nicht entscheide, passiert es nicht.“ Du glaubst an Klarheit statt Komplexität und daran, dass Führung eine Pflicht ist, kein Wunsch: „Wenn niemand führt, führt Chaos.“","",null],["Deine wichtigsten Bedürfnisse","Autonomie, Einfluss, Entscheidungshoheit, Klarheit, Tempo, Effizienz, Durchsetzungskraft und die Kontrolle über das Resultat.","",null],["Was dich motiviert",null,"",["Macht, nicht als Ego, sondern als Verantwortung: „Ich trage die Entscheidung.“","Wirksamkeit: „Ich will sehen, dass etwas passiert.“","Klarheit: „Was ist der nächste Schritt?“","Tempo: „Es muss vorangehen.“","Verantwortung: „Ich übernehme das – lass mich machen.“"]]]],["Was du fühlst","Dein emotionales Profil",[[null,"Deine Energie wirkt hart. Die Wahrheit dahinter: Du fühlst intensiv, zeigst es aber nur selten. Du hast eine starke innere Loyalität, bist emotional stabil und schützt andere.","",null],["Deine Grundgefühle",null,"",["Sicherheit, wenn du führst","Unruhe, wenn du passiv bist","Frustration, wenn Dinge ineffizient laufen"]],["Negative Gefühle entstehen bei",null,"warn",["Unklarheit","Zögern","unfairer Kritik","Machtspielen","Ineffizienz"]]]],["Wie du kommunizierst","Im Normalfall und unter Stress",[["Im Normalfall","Du kommunizierst klar, direkt, ohne Umwege, strukturiert, handlungsorientiert, kurz und knapp, ohne emotionalen Überschwang.","",null],["Typische Sätze",null,"",["„Was ist der Plan?“","„Was brauchen wir, um das zu lösen?“","„Mach das bitte bis morgen.“","„Ich übernehme.“"]],[null,"Dein Stil ist effektiv – aber nicht immer diplomatisch.","",null],["Unter Stress","Du wirst hart, ungeduldig, impulsiv, konfrontativ und überdirekt. Typische Signale sind schnelles Reden, eine lautere Stimme, klare Ansagen, Unterbrechungen und null Toleranz für Ineffizienz.","warn",null],["Bei anhaltendem Stress","Es kommt zu Überkontrolle, Selbstüberlastung und emotionaler Abkapselung.","warn",null]]],["Was dich triggert","Deine Reizpunkte",[[null,null,"",["Zögern und Unentschlossenheit: „Kann mir jemand eine Entscheidung geben?!“","Ineffizienz: „Warum dauert das so lange?“","Unklare Kommunikation: „Was willst du sagen? Komm zum Punkt.“","Überregulierung: „Das dauert zu lange – ich mach’s selbst.“","Emotionale Dramen: Du hasst es, wenn Emotion über Logik steht."]]]],["Wie du im Konflikt bist","Und wenn deine Energie kippt",[["Dein Konfliktverhalten","Direkte Konfrontation, klare Ansagen, lösungsorientierter Druck, Fokus auf Effektivität, wenig Diplomatie. Du bist konfliktfähig – aber nicht immer konfliktklug.","",null],["Konflikte eskalieren, wenn",null,"warn",["jemand sich verweigert","klare Entscheidungen fehlen","dir ohne Argument widersprochen wird"]],["Wenn deine Energie kippt","Dann zeigen sich Dominanz, Härte, Ungeduld, Machtkampf, Druckverhalten, Sturheit und Impulsivität. Der schlimmste Zustand klingt so: „Ich mache alles selbst, weil niemand es gut genug macht.“","warn",null]]]];


var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';
const PROFILE_FN='/.netlify/functions/profile';
const PROFILE_URL='https://app.6heroes.de/profil';
const HERO_COLOR={commander:'#0B63CE',explorer:'#F0672A',innovator:'#F2B705',guardian:'#1F9D62',sage:'#C0266A',strategist:'#475569'};
const HERO_LABEL={commander:'Commander',explorer:'Explorer',innovator:'Innovator',guardian:'Guardian',sage:'Sage',strategist:'Strategist'};
const ON_COLOR=k=>k==='innovator'?'#20293A':'#fff';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():'';
const blk=(l,p,cls,ul)=>'<div class="blk">'+(l?'<span class="bl '+(cls||'')+'">'+esc(l)+'</span>':'')+(p?'<p>'+esc(p)+'</p>':'')+(ul?'<ul>'+ul.map(x=>{const t=String(x).split('|');return t.length>1?'<li><b>'+esc(t[0])+'</b> '+esc(t.slice(1).join('|'))+'</li>':'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+'</div>';
const acc=(a,sub,inner,open)=>'<details'+(open?' open':'')+'><summary><span class="s1"><span class="a">'+esc(a)+'</span>'+(sub?'<span class="b">'+esc(sub)+'</span>':'')+'</span></summary><div class="body">'+inner+'</div></details>';
const lab=t=>'<div class="label">'+esc(t)+'</div>';
const topbar='<div class="topbar"><a href="'+PROFILE_URL+'" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mein Bereich</a></div>';
function postHeight(){const h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}
async function getProfile(){
  const p=new URLSearchParams(location.search);const email=(p.get('email')||'').trim();
  if(!email) return null;
  try{const r=await fetch(PROFILE_FN+'?email='+encodeURIComponent(email));if(!r.ok) throw new Error(r.status);return await r.json();}
  catch(e){console.warn('Profil-Fetch fehlgeschlagen:',e);return null;}
}
function boot(render){
  window.addEventListener('load',()=>{render().then(()=>{var w=document.querySelector('.wrap');if(w)w.classList.add('ready');postHeight();});});
  window.addEventListener('resize',postHeight);
  if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
  document.addEventListener('toggle',postHeight,true);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(postHeight);}
  [50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
}


function profilBlocks(h){
  return h.profil.map((p,i)=>acc(p[0],p[1],p[2].map(b=>blk(b[0],b[1],b[2])).join(''),i===0)).join('');
}
function staerken(h){return '<div class="card">'+h.staerken.map(s=>blk(s[0],s[1],'ok')).join('')+'</div>';}
async function render(){
  const q=new URLSearchParams(location.search);
  const rolle=(q.get('rolle')||'basis').toLowerCase()==='zweit'?'zweit':'basis';
  let key=(q.get('hero')||'').trim().toLowerCase();
  let basis=(q.get('basis')||'').trim().toLowerCase();
  if(!key||(rolle==='zweit'&&!basis)){
    const d=await getProfile();
    if(d){
      if(!key) key=String((rolle==='zweit'?d.second:d.base)||'').trim().toLowerCase();
      if(!basis) basis=String(d.base||'').trim().toLowerCase();
    }
  }
  if(!PLATT[key]) key=(rolle==='zweit')?'explorer':'commander';
  if(!basis) basis='commander';
  const h=PLATT[key];
  const root=document.documentElement.style;root.setProperty('--accent',HERO_COLOR[key]);
  let html=topbar+'<div class="hero"><div class="emb" style="background:'+HERO_COLOR[key]+';color:'+ON_COLOR(key)+'">'+HERO_LABEL[key][0]+'</div>'
    +'<span class="eyebrow">Dein '+(rolle==='zweit'?'Zweitheld':'Basisheld')+'</span><h1>Der <span class="accent">'+HERO_LABEL[key]+'</span></h1><p class="hook">'+esc(h.hook)+'</p></div>';
  if(rolle==='basis'){
    html+=lab('Deine drei Kernstärken')+staerken(h);
    html+=lab('Dein Profil')+'<div class="stack">'+profilBlocks(h)+'</div>';
    html+=lab('Im Alltag')+'<div class="stack">'+LIFE[key].map(l=>acc(l[0],'',blk(null,l[1]))).join('')+'</div>';
    if(key==='commander'){
      html+=lab('Noch tiefer')+'<div class="stack">'+TIEFER_COMMANDER.map(t=>acc(t[0],t[1],t[2].map(b=>blk(b[0],b[1],b[2],b[3])).join(''))).join('')+'</div>';
    }
  }else{
    const z=(basis==='commander')?ZC[key]:null;
    if(z){
      html+=lab('Dein Zweitheld im Zusammenspiel')+'<div class="stack">'
        +acc('Wie '+HERO_LABEL[key]+' zu deinem Commander passt','Kernidee und fünf Signaturen',blk(null,z.kern)+blk('Woran du dich erkennst',null,'',z.sig),true)+'</div>';
    }
    html+=lab('Die drei Kernstärken des '+HERO_LABEL[key])+staerken(h);
    html+=lab('Profil des '+HERO_LABEL[key])+'<div class="stack">'+profilBlocks(h)+'</div>';
    html+=lab('Im Alltag')+'<div class="stack">'+LIFE[key].map(l=>acc(l[0],'',blk(null,l[1]))).join('')+'</div>';
    if(z){
      html+=lab('Privat')+'<div class="stack">'+z.privat.map(x=>acc(x[0],'',blk('Zwei Stimmen in dir',x[1])+blk('Typisches Verhalten',x[2])+blk('Innere Sätze',null,'',x[3]))).join('')+'</div>';
      html+=lab('Im Beruf')+'<div class="stack">'+z.beruf.map(x=>acc(x[0],'',blk('Typisches Muster',null,'',x[1])+blk('Innere Sätze',null,'',x[2]))).join('')+'</div>';
      html+=lab('Zum Erkennen')+'<div class="stack">'+acc('Deine Warnlampen','Innere Sätze, die dich verraten',z.warn.map(w=>blk(w[0],null,'warn',w[1])).join(''))+'</div>';
    }
  }
  document.getElementById('app').innerHTML=html;
}
boot(render);

</script>
