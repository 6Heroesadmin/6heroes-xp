<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Entwicklung – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--bg:#F7F5F0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:8px 20px 28px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.head{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,38px);line-height:1.15}
.gear{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--mute);text-decoration:none}
.gear:hover{background:#ECE8DD;color:var(--ink)}
.gear svg{width:22px;height:22px}
.wheel{display:flex;justify-content:center;padding:10px 0 4px}
.wheel svg{width:100%;max-width:300px;height:auto;display:block}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:22px 2px 10px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;min-height:76px;transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:var(--ink);box-shadow:0 6px 18px rgba(32,41,58,.08)}
.dot{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.eb{font-size:13px;color:var(--mute)}
.nm{font-size:19px;font-weight:700;line-height:1.3}
.ds{font-size:14.5px;line-height:1.55;color:var(--mute)}
.chev{flex:none;width:10px;height:10px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);margin:0 6px 0 2px}
.row.locked{border-color:#EBD9A0}
.row.leer{border-style:dashed;border-color:#C9C2B3}
.lk{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#7A5C00;background:#FFF6D6;border:1px solid #EBD9A0;border-radius:999px;padding:6px 11px}
.lk svg{width:13px;height:13px}
.free{margin-left:8px;padding:2px 8px;border-radius:999px;background:#E6F5EC;color:#1F7A4C;font-size:11px;font-weight:700;vertical-align:middle}
.error{text-align:center;color:#B4471B;padding:40px 16px;font-size:14px}
/* Zielkarte Meine Entwicklung */
.zk{display:flex;flex-direction:column;gap:6px;padding:18px;background:#20293A;color:#fff;border-radius:16px;text-decoration:none;min-height:76px;transition:box-shadow .15s}
.zk:hover{box-shadow:0 6px 18px rgba(32,41,58,.18)}
.zk .ey{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#F2B705}
.zk .z{font-family:'DM Serif Display',Georgia,serif;font-size:21px;line-height:1.3}
.zk .p{font-size:14px;line-height:1.5;color:#C9CFDA}
.zk .cta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14.5px;font-weight:600;color:#fff;text-decoration:none}
.zk .cta .chev{border-color:#fff}
.zk.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.zk.light .p{color:var(--mute)}.zk.light .ey{color:#B26B00}.zk.light .cta{color:var(--ink)}.zk.light .cta .chev{border-color:var(--mute)}
.zk.dash{background:var(--card);color:var(--ink);border:1.5px dashed #B9B2A0}
.zk.dash .p{color:var(--mute)}.zk.dash .ey{color:var(--mute)}.zk.dash .cta{color:var(--ink)}.zk.dash .cta .chev{border-color:var(--mute)}
.zk.wait{background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:14px;justify-content:center}
@media(max-width:480px){.wrap{padding:6px 16px 24px}.row{padding:14px;gap:12px}.lk span{display:none}.lk{padding:7px}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:'DM Serif Display',Georgia,serif;font-size:30px;line-height:1.15}
.tile .t{font-size:12.5px;color:var(--mute)}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;margin-top:10px}
.goal b{font-size:15.5px}.goal span{font-size:14px;color:var(--mute)}
.bar{height:10px;border-radius:6px;background:#ECE7DB;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:#F2B705;border-radius:6px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:10px}
.note p{font-size:15px;line-height:1.6}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;background:#F2B705;color:#20293A;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.teaser{border:1px solid #EBD9A0;background:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.teaser .tile{background:#FBFAF6}.teaser .n{color:#B9B2A0}
.teaser p{font-size:14.5px;color:var(--mute)}
.dummy{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8A5A00;background:#FFF3D1;border:1px solid #F2D58A;border-radius:999px;padding:3px 10px;margin-bottom:6px}
.wait{min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px}
.dbg{font-size:12px;color:var(--mute);word-break:break-all}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Build: 2026-11-10 Meine Entwicklung v1.1 (Trainingskarte ruht)
// Daten: Make Meine_Entwicklung_Laden (Users.MeineEntwicklung_JSON = {zugang, erfolge, entwicklung}).
// URL-Parameter: email, k (Seiten_Schluessel), frame. Vorschau: ?demo=abo|neu|frei, Diagnose ?debug=1
var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';
const APP='https://app.6heroes.de';
const UPGRADE_URL='https://6heroes.de/preise.html#pricing';
const LINKS={ziel:APP+'/dein-aktuelles-ziel',verlauf:APP+'/verlauf',erfolge:APP+'/erfolge',langzeitprofil:APP+'/langzeitprofil',coach:APP+'/pocket-hero',account:APP+'/account'};
const ME_WEBHOOK_URL='https://hook.eu1.make.com/g2pd0gpxfarijkh2r2n834yhdkg9dw1g';   /* Make Meine_Entwicklung_Laden */
const LOAD_TOKEN='20569c7734eae0c5da881e2d0221959e';
const CACHE_MS=60000;
const Q=new URLSearchParams(location.search);
const EMAIL=(Q.get('email')||'').trim().toLowerCase();
const K=(Q.get('k')||'').trim();
const DEMO=Q.get('demo')||'';
const DEBUG=!!Q.get('debug');
const LEVELS=[[0,'Einsteiger'],[100,'Aushilfsheld'],[250,'Pfadfinder'],[500,'Vorreiter'],[900,'Aufsteiger'],[1500,'Champion'],[2500,'Mythos'],[4000,'Titan'],[6000,'Legende'],[9000,'SuperHero']];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

const zahl=n=>Number(n||0).toLocaleString('de-DE');
function montagISO(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function minusWoche(iso){const p=iso.split('-');return montagISO(new Date(+p[0],+p[1]-1,+p[2]-7));}
function streakAktuell(wochen){const set={};(wochen||[]).forEach(w=>{set[w]=1;});let w=montagISO(new Date());if(!set[w])w=minusWoche(w);let n=0;while(set[w]){n++;w=minusWoche(w);}return n;}
const PHASE_SATZ={Erkennen:'Du lernst gerade, wann dein gewohntes Verhalten beginnt.',Ausprobieren:'Du probierst gerade eine neue Reaktion bewusst aus.',Uebertragen:'Du setzt es gerade auch in schwierigen Situationen ein.',Eigenstaendig:'Du brauchst immer seltener Anleitung.'};
const heuteB=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Berlin'});
const tageZw=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/86400000);
const ZIEL_ICON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#20293A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="#20293A"/></svg>';
/* Zielkarte im Stil der übrigen Karten: goldener Kreis mit Zielscheibe, Statuszeile, Ziel fett, Phase grau */
function zkRow(status,ziel,text,opt){
  opt=opt||{};
  const href=opt.locked?UPGRADE_URL:LINKS.ziel;
  return '<a class="row'+(opt.locked?' locked':'')+(opt.leer?' leer':'')+'" href="'+href+'" target="_top">'
    +'<span class="dot" style="background:#F2B705">'+ZIEL_ICON+'</span>'
    +'<span class="txt">'+(status?'<span class="eb">'+esc(status)+'</span>':'')+'<span class="nm">'+esc(ziel)+'</span>'+(text?'<span class="ds">'+esc(text)+'</span>':'')+'</span>'
    +(opt.locked?'<span class="lk">'+LOCK+'<span>Freischalten</span></span>':'<span class="chev"></span>')+'</a>';
}
function zielkarte(ziele,paid){
  if(!paid)return zkRow('Im Abo enthalten','Langfristig etwas verändern','Ein Ziel, ein paar kleine Schritte pro Woche, dein Coach begleitet dich.',{locked:true});
  const LEER=()=>zkRow('Noch kein Ziel','Woran möchtest du arbeiten?','Ein Ziel, ein paar kleine Schritte pro Woche.',{leer:true});
  if(!ziele)return LEER();
  const h=heuteB();
  const z=ziele.find(x=>x.status==='aktiv'||x.status==='pausiert');
  if(z){
    const phase=PHASE_SATZ[z.phase]||'';
    if(z.status==='pausiert')return zkRow('Ruht gerade',z.kurz,'Dein Fortschritt bleibt erhalten.');
    if(z.ende_am&&z.ende_am<=h&&!z.zusammenfassung)return zkRow('Abschluss fällig',z.kurz,phase);
    if(z.bilanz_am&&z.bilanz_am<=h&&z.bilanz_erledigt!=='1')return zkRow('Zwischenbilanz fällig',z.kurz,phase);
    if(z.karte==='ruht')return zkRow('Ruht gerade',z.kurz,'Dein Fortschritt bleibt erhalten.'); /* wie Pocket Hero: Trainingskarte ruht nach 10 Tagen ohne Schritt */
    const bereit=z.next_titel&&(z.karte==='bereit'||(z.next_faellig&&z.next_faellig<=h));
    return zkRow(bereit?'Dein nächster Schritt ist bereit':'',z.kurz,phase);
  }
  const ab=ziele.filter(x=>x.status==='abgeschlossen').sort((a,b)=>String(b.geschlossen||b.ende_am).localeCompare(String(a.geschlossen||a.ende_am)))[0];
  if(ab&&ab.hat_nachfolger!=='1'&&ab.folgeteile&&!((ab.geschlossen||ab.ende_am)&&tageZw(ab.geschlossen||ab.ende_am,h)>60)){
    const teil=String(ab.folgeteile).split('\n').map(x=>x.trim()).filter(Boolean)[0];
    if(teil)return zkRow('Dein nächster Teil wartet',teil,'Baut auf deinem letzten Ziel auf.');
  }
  return LEER();
}

/* ---------- Bausteine ---------- */
function head(){return '<div class="head"><h1>Meine Entwicklung</h1><a class="gear" href="'+LINKS.account+'" target="_top" aria-label="Account und Einstellungen">'+GEAR+'</a></div>'+(DEMO?'<span class="dummy">Beispieldaten</span>':'');}
function row(o){
  const href=o.locked?UPGRADE_URL:o.url;
  return '<a class="row'+(o.locked?' locked':'')+'" href="'+href+'" target="_top"><span class="dot" style="background:'+o.bg+'">'+o.dot+'</span><span class="txt"><span class="nm">'+esc(o.nm)+'</span><span class="ds">'+esc(o.ds)+'</span></span>'+(o.locked?'<span class="lk">'+LOCK+'<span>Freischalten</span></span>':'<span class="chev"></span>')+'</a>';
}
function kacheln(e){
  const ab=e.abzeichen||[];const verdient=ab.filter(a=>a.erreicht).length;const st=streakAktuell(e.wochen);
  const lv=e.level||1, ln=e.level_name||'Einsteiger';
  return '<div class="tiles">'
    +'<div class="tile"><span class="n">'+esc(lv)+'</span><span class="t">Level, '+esc(ln)+'</span></div>'
    +'<div class="tile"><span class="n">'+zahl(e.punkte)+'</span><span class="t">Hero Points</span></div>'
    +'<div class="tile"><span class="n">'+st+'</span><span class="t">'+(st===1?'Woche':'Wochen')+' in Folge'+(e.streak_max>st?', bisher bis zu '+e.streak_max:'')+'</span></div>'
    +'<div class="tile"><span class="n">'+(ab.length?verdient+' von '+ab.length:verdient)+'</span><span class="t">Abzeichen verdient</span></div></div>';
}
function levelBalken(e){
  let nl=e.naechstes_level;
  if(!nl&&!e.punkte){nl={name:LEVELS[1][1],fehlt:LEVELS[1][0],prozent:0};}
  if(nl)return '<div class="goal"><b>'+esc(e.level_name||'Einsteiger')+' auf dem Weg zu '+esc(nl.name)+'</b><div class="bar"><i style="width:'+Math.max(2,Math.min(100,nl.prozent||0))+'%"></i></div><span>Noch '+zahl(nl.fehlt)+' Hero Points bis '+esc(nl.name)+'</span></div>';
  return '<div class="goal"><b>'+esc(e.level_name)+'</b><span>Du hast die höchste Stufe erreicht.</span></div>';
}
function einstieg(paid,e){
  if(!paid)return '<div class="teaser"><div class="tiles">'+['Level','Hero Points','Wochen in Folge','Abzeichen'].map(t=>'<div class="tile"><span class="n">–</span><span class="t">'+t+'</span></div>').join('')+'</div><p>Mit dem Abo sammelst du für jeden Rückblick Hero Points, steigst im Level und verdienst Abzeichen.</p><a class="btn" href="'+UPGRADE_URL+'" target="_top">Freischalten</a></div>';
  e=e||{};
  let h=kacheln(e)+levelBalken(e);
  if(!e.rueckblicke){
    h+='<div class="note"><p>Nutze den Pocket Hero, um mit Heldentaten deine Entwicklung voranzubringen. Für jeden Rückblick auf eine Heldentat bekommst du Hero Points.</p><a class="btn" href="'+LINKS.coach+'" target="_top">Zum Pocket Hero</a></div>';
  }else if(e.naechstes_abzeichen){
    h+='<div class="goal"><span>Nächstes Abzeichen in Reichweite</span><b>'+esc(e.naechstes_abzeichen.name)+'</b><span>'+esc(e.naechstes_abzeichen.text)+'</span></div>';
  }
  return h;
}
function render(d){
  const paid=d.zugang==='ja';
  const e=d.erfolge||{rueckblicke:0,abzeichen:[]};
  const ab=e.abzeichen||[];const verdient=ab.filter(a=>a.erreicht).length;
  let ziele=Array.isArray(d.entwicklung)?d.entwicklung.filter(z=>z.status!=='beendet'||(z.momente||[]).length||z.mitnahme):null;
  let h=head()+einstieg(paid,e);
  h+='<div class="label">Dein aktuelles Ziel</div><div class="stack">'+zielkarte(ziele,paid)+'</div>';
  h+='<div class="label">Deine bisherigen Heldentaten</div><div class="stack">'+row({nm:'Was du getan hast',ds:'Deine Heldentaten und Wochenrückblicke der letzten 60 Tage, nach Wochen geordnet.',dot:'V',bg:'#5A6272',url:LINKS.verlauf,locked:!paid})+'</div>';
  h+='<div class="label">Deine Erfolge</div><div class="stack">'+row({nm:'Alle Abzeichen',ds:paid&&ab.length?verdient+' von '+ab.length+' verdient, nach Kategorien geordnet.':'Abzeichen aus deinen Rückblicken, nach Kategorien geordnet.',dot:'E',bg:'#1F9D62',url:LINKS.erfolge,locked:!paid})+'</div>';
  h+='<div class="label">Dein Langzeitprofil</div><div class="stack">'+row({nm:'Was dein Alltag zeigt',ds:'Was ich aus deinen Rückblicken über dich sehe, etwa zweimal im Monat fortgeschrieben.',dot:'L',bg:'#20293A',url:LINKS.langzeitprofil,locked:!paid})+'</div>';
  return h;
}

/* ---------- Laden ---------- */
function cacheLesen(){try{const c=JSON.parse(sessionStorage.getItem('me_bereich_'+EMAIL)||'null');if(c&&Date.now()-c.t<CACHE_MS)return c.d;}catch(e){}return null;}
function cacheSchreiben(d){
  const t=Date.now();
  try{sessionStorage.setItem('me_bereich_'+EMAIL,JSON.stringify({t:t,d:d}));}catch(e){}
  /* Unterseiten nutzen dieselben Daten eine Minute lang (spart Make-Credits) */
  try{if(Array.isArray(d.entwicklung))sessionStorage.setItem('me_entw_'+EMAIL,JSON.stringify({t:t,d:d.entwicklung}));}catch(e){}
  try{if(d.erfolge&&typeof d.erfolge.punkte!=='undefined')sessionStorage.setItem('ef_'+EMAIL,JSON.stringify({t:t,d:d.erfolge}));}catch(e){}
}
async function laden(){
  if(DEMO)return demoDaten(DEMO);
  const c=cacheLesen();if(c)return c;
  const body=JSON.stringify({aktion:'meine_entwicklung',token:LOAD_TOKEN,user_id:EMAIL,k:K});
  let letzter=null;
  for(let v=0;v<2;v++){
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),20000);
    try{
      const r=await fetch(ME_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:body,signal:ctrl.signal});
      const t=(await r.text()).trim();
      if(!r.ok)throw new Error('HTTP '+r.status+': '+t.slice(0,120));
      if(!t)throw new Error('leere Antwort (Schlüssel oder E-Mail passt nicht)');
      let d;try{d=JSON.parse(t.replace(/[\u0000-\u001F]+/g,' '));}catch(pe){throw new Error('Kein JSON: '+t.slice(0,120));}
      if(!d||!d.zugang)throw new Error('Format: '+t.slice(0,120));
      if(d.erfolge&&typeof d.erfolge==='string'){try{d.erfolge=JSON.parse(d.erfolge);}catch(e){d.erfolge=null;}}
      cacheSchreiben(d);return d;
    }catch(e){letzter=e;console.warn('Meine Entwicklung Versuch '+(v+1)+':',e.message);if(v===0)await new Promise(res=>setTimeout(res,1200));}
    finally{clearTimeout(timer);}
  }
  throw letzter;
}

/* ---------- Vorschau ---------- */
function demoDaten(art){
  if(art==='frei')return {zugang:'nein',erfolge:null,entwicklung:[]};
  if(art==='neu')return {zugang:'ja',erfolge:{rueckblicke:0,abzeichen:[]},entwicklung:[]};
  const h=heuteB(),p=n=>{const x=new Date(h+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
  const w=[];for(let i=3;i>=0;i--){const d=new Date();d.setDate(d.getDate()-7*i);w.push(montagISO(d));}
  const ab=[];for(let i=0;i<60;i++)ab.push({id:'B'+i,name:'A'+i,kat:'Einstieg',erreicht:i<28?w[1]:''});
  return {zugang:'ja',
    erfolge:{punkte:650,level:4,level_name:'Vorreiter',naechstes_level:{level:5,name:'Aufsteiger',ab:900,fehlt:250,prozent:37},rueckblicke:37,aktive_tage:15,wochen:w,streak_max:4,abzeichen:ab,naechstes_abzeichen:{name:'Tiefentaucher',kat:'Nachdenken',text:'Noch 2 Rückblicke mit eigenen Worten, dann bekommst du das Abzeichen.'}},
    entwicklung:[{id:'akt',status:'aktiv',phase:'Erkennen',kurz:'Ich bringe meine Ideen klar und knapp ein.',start:p(-14),bilanz_am:p(2),ende_am:p(16),next_titel:'Ein Satz vorab',next_faellig:p(0),karte:'bereit',bilanz_erledigt:'0',momente:[]}]};
}

/* ---------- Start ---------- */
function postHeight(){const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);try{parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}catch(e){}}
function fehler(err){
  const app=document.getElementById('app');
  app.innerHTML=head()+'<div class="note"><p>Deine Entwicklung lässt sich gerade nicht laden.</p><button class="btn" id="nochmal">Nochmal versuchen</button>'+(DEBUG?'<p class="dbg">email='+esc(EMAIL||'(leer)')+' | k='+(K?'ok':'(fehlt)')+' | '+esc(err&&err.message||'')+'</p>':'')+'</div>';
  document.getElementById('nochmal').addEventListener('click',()=>{try{sessionStorage.removeItem('me_bereich_'+EMAIL);}catch(e){}start();});
  app.classList.add('ready');postHeight();
}
async function start(){
  const app=document.getElementById('app');
  if(!DEMO&&(!EMAIL||EMAIL.indexOf('@')<1||!/^rec[A-Za-z0-9]{14}$/.test(K))){fehler(new Error('email oder k fehlt im Link'));return;}
  app.innerHTML=head()+'<div class="wait">Wird geladen …</div>';app.classList.add('ready');postHeight();
  try{app.innerHTML=render(await laden());postHeight();}catch(e){console.warn(e);fehler(e);}
}
window.addEventListener('load',start);
window.addEventListener('resize',postHeight);
if(window.ResizeObserver)new ResizeObserver(postHeight).observe(document.body);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(postHeight);
[200,600,1200].forEach(t=>setTimeout(postHeight,t));
</script>
