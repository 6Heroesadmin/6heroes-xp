<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Quests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #20293A;
    --gold: #F2B705;
    --text: #F4F1E9;
    --text-soft: #C8CEDA;
    --text-muted: #8E96A8;
    --border: rgba(255,255,255,0.08);
    --card: rgba(255,255,255,0.035);
    --card-hover: rgba(255,255,255,0.06);
    --done: #1F9D62;
  }
  html, body {
    background: var(--navy);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .scroll { background: var(--navy); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 22px 16px 36px; }

  .header { margin-bottom: 18px; }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 32px; font-weight: 400; letter-spacing: -0.01em; margin-bottom: 6px;
  }
  .header p { font-size: 14.5px; color: var(--text-muted); }

  .focus-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 30px;
  }
  .focus-label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-right: 2px;
  }
  .focus-chip {
    font-size: 13px; font-weight: 500; color: var(--text);
    background: rgba(242,183,5,0.12); border: 1px solid rgba(242,183,5,0.28);
    padding: 4px 11px; border-radius: 999px;
  }
  .focus-none { font-size: 13px; color: var(--text-muted); }
  .focus-edit {
    margin-left: auto; font-size: 13px; font-weight: 600; color: var(--gold);
    background: none; border: none; cursor: pointer; padding: 4px 2px; text-decoration: none;
  }
  .focus-edit:hover { text-decoration: underline; }

  .block { margin-bottom: 34px; }
  .block:last-child { margin-bottom: 0; }
  .block-head { margin-bottom: 4px; }
  .block-role {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 3px;
  }
  .block-hero {
    font-family: 'DM Serif Display', serif; font-size: 26px; font-weight: 400;
    color: var(--text); line-height: 1.15;
  }
  .block-sub {
    font-size: 14px; color: var(--text-soft); line-height: 1.6;
    margin: 8px 0 18px; max-width: 52ch;
  }
  .block-energy { font-size: 13px; color: var(--text-muted); margin: 6px 0 18px; }
  .block-energy strong { color: var(--text-soft); font-weight: 600; }

  /* ---- Heldenrad-Navigation (V124) ---------------------------------- */
  .wheel-wrap { margin: 4px 0 26px; text-align: center; }
  .wheel-hint {
    font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .wheel-svg { width: 100%; max-width: 380px; height: auto; display: inline-block; touch-action: manipulation; }
  .wheel-seg { cursor: pointer; transition: opacity .18s ease, transform .12s ease; transform-origin: 50% 50%; }
  .wheel-seg:hover { opacity: 0.92; }
  .wheel-seg.is-brach { opacity: 0.34; }
  .wheel-seg.is-brach:hover { opacity: 0.48; }
  .wheel-seg.is-active { opacity: 1; }
  .wheel-seg .seg-path { transition: stroke-width .12s ease, stroke .12s ease; stroke: transparent; stroke-width: 0; }
  .wheel-seg.is-active .seg-path { stroke: var(--text); stroke-width: 3; }
  .wheel-seg:focus-visible { outline: none; }
  .wheel-seg:focus-visible .seg-path { stroke: var(--gold); stroke-width: 3; }
  .seg-label { font-size: 13px; font-weight: 700; fill: #fff; pointer-events: none; }
  .seg-count {
    font-size: 15px; font-weight: 700; fill: #fff; pointer-events: none;
  }
  .seg-count-bg { pointer-events: none; }
  .wheel-hub-ring { fill: var(--navy); stroke: rgba(255,255,255,0.14); stroke-width: 2; }
  .wheel-hub-text { font-family: 'DM Serif Display', serif; font-size: 26px; fill: var(--text); pointer-events: none; }
  .role-badge-rect { rx: 4; }
  .role-badge-text { font-size: 11px; font-weight: 700; fill: #fff; pointer-events: none; }

  /* Aktiver Held-Block: nur der gewählte ist sichtbar */
  .hero-panel { display: none; }
  .hero-panel.is-open { display: block; animation: panelIn .22s ease; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .hero-panel.is-open { animation: none; }
  }

  .typegroup { margin-bottom: 22px; }
  .typegroup:last-child { margin-bottom: 0; }
  .type-head { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 11px; }
  .type-head span { font-weight: 400; color: var(--text-muted); }

  .quest {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px;
    transition: background 0.18s ease, border-color 0.18s ease; cursor: pointer;
  }
  .quest:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.16); }
  .quest:last-child { margin-bottom: 0; }
  .quest:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .quest-top { display: flex; align-items: flex-start; gap: 14px; }
  .quest-main { flex: 1; min-width: 0; }
  .quest-title {
    font-size: 16.5px; font-weight: 600; color: var(--text);
    margin-bottom: 5px; line-height: 1.3;
  }
  .quest-instr { font-size: 14px; color: var(--text-soft); line-height: 1.6; }
  .quest-foot {
    display: flex; align-items: center; gap: 16px;
    margin-top: 12px; font-size: 12.5px; color: var(--text-muted);
  }
  .quest-foot .xp { color: var(--gold); font-weight: 600; }
  .quest-foot .streak { color: var(--text-soft); font-weight: 500; }
  .quest-foot .match {
    color: var(--gold); font-weight: 500;
    border-left: 1px solid var(--border); padding-left: 16px;
  }

  .status {
    flex-shrink: 0; font-size: 12px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--border); color: var(--text-soft);
  }
  .status.done {
    color: #BBF7D0; background: rgba(31,157,98,0.16); border-color: rgba(31,157,98,0.38);
  }

  .quest.optional { cursor: pointer; }

  .quest.done-card { cursor: default; border-color: rgba(31,157,98,0.28); }
  .quest.done-card:hover { background: var(--card); border-color: rgba(31,157,98,0.28); }
  .quest.done-card .quest-title { color: var(--text-soft); }
  .opt-note { font-size: 12px; color: var(--text-muted); margin-bottom: 7px; font-style: italic; }

  /* Teaser-Sperre: erster Quest gratis, restliche gesperrt.
     Inhalt bleibt lesbar angedeutet (leichter Blur + Abdunklung),
     klares Sperr-Signal via Schloss-Overlay + goldene Freischalt-Zeile. */
  .quest.locked-card { position: relative; cursor: pointer; overflow: hidden; }
  .quest.locked-card .quest-top { filter: blur(2.5px); opacity: 0.55; pointer-events: none; user-select: none; }
  .quest.locked-card:hover { border-color: rgba(242,183,5,0.45); }
  .status.locked {
    color: var(--gold); background: rgba(242,183,5,0.12); border-color: rgba(242,183,5,0.40);
  }
  .lock-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-direction: column; text-align: center;
    background: linear-gradient(180deg, rgba(32,41,58,0.10), rgba(32,41,58,0.30));
  }
  .lock-overlay .lock-badge { font-size: 20px; line-height: 1; }
  .lock-overlay .lock-cta {
    font-size: 13px; font-weight: 700; color: var(--navy, #20293A);
    background: var(--gold); padding: 7px 16px; border-radius: 999px;
  }
  @media (prefers-reduced-motion: reduce) { .quest.locked-card .quest-top { filter: none; } }

  .brach-intro {
    font-size: 14px; color: var(--text-soft); line-height: 1.6;
    margin: 8px 0 18px; max-width: 52ch;
  }
  .empty { color: var(--text-soft); font-size: 15px; line-height: 1.7; padding: 32px 0; }

  @media (prefers-reduced-motion: reduce) { .quest { transition: none; } }
</style>
</head>
<body>
<div class="scroll">
<div class="wrap" id="wrap">
  <div class="header">
    <h1>Meine Quests</h1>
    <p>Kleine Übungen, passend zu deinen Helden und deiner Energie.</p>
  </div>
  <div id="focusbar"></div>
  <div id="content"></div>
</div>
</div>

<script>
/* 6HEROES quests.html
   Achsen: 1) Rolle -> Typen  2) Energie -> Menge  3) Fokus -> Reihenfolge (erweiterbar)
   Datenquelle final: Make-Webhook. Vorerst DUMMY + URL-Params. */

const HEROES = [
  { key:'innovator',  label:'Innovator',  nettoKey:'ni',  color:'#F2B705' },
  { key:'commander',  label:'Commander',  nettoKey:'nc',  color:'#0B63CE' },
  { key:'strategist', label:'Strategist', nettoKey:'nst', color:'#94A3B8' },
  { key:'sage',       label:'Sage',       nettoKey:'ns',  color:'#C0266A' },
  { key:'guardian',   label:'Guardian',   nettoKey:'ng',  color:'#1F9D62' },
  { key:'explorer',   label:'Explorer',   nettoKey:'ne',  color:'#F0672A' },
];
function heroColor(key){ const h=HEROES.find(x=>x.key===key); return h?h.color:'#F4F1E9'; }

const TYPES = {
  Activate:  { label:'Einschalten',     desc:'Modus aktivieren'  },
  Perform:   { label:'Wirksam werden',  desc:'wirksam einsetzen' },
  StopLimit: { label:'Bewusst bremsen', desc:'regulieren'        },
  Discover:  { label:'Ausprobieren',    desc:'entdecken'         },
};

const LIFE_AREAS = {
  arbeit:'Arbeit & Leistung', beziehungen:'Beziehungen & Nähe', stress:'Stress & Erholung',
  entscheidungen:'Entscheidungen & Klarheit', selbstvertrauen:'Selbstvertrauen', fokus:'Fokus & Dranbleiben',
};

const ROLE_TYPES = {
  basis:['Perform','StopLimit','Activate'], zweit:['Activate','Perform','StopLimit'],
  stress1:['StopLimit'], stress2:['StopLimit'], brach:['Discover'],
};
const ROLE_META = {
  basis:{label:'Basisheld',sub:'Dein häufigster Modus. Hier geht es ums Verfeinern und kluge Dosieren.'},
  zweit:{label:'Zweitheld',sub:'Dein Ergänzungsmodus. Aktivieren und bewusst einbauen.'},
  stress1:{label:'Stressheld 1',sub:'Springt bei frühem Druck an. Erkennen, stoppen, umlenken.'},
  stress2:{label:'Stressheld 2',sub:'Greift bei tiefer Erschöpfung. Regulieren steht im Vordergrund.'},
  brach:{label:'Brachliegende Stärke',sub:''},
};

function windowFor(netto){
  const n = (netto==null)?0:netto;
  if (n>= 2.0) return {Activate:2,Perform:3,StopLimit:1,longPerform:'show'};
  if (n>= 0.5) return {Activate:2,Perform:2,StopLimit:1,longPerform:'show'};
  if (n>=-0.4) return {Activate:1,Perform:2,StopLimit:1,longPerform:'short'};
  if (n>=-1.9) return {Activate:1,Perform:1,StopLimit:2,longPerform:'option'};
  return            {Activate:1,Perform:0,StopLimit:2,longPerform:'option'};
}
const LONG_PERFORM_MIN = 10;

function energyLine(n){
  if (n==null) return '';
  let label;
  if (n>=2.0) label='lädt dich stark auf';
  else if (n>=0.5) label='lädt dich auf';
  else if (n>=-0.4) label='ist ausgeglichen';
  else if (n>=-1.9) label='zehrt gerade';
  else label='zehrt stark';
  const hint = (n<-0.4) ? ' Darum hier weniger und kürzere Quests.'
             : (n>=2.0 ? ' Du kannst hier großzügig üben.' : '');
  return `Energie: <strong>${label}</strong>.${hint}`;
}

/* Kontext-Gewichtung (Achse 3) — erweiterbarer Kern.
   Heute: Lebensbereiche (Tap). Später: KI liefert dieselbe Score-Map. */
function getContextScores(quest, focusAreas){
  if (!focusAreas || !focusAreas.length) return 0;
  const qa = quest.LifeAreas || [];
  let s = 0; qa.forEach(a => { if (focusAreas.includes(a)) s++; });
  return s;
}

const DUMMY_QUESTS = [
  {QuestID:'q01',Hero:'innovator',Type:'Activate', Title:'Erster Funke', Instruction:'Notiere in drei Minuten eine ungewöhnliche Idee zu etwas, das dich gerade beschäftigt. Ohne sie zu bewerten.',DurationMin:3, XP_Base:10,MinLevel:1,LifeAreas:['fokus']},
  {QuestID:'q02',Hero:'innovator',Type:'Activate', Title:'Was wäre, wenn', Instruction:'Nimm eine deiner Routinen und frage dich: Was wäre, wenn das ganz anders ginge? Schreib eine Antwort auf.',DurationMin:4, XP_Base:10,MinLevel:1,LifeAreas:['arbeit','entscheidungen']},
  {QuestID:'q03',Hero:'innovator',Type:'Perform',  Title:'Idee testen', Instruction:'Bring eine deiner Ideen heute in einem konkreten kleinen Schritt in die Wirklichkeit.',DurationMin:15,XP_Base:25,MinLevel:1,LifeAreas:['arbeit']},
  {QuestID:'q04',Hero:'innovator',Type:'Perform',  Title:'Schnelle Rohversion', Instruction:'Baue eine grobe, unfertige Version von etwas: eine Skizze, eine Notiz, ein Entwurf. Fertig wird später.',DurationMin:12,XP_Base:25,MinLevel:1,LifeAreas:['arbeit','fokus']},
  {QuestID:'q05',Hero:'innovator',Type:'Perform',  Title:'Zwei Welten verbinden', Instruction:'Verknüpfe zwei Dinge aus ganz verschiedenen Bereichen zu einem neuen Ansatz.',DurationMin:8, XP_Base:20,MinLevel:2,LifeAreas:['entscheidungen']},
  {QuestID:'q06',Hero:'innovator',Type:'StopLimit',Title:'Genug gesammelt', Instruction:'Setze bewusst einen Schlusspunkt: Wähle eine Idee aus und lass die anderen für heute los.',DurationMin:2, XP_Base:10,MinLevel:1,LifeAreas:['entscheidungen','fokus']},
  {QuestID:'q07',Hero:'innovator',Type:'Discover', Title:'Innovator ausprobieren', Instruction:'Spiel heute bewusst mit einer verrückten Idee, nur zum Ausprobieren.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['fokus','selbstvertrauen']},

  {QuestID:'q10',Hero:'guardian',Type:'Activate', Title:'Rücken freihalten', Instruction:'Sorge für eine Sache, die jemandem heute den Rücken freihält.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['beziehungen']},
  {QuestID:'q11',Hero:'guardian',Type:'Perform',  Title:'Verlässlich liefern', Instruction:'Halte heute eine Zusage ganz genau ein und mach es für die andere Person sichtbar.',DurationMin:10,XP_Base:25,MinLevel:1,LifeAreas:['beziehungen','arbeit']},
  {QuestID:'q13',Hero:'guardian',Type:'Perform',  Title:'Schutzraum schaffen', Instruction:'Nimm dir Zeit, einer Person heute aktiv zuzuhören, ohne gleich Lösungen anzubieten.',DurationMin:12,XP_Base:25,MinLevel:1,LifeAreas:['beziehungen']},
  {QuestID:'q12',Hero:'guardian',Type:'StopLimit',Title:'Nicht alles tragen', Instruction:'Gib eine Aufgabe ab, die nicht deine ist. Bewusst und freundlich.',DurationMin:3, XP_Base:15,MinLevel:1,LifeAreas:['stress','selbstvertrauen']},
  {QuestID:'q14',Hero:'guardian',Type:'Discover', Title:'Guardian ausprobieren', Instruction:'Übernimm heute bewusst Verantwortung für eine Kleinigkeit im Team und beobachte, wie sich das anfühlt.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['beziehungen','arbeit']},

  {QuestID:'q22',Hero:'commander',Type:'Activate', Title:'Klare Ansage', Instruction:'Triff heute eine kleine Entscheidung sofort und kommuniziere sie klar.',DurationMin:3, XP_Base:10,MinLevel:1,LifeAreas:['entscheidungen','arbeit']},
  {QuestID:'q23',Hero:'commander',Type:'Perform',  Title:'Vorangehen', Instruction:'Übernimm heute bei einer Sache die Führung und bring sie ins Rollen.',DurationMin:12,XP_Base:25,MinLevel:1,LifeAreas:['arbeit']},
  {QuestID:'q20',Hero:'commander',Type:'StopLimit',Title:'Druck bewusst stoppen', Instruction:'Erkenne den Moment, in dem du in Kontrolle kippst. Atme einmal tief durch, dann entscheide neu.',DurationMin:2, XP_Base:10,MinLevel:1,LifeAreas:['stress']},
  {QuestID:'q21',Hero:'commander',Type:'StopLimit',Title:'Eine Stufe leiser', Instruction:'Formuliere heute eine Anweisung bewusst als Frage statt als Ansage.',DurationMin:3, XP_Base:15,MinLevel:1,LifeAreas:['beziehungen','stress']},
  {QuestID:'q24',Hero:'commander',Type:'Discover', Title:'Commander ausprobieren', Instruction:'Sag heute bei einer Sache bewusst klar, was du willst, statt abzuwarten.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['selbstvertrauen','entscheidungen']},

  {QuestID:'q32',Hero:'sage',Type:'Activate', Title:'Innehalten', Instruction:'Nimm dir fünf Minuten, um über eine offene Frage in Ruhe nachzudenken, bevor du handelst.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['fokus','entscheidungen']},
  {QuestID:'q33',Hero:'sage',Type:'Perform',  Title:'Klarheit teilen', Instruction:'Bring heute einen komplexen Sachverhalt für jemanden in einfache Worte.',DurationMin:10,XP_Base:25,MinLevel:1,LifeAreas:['beziehungen','arbeit']},
  {QuestID:'q30',Hero:'sage',Type:'StopLimit',Title:'Grübeln beenden', Instruction:'Beende eine Gedankenschleife: Schreib die offene Frage auf und leg sie für heute bewusst weg.',DurationMin:3, XP_Base:15,MinLevel:1,LifeAreas:['stress','fokus']},
  {QuestID:'q31',Hero:'sage',Type:'StopLimit',Title:'Gut genug erlauben', Instruction:'Erkläre eine Sache bewusst für gut genug, statt sie weiter zu verfeinern.',DurationMin:2, XP_Base:10,MinLevel:1,LifeAreas:['selbstvertrauen','stress']},
  {QuestID:'q34',Hero:'sage',Type:'Discover', Title:'Sage ausprobieren', Instruction:'Stell dir heute bei einem Thema bewusst die Frage nach dem Warum, bevor du weitermachst.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['fokus','entscheidungen']},

  {QuestID:'q42',Hero:'strategist',Type:'Activate', Title:'Erst sortieren', Instruction:'Bevor du heute startest, ordne deine drei wichtigsten Aufgaben in eine klare Reihenfolge.',DurationMin:4, XP_Base:10,MinLevel:1,LifeAreas:['arbeit','fokus']},
  {QuestID:'q43',Hero:'strategist',Type:'Perform',  Title:'Plan durchziehen', Instruction:'Verfolge heute einen kleinen Plan konsequent vom Anfang bis zum Ende.',DurationMin:12,XP_Base:25,MinLevel:1,LifeAreas:['arbeit','entscheidungen']},
  {QuestID:'q44',Hero:'strategist',Type:'StopLimit',Title:'Überplanen stoppen', Instruction:'Hör bewusst auf zu planen und fang mit dem ersten Schritt an.',DurationMin:2, XP_Base:10,MinLevel:1,LifeAreas:['stress','fokus']},
  {QuestID:'q40',Hero:'strategist',Type:'Discover',Title:'Strategist ausprobieren', Instruction:'Verbringe zehn Minuten bewusst im Strategist-Modus: Bring ein Thema in eine einfache Struktur. Beobachte, wie sich das anfühlt.',DurationMin:10,XP_Base:15,MinLevel:1,LifeAreas:['entscheidungen','arbeit']},
  {QuestID:'q41',Hero:'strategist',Type:'Discover',Title:'Einen Zug weiter denken', Instruction:'Denke bei einer heutigen Entscheidung bewusst einen Schritt weiter als sonst.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['entscheidungen']},

  {QuestID:'q51',Hero:'explorer',Type:'Activate', Title:'Neugier wecken', Instruction:'Probier heute bewusst eine kleine Sache aus, die du noch nie gemacht hast.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['fokus','selbstvertrauen']},
  {QuestID:'q52',Hero:'explorer',Type:'Perform',  Title:'Neuland betreten', Instruction:'Geh heute ein Thema an, bei dem du noch keine Erfahrung hast, und mach den ersten Schritt.',DurationMin:12,XP_Base:25,MinLevel:1,LifeAreas:['arbeit','selbstvertrauen']},
  {QuestID:'q53',Hero:'explorer',Type:'StopLimit',Title:'Nicht verzetteln', Instruction:'Beende bewusst eine angefangene Sache, bevor du etwas Neues beginnst.',DurationMin:3, XP_Base:15,MinLevel:1,LifeAreas:['fokus','stress']},
  {QuestID:'q50',Hero:'explorer',Type:'Discover',Title:'Explorer ausprobieren', Instruction:'Brich heute bewusst eine Routine und nimm einen ungewohnten Weg. Beobachte, was das mit dir macht.',DurationMin:5, XP_Base:10,MinLevel:1,LifeAreas:['fokus','selbstvertrauen']},
];
const DUMMY_DONE_TODAY = ['q03','q20'];
const DUMMY_STREAK = { q01:3, q11:5, q20:2 };

/* ---- Live-Daten (B2) ----
   Werden per Webhook befüllt; fallen auf Dummy zurück, wenn kein Fetch möglich. */
const WEBHOOK_URL = 'https://hook.eu1.make.com/smmkpjh8x1tgqmsx5mp4ossl86tqp2eg';
/* Noloco-Seite, die den fokus.html-iframe hostet.
   Slug = echter Noloco-Seiten-Slug der (versteckten) "Mein Fokus"-Seite.
   Die Seite entstand als Klon von "Meine Quests", daher der -clone-Slug. */
const FOCUS_PAGE_URL = 'https://app.6heroes.de/meine-quests-clone';
/* Noloco Record Page (automatisch generiert von "Meine Quest-Einträge"),
   die den submit.html-iframe via Submit_URL-Formelfeld hostet.
   Vollständige Ziel-URL = SUBMIT_PAGE_URL + '/' + entryId */
const SUBMIT_PAGE_URL = 'https://app.6heroes.de/exercise-entries/view';
/* Direkte Netlify-URL der Reflexions-Seite. Sie zieht alle Daten aus
   URL-Params + eigenem Webhook und braucht Noloco NICHT. Direkt hierhin
   zu navigieren umgeht den Noloco-Sync-Verzug ("This ExerciseEntries
   could not be found") vollständig. */
const SUBMIT_NETLIFY_URL = 'https://regal-mooncake-d3a250.netlify.app/submit.html';
/* Make-Webhook "Quest Session Create": legt einen ExerciseEntries-Record an
   (email + questId) und gibt { entryId } zurück. */
const QUEST_SESSION_WEBHOOK_URL = 'https://hook.eu1.make.com/6bcm1uggdn0jmvf3wxsvs1k76eiw4j0m';
/* Zentrale Preisseite für den Teaser: erster Quest gratis, restliche Quests
   für unbezahlte User gesperrt (Blur + Schloss). Klick auf gesperrte Quest
   -> hierhin. Deep-Link auf Jahres-Paket-Anker wie bei den Profil-Kacheln. */
const UPGRADE_URL = 'https://6heroes.de/preise.html#pricing';
/* WICHTIG: Kein automatischer Dummy-Fallback mehr (siehe Bug-3-Nachwirkung V91→V92).
   DUMMY_QUESTS bleibt nur als Referenz-/Testdaten-Konstante im Code, wird aber
   nirgends mehr automatisch als aktiver Zustand gesetzt. Ohne erfolgreichen
   Live-Load ist die Quest-Liste bewusst leer, bis loadFailed() den Fehlerzustand zeigt. */
let QUESTS     = [];
let DONE_TODAY = [];
let STREAK     = {};
let LOAD_FAILED = false;

/* Normalisiert eine Webhook-Quest auf das interne Format.
   Wichtig: Hero kommt aus Airtable groß ("Innovator") -> lowercase. */
function normalizeQuest(q){
  return {
    QuestID:     q.QuestID,
    Hero:        (q.Hero||'').toLowerCase(),
    Type:        q.Type,
    Title:       q.Title,
    Instruction: q.Instruction,
    DurationMin: Number(q.DurationMin)||0,
    XP_Base:     Number(q.XP_Base)||0,
    MinLevel:    Number(q.MinLevel)||1,
    // .trim() gegen führende Leerzeichen in Multi-Select-Optionen (Import-Artefakt),
    // damit der Fokus-Abgleich " fokus" == "fokus" zuverlässig matcht:
    LifeAreas:   Array.isArray(q.LifeAreas) ? q.LifeAreas.map(a=>String(a).trim()).filter(Boolean) : [],
  };
}

/* Toleranter Parser: nimmt den Roh-Text der Webhook-Antwort und versucht,
   ihn in ein Objekt zu verwandeln — auch wenn Make kleine JSON-Macken liefert
   (leere Felder wie "doneToday": , oder ein einzelnes Objekt statt Array).
   Gibt bei Erfolg das Objekt zurück, sonst null. */
function parseWebhookPayload(text){
  if (!text || !text.trim()) return null;
  // 1) Normalversuch
  try { return JSON.parse(text); } catch(_) {}
  // 2) Häufige Make-Macke reparieren: leerer Wert nach Doppelpunkt
  //    z.B.  "doneToday": ,   ->   "doneToday": [],
  //    und   "doneToday":  }  ->   "doneToday": [] }
  let repaired = text
    .replace(/:\s*,/g, ': [],')      // leerer Wert vor Komma
    .replace(/:\s*}/g, ': [] }')     // leerer Wert vor schließender Klammer
    .replace(/,\s*}/g, ' }')         // trailing comma vor }
    .replace(/,\s*]/g, ' ]');        // trailing comma vor ]
  try { return JSON.parse(repaired); } catch(e){
    console.warn('Payload auch nach Reparatur nicht parsebar:', e);
    return null;
  }
}

/* Macht aus quests IMMER ein Array — egal ob Make ein Array, ein einzelnes
   Objekt (bei nur 1 Record) oder nichts liefert. */
function asQuestArray(v){
  if (Array.isArray(v)) return v;
  if (v && typeof v === 'object') return [v];   // einzelnes Objekt -> 1-Element-Array
  return [];
}

async function loadData(email){
  if (!email) return false;               // kein User -> Dummy/Demo behalten
  const url = WEBHOOK_URL + '?email=' + encodeURIComponent(email);
  const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
  if (!res.ok) throw new Error('Webhook '+res.status);

  // Roh-Text lesen (nie blind res.json()) und tolerant parsen
  const raw  = await res.text();
  const data = parseWebhookPayload(raw);
  if (!data || typeof data !== 'object'){
    throw new Error('Webhook-Antwort nicht verwertbar');
  }

  // Jedes Feld defensiv behandeln — ein kaputtes Feld darf nicht alles killen
  const quests = asQuestArray(data.quests).map(normalizeQuest).filter(q => q.QuestID);
  if (!quests.length) {
    // Leeres Array ist ein Fehlerzustand, kein "alles ok, nichts Neues" — siehe Bug 3.
    throw new Error('Webhook lieferte leeres quests-Array');
  }
  QUESTS = quests;
  DONE_TODAY = Array.isArray(data.doneToday) ? data.doneToday : [];
  STREAK     = (data.streaks && typeof data.streaks === 'object' && !Array.isArray(data.streaks))
                 ? data.streaks : {};
  return true;
}

function getParams(){
  const p = new URLSearchParams(window.location.search);
  const nettos = {};
  HEROES.forEach(h => { const n=parseFloat(p.get(h.nettoKey)); nettos[h.key]=isNaN(n)?null:n; });
  const fr = (p.get('focus')||'').toLowerCase();
  const focus = fr ? fr.split(',').map(s=>s.trim()).filter(Boolean).slice(0,3) : [];
  return {
    nettos, focus,
    basis:(p.get('basis')||'').toLowerCase(), zweit:(p.get('zweit')||'').toLowerCase(),
    stress1:(p.get('stress1')||'').toLowerCase(), stress2:(p.get('stress2')||'').toLowerCase(),
    level: parseInt(p.get('level'))||1,
    email:(p.get('email')||'').trim(),
    // Fehlender Param = Vollansicht (paid), sicherer Default wie im Dashboard.
    // Nur explizit paid=0 schaltet den Teaser (erster Quest gratis) ein.
    paid: p.get('paid') !== '0',
  };
}
function withDemoFallback(P){
  if (!P.basis && !P.zweit && !P.stress1 && !P.stress2){
    P.basis='innovator'; P.zweit='guardian'; P.stress1='commander'; P.stress2='sage';
    P.nettos={innovator:2.1,guardian:0.8,commander:-1.2,sage:-2.4,strategist:1.4,explorer:0.6};
    P.level=2;
    if (!P.focus.length) P.focus=['arbeit','stress'];
  }
  return P;
}

function sortByContext(pool, focus){
  return pool.map((q,i)=>({q,i,s:getContextScores(q,focus)}))
             .sort((a,b)=>(b.s-a.s)||(a.i-b.i)).map(x=>x.q);
}
function pickForRole(heroKey, roleKey, netto, level, focus){
  const all = QUESTS.filter(q=>q.Hero===heroKey && q.MinLevel<=level);
  const order = ROLE_TYPES[roleKey]; const win = windowFor(netto); const groups=[];
  order.forEach(type => {
    let pool = all.filter(q=>q.Type===type);
    let limit = roleKey.startsWith('stress') ? win.StopLimit : win[type];
    let optional=[];
    if (type==='Perform'){
      const short=pool.filter(q=>q.DurationMin<=LONG_PERFORM_MIN);
      const long =pool.filter(q=>q.DurationMin> LONG_PERFORM_MIN);
      if (win.longPerform==='short'){ pool=short; }
      else if (win.longPerform==='option'){ pool=short; optional=sortByContext(long,focus).slice(0,1); }
    }
    pool = sortByContext(pool, focus);
    const chosen = pool.slice(0, Math.max(0,limit));
    if (chosen.length===0 && optional.length===0) return;
    groups.push({type, quests:chosen, optional});
  });
  return groups;
}
function pickForBrach(heroKey, level, focus){
  let pool = QUESTS.filter(q=>q.Hero===heroKey && q.Type==='Discover' && q.MinLevel<=level);
  if (!pool.length) return null;
  pool = sortByContext(pool, focus);
  return [{type:'Discover', quests:pool.slice(0,2), optional:[]}];
}

function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function focusBar(focus){
  const edit = `<a class="focus-edit" id="focusEdit" href="#">ändern</a>`;
  if (!focus.length){
    return `<div class="focus-bar"><span class="focus-label">Dein Fokus</span>
      <span class="focus-none">noch nicht gesetzt – wähle bis zu drei Bereiche</span>${edit}</div>`;
  }
  const chips = focus.map(f=>`<span class="focus-chip">${esc(LIFE_AREAS[f]||f)}</span>`).join('');
  return `<div class="focus-bar"><span class="focus-label">Dein Fokus</span>${chips}${edit}</div>`;
}

/* Teaser-Zustand: erster Quest gratis, restliche für unbezahlte User gesperrt.
   TEASER.paid wird in render() aus den Params gesetzt, TEASER.freeUsed zählt,
   ob der eine Gratis-Quest schon vergeben wurde. Nur echte, nicht-optionale,
   heute nicht erledigte Karten verbrauchen den Gratis-Slot. */
const TEASER = { paid:true, freeUsed:false };

function questCard(q, doneSet, optional, focus){
  const done = doneSet.has(q.QuestID);
  const streak = STREAK[q.QuestID]||0;
  // Erledigte Karten bleiben sichtbar (Habit-Modell), sind aber nicht mehr klickbar:
  // kein erneutes Session-Create für eine heute schon abgeschlossene Quest.
  // Nur erledigte Quests sind inert (kein erneutes Session-Create).
  // Optionale sind jetzt vollwertig ausführbar.
  const inert = done;

  // Sperr-Entscheidung: nur im Teaser (!paid), für jede echte offene Quest –
  // optionale eingeschlossen. Die erste bleibt frei; jede weitere wird gesperrt.
  let locked = false;
  if (!TEASER.paid && !done){
    if (!TEASER.freeUsed){ TEASER.freeUsed = true; }
    else { locked = true; }
  }

  const cls = 'quest'+(optional?' optional':'')+(done?' done-card':'')+(locked?' locked-card':'');
  const status = locked
    ? `<span class="status locked">Gesperrt</span>`
    : `<span class="status ${done?'done':''}">${done?'Heute erledigt ✓':'Offen'}</span>`;
  const optNote = optional ? `<div class="opt-note">Optional – nur, wenn du heute Kapazität hast.</div>` : '';
  const streakHtml = streak>0 ? `<span class="streak">${streak} Tage in Folge</span>` : '';
  const match = (!optional && !done && !locked && getContextScores(q,focus)>0) ? `<span class="match">Passt zu deinem Fokus</span>` : '';
  // Gesperrte Karten sind per Tastatur/Klick erreichbar (führen zur Preisseite).
  const tab = (inert && !locked) ? '' : 'tabindex="0" role="button"';
  const lockOverlay = locked
    ? `<div class="lock-overlay"><span class="lock-badge">🔒</span>
         <span class="lock-cta">Jetzt freischalten</span></div>`
    : '';
  return `<div class="${cls}" ${tab} data-quest="${q.QuestID}"${locked?' data-locked="1"':''}>
    <div class="quest-top"><div class="quest-main">${optNote}
      <div class="quest-title">${esc(q.Title)}</div>
      <div class="quest-instr">${esc(q.Instruction)}</div>
      <div class="quest-foot"><span>${q.DurationMin} Min</span>
        <span class="xp">+${q.XP_Base} XP</span>${streakHtml}${match}</div>
    </div>${status}</div>${lockOverlay}</div>`;
}

function typeGroup(g, doneSet, focus){
  const t = TYPES[g.type];
  const cards = g.quests.map(q=>questCard(q,doneSet,false,focus)).join('')
              + g.optional.map(q=>questCard(q,doneSet,true,focus)).join('');
  return `<div class="typegroup"><div class="type-head">${t.label} <span>· ${t.desc}</span></div>${cards}</div>`;
}

function block(roleKey, heroKey, netto, groups, doneSet, focus){
  const meta = ROLE_META[roleKey];
  const heroLabel = (HEROES.find(h=>h.key===heroKey)||{}).label || heroKey;
  let lead;
  if (roleKey==='brach'){
    lead = `<div class="brach-intro">${esc(heroLabel)} gibt dir Energie, gehört aber nicht zu deinen Hauptmodi. Ein paar Quests zum Reinschnuppern – ganz unverbindlich.</div>`;
  } else {
    lead = `<div class="block-sub">${meta.sub}</div><div class="block-energy">${energyLine(netto)}</div>`;
  }
  return `<div class="block"><div class="block-head">
    <div class="block-role">${meta.label}</div>
    <div class="block-hero" style="color:${heroColor(heroKey)}">${esc(heroLabel)}</div></div>
    ${lead}${groups.map(g=>typeGroup(g,doneSet,focus)).join('')}</div>`;
}

/* ---- Heldenrad-Navigation (V124) -----------------------------------
   Baut ein SVG-Rad als Navigation vor die bestehenden Held-Blöcke.
   Sechs Sektoren in Heldenfarbe; Rolle bestimmt Badge + ob gedämpft
   (brach). Zahl im Segment = offene (nicht erledigte) Quests des Helden.
   Klick schaltet den zugehörigen .hero-panel-Block sichtbar. Der ganze
   Render-/Submit-/Teaser-Code darunter bleibt unverändert. */

// Reihenfolge im Uhrzeigersinn ab 12 Uhr, wie im Original-Rad-Bild:
// Innovator (oben rechts), Commander, Strategist, Sage, Guardian, Explorer.
const WHEEL_ORDER = ['innovator','commander','strategist','sage','guardian','explorer'];
const ROLE_BADGE = { basis:'B', zweit:'Z', stress1:'S1', stress2:'S2' };

function polar(cx,cy,r,deg){
  const a=(deg-90)*Math.PI/180;
  return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
}
function annularSeg(cx,cy,rOuter,rInner,a0,a1){
  const [ox0,oy0]=polar(cx,cy,rOuter,a0), [ox1,oy1]=polar(cx,cy,rOuter,a1);
  const [ix1,iy1]=polar(cx,cy,rInner,a1), [ix0,iy0]=polar(cx,cy,rInner,a0);
  const large = (a1-a0)>180?1:0;
  return `M${ox0.toFixed(2)},${oy0.toFixed(2)} `
       + `A${rOuter},${rOuter} 0 ${large} 1 ${ox1.toFixed(2)},${oy1.toFixed(2)} `
       + `L${ix1.toFixed(2)},${iy1.toFixed(2)} `
       + `A${rInner},${rInner} 0 ${large} 0 ${ix0.toFixed(2)},${iy0.toFixed(2)} Z`;
}

/* Liefert je Held: alle zugewiesenen Rollen (roles[]), eine primäre Rolle
   (nach Priorität Basis > Zweit > Stress), und offene Quest-Anzahl.
   Ein Held kann mehrere Rollen tragen — typischer Fall: Stress1 und Stress2
   sind derselbe Held. Dann sollen beide Badges (S1 S2) erscheinen. */
const ROLE_PRIORITY = ['basis','zweit','stress1','stress2'];
function wheelModel(P, doneSetLocal){
  const rolesByHero = {};
  [['basis',P.basis],['zweit',P.zweit],['stress1',P.stress1],['stress2',P.stress2]]
    .forEach(([role,hero])=>{ if(hero){ (rolesByHero[hero]=rolesByHero[hero]||[]).push(role); } });

  return WHEEL_ORDER.map(hero=>{
    const roles = rolesByHero[hero] || [];       // leer = brachliegend
    // Primäre Rolle nach Priorität; bestimmt Panel, Farbe und erlaubte Typen.
    const role = ROLE_PRIORITY.find(r=>roles.includes(r)) || null;
    // Erlaubte Typen = Vereinigung aller Rollen des Helden (bei Doppel-Stress
    // identisch, aber sauber für künftige Kombis wie Basis+Zweit).
    const allowed = roles.length
      ? [...new Set(roles.flatMap(r=>ROLE_TYPES[r]))]
      : ['Discover'];
    const open = QUESTS.filter(q =>
      q.Hero===hero &&
      allowed.includes(q.Type) &&
      q.MinLevel<=P.level &&
      !doneSetLocal.has(q.QuestID)
    ).length;
    return { hero, role, roles, open,
             label:(HEROES.find(h=>h.key===hero)||{}).label||hero,
             color:heroColor(hero) };
  });
}

function heroWheel(model){
  // Rad-Maße. PAD_X schafft links/rechts Platz für die außen hängenden Badges,
  // ohne das Rad selbst zu verkleinern (Höhe = Raddurchmesser + kleiner Rand).
  const D=300, PAD_X=42, PAD_Y=14;
  const VBW=D+PAD_X*2, VBH=D+PAD_Y*2;
  const cx=VBW/2, cy=VBH/2, rOuter=140, rInner=64, gap=1.4;
  const n=model.length, step=360/n;
  let segs='';
  model.forEach((m,i)=>{
    const a0=i*step+gap, a1=(i+1)*step-gap, mid=(a0+a1)/2;
    const brach = m.role===null;
    const path = annularSeg(cx,cy,rOuter,rInner,a0,a1);
    // Label und Zahl vertikal gestapelt auf dem mittleren Radius:
    // Name oben, Zähl-Chip darunter — überschneidet sich nie, egal wie lang der Name.
    const rMid=(rOuter+rInner)/2;
    const [mx,my]=polar(cx,cy,rMid,mid);
    const labelY = my-9, countY = my+13;
    // Rollen-Badge(s) knapp außerhalb des Rings (im PAD_X-Rand).
    // Ein Held kann mehrere Rollen tragen (z.B. Stress1+Stress2 = selber Held);
    // dann als Reihe nebeneinander, horizontal um den Ankerpunkt zentriert.
    const [bx,by]=polar(cx,cy,rOuter+15,mid);
    const badgeColorFor = (role)=> (role==='stress1'||role==='stress2') ? '#B5321F'
                     : (role==='basis') ? '#F2B705'
                     : (role==='zweit') ? '#E06A1E' : '#555';
    const badgeTextColorFor = (role)=> (role==='basis') ? '#20293A' : '#fff';
    let badgesSvg='';
    if (m.roles && m.roles.length){
      const badges = m.roles.map(r=>({txt:ROLE_BADGE[r], w:ROLE_BADGE[r].length>1?22:16, color:badgeColorFor(r), tc:badgeTextColorFor(r)}));
      const bgap=3;
      const totalW = badges.reduce((s,b)=>s+b.w,0) + bgap*(badges.length-1);
      let curX = bx - totalW/2;
      badges.forEach(b=>{
        const cxB = curX + b.w/2;
        badgesSvg += `<rect class="role-badge-rect" x="${curX.toFixed(1)}" y="${(by-9).toFixed(1)}"
              width="${b.w}" height="18" rx="4" fill="${b.color}"></rect>
      <text class="role-badge-text" x="${cxB.toFixed(1)}" y="${(by+0.5).toFixed(1)}"
            text-anchor="middle" dominant-baseline="middle" fill="${b.tc}">${b.txt}</text>`;
        curX += b.w + bgap;
      });
    }
    const roleAria = (m.roles && m.roles.length)
      ? ', ' + m.roles.map(r=>ROLE_META[r].label).join(' und ')
      : '';

    segs += `
    <g class="wheel-seg${brach?' is-brach':''}" data-hero="${m.hero}" tabindex="0" role="button"
       aria-label="${esc(m.label)}${roleAria}, ${m.open} offene Quests">
      <path class="seg-path" d="${path}" fill="${m.color}"></path>
      <text class="seg-label" x="${mx.toFixed(1)}" y="${labelY.toFixed(1)}"
            text-anchor="middle" dominant-baseline="middle">${esc(m.label)}</text>
      <circle class="seg-count-bg" cx="${mx.toFixed(1)}" cy="${countY.toFixed(1)}" r="11"
              fill="rgba(0,0,0,0.32)"></circle>
      <text class="seg-count" x="${mx.toFixed(1)}" y="${countY.toFixed(1)}"
            text-anchor="middle" dominant-baseline="central">${m.open}</text>
      ${badgesSvg}
    </g>`;
  });

  return `
  <div class="wheel-wrap">
    <div class="wheel-hint">Tippe auf einen Helden, um seine Quests zu sehen</div>
    <svg class="wheel-svg" viewBox="0 0 ${VBW} ${VBH}" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Heldenrad – wähle einen Helden">
      ${segs}
      <circle class="wheel-hub-ring" cx="${cx}" cy="${cy}" r="${rInner-4}"></circle>
      <text class="wheel-hub-text" x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle">6H</text>
    </svg>
  </div>`;
}

/* Schaltet sichtbaren Held-Block + aktives Segment um. */
function activateHero(heroKey){
  document.querySelectorAll('.hero-panel').forEach(p=>{
    p.classList.toggle('is-open', p.dataset.hero===heroKey);
  });
  document.querySelectorAll('.wheel-seg').forEach(s=>{
    s.classList.toggle('is-active', s.dataset.hero===heroKey);
  });
  postHeight();
}

function bindWheel(defaultHero){
  document.querySelectorAll('.wheel-seg').forEach(seg=>{
    const go=(ev)=>{ if(ev){ev.preventDefault();ev.stopPropagation();}
      activateHero(seg.dataset.hero); };
    seg.addEventListener('click',go);
    seg.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e);}});
  });
  if (defaultHero) activateHero(defaultHero);
}

let doneSet;
function render(){
  const P = withDemoFallback(getParams());
  // Teaser-Zustand pro Render zurücksetzen: erster Quest gratis, Rest gesperrt.
  TEASER.paid = P.paid;
  TEASER.freeUsed = false;
  doneSet = new Set(DONE_TODAY);
  document.getElementById('focusbar').innerHTML = focusBar(P.focus);
  const el = document.getElementById('content');

  if (LOAD_FAILED){
    el.innerHTML = `<div class="empty">
      Deine Quests konnten gerade nicht geladen werden.<br>
      Bitte lade die Seite neu — falls es weiterhin nicht klappt, melde dich kurz beim Support.
      <div style="margin-top:12px">
        <button type="button" id="reloadQuests" style="cursor:pointer">Erneut versuchen</button>
      </div>
    </div>`;
    const btn = document.getElementById('reloadQuests');
    if (btn) btn.addEventListener('click', ()=>{ location.reload(); });
    postHeight();
    return;
  }

  const roleAssignRaw = [
    {roleKey:'basis',hero:P.basis},{roleKey:'zweit',hero:P.zweit},
    {roleKey:'stress1',hero:P.stress1},{roleKey:'stress2',hero:P.stress2},
  ].filter(r=>r.hero);

  if (!roleAssignRaw.length){
    el.innerHTML = `<div class="empty">Hier erscheinen deine Quests, sobald du den Fragebogen abgeschlossen hast.</div>`;
    bindEvents(); postHeight(); return;
  }
  // Pro Held nur EIN Eintrag: primäre Rolle nach Priorität (Basis > Zweit >
  // Stress1 > Stress2). Fängt den Fall ab, dass ein Held mehrere Rollen trägt
  // (typisch: Stress1 und Stress2 sind derselbe Held) — sonst würde das Panel
  // doppelt gebaut und mit der zweitrangigen Rolle beschriftet.
  const roleRank = {basis:0,zweit:1,stress1:2,stress2:3};
  const byHero = {};
  roleAssignRaw.forEach(r=>{
    if (!byHero[r.hero] || roleRank[r.roleKey] < roleRank[byHero[r.hero].roleKey]) byHero[r.hero]=r;
  });
  const roleAssign = Object.values(byHero);
  const used = new Set(roleAssign.map(r=>r.hero));

  // Panels je Held bauen (nach Rolle), in umschaltbare Container gewickelt.
  // Reihenfolge egal – Sichtbarkeit steuert das Rad. Wir bauen ALLE sechs
  // Helden, damit jedes Rad-Segment ein Panel zum Aufklappen hat.
  const panels = {};
  roleAssign.forEach(r=>{
    const netto=P.nettos[r.hero];
    const groups=pickForRole(r.hero,r.roleKey,netto,P.level,P.focus);
    if (groups.length) panels[r.hero]=block(r.roleKey,r.hero,netto,groups,doneSet,P.focus);
  });
  // Brachliegende: alle übrigen Helden (unabhängig von Netto-Schwelle, damit
  // jedes gedämpfte Rad-Segment beim Klick auch Discover-Quests zeigt).
  HEROES.map(h=>h.key).filter(k=>!used.has(k)).forEach(k=>{
    const groups=pickForBrach(k,P.level,P.focus);
    if (groups) panels[k]=block('brach',k,(P.nettos[k]!=null?P.nettos[k]:null),groups,doneSet,P.focus);
  });

  // Rad-Modell + Default-Held (Basis, sonst erster zugewiesener).
  const model = wheelModel(P, doneSet);
  const defaultHero = P.basis || (roleAssign[0] && roleAssign[0].hero) || WHEEL_ORDER[0];

  let html = heroWheel(model);
  html += '<div class="hero-panels">';
  WHEEL_ORDER.forEach(hero=>{
    if (panels[hero]) html += `<div class="hero-panel" data-hero="${hero}">${panels[hero]}</div>`;
  });
  html += '</div>';

  el.innerHTML = html;
  bindEvents();
  bindWheel(panels[defaultHero] ? defaultHero : Object.keys(panels)[0]);
  postHeight();
}

/* Ladeanzeige für die Wartezeit vor der Weiterleitung. Ohne sie wirkt
   die Verzögerung wie ein Hänger — der Nutzer klickt sonst mehrfach. */
function showLoadingOverlay(msg){
  if (document.getElementById('questLoadingOverlay')) return;
  const ov = document.createElement('div');
  ov.id = 'questLoadingOverlay';
  ov.style.cssText =
    'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;' +
    'justify-content:center;flex-direction:column;gap:16px;' +
    'background:rgba(32,41,58,0.92);backdrop-filter:blur(2px);' +
    "font-family:'Inter',system-ui,sans-serif;color:#F4F1E9;font-size:15px;";
  ov.innerHTML =
    '<div style="width:34px;height:34px;border:3px solid rgba(244,241,233,0.2);' +
    'border-top-color:#F2B705;border-radius:50%;' +
    'animation:questSpin .8s linear infinite"></div>' +
    '<div>' + (msg || 'Einen Moment …') + '</div>' +
    '<style>@keyframes questSpin{to{transform:rotate(360deg)}}</style>';
  document.body.appendChild(ov);
}

function hideLoadingOverlay(){
  const ov = document.getElementById('questLoadingOverlay');
  if (ov) ov.remove();
}

function bindEvents(){
  // Gesperrte Teaser-Karten: Klick/Enter führt zur Preisseite, kein Session-Create.
  document.querySelectorAll('.quest.locked-card[data-locked="1"]').forEach(card=>{
    const goUpgrade=(ev)=>{
      if (ev){ ev.preventDefault(); ev.stopPropagation(); }
      try { window.parent.location.href = UPGRADE_URL; }
      catch(_) { window.location.href = UPGRADE_URL; }
    };
    card.addEventListener('click',goUpgrade);
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();goUpgrade(e);}});
  });

  document.querySelectorAll('.quest[data-quest]:not(.done-card):not(.locked-card)').forEach(card=>{
    const open=async (ev)=>{
      /* Verhindert, dass ein evtl. vorhandener Noloco-Handler parallel
         navigiert — der landet sonst auf einem Record, den Noloco noch
         nicht synchronisiert hat ("This ExerciseEntries could not be found"). */
      if (ev){ ev.preventDefault(); ev.stopPropagation(); }
      if (card.dataset.loading === '1') return;   // Doppelklick verhindern
      const id=card.getAttribute('data-quest');
      const q = QUESTS.find(x=>x.QuestID===id);
      if (!q) return;
      const P = getParams();
      if (!P.email) return;   // ohne Email kein Session-Record möglich

      card.dataset.loading = '1';
      const prevCursor = card.style.cursor;
      card.style.cursor = 'wait';
      try {
        const res = await fetch(QUEST_SESSION_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: P.email, questId: q.QuestID })
        });
        if (!res.ok) throw new Error('Quest Session Create '+res.status);
        const raw = await res.text();
        const data = parseWebhookPayload(raw);
        if (!data || !data.entryId) throw new Error('Keine entryId in Antwort');

        /* Modul 8 (Webhook Response) liefert die nackte Airtable-Record-ID.
           Das E_-Präfix wird trotzdem toleriert, falls die Response später
           wieder auf die Präfix-Variante umgestellt wird. */
        const cleanId = String(data.entryId).replace(/^E_/, '').trim();
        if (!/^rec[A-Za-z0-9]{14}$/.test(cleanId)){
          throw new Error('Unerwartete entryId: ' + data.entryId);
        }

        /* Direkt auf die Netlify-Seite navigieren — NICHT auf die Noloco-
           Record-Page. submit.html lädt Titel/Instruction selbst per Webhook
           und braucht nur die drei URL-Params. So entfällt der Noloco-Sync
           komplett und der "not found"-Fehler kann nicht mehr auftreten. */
        const params = new URLSearchParams({
          email:   P.email,
          qid:     q.QuestID,
          entryId: cleanId
        });
        const url = SUBMIT_NETLIFY_URL + '?' + params.toString();
        try { window.parent.location.href = url; }
        catch(_) { window.location.href = url; }
      } catch(e){
        console.warn('Quest-Session konnte nicht erstellt werden:', e);
        hideLoadingOverlay();
        card.dataset.loading = '0';
        card.style.cursor = prevCursor;
      }
    };
    card.addEventListener('click',open);
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e);}});
  });
  const edit=document.getElementById('focusEdit');
  if (edit) edit.addEventListener('click',e=>{ e.preventDefault();
    const P = getParams();
    const q = new URLSearchParams();
    if (P.email) q.set('email', P.email);
    if (P.focus && P.focus.length) q.set('focus', P.focus.join(','));
    const url = FOCUS_PAGE_URL + (q.toString() ? ('?'+q.toString()) : '');
    // Parent (Noloco) navigieren, nicht den iframe selbst
    try { window.parent.location.href = url; }
    catch(_) { window.location.href = url; }   // Fallback falls kein Parent
  });
}

let lastH = 0;
function postHeight(){
  const h = Math.max(
    document.body.scrollHeight,
    document.documentElement.scrollHeight,
    document.body.offsetHeight,
    document.documentElement.offsetHeight
  );
  if (h === lastH) return;
  lastH = h;
  parent.postMessage({type:"6heroes:setHeight",height:h},"*");
}
async function init(){
  const email = getParams().email;
  if (!email){
    // Kein eingeloggter User -> reine Vorschau/Demo-Ansicht (z.B. Marketing-Preview).
    // Hier sind Beispiel-Quests bewusst und unkritisch, da nichts anklickbar echte
    // Sessions gegen Airtable/Make erzeugen soll (kein User = kein Session-Create möglich).
    QUESTS = DUMMY_QUESTS; DONE_TODAY = DUMMY_DONE_TODAY; STREAK = DUMMY_STREAK;
    LOAD_FAILED = false;
    render();
    return;
  }
  try {
    await loadData(email);
    LOAD_FAILED = false;
  } catch(e){
    // Echter Lade-/Parse-/Server-Fehler bei eingeloggtem User: sichtbar machen statt
    // still auf Dummy-Daten auszuweichen. Stille Fallbacks haben in der Vergangenheit
    // dazu geführt, dass nicht existierende Dummy-QuestIDs an "Quest Session Create"
    // gesendet wurden (siehe V91/V92-Vorfall).
    console.warn('Quest-Daten konnten nicht geladen werden:', e);
    QUESTS = []; DONE_TODAY = []; STREAK = {};
    LOAD_FAILED = true;
  }
  render();
}
window.addEventListener("load",init);
window.addEventListener("resize",postHeight);
if (window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
if (document.fonts && document.fonts.ready){ document.fonts.ready.then(postHeight); }
[50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
</script>
