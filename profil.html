<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Profil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #20293A; }
  html, body { background: var(--navy); -webkit-font-smoothing: antialiased; }
  .profil-stack { display: block; background: var(--navy); max-width: 760px; margin: 0 auto; }
  .sec { display: block; width: 100%; font-size: 0; }
  .sec iframe { display: block; width: 100%; border: 0; background: var(--navy); vertical-align: top; }
</style>
</head>
<body>
<div class="profil-stack" id="stack">
  <div class="sec"><iframe id="f-rad"     scrolling="no" title="Heldenkompass"></iframe></div>
  <div class="sec"><iframe id="f-tiles"   scrolling="no" title="Deine Helden"></iframe></div>
  <div class="sec"><iframe id="f-stress"  scrolling="no" title="Deine Stressdynamik"></iframe></div>
  <div class="sec"><iframe id="f-energie" scrolling="no" title="Deine Energiebilanz"></iframe></div>
</div>
<script>
const BASE = 'https://regal-mooncake-d3a250.netlify.app';
const FIXED_HEIGHT = { rad: 500 };

function getParams(){
  const p = new URLSearchParams(location.search);
  const g = k => (p.get(k) || '').trim();
  return {
    basis:g('basis'), zweit:g('zweit'), stress1:g('stress1'), stress2:g('stress2'),
    paid: g('paid') === '1' ? '1' : '0',
    ni:g('ni'), nc:g('nc'), nst:g('nst'), ns:g('ns'), ng:g('ng'), ne:g('ne'),
    si:g('si'), sc:g('sc'), ss:g('ss'), sa:g('sa'), sg:g('sg'), se:g('se'),
  };
}
function buildUrls(P){
  const rad = new URLSearchParams();
  if(P.basis)rad.set('b',P.basis); if(P.zweit)rad.set('z',P.zweit);
  if(P.stress1)rad.set('s1',P.stress1); if(P.stress2)rad.set('s2',P.stress2);
  rad.set('mode', P.paid==='1'?'full':'free');
  ['si','sc','ss','sa','sg','se'].forEach(k=>{ if(P[k])rad.set(k,P[k]); });
  const tiles = new URLSearchParams();
  ['basis','zweit','stress1','stress2'].forEach(k=>{ if(P[k])tiles.set(k,P[k]); });
  tiles.set('paid',P.paid);
  const stress = new URLSearchParams();
  if(P.stress1)stress.set('stress1',P.stress1);
  if(P.stress2)stress.set('stress2',P.stress2);
  const ener = new URLSearchParams();
  ['basis','zweit','stress1','stress2'].forEach(k=>{ if(P[k])ener.set(k,P[k]); });
  ener.set('paid',P.paid);
  ['ni','nc','nst','ns','ng','ne'].forEach(k=>{ if(P[k])ener.set(k,P[k]); });
  return {
    rad:     BASE+'/6heroes_rad-4_light-3.html?'+rad.toString(),
    tiles:   BASE+'/profil-kacheln.html?'+tiles.toString(),
    stress:  BASE+'/stresskurve.html?'+stress.toString(),
    energie: BASE+'/energie.html?'+ener.toString(),
  };
}
const frames = {};
const heights = {};
function setHeight(key, h){
  if (FIXED_HEIGHT[key] != null) h = FIXED_HEIGHT[key];
  h = Math.round(h);
  if (heights[key] != null && Math.abs(heights[key] - h) <= 1) return;
  heights[key] = h;
  if (frames[key]) frames[key].style.height = h + 'px';
  scheduleOwnHeight();
}
function initFrames(){
  const P = getParams();
  const urls = buildUrls(P);
  ['rad','tiles','stress','energie'].forEach(key=>{
    frames[key] = document.getElementById('f-'+key);
    const start = FIXED_HEIGHT[key] || 460;
    frames[key].style.height = start + 'px';
    heights[key] = start;
    frames[key].src = urls[key];
  });
}
window.addEventListener('message', function(e){
  const d = e.data;
  if (!d || d.type !== '6heroes:setHeight' || !d.height) return;
  for (const key in frames){
    if (frames[key] && frames[key].contentWindow === e.source){ setHeight(key, d.height); return; }
  }
});
let ownTimer = null, lastOwn = 0;
function scheduleOwnHeight(){
  if (ownTimer) return;
  ownTimer = setTimeout(function(){
    ownTimer = null;
    let total = 0;
    for (const k in heights) total += (heights[k] || 0);
    if (Math.abs(total - lastOwn) <= 1) return;
    lastOwn = total;
    parent.postMessage({ type:'6heroes:setHeight', height: total + 4 }, '*');
  }, 120);
}
window.addEventListener('load', initFrames);
</script>
</body>
</html>
