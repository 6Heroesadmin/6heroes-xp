<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Langzeitprofil – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--ok:#1F9D62;--warn:#B4471B;--gold:#F2B705;--accent:#0B63CE;--accent2:#F0672A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 72px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.topbar svg{width:20px;height:20px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 6px}
.emb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'DM Serif Display',Georgia,serif;font-size:38px}
.emb2{display:flex}
.emb2 .emb{width:68px;height:68px;border-radius:34px;font-size:30px;border:3px solid var(--bg)}
.emb2 .emb+.emb{margin-left:-14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.15}
h1 .accent{color:var(--accent)}
.hook{font-size:16px;line-height:1.6;color:var(--mute);max-width:54ch}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
details[open]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s1{display:flex;flex-direction:column;gap:1px}
summary .a{font-size:15.5px;font-weight:600;line-height:1.35}
summary .b{font-size:12.5px;color:var(--mute)}
summary:after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details[open] summary:after{transform:rotate(45deg)}
.body{padding:2px 18px 20px;display:flex;flex-direction:column;gap:18px}
.blk{display:flex;flex-direction:column;gap:6px}
.bl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bl.ok{color:var(--ok)}.bl.warn{color:var(--warn)}
p{font-size:15.5px;line-height:1.7}
ul{padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:15.5px;line-height:1.6}
.card{display:flex;flex-direction:column;gap:18px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding-top:30px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.pill:hover{border-color:var(--ink)}
@media (max-width:480px){.wrap{padding:8px 16px 56px}}

.dummy{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8A5A00;background:#FFF3D1;border:1px solid #F2D58A;border-radius:999px;padding:3px 10px}
.hero2{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 4px}
.story{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px}
.story p{font-family:'DM Serif Display',Georgia,serif;font-size:20px;line-height:1.55;color:var(--ink)}
.story .meta{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:'DM Serif Display',Georgia,serif;font-size:30px;line-height:1.15}
.tile .t{font-size:12.5px;color:var(--mute)}
.bar{height:10px;border-radius:6px;background:#ECE7DB;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.goal b{font-size:15.5px}
.goal span{font-size:14px;color:var(--mute)}
.bd{display:flex;align-items:center;gap:14px}
.bdc{flex:none;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.bdc.on{background:var(--gold);color:#20293A}
.bdc.off{border:2px dashed #C9C2B2;color:#9A9384}
.bdc svg{width:22px;height:22px}
.bd .x{display:flex;flex-direction:column;gap:1px}
.bd .x b{font-size:15px}.bd .x span{font-size:13.5px;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 6px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px 'Inter',sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.week{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.wk{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:14px 2px 0}
.wbild{background:#F0ECE0;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.wbild .bl{color:var(--mute)}
.ent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ent .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:10px;height:10px;border-radius:5px;border:1.5px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.dots em{font-style:normal;font-size:12.5px;margin-left:6px;color:var(--mute)}
.ent .sit{font-size:15.5px;font-weight:600;line-height:1.45}
.ent .rb{font-size:15px;line-height:1.65;color:var(--ink);border-left:3px solid var(--line);padding-left:12px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.tag.ok{background:#E3F4EA;color:#17724A}.tag.mid{background:#F4EFE0;color:#7A6420}.tag.no{background:#F6E5DD;color:#8F3A17}
.meta2{font-size:13px;color:var(--mute);text-align:center;max-width:46ch}
.beleg{display:inline-block;font-size:12.5px;color:var(--mute);background:#F0ECE0;border-radius:8px;padding:4px 10px}
.two{display:grid;grid-template-columns:1fr;gap:12px}
.two>div{background:#F0ECE0;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fact{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .ft{font-size:15px;line-height:1.5}.fact .fd{font-size:12.5px;color:var(--mute)}
.fact button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:600 13px 'Inter',sans-serif;color:var(--warn);cursor:pointer}
.story2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.story2 p{font-size:16.5px;line-height:1.75}
.story2 p.lead{font-family:'DM Serif Display',Georgia,serif;font-size:21px;line-height:1.5}
.story2 .meta{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.quote{border-left:3px solid var(--gold);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:2px}
.quote p{font-size:15.5px;font-style:italic}
.quote span{font-size:12.5px;color:var(--mute)}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.note a{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--gold);color:#20293A;font-weight:700;font-size:15px;text-decoration:none}
.lock-wrap{position:relative}
.lock-wrap.locked .lockable{filter:blur(6px);opacity:.5;pointer-events:none;user-select:none}
.lock-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:80px;gap:14px;text-align:center}
.lock-wrap.locked .lock-overlay{display:flex}
.lock-overlay .t{font-size:17px;font-weight:700;max-width:360px;line-height:1.45}
.lock-overlay a{display:inline-flex;align-items:center;min-height:44px;padding:0 26px;border-radius:999px;background:var(--gold);color:#20293A;font-weight:700;font-size:15px;text-decoration:none}
.fact{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.fact .row2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fact .ask{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--mute)}
.fact .ask button{color:var(--ink)}
.fact .ask button.ja{color:#fff;background:var(--warn);border-color:var(--warn)}
.hinweis{font-size:13px;color:var(--mute);padding:4px 2px 0}
.ok-note{font-size:13.5px;color:var(--ok);font-weight:600}
.err{text-align:center;color:var(--warn);padding:40px 16px;font-size:15px;display:flex;flex-direction:column;gap:14px;align-items:center}
.err button{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:#fff;font:600 14px 'Inter',sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Langzeitprofil, Build 2026-11-02 v1
   Daten: Make Langzeitprofil_Laden (Users.Langzeit_JSON). Vergessen: Make Fakt_Vergessen.
   URL-Parameter: email, frame. Vorschau ohne Make: ?demo=voll | frueh | keine */
const BUILD='2026-11-02 Langzeitprofil v1';
var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';
const MB_URL='https://app.6heroes.de/mein-bereich';
const ACCOUNT_URL='https://app.6heroes.de/account';
const LZ_WEBHOOK_URL='HIER_URL_LANGZEITPROFIL_LADEN';   /* EINTRAGEN */
const VERGESSEN_WEBHOOK_URL='HIER_URL_FAKT_VERGESSEN';  /* EINTRAGEN */
const LOAD_TOKEN='20569c7734eae0c5da881e2d0221959e';
const Q=new URLSearchParams(location.search);
const EMAIL=(Q.get('email')||'').trim();
const DEMO=Q.get('demo')||'';
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lab=t=>'<div class="label">'+esc(t)+'</div>';
const acc=(a,sub,inner,open)=>'<details'+(open?' open':'')+'><summary><span class="s1"><span class="a">'+esc(a)+'</span>'+(sub?'<span class="b">'+esc(sub)+'</span>':'')+'</span></summary><div class="body">'+inner+'</div></details>';
const topbar='<div class="topbar"><a href="'+MB_URL+'" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mein Bereich</a></div>';
const kopf='<div class="hero2"><span class="eyebrow">Langzeitprofil</span><h1>Was ich über dich sehe</h1><p class="meta2">Eine Zusammenfassung deiner letzten Wochen, so, wie ein Coach sie schreiben würde.</p></div>';
function datum(s){if(!s)return '';const d=new Date(String(s).slice(0,10)+'T12:00:00Z');if(isNaN(d))return '';return d.getUTCDate()+'. '+MONATE[d.getUTCMonth()];}
const liste=v=>Array.isArray(v)?v.filter(x=>String(x||'').trim()):(v?[v]:[]);

let D=null;
async function post(url,body){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),20000);
  try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});return {ok:r.ok,text:(await r.text()).trim()};}
  finally{clearTimeout(t);}
}
async function laden(){
  if(DEMO)return demo(DEMO);
  const r=await post(LZ_WEBHOOK_URL,{aktion:'langzeitprofil',token:LOAD_TOKEN,user_id:EMAIL});
  if(!r.ok)throw new Error('HTTP');
  const d=JSON.parse(r.text);
  if(!d||typeof d!=='object')throw new Error('leer');
  return d;
}

function profilHtml(p,erstellt){
  const bild=liste(p.bild);
  let h='<div class="story2">'+bild.map((x,i)=>'<p class="'+(i===0?'lead':'')+'">'+esc(x)+'</p>').join('')
    +'<div class="meta">Zuletzt geschrieben am '+esc(datum(erstellt)||p.stand||'')+'. Ich schreibe es etwa zweimal im Monat fort und nehme dabei mit, was du mir seitdem erzählt hast.</div></div>';
  const themen=(Array.isArray(p.themen)?p.themen:[]).filter(t=>t&&t.titel);
  if(themen.length)h+=lab('Was ich bei dir sehe')+'<div class="stack">'+themen.map((t,i)=>acc(t.titel,'',
      liste(t.absaetze).map(x=>'<p>'+esc(x)+'</p>').join('')
      +(liste(t.zitate).length?'<div class="blk"><span class="bl">Woran ich das sehe</span>'+liste(t.zitate).map(q=>'<div class="quote"><p>„'+esc(q)+'“</p></div>').join('')+'</div>':''),i===0)).join('')+'</div>';
  /* vorher_jetzt: Objekt {vorher,jetzt} (Prompt) oder ältere Form */
  const vj=p.vorher_jetzt||{};const vor=String(vj.vorher||'').trim(),jetzt=String(vj.jetzt||'').trim();
  if(vor&&jetzt)h+=lab('Was sich verändert hat')+'<div class="two"><div><span class="bl">Am Anfang</span><p>'+esc(vor)+'</p></div><div><span class="bl">Heute</span><p>'+esc(jetzt)+'</p></div></div>';
  const offen=liste(p.offen);
  if(offen.length)h+=lab('Was noch offen ist')+'<div class="card">'+offen.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
  return h;
}
function faktenHtml(fakten){
  const fs=(fakten||[]).slice().sort((a,b)=>String(b.datum).localeCompare(String(a.datum)));
  if(!fs.length)return '';
  return lab('Was ich über dich weiß')+'<div class="stack">'+acc('So habe ich es mir notiert','Du kannst jede einzelne Angabe vergessen lassen',
    '<div id="facts">'+fs.map(f=>'<div class="fact" data-id="'+esc(f.id)+'"><div class="row2"><div><div class="ft">'+esc(f.text)+'</div><div class="fd">'+(f.datum?'Aus deinem Rückblick vom '+esc(datum(f.datum)):'')+'</div></div><button type="button" class="vg">Vergessen</button></div></div>').join('')
    +'</div><p class="hinweis">Was du vergessen lässt, ist sofort gelöscht. Im Text oben verschwindet es, wenn ich dein Profil das nächste Mal fortschreibe.</p>')+'</div>';
}
function render(){
  let h=topbar+kopf;
  if(DEMO)h+='<div style="text-align:center;padding-top:6px"><span class="dummy">Vorschau mit Beispieldaten</span></div>';
  let inner;
  if(D.einwilligung!=='ja'){
    inner='<div class="note"><b>Dafür brauche ich deine Zustimmung.</b><p>Das Langzeitprofil entsteht aus deinen Rückblicken. Ohne deine Einwilligung, dass ich aus ihnen lernen darf, schreibe ich es nicht.</p><a href="'+ACCOUNT_URL+'" target="_top">Zustimmung prüfen</a></div>';
  }else if(!D.profil||!D.profil.inhalt||D.profil.zustand==='zu_frueh'){
    inner='<div class="note"><b>Dafür ist es noch zu früh.</b><p>Ich möchte dich erst besser kennenlernen, bevor ich etwas über dich sage. Sobald du ein paar Wochen dabei bist und einige Rückblicke geschrieben hast, schreibe ich dir das erste Bild. Bis dahin sammle ich in Ruhe mit.</p></div>'+faktenHtml(D.fakten);
  }else{
    inner=profilHtml(D.profil.inhalt,D.profil.erstellt)+faktenHtml(D.fakten);
  }
  document.getElementById('app').innerHTML=h+'<div style="margin-top:14px">'+inner+'</div>';
  binden();postHeight();
}
function binden(){
  document.querySelectorAll('.fact .vg').forEach(b=>b.addEventListener('click',()=>{
    const fact=b.closest('.fact');
    if(fact.querySelector('.ask'))return;
    const ask=document.createElement('div');ask.className='ask';
    ask.innerHTML='<span>Diese Angabe endgültig vergessen?</span><button type="button" class="ja">Ja, vergessen</button><button type="button" class="nein">Behalten</button>';
    fact.appendChild(ask);postHeight();
    ask.querySelector('.nein').addEventListener('click',()=>{ask.remove();postHeight();});
    ask.querySelector('.ja').addEventListener('click',async()=>{
      const ja=ask.querySelector('.ja');ja.disabled=true;
      let ok=false;
      if(DEMO)ok=true;else{try{const r=await post(VERGESSEN_WEBHOOK_URL,{aktion:'fakt_vergessen',token:LOAD_TOKEN,user_id:EMAIL,fakt_id:fact.dataset.id});ok=r.ok;}catch(e){ok=false;}}
      if(ok){fact.innerHTML='<span class="ok-note">Vergessen.</span>';D.fakten=(D.fakten||[]).filter(x=>String(x.id)!==fact.dataset.id);setTimeout(()=>{fact.remove();postHeight();},1500);}
      else{ja.disabled=false;ask.querySelector('span').textContent='Das hat gerade nicht geklappt. Bitte noch einmal.';}
      postHeight();
    });
  }));
}
function demo(art){
  const fakten=[{id:'61',text:'Er bespricht wichtige berufliche Situationen mit einem Freund.',datum:'2026-10-05'},{id:'63',text:'Er sucht aktuell eine neue berufliche Aufgabe.',datum:'2026-10-05'},{id:'66',text:'Er hat nach einem Vorstellungsgespräch begonnen, seine Gedanken zu ordnen.',datum:'2026-10-06'}];
  if(art==='keine')return {einwilligung:'nein',profil:null,fakten:[]};
  if(art==='frueh')return {einwilligung:'ja',profil:null,fakten:fakten};
  return {einwilligung:'ja',fakten:fakten,profil:{erstellt:'2026-10-20',zustand:'ok',inhalt:{stand:'Oktober 2026',
    bild:['Du befindest dich in einer Phase beruflicher Neuorientierung und nutzt die Zeit, um dich auf neue Möglichkeiten vorzubereiten.','In den letzten Wochen hast du konkrete Schritte unternommen: ein Gespräch geführt, Kriterien für deine Optionen festgelegt und mit einem eigenen Projekt begonnen.','Bewegung und Gespräche mit vertrauten Menschen helfen dir, mit Belastung umzugehen.'],
    themen:[{titel:'Berufliche Neuorientierung',absaetze:['Du prüfst mehrere Möglichkeiten und planst deine Zeit bewusst.'],zitate:['Ich hatte heute ein Bewerbungsgespräch. Es lief eigentlich sehr gut.']},{titel:'Ressourcen im Alltag',absaetze:['Sport ist dir wichtig, und du möchtest ihn wieder stärker einbauen.'],zitate:[]}],
    vorher_jetzt:{vorher:'',jetzt:''},offen:['Wie wirst du die nächsten Wochen nutzen?']}}};
}
function postHeight(){const h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}
async function init(){
  const app=document.getElementById('app');
  try{
    if(!EMAIL&&!DEMO)throw new Error('keine E-Mail');
    D=await laden();render();
  }catch(e){
    console.warn('Langzeitprofil laden:',e);
    app.innerHTML=topbar+kopf+'<div class="err"><span>Dein Langzeitprofil ist gerade nicht erreichbar.</span><button type="button" id="nochmal">Noch einmal versuchen</button></div>';
    const n=document.getElementById('nochmal');if(n)n.addEventListener('click',init);
  }
  app.classList.add('ready');postHeight();
}
window.addEventListener('load',init);
window.addEventListener('resize',postHeight);
if(window.ResizeObserver)new ResizeObserver(postHeight).observe(document.body);
document.addEventListener('toggle',postHeight,true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(postHeight);
[50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
</script>
</body>
</html>
