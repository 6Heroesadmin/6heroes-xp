<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6Heroes Assessment</title>
<link rel="stylesheet" href="/fonts.css">
  <script async src="https://tally.so/widgets/embed.js"></script>
  <style>
    :root {
      --navy:       #1E293B;
      --gold:       #F2B705;
      --white:      #FFFFFF;
      --commander:  #0B63CE;
      --guardian:   #1F9D62;
      --innovator:  #F2B705;
      --strategist: #475569;
      --sage:       #C0266A;
      --explorer:   #F0672A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--navy);
      font-family: 'Outfit', sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header.nav {
      flex: 0 0 auto;
      height: 68px;
      padding: 0 24px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'DM Serif Display', serif;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--white);
    }
    .logo-dots { display: flex; gap: 3px; }
    .logo-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      animation: dot-pulse 3s ease-in-out infinite;
    }
    .logo-dots span:nth-child(1) { background: var(--commander); animation-delay: 0s; }
    .logo-dots span:nth-child(2) { background: var(--guardian);  animation-delay: 0.2s; }
    .logo-dots span:nth-child(3) { background: var(--innovator); animation-delay: 0.4s; }
    .logo-dots span:nth-child(4) { background: var(--strategist);animation-delay: 0.6s; }
    .logo-dots span:nth-child(5) { background: var(--sage);      animation-delay: 0.8s; }
    .logo-dots span:nth-child(6) { background: var(--explorer);  animation-delay: 1.0s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(1); opacity: 0.7; }
      40% { transform: scale(1.4); opacity: 1; }
    }
    .nav-tagline {
      font-size: 0.85rem;
      color: #94A3B8;
      font-weight: 400;
    }
    .form-wrap {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
    }
    .form-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    @media (max-width: 600px) {
      header.nav { padding: 0 18px; }
      .nav-logo { font-size: 1.2rem; }
      .nav-tagline { display: none; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-logo">
      <div class="logo-dots">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      6Heroes
    </div>
    <span class="nav-tagline">Dein Heldenprofil</span>
  </header>
  <div class="form-wrap">
    <iframe
      data-tally-src="https://tally.so/r/J90ZAR?transparentBackground=1"
      width="100%" height="100%" frameborder="0"
      marginheight="0" marginwidth="0"
      title="6Heroes Assessment"></iframe>
  </div>
</body>
</html>
