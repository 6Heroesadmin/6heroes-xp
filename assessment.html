<script>
/* 6Heroes Assessment 2.0 - Scoring (Pilotgewichtung 70/30, Stress 3:2, TieBank V1.1) */
var HEROES = ['innovator','commander','strategist','sage','guardian','explorer'];
var HERO_LABEL = {innovator:'Innovator',commander:'Commander',strategist:'Strategist',sage:'Sage',guardian:'Guardian',explorer:'Explorer'};
var SCORING_VERSION = '2.0';
var SKIP_TB_WHEN_LOW_SIGNAL = true;
var MAX_TB_CANDIDATES = 3;   /* ab 4 gleichstehenden Helden keine Zusatzfragen */

function pairKey(a, b){ return [a, b].sort().join('|'); }

/* Direkter Paarvergleich aus Teil B: liefert Sieger-Held oder null */
function sitWinner(DATA, answers, a, b){
  var k = pairKey(a, b);
  for (var i = 0; i < DATA.sit.length; i++){
    var s = DATA.sit[i];
    if (pairKey(s.aHero, s.bHero) === k){
      var v = answers['q' + s.q];
      if (v === 'A') return s.aHero;
      if (v === 'B') return s.bHero;
      return null;
    }
  }
  return null;
}

function tbForPair(bank, a, b){
  var k = pairKey(a, b);
  for (var i = 0; i < bank.length; i++) if (pairKey(bank[i].aHero, bank[i].bHero) === k) return bank[i];
  return null;
}

function allPairs(list){
  var p = [];
  for (var i = 0; i < list.length; i++) for (var j = i + 1; j < list.length; j++) p.push([list[i], list[j]]);
  return p;
}

/* SHA-256 -> gleichverteilter Index (Rejection Sampling auf 32 Bit) */
async function sha256Bytes(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return new Uint8Array(buf);
}
async function hashPick(responseId, position, candidates){
  var c = candidates.slice().sort();
  var n = c.length;
  var limit = Math.floor(4294967296 / n) * n;
  for (var round = 0; round < 50; round++){
    var b = await sha256Bytes(responseId + '|' + position + '|' + c.join(',') + '|' + SCORING_VERSION + (round ? '|' + round : ''));
    for (var off = 0; off + 4 <= b.length; off += 4){
      var v = ((b[off] << 24) >>> 0) + (b[off+1] << 16) + (b[off+2] << 8) + b[off+3];
      if (v < limit) return c[v % n];
    }
  }
  return c[0];
}

/* ---------- Stress ---------- */
function stressScores(items, answers){
  var s = {};
  HEROES.forEach(function(h){ s[h] = {inner:0, action:0, score:0}; });
  items.forEach(function(it){
    var v = Number(answers['q' + it.q]) || 0;
    s[it.hero][it.dim] = v;
  });
  HEROES.forEach(function(h){ s[h].score = 3 * s[h].inner + 2 * s[h].action; });
  return s;
}

/* Liefert Zwischenstand einer Stressphase: benoetigte Tiebreaker-Fragen und ggf. Ergebnis */
function stressState(items, answers, bank, tbAnswers){
  var sc = stressScores(items, answers);
  var low = items.every(function(it){ return Number(answers['q' + it.q]) <= 3; });
  var max = Math.max.apply(null, HEROES.map(function(h){ return sc[h].score; }));
  var c = HEROES.filter(function(h){ return sc[h].score === max; });
  var step = 'score';
  if (c.length > 1){
    var mi = Math.max.apply(null, c.map(function(h){ return sc[h].inner; }));
    c = c.filter(function(h){ return sc[h].inner === mi; });
    step = 'inner';
  }
  var st = {scores:sc, low:low, candidates:c.slice(), needed:[], winner:null, residual:null, wins:null, method:step};
  if (c.length === 1){ st.winner = c[0]; return st; }
  if (low && SKIP_TB_WHEN_LOW_SIGNAL){ st.residual = c; st.method = 'low_signal'; return st; }
  if (c.length > MAX_TB_CANDIDATES){ st.residual = c; st.method = 'zu_viele_kandidaten'; return st; }
  st.needed = allPairs(c).map(function(p){ return tbForPair(bank, p[0], p[1]); });
  var open = st.needed.filter(function(q){ return !tbAnswers[q.id]; });
  if (open.length){ st.method = 'pending'; return st; }
  var wins = {}; c.forEach(function(h){ wins[h] = 0; });
  st.needed.forEach(function(q){ var w = tbAnswers[q.id] === 'A' ? q.aHero : q.bHero; wins[w]++; });
  var mw = Math.max.apply(null, c.map(function(h){ return wins[h]; }));
  var top = c.filter(function(h){ return wins[h] === mw; });
  st.wins = wins; st.method = 'tiebreaker';
  if (top.length === 1) st.winner = top[0]; else st.residual = top;
  return st;
}

/* ---------- Basis / Zweit ---------- */
function baseScores(DATA, answers){
  var s = {};
  HEROES.forEach(function(h){ s[h] = {likert:0, wins:0}; });
  DATA.likert.forEach(function(it){ s[it.hero].likert += Number(answers['q' + it.q]) || 0; });
  DATA.sit.forEach(function(it){
    var v = answers['q' + it.q];
    if (v === 'A') s[it.aHero].wins++; else if (v === 'B') s[it.bHero].wins++;
  });
  HEROES.forEach(function(h){
    var x = s[h];
    x.key = 35 * (x.likert - 4) + 48 * x.wins;            /* ganzzahlig, gleiche Rangfolge */
    x.likertIndex = (x.likert - 4) / 16 * 100;
    x.sitIndex = x.wins / 5 * 100;
    x.score = Math.round((0.7 * x.likertIndex + 0.3 * x.sitIndex) * 10) / 10;
  });
  return s;
}

function groupBy(list, fn){
  var g = [], m = {};
  list.forEach(function(h){ var k = fn(h); if (!(k in m)){ m[k] = g.length; g.push({k:k, items:[]}); } g[m[k]].items.push(h); });
  g.sort(function(a, b){ return b.k - a.k; });
  return g.map(function(x){ return x.items; });
}

async function baseRanking(DATA, answers, responseId, log){
  var sc = baseScores(DATA, answers);
  var order = [], weak = false;
  var groups = groupBy(HEROES, function(h){ return sc[h].key; });
  for (var gi = 0; gi < groups.length; gi++){
    var g = groups[gi];
    var pos = order.length;
    if (g.length === 1 || pos >= 2){ order = order.concat(g.slice().sort()); continue; }
    /* Gleichstand auf relevanter Position: direkte Vergleiche aus Q25-Q39 */
    var w = {}; g.forEach(function(h){ w[h] = 0; });
    allPairs(g).forEach(function(p){ var x = sitWinner(DATA, answers, p[0], p[1]); if (x) w[x]++; });
    var sub = groupBy(g, function(h){ return w[h]; });
    var entry = {position:'basis_zweit', candidates:g.slice().sort(), method:'direkt', wins:w};
    for (var si = 0; si < sub.length; si++){
      var sg = sub[si], p2 = order.length;
      if (sg.length === 1 || p2 >= 2){ order = order.concat(sg.slice().sort()); continue; }
      weak = true;
      var rest = sg.slice();
      var posNames = ['basis', 'zweit'];
      while (rest.length && order.length < 2){
        var name = posNames[order.length];
        var pick = await hashPick(responseId, name, rest);
        log.push({position:name, candidates:rest.slice().sort(), method:'hash', result:HERO_LABEL[pick]});
        order.push(pick);
        rest = rest.filter(function(h){ return h !== pick; });
      }
      order = order.concat(rest.sort());
    }
    entry.result = order.slice(pos, Math.min(order.length, 2)).map(function(h){ return HERO_LABEL[h]; });
    log.push(entry);
  }
  return {scores:sc, order:order, weak:weak};
}

/* ---------- Gesamtauswertung ---------- */
async function evaluate(DATA, answers, tbAnswers, responseId){
  var log = [];
  var base = await baseRanking(DATA, answers, responseId, log);
  async function phase(name, items, bank){
    var st = stressState(items, answers, bank, tbAnswers);
    var hero = st.winner, weak = st.low;
    if (st.candidates.length > 1){
      var e = {position:name, candidates:st.candidates.slice().sort(), method:st.method};
      if (st.wins) e.wins = st.wins;
      if (!hero){
        hero = await hashPick(responseId, name, st.residual);
        weak = true;
        e.residual = st.residual.slice().sort();
        e.method_final = 'hash';
      }
      e.result = HERO_LABEL[hero];
      log.push(e);
    }
    return {hero:hero, weak:weak, scores:st.scores, low:st.low};
  }
  var s1 = await phase('stress1', DATA.c1, DATA.tb1);
  var s2 = await phase('stress2', DATA.c2, DATA.tb2);
  return {base:base, s1:s1, s2:s2, log:log,
          basis:base.order[0], zweit:base.order[1], stress1:s1.hero, stress2:s2.hero};
}

if (typeof module !== 'undefined') module.exports = {evaluate:evaluate, stressState:stressState, baseScores:baseScores, hashPick:hashPick, HEROES:HEROES};

</script>
<script>
(function(){
var LIKERT = ['Trifft überhaupt nicht zu','Trifft eher nicht zu','Teils, teils','Trifft eher zu','Trifft vollständig zu'];
var CHANGE = ['Deutlich seltener als sonst','Etwas seltener als sonst','Unverändert','Etwas häufiger als sonst','Deutlich häufiger als sonst'];
var byQ = {};
['likert','sit','c1','c2'].forEach(function(k){ DATA[k].forEach(function(x){ byQ[x.q] = x; }); });

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
var S = load() || {id:uuid(), answers:{}, tb:{}, step:'intro', started:new Date().toISOString()};
function load(){ try { var x = sessionStorage.getItem(STORE_KEY); return x ? JSON.parse(x) : null; } catch(e){ return null; } }
function save(){ try { sessionStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} }
function clearStore(){ try { sessionStorage.removeItem(STORE_KEY); } catch(e){} }

function allAnswered(list){ return list.every(function(it){ return S.answers['q' + it.q] != null; }); }

function sequence(){
  var s = ['intro','introA'];
  ORDER_A.forEach(function(q){ s.push('q' + q); });
  s.push('introB'); DATA.sit.forEach(function(x){ s.push('q' + x.q); });
  s.push('introC1'); ORDER_C1.forEach(function(q){ s.push('q' + q); });
  if (allAnswered(DATA.c1)){
    var st1 = stressState(DATA.c1, S.answers, DATA.tb1, S.tb);
    if (st1.needed.length){ s.push('introTB1'); st1.needed.forEach(function(q){ s.push('tb:' + q.id); }); }
  }
  s.push('introC2'); ORDER_C2.forEach(function(q){ s.push('q' + q); });
  if (allAnswered(DATA.c2)){
    var st2 = stressState(DATA.c2, S.answers, DATA.tb2, S.tb);
    if (st2.needed.length){ s.push('introTB2'); st2.needed.forEach(function(q){ s.push('tb:' + q.id); }); }
  }
  s.push('final');
  return s;
}
function tbById(id){ return DATA.tb1.concat(DATA.tb2).filter(function(q){ return q.id === id; })[0]; }
function isAnswered(key){
  if (key.indexOf('tb:') === 0) return !!S.tb[key.slice(3)];
  if (/^q\d+$/.test(key)) return S.answers[key] != null;
  return true;
}

var view = document.getElementById('view');
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function progress(seq, idx){
  var qs = seq.filter(function(k){ return k.indexOf('tb:') === 0 || /^q\d+$/.test(k); });
  var done = qs.filter(isAnswered).length;
  document.getElementById('bar').style.width = Math.round(done / qs.length * 100) + '%';
  var pos = qs.indexOf(seq[idx]);
  document.getElementById('count').textContent = pos >= 0 ? ('Frage ' + (pos + 1) + ' von ' + qs.length) : '';
  document.getElementById('back').hidden = idx === 0 || S.step === 'sending';
}

function go(key){ S.step = key; save(); render(); window.scrollTo(0, 0); }
function next(){
  var seq = sequence(), i = seq.indexOf(S.step);
  go(seq[Math.min(i + 1, seq.length - 1)]);
}
document.getElementById('back').onclick = function(){
  var seq = sequence(), i = seq.indexOf(S.step);
  if (i > 0) go(seq[i - 1]);
};

function introCard(kicker, title, paras, btn){
  view.innerHTML = '<div class="card"><div class="kicker">' + esc(kicker) + '</div><h1>' + esc(title) + '</h1>' +
    paras.map(function(p){ return '<p>' + p + '</p>'; }).join('') +
    '<button class="btn" id="nx">' + esc(btn || 'Weiter') + '</button></div>';
  document.getElementById('nx').onclick = next;
}

function scaleCard(kicker, sitText, qText, labels, current, onPick){
  var h = '<div class="card"><div class="kicker">' + esc(kicker) + '</div>' +
    (sitText ? '<div class="sit">' + esc(sitText) + '</div>' : '') +
    '<div class="q">' + esc(qText) + '</div><div class="opts">';
  labels.forEach(function(l, i){
    var val = l.v;
    h += '<button class="opt' + (String(current) === String(val) ? ' sel' : '') + '" data-v="' + esc(val) + '"><span class="n">' + esc(l.n) + '</span><span>' + esc(l.t) + '</span></button>';
  });
  view.innerHTML = h + '</div></div>';
  Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){
    b.onclick = function(){
      Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(x){ x.classList.remove('sel'); });
      b.classList.add('sel');
      var v = b.getAttribute('data-v');
      if (view.getAttribute('data-lock')) return; view.setAttribute('data-lock','1');
      setTimeout(function(){ view.removeAttribute('data-lock'); onPick(v); }, 180);
    };
  });
}

function render(){
  var seq = sequence();
  if (seq.indexOf(S.step) < 0 && S.step !== 'sending') S.step = firstOpen(seq);
  var idx = seq.indexOf(S.step);
  progress(seq, idx);
  var k = S.step;
  if (k === 'intro') return introCard('Assessment', 'Finde heraus, was dich antreibt.', [
      'Du beantwortest 63 kurze Fragen. Das dauert etwa 12 bis 15 Minuten.',
      'Es gibt keine richtigen oder falschen Antworten. Antworte so, wie du wirklich bist, nicht wie du gern wärst.',
      'Am Ende gibst du deinen Vornamen und deine E-Mail-Adresse an. Danach bekommst du eine E-Mail, mit der du dein Profil öffnest.'
    ].concat(TEST ? ['<button class="btn" id="fill" style="background:#9A7400">Test: zufällig ausfüllen</button>'] : []), 'Los geht\'s') , testHook();
  if (k === 'introA') return introCard('Teil 1 von 3', 'Deine natürlichen Verhaltensweisen', [esc('Die folgenden Aussagen beschreiben unterschiedliche Arten, wie Menschen denken, handeln und sich mit Dingen beschäftigen. Gib an, wie sehr die jeweilige Aussage auf dich persönlich zutrifft.'), esc('Denke dabei an dein typisches Verhalten im Alltag, wenn du dich nicht außergewöhnlich unter Druck fühlst.')]);
  if (k === 'introB') return introCard('Teil 2 von 3', 'Wie würdest du vorgehen?', [esc('Stell dir die folgenden Alltagssituationen vor. Du kannst jeweils zwischen zwei sinnvollen Vorgehensweisen wählen. Was würdest du persönlich lieber tun?'), esc('Auch wenn dir beide Möglichkeiten gefallen, entscheide dich bitte für eine.')]);
  if (k === 'introC1') return introCard('Teil 3 von 3', 'Wenn die Anforderungen steigen', [esc('Denke an Situationen, in denen mehrere Anforderungen gleichzeitig zunehmen. Du merkst, dass du angespannter wirst, kannst deinen Alltag aber noch weitgehend bewältigen.'), esc('Wie verändern sich die folgenden Gedanken, Gefühle und Verhaltensweisen gegenüber deinem normalen Zustand?')]);
  if (k === 'introC2') return introCard('Teil 3 von 3', 'Wenn die Belastung anhält', [esc('Denke nun an Phasen, in denen du über längere Zeit stark gefordert bist. Die Belastung hält an, und deine gewohnten Strategien helfen dir nicht mehr so gut wie sonst.'), esc('Wie verändern sich die folgenden Gedanken, Gefühle und Verhaltensweisen gegenüber deinem normalen Zustand?')]);
  if (k === 'introTB1') return introCard('Kurze Zusatzfrage', 'Damit dein Ergebnis eindeutig wird', [esc('Zwei oder mehr Antworten lagen bei dir gleichauf. Mit wenigen Zusatzfragen können wir das klären.'), esc('Denke an Situationen, in denen die Anforderungen steigen und du angespannter wirst, sie aber noch weitgehend bewältigen kannst. Welche der beiden inneren Reaktionen trifft eher auf dich zu? Entscheide dich bitte für eine, auch wenn du beide nachvollziehen kannst.')]);
  if (k === 'introTB2') return introCard('Kurze Zusatzfrage', 'Damit dein Ergebnis eindeutig wird', [esc('Auch hier lagen Antworten gleichauf. Mit wenigen Zusatzfragen können wir das klären.'), esc('Denke an Phasen, in denen du über längere Zeit stark belastet bist und deine gewohnten Vorgehensweisen nicht mehr so gut helfen. Welche der beiden inneren Reaktionen wird in solchen Phasen bei dir stärker?')]);
  if (k === 'final') return renderFinal();
  if (k === 'sending') return renderSending();
  if (k.indexOf('tb:') === 0){
    var tq = tbById(k.slice(3));
    return scaleCard('Zusatzfrage', tq.situation, tq.question, [{v:'A',n:'A',t:tq.a},{v:'B',n:'B',t:tq.b}], S.tb[tq.id], function(v){ S.tb[tq.id] = v; next(); });
  }
  var q = byQ[+k.slice(1)];
  if (q.a){
    return scaleCard(q.title, q.situation, q.question, [{v:'A',n:'A',t:q.a},{v:'B',n:'B',t:q.b}], S.answers[k], function(v){ S.answers[k] = v; next(); });
  }
  var labels = (q.dim ? CHANGE : LIKERT).map(function(t, i){ return {v:i + 1, n:i + 1, t:t}; });
  var kick = q.dim ? (q.q <= 51 ? 'Wenn die Anforderungen steigen' : 'Wenn die Belastung anhält') : 'Wie sehr trifft das zu?';
  scaleCard(kick, '', q.text, labels, S.answers[k], function(v){ S.answers[k] = Number(v); next(); });
}
function firstOpen(seq){ for (var i = 0; i < seq.length; i++) if (!isAnswered(seq[i])) return seq[i]; return 'final'; }

function testHook(){
  var f = document.getElementById('fill'); if (!f) return;
  f.onclick = function(){
    DATA.likert.concat(DATA.c1, DATA.c2).forEach(function(it){ S.answers['q' + it.q] = 1 + Math.floor(Math.random() * 5); });
    DATA.sit.forEach(function(it){ S.answers['q' + it.q] = Math.random() < .5 ? 'A' : 'B'; });
    S.tb = {}; go(firstOpen(sequence()));
  };
}

function renderFinal(){
  var open = sequence().filter(function(k){ return !isAnswered(k); });
  if (open.length){ return go(open[0]); }
  view.innerHTML = '<div class="card"><div class="kicker">Geschafft</div><h1>Fast fertig.</h1>' +
    '<p>Wohin dürfen wir dir den Link zu deinem Profil schicken?</p>' +
    '<label class="f" for="vn">Vorname</label><input type="text" id="vn" autocomplete="given-name" maxlength="60" value="' + esc(S.vorname || '') + '">' +
    '<label class="f" for="em">E-Mail-Adresse</label><input type="email" id="em" autocomplete="email" maxlength="120" value="' + esc(S.email || '') + '">' +
    '<div class="hp" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>' +
    '<label class="check"><input type="checkbox" id="ds"><span>Ich habe die <a href="' + DATENSCHUTZ_URL + '" target="_blank" rel="noopener noreferrer">Datenschutzhinweise</a> gelesen. Meine Antworten werden ausgewertet, um mein Heldenprofil zu erstellen.</span></label>' +
    '<label class="check"><input type="checkbox" id="optin"' + (S.optin ? ' checked' : '') + '><span>' + esc(OPTIN_TEXT) + ' <span class="hint">(freiwillig)</span></span></label>' +
    '<div class="err" id="err"></div>' +
    '<button class="btn" id="send">Profil erstellen</button>' +
    '<p class="hint" style="margin-top:14px">Wir nutzen deine E-Mail-Adresse nur für dein Profil und die Bestätigung. Kein Newsletter ohne deine ausdrückliche Zustimmung.</p></div>';
  document.getElementById('send').onclick = submit;
}

function renderSending(){
  view.innerHTML = '<div class="card"><div class="kicker">Einen Moment</div><h1>Dein Profil wird erstellt.</h1><p>Das dauert nur wenige Sekunden.</p><div class="err" id="err"></div><div id="retry"></div><div id="dbg"></div></div>';
}

async function submit(){
  var vn = document.getElementById('vn').value.trim();
  var em = document.getElementById('em').value.trim().toLowerCase();
  var err = document.getElementById('err');
  if (document.getElementById('website').value) return;
  if (!vn){ err.textContent = 'Bitte gib deinen Vornamen an.'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ err.textContent = 'Bitte prüfe deine E-Mail-Adresse.'; return; }
  if (!document.getElementById('ds').checked){ err.textContent = 'Bitte bestätige die Datenschutzhinweise.'; return; }
  S.vorname = vn; S.email = em; S.optin = document.getElementById('optin').checked; save();
  go('sending');
  var payload;
  try { payload = await buildPayload(); }
  catch(e){ document.getElementById('err').textContent = 'Die Auswertung ist fehlgeschlagen. Bitte lade die Seite neu.'; return; }
  if (TEST){
    document.getElementById('dbg').innerHTML = '<p class="hint">Testmodus: nichts wurde gesendet.</p><pre>' + esc(JSON.stringify(payload, null, 2)) + '</pre>';
    return;
  }
  send(payload);
}

function send(payload){
  fetch(WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); clearStore(); location.replace(DONE_URL); })
    .catch(function(){
      document.getElementById('err').textContent = 'Das Senden hat nicht geklappt. Deine Antworten sind noch da.';
      var r = document.getElementById('retry');
      r.innerHTML = '<button class="btn" id="again">Erneut senden</button>';
      document.getElementById('again').onclick = function(){ r.innerHTML = ''; document.getElementById('err').textContent = ''; send(payload); };
    });
}

async function buildPayload(){
  var r = await evaluate(DATA, S.answers, S.tb, S.id);
  var L = function(h){ return HERO_LABEL[h]; };
  var scores = {basis:{}, stress1:{}, stress2:{}};
  HEROES.forEach(function(h){
    var b = r.base.scores[h];
    scores.basis[L(h)] = {likert_summe:b.likert, siege:b.wins, likert_index:Math.round(b.likertIndex*10)/10, situations_index:b.sitIndex, score:b.score};
    scores.stress1[L(h)] = {inneres:r.s1.scores[h].inner, handlung:r.s1.scores[h].action, score:r.s1.scores[h].score};
    scores.stress2[L(h)] = {inneres:r.s2.scores[h].inner, handlung:r.s2.scores[h].action, score:r.s2.scores[h].score};
  });
  scores.basis_rangfolge = r.base.order.map(L);
  var raw = {};
  for (var i = 1; i <= 63; i++) raw['q' + i] = S.answers['q' + i];
  var p = {
    response_id: S.id,
    assessment_version: ASSESSMENT_VERSION,
    tiebank_version: TIEBANK_VERSION,
    scoring_version: SCORING_VERSION,
    vorname: S.vorname,
    email: S.email,
    datenschutz_bestaetigt: 'ja',
    datenschutz_zeit: new Date().toISOString(),
    email_optin: S.optin ? 'ja' : 'nein',
    email_optin_text: S.optin ? OPTIN_TEXT : '',
    email_optin_zeit: S.optin ? new Date().toISOString() : '',
    gestartet: S.started,
    basisheld: L(r.basis),
    zweitheld: L(r.zweit),
    stressheld1: L(r.stress1),
    stressheld2: L(r.stress2),
    basis_signal_schwach: r.base.weak ? 'ja' : 'nein',
    stress1_signal_schwach: r.s1.weak ? 'ja' : 'nein',
    stress2_signal_schwach: r.s2.weak ? 'ja' : 'nein',
    scores_json: JSON.stringify(scores),
    raw_answers_json: JSON.stringify({answers:raw, tiebreaker:S.tb}),
    tiebreak_log: JSON.stringify(r.log)
  };
  var legacy = {scores:{}, stress:{}, stress2:{}, version:ASSESSMENT_VERSION};
  HEROES.forEach(function(h){
    var b15 = Math.round((1 + r.base.scores[h].score / 25) * 100) / 100;
    var s1 = Math.round(r.s1.scores[h].score / 5 * 100) / 100;
    var s2 = Math.round(r.s2.scores[h].score / 5 * 100) / 100;
    p['score_' + h] = r.base.scores[h].score;   /* 0-100 */
    p['b15_' + h] = b15;                         /* 1-5, gleiche Rangfolge */
    p['s1_' + h] = s1;                           /* 1-5 */
    p['s2_' + h] = s2;                           /* 1-5 */
    legacy.scores[HERO_LABEL[h]] = b15; legacy.stress[HERO_LABEL[h]] = s1; legacy.stress2[HERO_LABEL[h]] = s2;
  });
  p.result_json = JSON.stringify(legacy);
  return p;
}

if (S.step === 'sending') S.step = 'final';
render();
})();
</script>
