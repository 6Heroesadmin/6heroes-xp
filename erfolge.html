<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deine Erfolge – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--soft:#F0ECE0;--gold:#F2B705}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 72px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.topbar svg{width:20px;height:20px}
.hero2{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.15}
.meta2{font-size:13px;color:var(--mute);text-align:center;max-width:46ch}
.dummy{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8A5A00;background:#FFF3D1;border:1px solid #F2D58A;border-radius:999px;padding:3px 10px}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:'DM Serif Display',Georgia,serif;font-size:30px;line-height:1.15}
.tile .t{font-size:12.5px;color:var(--mute)}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;margin-top:10px}
.goal b{font-size:15.5px}
.goal span{font-size:14px;color:var(--mute)}
.bar{height:10px;border-radius:6px;background:#ECE7DB;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
details[open]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s1{display:flex;flex-direction:column;gap:1px}
summary .a{font-size:15.5px;font-weight:600;line-height:1.35}
summary .b{font-size:12.5px;color:var(--mute)}
summary:after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details[open] summary:after{transform:rotate(45deg)}
.body{padding:2px 18px 20px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.bg{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12.5px;line-height:1.3}
.bg small{font-size:11px;color:var(--mute)}
.bdc{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.bdc.on{background:var(--gold);color:#20293A}
.bdc.off{border:2px dashed #C9C2B2;color:#9A9384}
.bdc svg{width:22px;height:22px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:14px}
.note p{font-size:15px;line-height:1.6}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--gold);color:#20293A;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.foot{font-size:13px;color:var(--mute);text-align:center;padding-top:28px}
@media (max-width:480px){.wrap{padding:8px 16px 56px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Build: 2026-11-05 Erfolge v1
var ERFOLGE_WEBHOOK_URL='HIER_WEBHOOK_URL_ERFOLGE_LADEN';
var LOAD_TOKEN='20569c7734eae0c5da881e2d0221959e';
var MB_URL='https://app.6heroes.de/mein-bereich';
var COACH_URL='https://app.6heroes.de/pocket-hero';
var CACHE_MS=60000;

var Q=new URLSearchParams(location.search);
var __FRAME_ID__=Q.get('frame')||'';
var EMAIL=(Q.get('email')||'').trim().toLowerCase();
var DEMO=Q.get('demo')||'';
var KATS=['Einstieg','Beständigkeit','Pfade','Erfahrung','Vielfalt','Nachdenken'];
var MONATE=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var RING='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/></svg>';

var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
var zahl=function(n){return Number(n||0).toLocaleString('de-DE');};
function tagText(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?(+m[3])+'. '+MONATE[+m[2]-1]+(+m[1]!==new Date().getFullYear()?' '+m[1]:''):'';}
function montagISO(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function minusWoche(iso){var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]-7);return montagISO(d);}
function streakAktuell(wochen){
  var set={};(wochen||[]).forEach(function(w){set[w]=1;});
  var w=montagISO(new Date());
  if(!set[w]) w=minusWoche(w);
  var n=0; while(set[w]){n++;w=minusWoche(w);}
  return n;
}

function postHeight(){var h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);try{parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}catch(e){}}
var topbar='<div class="topbar"><a href="'+MB_URL+'" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mein Bereich</a></div>';
function kopf(){return topbar+'<div class="hero2"><span class="eyebrow">Erfolge</span><h1>Deine Erfolge</h1><p class="meta2">Hero Points und Abzeichen bekommst du für jeden Rückblick auf eine Heldentat.</p></div>'+(DEMO?'<div style="text-align:center;padding-top:6px"><span class="dummy">Beispieldaten</span></div>':'');}

// ---- Laden ----
function cacheLesen(){try{var r=sessionStorage.getItem('ef_'+EMAIL);if(!r)return null;var o=JSON.parse(r);if(Date.now()-o.t>CACHE_MS)return null;return o.d;}catch(e){return null;}}
function cacheSchreiben(d){try{sessionStorage.setItem('ef_'+EMAIL,JSON.stringify({t:Date.now(),d:d}));}catch(e){}}
async function laden(){
  if(DEMO) return demoDaten(DEMO);
  var c=cacheLesen(); if(c) return c;
  var body=JSON.stringify({aktion:'erfolge',token:LOAD_TOKEN,user_id:EMAIL});
  var letzter=null;
  for(var versuch=0;versuch<2;versuch++){
    var ctrl=new AbortController();var timer=setTimeout(function(){ctrl.abort();},20000);
    try{
      var r=await fetch(ERFOLGE_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:body,signal:ctrl.signal});
      clearTimeout(timer);
      var t=(await r.text()).trim();
      if(!r.ok) throw new Error('HTTP '+r.status+': '+t.slice(0,120));
      if(t===''){var leer={rueckblicke:0,abzeichen:[]};return leer;}
      var d;
      try{d=JSON.parse(t.replace(/[\u0000-\u001F]+/g,' '));}catch(pe){throw new Error('Kein JSON: '+t.slice(0,120));}
      if(!d||typeof d.punkte==='undefined') throw new Error('Format: '+t.slice(0,120));
      cacheSchreiben(d);
      return d;
    }catch(e){clearTimeout(timer);letzter=e;console.warn('Erfolge Versuch '+(versuch+1)+':',e.message);if(versuch===0)await new Promise(function(res){setTimeout(res,1200);});}
  }
  throw letzter;
}

// ---- Anzeige ----
function render(d){
  var html=kopf();
  if(!d.rueckblicke){
    html+='<div class="note"><p>Deine Erfolge beginnen mit deinem ersten Rückblick. Leg im Pocket Hero eine Heldentat fest und erzähl danach, wie es gelaufen ist.</p><a class="btn" href="'+COACH_URL+'" target="_top">Zum Pocket Hero</a></div>';
    document.getElementById('app').innerHTML=html; fertig(); return;
  }
  var ab=d.abzeichen||[];
  var verdient=ab.filter(function(a){return a.erreicht;}).length;
  var streak=streakAktuell(d.wochen);
  html+='<div class="label">Auf einen Blick</div><div class="tiles">'
    +'<div class="tile"><span class="n">'+esc(d.level)+'</span><span class="t">Level, '+esc(d.level_name)+'</span></div>'
    +'<div class="tile"><span class="n">'+zahl(d.punkte)+'</span><span class="t">Hero Points</span></div>'
    +'<div class="tile"><span class="n">'+streak+'</span><span class="t">'+(streak===1?'Woche':'Wochen')+' in Folge'+(d.streak_max>streak?', bisher bis zu '+d.streak_max:'')+'</span></div>'
    +'<div class="tile"><span class="n">'+verdient+' von '+ab.length+'</span><span class="t">Abzeichen verdient</span></div></div>';
  var nl=d.naechstes_level;
  if(nl){
    html+='<div class="goal"><b>'+esc(d.level_name)+' auf dem Weg zu '+esc(nl.name)+'</b><div class="bar"><i style="width:'+Math.max(2,Math.min(100,nl.prozent||0))+'%"></i></div><span>Noch '+zahl(nl.fehlt)+' Hero Points bis '+esc(nl.name)+'</span></div>';
  } else {
    html+='<div class="goal"><b>'+esc(d.level_name)+'</b><span>Du hast die höchste Stufe erreicht.</span></div>';
  }
  if(d.naechstes_abzeichen){
    html+='<div class="goal"><span>Nächstes Abzeichen in Reichweite</span><b>'+esc(d.naechstes_abzeichen.name)+'</b><span>'+esc(d.naechstes_abzeichen.text)+'</span></div>';
  }
  html+='<div class="label">Deine Abzeichen</div><p class="meta2" style="margin:0 auto 12px">Gefüllt heißt verdient, gestrichelt heißt noch offen.</p><div class="stack">';
  KATS.forEach(function(k){
    var liste=ab.filter(function(a){return a.kat===k;});
    if(!liste.length) return;
    var n=liste.filter(function(a){return a.erreicht;}).length;
    liste=liste.filter(function(a){return a.erreicht;}).concat(liste.filter(function(a){return !a.erreicht;}));
    html+='<details><summary><span class="s1"><span class="a">'+esc(k)+'</span><span class="b">'+n+' von '+liste.length+' verdient</span></span></summary><div class="body"><div class="bgrid">'
      +liste.map(function(a){return '<div class="bg"><div class="bdc '+(a.erreicht?'on':'off')+'">'+(a.erreicht?CHECK:RING)+'</div><span>'+esc(a.name)+'</span>'+(a.erreicht?'<small>'+tagText(a.erreicht)+'</small>':'')+'</div>';}).join('')
      +'</div></div></details>';
  });
  html+='</div><p class="foot">Mini 10, Standard 15, Erweitert 20 Hero Points pro Rückblick, 5 mehr, wenn du ihn in eigenen Worten schreibst.</p>';
  document.getElementById('app').innerHTML=html;
  fertig();
}

function fehler(err){
  var dbg=Q.get('debug')?'<p style="font-size:12px;color:#5A6272;word-break:break-all">email='+esc(EMAIL||'(leer)')+' | '+esc(err&&err.message||'')+'</p>':'';
  document.getElementById('app').innerHTML=kopf()+'<div class="note"><p>Deine Erfolge lassen sich gerade nicht laden.</p><button class="btn" id="nochmal">Nochmal versuchen</button>'+dbg+'</div>';
  document.getElementById('nochmal').addEventListener('click',function(){start();});
  fertig();
}
function fertig(){document.getElementById('app').classList.add('ready');postHeight();}
async function start(){
  if((!EMAIL||EMAIL.indexOf('@')<1)&&!DEMO){fehler(new Error('keine gueltige email im Link'));return;}
  try{render(await laden());}catch(e){console.warn('Erfolge laden:',e);fehler(e);}
}

// ---- Demo ----
function demoDaten(art){
  if(art==='leer') return {rueckblicke:0,abzeichen:[]};
  var heute=new Date(), w=[];for(var i=3;i>=0;i--){var d=new Date(heute);d.setDate(d.getDate()-7*i);w.push(montagISO(d));}
  var A=[['Erster Schritt','Einstieg',1],['Systemstart','Einstieg',1],['Zündung','Einstieg',1],['Im Einsatz','Einstieg',1],['Selbstbremse','Einstieg',1],['Dreiklang','Einstieg',1],
    ['Konstanzkern','Beständigkeit',1],['Gewohnheitskraft','Beständigkeit',0],['Unaufhaltsam','Beständigkeit',0],['Taktgeber','Beständigkeit',1],['Dauerläufer','Beständigkeit',0],['Fels','Beständigkeit',0],
    ['Ideenfunke','Pfade',1],['Realitätsbieger','Pfade',0],['Entscheidungsblitz','Pfade',1],['Aufbruch','Pfade',1],['Grenzgänger','Pfade',0],['Planfokus','Pfade',1],
    ['XP-Sammler','Erfahrung',1],['Energiegeladen','Erfahrung',1],['Heldenmotor','Erfahrung',1],['Aushilfsheld','Erfahrung',1],['Pfadfinder','Erfahrung',1],['Vorreiter','Erfahrung',1],['Aufsteiger','Erfahrung',0],
    ['Heldenmix','Vielfalt',1],['Sechserkreis','Vielfalt',0],['Vielseitig','Vielfalt',1],
    ['Reflexionsstarter','Nachdenken',1],['Musterseher','Nachdenken',1],['Tiefentaucher','Nachdenken',0],['Stop-Knopf','Nachdenken',1]];
  return {punkte:650,level:4,level_name:'Vorreiter',naechstes_level:{level:5,name:'Aufsteiger',ab:900,fehlt:250,prozent:37},rueckblicke:37,aktive_tage:15,wochen:w,streak_max:4,
    abzeichen:A.map(function(a,i){return {id:'B'+i,name:a[0],kat:a[1],erreicht:a[2]?w[1]:''};}),
    naechstes_abzeichen:{name:'Tiefentaucher',kat:'Nachdenken',text:'Noch 2 Rückblicke mit eigenen Worten, dann bekommst du das Abzeichen.'}};
}

window.addEventListener('load',start);
window.addEventListener('resize',postHeight);
document.addEventListener('toggle',postHeight,true);
if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(postHeight);}
[50,200,500,1000,1600].forEach(function(t){setTimeout(postHeight,t);});
</script>
</body>
</html>
