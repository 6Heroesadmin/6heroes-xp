<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Verlauf – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--soft:#F0ECE0;--gold:#F2B705}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 72px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.topbar svg{width:20px;height:20px}
.hero2{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.15}
.meta2{font-size:13px;color:var(--mute);text-align:center;max-width:46ch}
.dummy{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8A5A00;background:#FFF3D1;border:1px solid #F2D58A;border-radius:999px;padding:3px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 6px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px 'Inter',sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.week{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.wk{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:14px 2px 0}
.wbild{background:var(--soft);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.wbild .bl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.wbild p{font-family:'DM Serif Display',Georgia,serif;font-size:18px;line-height:1.55}
.ent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.ent .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.dots{display:inline-flex;gap:4px;align-items:center;flex:none}
.dots i{width:10px;height:10px;border-radius:5px;border:1.5px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.dots em{font-style:normal;font-size:12.5px;margin-left:6px;color:var(--mute)}
.ent .tt{font-size:15.5px;font-weight:600;line-height:1.45}
.ent .sit{font-size:13.5px;color:var(--mute);line-height:1.5}
.ent .rb{font-size:15px;line-height:1.65;border-left:3px solid var(--line);padding-left:12px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--mute)}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:14px}
.note p{font-size:15px;line-height:1.6}
.note.small{padding:14px 18px;gap:6px}
.note.small p{font-size:14px;color:var(--mute)}
.note.small a{font-size:14px;font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--gold);color:#20293A;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.foot{font-size:13px;color:var(--mute);text-align:center;padding-top:28px}
.foot a{color:var(--ink);font-weight:600}
@media (max-width:480px){.wrap{padding:8px 16px 56px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Build: 2026-11-05 Verlauf v1.3
var VERLAUF_WEBHOOK_URL='https://hook.eu1.make.com/5y427lg5937oqsibywlpeuxjgijuneld';
var LOAD_TOKEN='20569c7734eae0c5da881e2d0221959e';
var MB_URL='https://app.6heroes.de/mein-bereich';
var COACH_URL='https://app.6heroes.de/pocket-hero';
var ACCOUNT_URL='https://app.6heroes.de/account';
var LZ_URL='https://app.6heroes.de/langzeitprofil';
var CACHE_MS=60000;

var Q=new URLSearchParams(location.search);
var __FRAME_ID__=Q.get('frame')||'';
var EMAIL=(Q.get('email')||'').trim().toLowerCase();
var DEMO=Q.get('demo')||'';

var STUFE={Mini:1,Standard:2,Erweitert:3};
var STATUS={voll:'Umgesetzt',teilweise:'Teilweise umgesetzt',anders:'Anders gemacht',nicht:'Nicht umgesetzt',festgelegt:'Festgelegt'};
var TAGE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
function parseDatum(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function montag(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;}
function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function kuerzen(s,n){s=String(s||'').replace(/\s+/g,' ').trim();if(s.length<=n)return s;var t=s.slice(0,n);var i=t.lastIndexOf(' ');if(i>n*0.6)t=t.slice(0,i);return t.replace(/[\s,.;:–-]+$/,'')+' …';}

function postHeight(){var h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);try{parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}catch(e){}}

var topbar='<div class="topbar"><a href="'+MB_URL+'" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mein Bereich</a></div>';
function kopf(){return topbar+'<div class="hero2"><span class="eyebrow">Verlauf</span><h1>Dein Verlauf</h1><p class="meta2">Was du dir vorgenommen und umgesetzt hast, nach Wochen geordnet.</p></div>'+(DEMO?'<div style="text-align:center;padding-top:6px"><span class="dummy">Beispieldaten</span></div>':'');}

// ---- Daten laden ----
function cacheLesen(){try{var r=sessionStorage.getItem('vl_'+EMAIL);if(!r)return null;var o=JSON.parse(r);if(Date.now()-o.t>CACHE_MS)return null;return o.d;}catch(e){return null;}}
function cacheSchreiben(d){try{sessionStorage.setItem('vl_'+EMAIL,JSON.stringify({t:Date.now(),d:d}));}catch(e){}}
async function laden(){
  if(DEMO) return demoDaten(DEMO);
  var c=cacheLesen(); if(c) return c;
  var body=JSON.stringify({aktion:'verlauf',token:LOAD_TOKEN,user_id:EMAIL});
  var letzter=null;
  for(var versuch=0;versuch<2;versuch++){
    var ctrl=new AbortController();var timer=setTimeout(function(){ctrl.abort();},20000);
    try{
      var r=await fetch(VERLAUF_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:body,signal:ctrl.signal});
      clearTimeout(timer);
      var t=await r.text();
      if(!r.ok) throw new Error('HTTP '+r.status+': '+t.slice(0,120));
      var d;
      try{d=JSON.parse(t.replace(/[\u0000-\u001F]+/g,' '));}
      catch(pe){throw new Error('Kein JSON: '+t.slice(0,120));}
      if(!d||!Array.isArray(d.chronik)) throw new Error('Format: '+t.slice(0,120));
      cacheSchreiben(d);
      return d;
    }catch(e){clearTimeout(timer);letzter=e;console.warn('Verlauf Versuch '+(versuch+1)+':',e.message);if(versuch===0)await new Promise(function(res){setTimeout(res,1200);});}
  }
  throw letzter;
}

// ---- Aufbereiten ----
function wochenBauen(d){
  var heute=montag(new Date()), letzte=new Date(heute); letzte.setDate(letzte.getDate()-7);
  var map={};
  function woche(mo){var k=key(mo);if(!map[k])map[k]={mo:mo,e:[],bild:''};return map[k];}
  (d.chronik||[]).forEach(function(e,i){var dt=parseDatum(e.datum);if(!dt)return;e._d=dt;e._i=i;woche(montag(dt)).e.push(e);});
  if(d.einwilligung)(d.wochen||[]).forEach(function(w){var dt=parseDatum(w.von);if(!dt||!w.text)return;woche(montag(dt)).bild=w.text;});
  var liste=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.mo-a.mo;});
  liste.forEach(function(w){
    w.e.sort(function(a,b){return (b._d-a._d)||(b._i-a._i);});
    var k=key(w.mo);
    w.titel=k===key(heute)?'Diese Woche':k===key(letzte)?'Letzte Woche':'Woche vom '+w.mo.getDate()+'. '+MONATE[w.mo.getMonth()];
  });
  return liste;
}

function entHTML(e){
  var n=STUFE[e.stufe]||0;
  var dots=n?'<span class="dots">'+[1,2,3].map(function(i){return '<i class="'+(i<=n?'f':'')+'"></i>';}).join('')+'<em>'+esc(e.stufe)+'</em></span>':'';
  var h='<div class="ent"><div class="top"><span>'+TAGE[e._d.getDay()]+', '+e._d.getDate()+'. '+MONATE[e._d.getMonth()]+'</span>'+dots+'</div>';
  h+='<div class="tt">'+esc(e.titel)+'</div>';
  if(e.situation) h+='<div class="sit">'+esc(kuerzen(e.situation,120))+'</div>';
  if(e.text) h+='<div class="rb">'+esc(e.text)+'</div>';
  if(STATUS[e.status]) h+='<div><span class="tag">'+STATUS[e.status]+'</span></div>';
  return h+'</div>';
}

var FILTER='alle', WOCHEN=[], DATEN=null;
function draw(){
  var h='';
  WOCHEN.forEach(function(w){
    var teile='';
    if(FILTER!=='tat'&&w.bild) teile+='<div class="wbild"><span class="bl">Wochenrückblick</span><p>'+esc(w.bild)+'</p></div>';
    if(FILTER!=='woche') teile+=w.e.map(entHTML).join('');
    if(teile) h+='<div class="week"><div class="wk">'+esc(w.titel)+'</div>'+teile+'</div>';
  });
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c.dataset.f===FILTER);});
  postHeight();
}

function render(d){
  DATEN=d; WOCHEN=wochenBauen(d);
  var hatTaten=WOCHEN.some(function(w){return w.e.length;});
  var hatBilder=WOCHEN.some(function(w){return w.bild;});
  var html=kopf();
  if(!hatTaten&&!hatBilder){
    html+='<div class="note"><p>Hier erscheinen deine Heldentaten, sobald du die erste festgelegt hast.</p><a class="btn" href="'+COACH_URL+'" target="_top">Zum Pocket Hero</a></div>';
  } else {
    if(hatBilder) html+='<div class="chips"><button class="chip on" data-f="alle">Alles</button><button class="chip" data-f="tat">Heldentaten</button><button class="chip" data-f="woche">Wochenrückblicke</button></div>';
    if(!d.einwilligung) html+='<div class="note small"><p>Wochenrückblicke gibt es, wenn du dem Speichern deiner Antworten zustimmst.</p><a href="'+ACCOUNT_URL+'" target="_top">Im Account ändern</a></div>';
    html+='<div id="list"></div><p class="foot">Hier siehst du die letzten 60 Tage. Was davor liegt, fließt in dein <a href="'+LZ_URL+'" target="_top">Langzeitprofil</a> ein.</p>';
  }
  document.getElementById('app').innerHTML=html;
  document.querySelectorAll('.chip').forEach(function(c){c.addEventListener('click',function(){FILTER=c.dataset.f;draw();});});
  if(document.getElementById('list')) draw();
  fertig();
}

function fehler(err){
  var dbg=Q.get('debug')?'<p style="font-size:12px;color:#5A6272;word-break:break-all">email='+esc(EMAIL||'(leer)')+' | '+esc(err&&err.message||'')+'</p>':'';
  document.getElementById('app').innerHTML=kopf()+'<div class="note"><p>Dein Verlauf lässt sich gerade nicht laden.</p><button class="btn" id="nochmal">Nochmal versuchen</button>'+dbg+'</div>';
  document.getElementById('nochmal').addEventListener('click',function(){start();});
  fertig();
}
function fertig(){document.getElementById('app').classList.add('ready');postHeight();}

async function start(){
  if((!EMAIL||EMAIL.indexOf('@')<1)&&!DEMO){fehler(new Error('keine gueltige email im Link'));return;}
  try{render(await laden());}catch(e){console.warn('Verlauf laden:',e);fehler(e);}
}

// ---- Demo ----
function demoDaten(art){
  function tag(n){var d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function mo(n){var d=montag(new Date());d.setDate(d.getDate()-7*n);var s=new Date(d);s.setDate(s.getDate()+6);var f=function(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};return {von:f(d),bis:f(s)};}
  if(art==='leer') return {einwilligung:true,chronik:[],wochen:[]};
  var chronik=[
    {datum:tag(9),titel:'Klare Aufgabenliste für das Team',situation:'Ich möchte die Arbeit für unser gemeinsames Projekt aufteilen und dabei Verantwortlichkeiten und Prioritäten klar verteilen, ohne dass jemand übergangen wird.',stufe:'Erweitert',status:'teilweise',text:''},
    {datum:tag(8),titel:'Grobe Meilensteinplanung für Marketing und Sales',situation:'Ich bin mir nicht sicher, was wir zuerst machen sollen.',stufe:'Erweitert',status:'voll',text:'Das Festhalten der Meilensteine hat gut funktioniert und das Feedback vom Team war toll.'},
    {datum:tag(7),titel:'Eine Sache bewusst streichen',situation:'Ich fühle mich von allen Seiten unter Druck gesetzt und möchte vieles unter einen Hut bekommen.',stufe:'Mini',status:'anders',text:'Ich habe nicht gestrichen, sondern verschoben.'},
    {datum:tag(2),titel:'Ein Satz vorab',situation:'',stufe:'Mini',status:'festgelegt',text:''},
    {datum:tag(1),titel:'Gespräch mit Raum für Meinungen',situation:'Ich spüre in Gesprächen mit Teammitgliedern oft Stress, wenn wir unterschiedlicher Meinung sind.',stufe:'Standard',status:'voll',text:'Ich habe zuerst gefragt und dann erst meine Sicht gesagt.'},
    {datum:tag(16),titel:'Bewegung gegen die Nervosität',situation:'Heute steht ein wichtiges Gespräch an und ich bin nervös.',stufe:'Erweitert',status:'nicht',text:''}
  ];
  var wochen=[
    Object.assign(mo(1),{text:'Du hast dich mit der Aufteilung eures gemeinsamen Projekts beschäftigt und eine Planung für die nächsten Monate festgehalten. Daneben ging es darum, bewusst weniger auf einmal anzugehen.'}),
    Object.assign(mo(2),{text:'Deine berufliche Neuorientierung stand im Mittelpunkt, und du hast Bewegung genutzt, um ruhiger zu werden.'})
  ];
  return {einwilligung:art!=='keine',chronik:chronik,wochen:art==='keine'?[]:wochen};
}

window.addEventListener('load',start);
window.addEventListener('resize',postHeight);
if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(postHeight);}
[50,200,500,1000,1600].forEach(function(t){setTimeout(postHeight,t);});
</script>
</body>
</html>
