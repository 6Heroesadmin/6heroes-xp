<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dein Profil wird erstellt – 6Heroes</title>
<link rel="stylesheet" href="/fonts.css">
  <style>
    :root {
      --bg:    #0D1117;
      --text:  #F5F5F0;
      --muted: rgba(245,245,240,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    /* ── Wheel Stack ── */
    .wheel-wrap {
      position: relative;
      width: clamp(140px, 35vw, 200px);
      height: clamp(140px, 35vw, 200px);
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
    }

    /* Segmente drehen sich */
    .wheel-segments {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      animation: wheelSpin 6s linear infinite;
      transform-origin: center;
    }

    /* Weißer Innenkreis – statisch */
    .wheel-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 48%;
      height: 48%;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-center span {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: clamp(0.55rem, 2.5vw, 0.85rem);
      color: #1B2333;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }

    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Headline ── */
    .headline {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.65rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.5s forwards;
    }

    .subtext {
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 2.2rem;
      max-width: 300px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.7s forwards;
    }

    /* ── Fortschrittsbalken ── */
    .progress-track {
      width: clamp(200px, 55vw, 320px);
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.9s forwards;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #1F9D62, #F2B705, #F0672A);
      animation: fillBar 7.5s cubic-bezier(0.4,0,0.2,1) 1.1s forwards;
    }
    @keyframes fillBar {
      0%   { width: 0%; }
      30%  { width: 35%; }
      60%  { width: 65%; }
      85%  { width: 88%; }
      100% { width: 100%; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
