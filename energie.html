<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Energiebilanz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #F0EFE8;
    --text-muted: #7A9BBE;
    --border: rgba(255,255,255,0.09);
    --card: rgba(255,255,255,0.05);
    --neg-color: #C0266A;
  }
  html, body {
    background: transparent;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    padding: 20px 16px 32px;
  }

  .header { text-align: center; margin-bottom: 22px; }
  .header h1 { font-size: 18px; font-weight: 900; margin-bottom: 3px; }
  .header p { font-size: 12px; color: var(--text-muted); font-weight: 600; }

  .scale-row {
    display: grid;
    grid-template-columns: 110px 1fr 52px;
    gap: 10px; margin-bottom: 4px; align-items: center;
  }
  .scale-track {
    display: flex; justify-content: space-between;
    padding: 0 2px; position: relative;
  }
  .scale-track span { font-size: 9px; font-weight: 700; color: var(--text-muted); }
  .scale-zero-line {
    position: absolute; left: 50%; top: -4px; bottom: -4px;
    width: 1px; background: rgba(255,255,255,0.2);
  }

  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar-row {
    display: grid;
    grid-template-columns: 110px 1fr 52px;
    align-items: center; gap: 10px;
    opacity: 0; transform: translateX(-10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .bar-row.visible { opacity: 1; transform: none; }

  .bar-label {
    font-size: 13px; font-weight: 800;
    color: var(--hero-color);
    text-align: right; white-space: nowrap;
  }
  .bar-label .role-badge {
    display: block; font-size: 9px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.06em; margin-top: 1px;
  }

  .netto-track-wrap { position: relative; height: 22px; }
  .netto-bg {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.06); border-radius: 50px;
  }
  .netto-zero {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; background: rgba(255,255,255,0.25);
    transform: translateX(-50%); border-radius: 1px;
  }
  .netto-fill {
    position: absolute; top: 0; bottom: 0;
    border-radius: 50px;
    transition: width 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    width: 0%;
  }
  .netto-fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 40%, rgba(255,255,255,0.15));
    border-radius: 50px;
  }
  .netto-fill.pos { left: 50%; }
  .netto-fill.neg {
    right: 50%; background: #9B1239 !important;
  }
  .netto-fill.neg::after {
    background: linear-gradient(270deg, transparent 40%, rgba(255,255,255,0.1));
  }

  .bar-score { font-size: 13px; font-weight: 900; text-align: left; }
  .bar-score.neg { color: #F9A8C9; }

  /* LEGEND – semantische Farben, keine Heldenfarben */
  .netto-legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-top: 12px; padding: 8px 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px; border: 1px solid var(--border);
  }
  .netto-legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 9px; font-weight: 700; color: var(--text-muted);
  }
  .netto-legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .divider {
    border: none; border-top: 1px solid var(--border);
    margin: 24px 0 20px;
  }

  .interp-title { font-size: 14px; font-weight: 900; margin-bottom: 14px; }

  .interp-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
    border-left: 3px solid var(--role-color);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .interp-card.visible { opacity: 1; transform: none; }

  .interp-card-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .interp-role {
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--role-color);
  }
  .interp-hero { font-size: 15px; font-weight: 900; color: var(--role-color); }

  /* Level badge – semantische Farben */
  .interp-level {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px; margin-left: auto;
    color: var(--sem-text); background: var(--sem-bg);
  }
  .netto-badge {
    font-size: 10px; font-weight: 800;
    padding: 3px 9px; border-radius: 20px; margin-left: 6px;
    color: var(--sem-text); background: var(--sem-bg);
  }

  .interp-text {
    font-size: 13px; font-weight: 600;
    color: var(--text); line-height: 1.7; margin-bottom: 10px;
  }
  .netto-insight {
    font-size: 13px; font-weight: 600; color: var(--text);
    background: rgba(255,255,255,0.06);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
    border-left: 3px solid var(--role-color); line-height: 1.65;
  }
  .potential-box {
    font-size: 13px; font-weight: 600; color: var(--text);
    background: rgba(255,255,255,0.06);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
    border-left: 3px solid rgba(255,255,255,0.25); line-height: 1.65;
  }
  .potential-box strong {
    display: block; margin-bottom: 4px;
    font-size: 11px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.07em; color: rgba(255,255,255,0.5);
  }
  .interp-impulse {
    font-size: 13px; font-weight: 600; color: var(--text);
    background: rgba(255,255,255,0.08);
    border-radius: 8px; padding: 12px 14px; line-height: 1.65;
  }
  .interp-impulse strong {
    color: var(--role-color); display: block; margin-bottom: 5px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  }

  .pattern-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
  }
  .pattern-box.visible { opacity: 1; transform: none; }
  .pattern-title {
    font-size: 12px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px;
  }
  .pattern-text { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.7; }

  .potential-section { margin-top: 6px; }
  .potential-section-title {
    font-size: 12px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted);
    margin-bottom: 8px; margin-top: 20px;
  }

  .no-data {
    text-align: center; padding: 40px 20px;
    color: var(--text-muted); font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Meine Energiebilanz</h1>
  <p>Netto-Energie: Was bleibt nach Quellen minus Kosten?</p>
</div>

<div id="content"></div>

<script>
const HEROES = [
  { key: 'innovator',  label: 'Innovator',  color: '#F2B705', nettoKey: 'ni' },
  { key: 'commander',  label: 'Commander',  color: '#1167D6', nettoKey: 'nc' },
  { key: 'strategist', label: 'Strategist', color: '#7A8FA6', nettoKey: 'nst' },
  { key: 'sage',       label: 'Sage',       color: '#C0266A', nettoKey: 'ns' },
  { key: 'guardian',   label: 'Guardian',   color: '#1F9D62', nettoKey: 'ng' },
  { key: 'explorer',   label: 'Explorer',   color: '#F0672A', nettoKey: 'ne' },
];

// Semantische Farben – keine Überschneidung mit Heldenfarben
const NETTO_LEVELS = [
  { min:  2.0, max:  4.0, label: 'Stark aufladend',  semBg: 'rgba(20,83,45,0.35)',   semText: '#86EFAC' },
  { min:  0.5, max:  1.9, label: 'Aufladend',        semBg: 'rgba(30,58,138,0.3)',   semText: '#93C5FD' },
  { min: -0.4, max:  0.4, label: 'Ausgeglichen',     semBg: 'rgba(120,53,15,0.35)',  semText: '#FDE68A' },
  { min: -1.9, max: -0.5, label: 'Zehrend',          semBg: 'rgba(124,45,18,0.35)',  semText: '#FDBA74' },
  { min: -4.0, max: -2.0, label: 'Stark zehrend',    semBg: 'rgba(136,19,55,0.35)',  semText: '#FDA4AF' },
];

const LEVELS = [
  { min: 4.0, max: 5.0, label: 'Sehr energievoll', color: '#1F9D62' },
  { min: 3.1, max: 3.9, label: 'Gibt eher Energie', color: '#84cc16' },
  { min: 2.6, max: 3.0, label: 'Teils-teils',       color: '#F2B705' },
  { min: 2.1, max: 2.5, label: 'Eher anstrengend',  color: '#F0672A' },
  { min: 0.0, max: 2.0, label: 'Kostet Energie',    color: '#C0266A' },
];

function getNettoLevel(n) {
  return NETTO_LEVELS.find(l => n >= l.min && n <= l.max) || NETTO_LEVELS[4];
}
function getLevel(s) {
  return LEVELS.find(l => s >= l.min && s <= l.max) || LEVELS[4];
}
function getHeroByName(name) {
  return HEROES.find(h => h.label.toLowerCase() === name.toLowerCase());
}
function getHeroColor(name) {
  const h = getHeroByName(name); return h ? h.color : '#7A9BBE';
}
function getHeroScore(scores, name) {
  const h = getHeroByName(name); return h ? scores[h.key] : null;
}
function getHeroNetto(nettos, name) {
  const h = getHeroByName(name); return h ? nettos[h.key] : null;
}

function getLevelStyle(netto) {
  const l = getNettoLevel(netto);
  return `style="--sem-bg:${l.semBg}; --sem-text:${l.semText}; background:var(--sem-bg); color:var(--sem-text);"`;
}

function getInterpText(role, heroName, score, netto) {
  const nettoLvl = getNettoLevel(netto);
  const isNeg = netto < -0.4;
  const isHigh = netto >= 2.0;
  const isMid = netto >= 0.5 && netto < 2.0;
  const isNeutral = netto >= -0.4 && netto < 0.5;

  const nettoInsight = isHigh
    ? `Dieser Modus lädt dich netto stark auf: Die Energie, die du beim Einsatz des ${heroName}-Modus gewinnst, übersteigt die Kosten deutlich. Du kannst ihn großzügig einsetzen.`
    : isMid
    ? `Dieser Modus lädt dich netto leicht auf. Die Quellen überwiegen die Kosten – du kannst ihn regelmäßig einsetzen, solange du auf Erholungsphasen achtest.`
    : isNeutral
    ? `Dieser Modus ist energetisch ausgeglichen. Was du investierst, bekommst du in etwa zurück. Er belastet dich nicht – aber er lädt dich auch nicht aktiv auf.`
    : `Die Kosten dieses Modus übersteigen die Quellen. Das bedeutet nicht, dass du ihn meiden sollst – aber dosierter Einsatz und bewusste Erholung danach sind wichtig.`;

  const ROLE_TEXTS = {
    basis: {
      main: isNeg
        ? `Dein Basisheld ${heroName} ist der Modus, aus dem du am häufigsten heraus agierst – und er kostet dich aktuell netto Energie. Das erklärt, warum sich dauerhaftes Funktionieren anstrengend anfühlen kann. Die Fähigkeiten sind da, aber der Preis ist spürbar.`
        : isNeutral
        ? `Dein Basisheld ${heroName} ist energetisch ausgeglichen. Du agierst stabil aus diesem Modus – er erschöpft dich nicht, aber er trägt dich auch nicht automatisch. Der Kontext entscheidet, ob er aufladt oder kostet.`
        : `Dein Basisheld ${heroName} lädt dich netto auf. Das ist eine starke Ausgangslage: Du agierst am häufigsten aus einem Modus, der dir mehr gibt als er nimmt. Das macht dich langfristig belastbarer.`,
      impulse: isNeg
        ? `Schau dir an, welche Situationen oder Rahmenbedingungen die Kosten dieses Modus erhöhen – Rollenerwartungen, Teamdynamiken oder Dauerdruck sind häufige Treiber. Ziel: die Kontexte reduzieren, die den ${heroName}-Modus von aufladend auf zehrend kippen.`
        : isNeutral
        ? `Welche konkreten Situationen heben deinen ${heroName}-Modus von ausgeglichen auf aufladend? Kontext, Aufgabenart und Zusammenarbeit machen hier den entscheidenden Unterschied. Das ist der Hebel für mehr Energie.`
        : `Diese Stärke ist dein natürlicher Anker. Achte darauf, diese aufladenden Kontexte bewusst zu schützen – und ergänze sie durch deinen Zweithelden, damit keine Einseitigkeit entsteht.`
    },
    zweit: {
      main: isNeg
        ? `Dein Zweitheld ${heroName} ergänzt deinen Basishelden im Alltag – aber er kostet dich aktuell netto Energie. Das bedeutet: Auch dein wichtigster Ausgleichsmodus zehrt. Wenn beide Haupthelden netto kosten, fehlt dir ein natürlicher Erholungskanal.`
        : isNeutral
        ? `Dein Zweitheld ${heroName} ist energetisch neutral. Er ist situativ einsetzbar und belastet dich nicht – aber er gibt dir auch keinen aktiven Energieschub.`
        : `Dein Zweitheld ${heroName} ist eine echte Ressource. Er ergänzt deinen Basishelden auf eine Weise, die dich netto stärkt. Diese Kombination ist eine stabile Energiebasis.`,
      impulse: isNeg
        ? `Prüfe, welche Kontexte den ${heroName}-Modus bei dir von netto neutral auf zehrend kippen. Manchmal hilft es, diesen Modus bewusster einzusetzen – weniger als Dauerzustand, mehr als gezieltes Werkzeug.`
        : isNeutral
        ? `Identifiziere die Situationen, in denen der ${heroName}-Modus dich wirklich auflädt – und setze ihn gezielt dort ein, statt ihn als Standard-Ergänzung zu verwenden.`
        : `Ritualisiere die Momente, in denen du ${heroName} als Ergänzung einsetzt. Diese Kombination aus Basis- und Zweitheld ist dein natürlicher Energiekreislauf.`
    },
    stress1: {
      main: isNeg
        ? `Dein erster Stressheld ${heroName} aktiviert sich bei frühem Druck – und kostet dich netto Energie. Das ist eine doppelte Belastung: Stress selbst plus ein zehrender Modus. Frühe Stressphasen können dich dadurch schneller erschöpfen als du erwartest.`
        : isNeutral
        ? `Dein erster Stressheld ${heroName} ist energetisch ausgeglichen. Du zahlst keinen Extra-Preis für frühen Stress – der Modus selbst belastet dich nicht zusätzlich.`
        : `Dein erster Stressheld ${heroName} gibt dir sogar unter frühem Druck netto Energie. Das ist eine ungewöhnliche Stärke: Du aktivierst unter Stress einen Modus, der dich nicht zusätzlich belastet.`,
      impulse: isNeg
        ? `Lerne deine frühen Stress-Warnsignale kennen. Je früher du merkst, dass du in den ${heroName}-Modus rutschst, desto schneller kannst du gegensteuern – zum Beispiel durch bewussten Wechsel in einen aufladenderen Modus.`
        : isNeutral
        ? `Kenne die Kontexte, die diesen Modus unter Druck von ausgeglichen auf zehrend kippen – besonders in längeren Stressphasen ist das wichtig zu beobachten.`
        : `In Drucksituationen kannst du dem ${heroName}-Modus vertrauen. Nutze dieses Wissen bewusst – und achte darauf, danach wieder in deinen Basismodus zurückzufinden.`
    },
    stress2: {
      main: isNeg
        ? `Dein zweiter Stressheld ${heroName} aktiviert sich bei tiefer, lang anhaltender Erschöpfung – und er kostet dich netto Energie. Das ist die kritischste Kombination: Tiefe Erschöpfung plus ein zehrender Modus. Langzeitstress ist für dich besonders zehrend.`
        : isNeutral
        ? `Dein zweiter Stressheld ${heroName} ist energetisch ausgeglichen – auch bei tiefer Eskalation zahlst du keinen Extra-Preis durch den Modus selbst.`
        : `Dein zweiter Stressheld ${heroName} gibt dir auch bei tiefer Eskalation netto Energie. Das ist eine echte Resilienz-Ressource – du bleibst auch in extremen Stressphasen handlungsfähig.`,
      impulse: isNeg
        ? `Baue aktiv Erholungsphasen ein, bevor es zur zweiten Eskalation kommt. Auf diesem Level ist Gegensteuern deutlich schwerer – Prävention ist wichtiger als Reaktion.`
        : isNeutral
        ? `Der Fokus liegt auf dem generellen Stressmanagement. Erholungsroutinen und frühe Warnsignale sind dein wichtigstes Werkzeug – nicht der Modus selbst.`
        : `Vertraue diesem Modus in extremen Stressphasen. Vergiss aber nicht, danach bewusst zu regenerieren – auch starke Ressourcen brauchen Erholung.`
    }
  };

  return { main: ROLE_TEXTS[role].main, nettoInsight, impulse: ROLE_TEXTS[role].impulse };
}

function getPotentialText(heroName, netto, roleHeroes) {
  if (netto < 0.5) return null;
  const isHigh = netto >= 2.0;
  if (isHigh) {
    return `Der ${heroName}-Modus lädt dich netto stark auf – auch wenn er nicht dein zugewiesener Basis- oder Zweitheld ist. Das bedeutet: Du hast hier eine brachliegende Ressource. In Situationen, die dem ${heroName}-Modus entgegenkommen, kannst du bewusst in diesen Modus wechseln – ohne dass es dich erschöpft. Frage dich: Wann im Alltag hast du die Möglichkeit, aus dem ${heroName}-Modus heraus zu handeln?`;
  }
  return `Der ${heroName}-Modus gibt dir netto Energie, auch wenn er nicht dein Hauptheld ist. Er kann als situativer Verstärker dienen – zum Beispiel in Phasen, in denen dein Basisheld gerade viel Energie kostet.`;
}

function getPatternText(nettos) {
  const vals = Object.values(nettos).filter(v => v !== null);
  if (!vals.length) return null;
  const posCount = vals.filter(v => v >= 0.5).length;
  const negCount = vals.filter(v => v < -0.4).length;
  if (negCount >= 4) return { title: 'Gesamtbild: Hohes Netto-Energiedefizit', text: 'Dein Profil zeigt, dass die Kosten deiner Heldenmodi aktuell die Quellen in vielen Bereichen übersteigen. Das ist ein wichtiges Signal: Nicht die Fähigkeiten fehlen – sondern der Kontext oder die Erholung, die nötig wäre, um die Balance zu halten. Der erste Schritt ist zu verstehen, welche Rahmenbedingungen die Kosten treiben – bevor du an den einzelnen Helden arbeitest.' };
  if (posCount >= 4) return { title: 'Gesamtbild: Starke Netto-Ressourcenbasis', text: 'Deine Heldenmodi laden dich netto in den meisten Bereichen auf. Das ist eine stabile Ausgangslage: Du kannst aus vielen Modi heraus agieren, ohne schnell auszubrennen. Nutze dieses Wissen, um gezielt die aufladendsten Kontexte zu schützen und zu stärken.' };
  return { title: 'Gesamtbild: Gemischte Energiebilanz', text: 'Dein Profil zeigt eine Mischung aus aufladenden und zehrenden Modi. Das ist normal – und gibt dir klare Orientierung. Die aufladenden Helden sind deine natürlichen Ressourcen, die zehrenden brauchen bewussteren Einsatz und mehr Erholung danach.' };
}

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const scores = {}, nettos = {};
  let hasData = false, hasNetto = false;
  HEROES.forEach(h => {
    const v = parseFloat(p.get(h.key));
    scores[h.key] = isNaN(v) ? 0 : Math.min(5, Math.max(0, v));
    if (!isNaN(v) && v > 0) hasData = true;
    const n = parseFloat(p.get(h.nettoKey));
    nettos[h.key] = isNaN(n) ? null : n;
    if (!isNaN(n)) hasNetto = true;
  });
  return {
    scores, nettos, hasData, hasNetto,
    basis:   p.get('basis')   || '',
    zweit:   p.get('zweit')   || '',
    stress1: p.get('stress1') || '',
    stress2: p.get('stress2') || '',
  };
}

function getRoleBadge(heroName, basis, zweit, stress1, stress2) {
  const n = heroName.toLowerCase();
  if (n === basis.toLowerCase())   return 'Basisheld';
  if (n === zweit.toLowerCase())   return 'Zweitheld';
  if (n === stress1.toLowerCase()) return 'Stressheld 1';
  if (n === stress2.toLowerCase()) return 'Stressheld 2';
  return '';
}

function render() {
  const { scores, nettos, hasData, hasNetto, basis, zweit, stress1, stress2 } = getParams();
  const el = document.getElementById('content');
  if (!hasData && !hasNetto) {
    el.innerHTML = `<div class="no-data">Keine Energie-Daten verfügbar.<br>Bitte schließe zuerst den Fragebogen ab.</div>`;
    return;
  }

  const roleHeroes = [basis, zweit, stress1, stress2].map(s => s.toLowerCase()).filter(Boolean);

  let html = `<div class="scale-row"><div></div><div class="scale-track">
    <span>−4</span><span>−2</span><span>0</span><span>+2</span><span>+4</span>
    <div class="scale-zero-line"></div>
  </div><div></div></div><div class="bars">`;

  HEROES.forEach((h, i) => {
    const netto = nettos[h.key];
    const badge = getRoleBadge(h.label, basis, zweit, stress1, stress2);
    let trackHtml = '', scoreHtml = '';

    if (netto !== null) {
      const isNeg = netto < 0;
      const pct = Math.min(50, (Math.abs(netto) / 4) * 50);
      const display = netto > 0 ? `+${netto.toFixed(1)}` : netto.toFixed(1);
      trackHtml = `<div class="netto-track-wrap">
        <div class="netto-bg"></div>
        <div class="netto-zero"></div>
        <div class="netto-fill ${isNeg ? 'neg' : 'pos'}" data-pct="${pct}" style="${!isNeg ? 'background:'+h.color : ''}"></div>
      </div>`;
      scoreHtml = `<div class="bar-score ${isNeg ? 'neg' : ''}" style="${!isNeg ? 'color:'+h.color : ''}">${display}</div>`;
    } else {
      const pct = (scores[h.key] / 5) * 50;
      trackHtml = `<div class="netto-track-wrap">
        <div class="netto-bg"></div>
        <div class="netto-zero"></div>
        <div class="netto-fill pos" data-pct="${pct}" style="background:${h.color}"></div>
      </div>`;
      scoreHtml = `<div class="bar-score" style="color:${h.color}">${scores[h.key].toFixed(1)}</div>`;
    }

    html += `<div class="bar-row" style="--hero-color:${h.color}; transition-delay:${i * 0.08}s">
      <div class="bar-label">${h.label}${badge ? `<span class="role-badge">${badge}</span>` : ''}</div>
      ${trackHtml}${scoreHtml}
    </div>`;
  });

  html += `</div>`;

  // Legend
  html += `<div class="netto-legend">
    <div class="netto-legend-item"><div class="netto-legend-dot" style="background:#86EFAC"></div>Stark aufladend (+2 bis +4)</div>
    <div class="netto-legend-item"><div class="netto-legend-dot" style="background:#93C5FD"></div>Aufladend (+0.5 bis +2)</div>
    <div class="netto-legend-item"><div class="netto-legend-dot" style="background:#FDE68A"></div>Ausgeglichen (±0.4)</div>
    <div class="netto-legend-item"><div class="netto-legend-dot" style="background:#FDBA74"></div>Zehrend (−0.5 bis −2)</div>
    <div class="netto-legend-item"><div class="netto-legend-dot" style="background:#FDA4AF"></div>Stark zehrend (−2 bis −4)</div>
  </div>`;

  // Interpretation
  const roles = [
    { key: 'basis',   name: basis,   label: 'Basisheld' },
    { key: 'zweit',   name: zweit,   label: 'Zweitheld' },
    { key: 'stress1', name: stress1, label: 'Stressheld 1' },
    { key: 'stress2', name: stress2, label: 'Stressheld 2' },
  ].filter(r => r.name);

  // Potential heroes: not in roles, netto >= 0.5
  const potentialHeroes = HEROES.filter(h => {
    const netto = nettos[h.key];
    return netto !== null && netto >= 0.5 && !roleHeroes.includes(h.label.toLowerCase());
  }).sort((a, b) => nettos[b.key] - nettos[a.key]);

  if (roles.length > 0 || potentialHeroes.length > 0) {
    html += `<hr class="divider"><div class="interp-title">Deine persönliche Auswertung</div>`;

    const pattern = getPatternText(nettos);
    if (pattern) html += `<div class="pattern-box" id="pattern-box">
      <div class="pattern-title">${pattern.title}</div>
      <div class="pattern-text">${pattern.text}</div>
    </div>`;

    roles.forEach((r, i) => {
      const score = getHeroScore(scores, r.name);
      if (score === null) return;
      const netto = getHeroNetto(nettos, r.name);
      if (netto === null) return;
      const heroColor = getHeroColor(r.name);
      const nettoLvl = getNettoLevel(netto);
      const interp = getInterpText(r.key, r.name, score, netto);
      const display = netto > 0 ? `+${netto.toFixed(1)}` : netto.toFixed(1);

      html += `<div class="interp-card" id="icard-${i}" style="--role-color:${heroColor}; transition-delay:${0.1 + i * 0.1}s">
        <div class="interp-card-header">
          <div>
            <div class="interp-role">${r.label}</div>
            <div class="interp-hero">${r.name}</div>
          </div>
          <div style="display:flex;align-items:center;margin-left:auto;gap:6px;">
            <span class="netto-badge" ${getLevelStyle(netto)}>Netto ${display}</span>
            <span class="interp-level" ${getLevelStyle(netto)}>${nettoLvl.label}</span>
          </div>
        </div>
        <div class="interp-text">${interp.main}</div>
        <div class="netto-insight">${interp.nettoInsight}</div>
        <div class="interp-impulse"><strong>Coaching-Impuls</strong>${interp.impulse}</div>
      </div>`;
    });

    // Potential section
    if (potentialHeroes.length > 0) {
      html += `<div class="potential-section-title">Dein ungenutztes Energiepotenzial</div>`;
      potentialHeroes.forEach((h, i) => {
        const netto = nettos[h.key];
        const nettoLvl = getNettoLevel(netto);
        const display = netto > 0 ? `+${netto.toFixed(1)}` : netto.toFixed(1);
        const potText = getPotentialText(h.label, netto, roleHeroes);
        if (!potText) return;
        html += `<div class="interp-card" id="pcrd-${i}" style="--role-color:${h.color}; transition-delay:${0.3 + i * 0.1}s">
          <div class="interp-card-header">
            <div>
              <div class="interp-role">Potenzial-Held</div>
              <div class="interp-hero">${h.label}</div>
            </div>
            <div style="display:flex;align-items:center;margin-left:auto;gap:6px;">
              <span class="netto-badge" ${getLevelStyle(netto)}>Netto ${display}</span>
              <span class="interp-level" ${getLevelStyle(netto)}>${nettoLvl.label}</span>
            </div>
          </div>
          <div class="interp-text">${potText}</div>
          <div class="interp-impulse"><strong>Aktivierungs-Impuls</strong>Überlege: In welchen konkreten Situationen dieser Woche könntest du bewusst in den ${h.label}-Modus wechseln? Welche Aufgaben, Gespräche oder Entscheidungen passen zu diesem Modus – und wann hast du die Freiheit, ihn zu wählen?</div>
        </div>`;
      });
    }
  }

  el.innerHTML = html;

  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-row').forEach((row, i) => {
      setTimeout(() => {
        row.classList.add('visible');
        row.querySelectorAll('.netto-fill').forEach(f => {
          setTimeout(() => { f.style.width = f.dataset.pct + '%'; }, 50);
        });
      }, i * 80);
    });
    setTimeout(() => {
      const pb = document.getElementById('pattern-box');
      if (pb) pb.classList.add('visible');
      [...roles, ...potentialHeroes].forEach((_, i) => {
        setTimeout(() => {
          const c = document.getElementById(`icard-${i}`) || document.getElementById(`pcrd-${i}`);
          if (c) c.classList.add('visible');
        }, i * 120);
      });
    }, 700);
  });
}

render();

/* === 6HEROES iframe Auto-Höhe: Sender === */
function postHeight(){
  var h=Math.max(document.body.scrollHeight,document.body.offsetHeight,
    document.documentElement.scrollHeight,document.documentElement.offsetHeight);
  parent.postMessage({type:"6heroes:setHeight",height:h},"*");
}
window.addEventListener("load",postHeight);
window.addEventListener("resize",postHeight);
if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
</script>
</body>
</html>
