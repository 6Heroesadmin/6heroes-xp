<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Energiebilanz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --c-innovator:  #F2B705;
    --c-commander:  #1167D6;
    --c-strategist: #7A8FA6;
    --c-sage:       #C0266A;
    --c-guardian:   #1F9D62;
    --c-explorer:   #F0672A;
    --text: #F0EFE8;
    --text-muted: #7A9BBE;
    --border: rgba(255,255,255,0.09);
    --card: rgba(255,255,255,0.05);
  }
  html, body {
    background: transparent;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    padding: 20px 16px 32px;
  }

  /* HEADER */
  .header { text-align: center; margin-bottom: 22px; }
  .header h1 { font-size: 18px; font-weight: 900; margin-bottom: 3px; }
  .header p { font-size: 12px; color: var(--text-muted); font-weight: 600; }

  /* SCALE */
  .scale-labels {
    display: grid;
    grid-template-columns: 90px 1fr 42px;
    gap: 10px;
    margin-bottom: 6px;
  }
  .scale-track {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }
  .scale-track span { font-size: 9px; font-weight: 700; color: var(--text-muted); }

  /* BARS */
  .bars { display: flex; flex-direction: column; gap: 14px; }
  .bar-row {
    display: grid;
    grid-template-columns: 90px 1fr 42px;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .bar-row.visible { opacity: 1; transform: none; }
  .bar-label {
    font-size: 13px; font-weight: 800;
    color: var(--hero-color);
    text-align: right; white-space: nowrap;
  }
  .bar-label .role-badge {
    display: block;
    font-size: 9px; font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 1px;
  }
  .bar-tracks { display: flex; flex-direction: column; gap: 4px; }
  .bar-track-wrap { display: flex; align-items: center; gap: 6px; }
  .bar-track-label { font-size: 8px; font-weight: 800; color: var(--text-muted); width: 28px; text-align: right; flex-shrink: 0; text-transform: uppercase; }
  .bar-track {
    background: rgba(255,255,255,0.07);
    border-radius: 50px;
    height: 16px;
    overflow: hidden;
    flex: 1;
  }
  .bar-track.netto-track {
    background: rgba(255,255,255,0.04);
  }
  .bar-fill {
    height: 100%; border-radius: 50px;
    width: 0%;
    transition: width 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .bar-fill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 40%, rgba(255,255,255,0.15));
    border-radius: 50px;
  }
  .bar-fill.netto-fill {
    opacity: 0.55;
  }
  .bar-fill.netto-negative {
    background: rgba(192,38,106,0.6) !important;
    opacity: 0.8;
  }
  .bar-scores { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .bar-score { font-size: 11px; font-weight: 900; color: var(--text); line-height: 16px; }
  .bar-score.netto-score { color: var(--text-muted); font-size: 10px; }
  .bar-score.netto-negative { color: #C0266A; }

  /* LEGEND */
  .legend-row {
    display: grid;
    grid-template-columns: 90px 1fr 42px;
    gap: 10px;
    margin-top: 8px;
  }
  .legend-track {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .legend-item {
    display: flex; flex-direction: column;
    align-items: center;
    width: 0; overflow: visible;
  }
  .legend-bar { height: 3px; border-radius: 2px; width: 20px; margin-bottom: 4px; flex-shrink: 0; }
  .legend-item .l-label {
    font-size: 8px; font-weight: 800;
    color: var(--text-muted);
    text-align: center; white-space: nowrap;
    line-height: 1.3;
  }

  /* NETTO LEGEND */
  .netto-legend {
    display: flex; gap: 14px; align-items: center;
    margin-top: 10px; padding: 8px 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .netto-legend-item { display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 700; color: var(--text-muted); }
  .netto-legend-bar { height: 6px; width: 18px; border-radius: 3px; }

  /* DIVIDER */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0 20px;
  }

  /* INTERPRETATION */
  .interp-title {
    font-size: 14px; font-weight: 900;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  .interp-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border-left: 3px solid var(--role-color);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .interp-card.visible { opacity: 1; transform: none; }

  .interp-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .interp-role {
    font-size: 10px; font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--role-color);
  }
  .interp-hero {
    font-size: 15px; font-weight: 900;
    color: var(--role-color);
  }
  .interp-level {
    font-size: 11px; font-weight: 700;
    color: var(--level-color);
    background: color-mix(in srgb, var(--level-color) 12%, transparent);
    padding: 3px 9px;
    border-radius: 20px;
    margin-left: auto;
  }

  /* NETTO BADGE */
  .netto-badge {
    font-size: 10px; font-weight: 800;
    padding: 3px 9px; border-radius: 20px;
    margin-left: 6px;
  }
  .netto-badge.pos { background: rgba(31,157,98,0.15); color: #1F9D62; }
  .netto-badge.neu { background: rgba(242,183,5,0.15); color: #F2B705; }
  .netto-badge.neg { background: rgba(192,38,106,0.15); color: #C0266A; }

  .interp-text {
    font-size: 13px; font-weight: 600;
    color: var(--text-muted);
    line-height: 1.65;
    margin-bottom: 10px;
  }

  .interp-impulse {
    font-size: 12px; font-weight: 700;
    color: var(--text);
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 10px 12px;
    line-height: 1.55;
  }
  .interp-impulse strong {
    color: var(--role-color);
    display: block;
    margin-bottom: 3px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  /* NETTO INSIGHT */
  .netto-insight {
    font-size: 12px; font-weight: 700;
    color: var(--text-muted);
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 8px;
    border-left: 2px solid var(--role-color);
    line-height: 1.5;
  }

  /* PATTERN BOX */
  .pattern-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
  }
  .pattern-box.visible { opacity: 1; transform: none; }
  .pattern-title {
    font-size: 12px; font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .pattern-text {
    font-size: 13px; font-weight: 600;
    color: var(--text-muted);
    line-height: 1.65;
  }

  .no-data {
    text-align: center; padding: 40px 20px;
    color: var(--text-muted); font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Meine Energiebilanz</h1>
  <p>Wie viel Energie gibt dir jeder Held-Modus?</p>
</div>

<div id="content"></div>

<script>
const HEROES = [
  { key: 'innovator',  label: 'Innovator',  color: '#F2B705', nettoKey: 'ni' },
  { key: 'commander',  label: 'Commander',  color: '#1167D6', nettoKey: 'nc' },
  { key: 'strategist', label: 'Strategist', color: '#7A8FA6', nettoKey: 'nst' },
  { key: 'sage',       label: 'Sage',       color: '#C0266A', nettoKey: 'ns' },
  { key: 'guardian',   label: 'Guardian',   color: '#1F9D62', nettoKey: 'ng' },
  { key: 'explorer',   label: 'Explorer',   color: '#F0672A', nettoKey: 'ne' },
];

const LEVELS = [
  { min: 4.0, max: 5.0, label: 'Sehr energievoll', color: '#1F9D62' },
  { min: 3.1, max: 3.9, label: 'Gibt eher Energie', color: '#84cc16' },
  { min: 2.6, max: 3.0, label: 'Teils-teils',       color: '#F2B705' },
  { min: 2.1, max: 2.5, label: 'Eher anstrengend',  color: '#F0672A' },
  { min: 0.0, max: 2.0, label: 'Kostet Energie',    color: '#C0266A' },
];

function getLevel(score) {
  return LEVELS.find(l => score >= l.min && score <= l.max) || LEVELS[4];
}

function getHeroColor(name) {
  const h = HEROES.find(h => h.label.toLowerCase() === name.toLowerCase());
  return h ? h.color : '#7A9BBE';
}

function getHeroScore(scores, name) {
  const h = HEROES.find(h => h.label.toLowerCase() === name.toLowerCase());
  return h ? scores[h.key] : null;
}

function getHeroNetto(nettos, name) {
  const h = HEROES.find(h => h.label.toLowerCase() === name.toLowerCase());
  return h ? nettos[h.key] : null;
}

function getNettoBadge(netto) {
  if (netto === null) return '';
  if (netto > 0.5) return `<span class="netto-badge pos">Netto +${netto.toFixed(1)}</span>`;
  if (netto < -0.5) return `<span class="netto-badge neg">Netto ${netto.toFixed(1)}</span>`;
  return `<span class="netto-badge neu">Netto ±0</span>`;
}

function getNettoInsight(heroName, netto) {
  if (netto === null) return '';
  if (netto >= 1.5) return `Die Energiekosten dieses Modus sind gering – du ladest dich beim Einsatz des ${heroName}-Modus deutlich mehr auf als du ausgibst.`;
  if (netto >= 0.5) return `Du gewinnst netto Energie durch diesen Modus. Die Kosten sind vorhanden, aber die Quellen überwiegen.`;
  if (netto >= -0.5) return `Dieser Modus ist energetisch ausgeglichen – was du investierst, bekommst du ungefähr zurück.`;
  if (netto >= -1.5) return `Die Kosten dieses Modus übersteigen die Quellen leicht. Dosiere ihn bewusst und baue Erholungsphasen ein.`;
  return `Dieser Modus kostet dich netto deutlich Energie. Langfristiger Einsatz zehrt an deinen Ressourcen – achte auf Ausgleich.`;
}

/* ── INTERPRETATION TEXTS ── */
function getInterpText(role, heroName, score, heroColor) {
  const level = getLevel(score);

  const TEXTS = {
    basis: {
      low: {
        main: `Du führst deinen Alltag gerade überwiegend aus einem Modus heraus, der dir Energie kostet. Das bedeutet nicht, dass du den ${heroName}-Modus nicht beherrschst – oft ist das Gegenteil der Fall. Es bedeutet aber: Du zahlst dabei einen Preis. Dauerhafter Einsatz dieses Modus kann sich als Erschöpfung, Gereiztheit oder innerer Leere zeigen.`,
        impulse: `Schau dir an, welche Situationen dich zwingen, hauptsächlich als ${heroName} zu agieren. Rollenerwartungen, Teamdynamiken oder alte Gewohnheiten sind häufige Treiber. Ziel ist nicht, den ${heroName} loszuwerden – sondern zu verstehen, wann du ihn brauchst und wann du dir erlauben kannst, aus energiereicheren Helden heraus zu agieren.`
      },
      mid: {
        main: `Dein ${heroName}-Modus ist energetisch neutral bis leicht aufladend – je nach Kontext. Du kannst stabil aus diesem Modus führen, aber er trägt dich nicht automatisch. In passenden Situationen fließt es, in unpassenden kostet es.`,
        impulse: `Wir schauen gemeinsam, welche Rahmenbedingungen deinen ${heroName}-Modus von „3" auf „4" heben – und welche ihn auf „2" ziehen. Kontext, Timing und Aufgabenart machen hier den Unterschied.`
      },
      high: {
        main: `Dein ${heroName}-Modus ist eine echte Kraftquelle. Du kannst länger aus diesem Modus heraus agieren, ohne auszubrennen. Andere erleben dich hier oft besonders authentisch und wirksam.`,
        impulse: `Diese Stärke ist dein natürlicher Anker. Wichtig: Nutze sie bewusst – und ergänze sie durch deinen Zweithelden, damit keine Einseitigkeit entsteht.`
      }
    },
    zweit: {
      low: {
        main: `Dein ${heroName}-Modus als Zweitheld kostet dich aktuell Energie. Das ist ein wichtiges Signal: Wenn dein Hauptpartner im Alltag ein erschöpfender Modus ist, fehlt dir die natürliche Entlastung, die ein energiegebender Zweitheld bieten könnte.`,
        impulse: `Prüfe, ob du bewusst andere Helden aktivieren kannst, die dir mehr Energie geben. Dein Zweitheld muss nicht immer ${heroName} sein – im Alltag kannst du flexibel schalten.`
      },
      mid: {
        main: `Dein ${heroName}-Modus als Zweitheld ist situativ nutzbar. Manchmal ergänzt er deinen Basishelden gut, manchmal kostet er etwas. Der Kontext entscheidet.`,
        impulse: `Identifiziere die Situationen, in denen der ${heroName}-Modus dich wirklich unterstützt – und setze ihn gezielt dort ein.`
      },
      high: {
        main: `Dein ${heroName}-Modus als Zweitheld ist eine echte Ressource. Er ergänzt deinen Basishelden auf eine Weise, die dich stärkt statt kostet. Das ist eine stabile Kombination.`,
        impulse: `Nutze diese Kombination bewusst: Wann setzt du ${heroName} als Ergänzung ein? Ritualisiere diese Momente – sie sind deine natürlichen Energiequellen.`
      }
    },
    stress1: {
      low: {
        main: `Dein erster Stressheld ${heroName} kostet dich schon im Normalzustand Energie. Wenn du unter Druck in diesen Modus rutschst, wird es doppelt belastend: Du bist bereits im Stressmodus und agierst zusätzlich aus einem energiearmen Helden heraus.`,
        impulse: `Lerne deine frühen Stress-Warnsignale kennen: Wann kippt der ${heroName}-Modus bei dir? Je früher du es merkst, desto schneller kannst du gegensteuern – und zurück in einen energiereichen Modus wechseln.`
      },
      mid: {
        main: `Dein erster Stressheld ${heroName} ist energetisch neutral. Das bedeutet: Stress erschöpft dich nicht automatisch doppelt – du zahlst keinen Extra-Preis für das Aktivieren dieses Modus unter Druck.`,
        impulse: `Trotzdem: Kenne die Kontexte, die diesen Modus von „3" auf „2" ziehen. Achte besonders auf lange Stressphasen, in denen der Kontext sich verschlechtert.`
      },
      high: {
        main: `Dein erster Stressheld ${heroName} gibt dir sogar unter Druck eher Energie. Das ist eine ungewöhnliche Stärke: Du aktivierst unter Stress einen Modus, der dich nicht zusätzlich belastet.`,
        impulse: `Nutze dieses Wissen bewusst: In Drucksituationen kannst du dem ${heroName}-Modus vertrauen. Achte aber darauf, dass du danach wieder in deinen Basismodus zurückfindest.`
      }
    },
    stress2: {
      low: {
        main: `Dein zweiter Stressheld ${heroName} wird bei später, tief eskaliertem Stress aktiv – und kostet dich dabei viel Energie. Das ist die kritischste Kombination: tiefe Erschöpfung trifft auf einen anstrengenden Modus.`,
        impulse: `Auf Langzeitstress achten ist hier besonders wichtig. Baue aktiv Erholungsphasen ein, bevor es zur zweiten Eskalation kommt – denn auf diesem Level ist Gegensteuern deutlich schwerer.`
      },
      mid: {
        main: `Dein zweiter Stressheld ${heroName} ist energetisch neutral – auch bei später Eskalation zahlst du keinen Extra-Preis durch den Modus selbst.`,
        impulse: `Der Fokus liegt hier auf dem generellen Stressmanagement – nicht auf dem Modus selbst. Erholungsroutinen und frühe Warnsignale sind dein wichtigstes Werkzeug.`
      },
      high: {
        main: `Dein zweiter Stressheld ${heroName} gibt dir auch bei tiefer Eskalation noch eher Energie. Das ist eine echte Resilienz-Ressource.`,
        impulse: `Vertraue diesem Modus in extremen Stressphasen – aber vergiss nicht, danach bewusst zu regenerieren.`
      }
    }
  };

  const roleTexts = TEXTS[role];
  let category;
  if (score <= 2.5) category = 'low';
  else if (score <= 3.5) category = 'mid';
  else category = 'high';

  return roleTexts[category];
}

/* ── PATTERN INTERPRETATION ── */
function getPatternText(scores) {
  const vals = Object.values(scores);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const highCount = vals.filter(v => v >= 4).length;
  const lowCount = vals.filter(v => v <= 2.5).length;
  const midCount = vals.filter(v => v > 2.5 && v < 4).length;

  if (lowCount >= 4) {
    return {
      title: 'Gesamtbild: Hohes Energiedefizit',
      text: 'Dein Profil zeigt, dass du aktuell viele Helden-Modi als energiearmen erlebst. Das bedeutet nicht, dass du diese Modi nicht beherrschst – häufig ist es ein Hinweis auf Dauerstress, Rollenanpassung oder eine Phase des Funktionierens. Bevor wir tiefer in die einzelnen Helden gehen, lohnt sich die Frage: Wie voll ist dein Akku gerade grundsätzlich?'
    };
  }
  if (highCount >= 4) {
    return {
      title: 'Gesamtbild: Starke Ressourcenbasis',
      text: 'Du hast insgesamt viele energiegebende Modi. Das ist eine gute Ausgangslage – du kannst dich in vielen Situationen gut aufladen und bleibst auch unter Druck stabiler. Achte darauf, deine Stärken nicht zu übernutzen und ergänze sie bewusst durch Helden, die dir helfen, Lücken zu schließen.'
    };
  }
  if (midCount >= 4) {
    return {
      title: 'Gesamtbild: Viel Potenzial im mittleren Bereich',
      text: 'Dein Profil zeigt viele „Teils-teils"-Werte. Du bist flexibel und funktionierst in vielen Situationen gut – aber du ladest dich nicht automatisch auf. Der entscheidende Hebel ist Kontext: Welche Umgebungen, Aufgaben und Menschen machen deine Helden von „3" auf „4"?'
    };
  }
  return {
    title: 'Gesamtbild: Gemischtes Profil',
    text: 'Dein Profil zeigt eine Mischung: einige Modi die dir Energie geben und andere die dich mehr kosten. Das ist normal – und gibt dir klare Orientierung, welche Helden du bewusst stärken und welche du dosieren solltest.'
  };
}

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const scores = {};
  const nettos = {};
  let hasData = false;
  let hasNetto = false;
  HEROES.forEach(h => {
    const v = parseFloat(p.get(h.key));
    scores[h.key] = isNaN(v) ? 0 : Math.min(5, Math.max(0, v));
    if (!isNaN(v) && v > 0) hasData = true;
    const n = parseFloat(p.get(h.nettoKey));
    nettos[h.key] = isNaN(n) ? null : n;
    if (!isNaN(n)) hasNetto = true;
  });
  const basis   = p.get('basis')   || '';
  const zweit   = p.get('zweit')   || '';
  const stress1 = p.get('stress1') || '';
  const stress2 = p.get('stress2') || '';
  return { scores, nettos, hasData, hasNetto, basis, zweit, stress1, stress2 };
}

function getRoleBadge(heroName, basis, zweit, stress1, stress2) {
  const n = heroName.toLowerCase();
  if (n === basis.toLowerCase())   return 'Basisheld';
  if (n === zweit.toLowerCase())   return 'Zweitheld';
  if (n === stress1.toLowerCase()) return 'Stressheld 1';
  if (n === stress2.toLowerCase()) return 'Stressheld 2';
  return '';
}

function render() {
  const { scores, nettos, hasData, hasNetto, basis, zweit, stress1, stress2 } = getParams();
  const el = document.getElementById('content');

  if (!hasData) {
    el.innerHTML = `<div class="no-data">Keine Energie-Daten verfügbar.<br>Bitte schließe zuerst den Fragebogen ab.</div>`;
    return;
  }

  /* ── BAR CHART ── */
  let html = `
    <div class="scale-labels">
      <div></div>
      <div class="scale-track">
        <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
      </div>
      <div></div>
    </div>
    <div class="bars">
  `;

  HEROES.forEach((h, i) => {
    const score = scores[h.key];
    const netto = nettos[h.key];
    const pct = (score / 5) * 100;
    const badge = getRoleBadge(h.label, basis, zweit, stress1, stress2);

    // Netto bar: range is -4 to +4, map to 0-100% where 50% = 0
    let nettoPct = 0;
    let nettoNegative = false;
    if (netto !== null) {
      if (netto >= 0) {
        nettoPct = (netto / 4) * 100;
      } else {
        nettoPct = (Math.abs(netto) / 4) * 100;
        nettoNegative = true;
      }
      nettoPct = Math.min(100, nettoPct);
    }

    const nettoDisplay = netto !== null ? (netto > 0 ? `+${netto.toFixed(1)}` : netto.toFixed(1)) : '–';
    const nettoClass = netto !== null && netto < 0 ? 'netto-score netto-negative' : 'netto-score';

    html += `
      <div class="bar-row" style="--hero-color:${h.color}; transition-delay:${i * 0.08}s">
        <div class="bar-label">
          ${h.label}
          ${badge ? `<span class="role-badge">${badge}</span>` : ''}
        </div>
        <div class="bar-tracks">
          <div class="bar-track-wrap">
            <div class="bar-track-label">E+</div>
            <div class="bar-track">
              <div class="bar-fill" data-pct="${pct}" style="background:${h.color}"></div>
            </div>
          </div>
          ${netto !== null ? `
          <div class="bar-track-wrap">
            <div class="bar-track-label">Netto</div>
            <div class="bar-track netto-track">
              <div class="bar-fill netto-fill ${nettoNegative ? 'netto-negative' : ''}" data-pct="${nettoPct}" style="${!nettoNegative ? 'background:' + h.color : ''}"></div>
            </div>
          </div>` : ''}
        </div>
        <div class="bar-scores">
          <div class="bar-score">${score.toFixed(1)}</div>
          ${netto !== null ? `<div class="${nettoClass}">${nettoDisplay}</div>` : ''}
        </div>
      </div>
    `;
  });

  html += `</div>`;

  /* ── NETTO LEGEND ── */
  if (hasNetto) {
    html += `
      <div class="netto-legend" style="margin-top:12px;">
        <div class="netto-legend-item">
          <div class="netto-legend-bar" style="background:rgba(255,255,255,0.3)"></div>
          E+ = Energie aus Quellen (1–5)
        </div>
        <div class="netto-legend-item">
          <div class="netto-legend-bar" style="background:rgba(255,255,255,0.2)"></div>
          Netto = E+ minus Energiekosten
        </div>
        <div class="netto-legend-item">
          <div class="netto-legend-bar" style="background:rgba(192,38,106,0.6)"></div>
          Negativ = Kosten überwiegen
        </div>
      </div>`;
  }

  /* ── ENERGY LEVEL LEGEND ── */
  html += `<div class="legend-row" style="margin-top:12px;"><div></div><div class="legend-track">`;
  [...LEVELS].reverse().forEach(l => {
    html += `<div class="legend-item">
      <div class="legend-bar" style="background:${l.color}"></div>
      <div class="l-label">${l.label.replace(' ', '<br>')}</div>
    </div>`;
  });
  html += `</div><div></div></div>`;

  /* ── INTERPRETATION ── */
  const roles = [
    { key: 'basis',   name: basis,   label: 'Basisheld' },
    { key: 'zweit',   name: zweit,   label: 'Zweitheld' },
    { key: 'stress1', name: stress1, label: 'Stressheld 1' },
    { key: 'stress2', name: stress2, label: 'Stressheld 2' },
  ].filter(r => r.name);

  if (roles.length > 0) {
    html += `<hr class="divider"><div class="interp-title">Deine persönliche Auswertung</div>`;

    const pattern = getPatternText(scores);
    html += `<div class="pattern-box" id="pattern-box">
      <div class="pattern-title">${pattern.title}</div>
      <div class="pattern-text">${pattern.text}</div>
    </div>`;

    roles.forEach((r, i) => {
      const score = getHeroScore(scores, r.name);
      if (score === null) return;
      const netto = getHeroNetto(nettos, r.name);
      const level = getLevel(score);
      const heroColor = getHeroColor(r.name);
      const interp = getInterpText(r.key, r.name, score, heroColor);
      const nettoBadge = hasNetto ? getNettoBadge(netto) : '';
      const nettoInsight = (hasNetto && netto !== null) ? getNettoInsight(r.name, netto) : '';

      html += `
        <div class="interp-card" id="icard-${i}" style="--role-color:${heroColor}; --level-color:${level.color}; transition-delay:${0.1 + i * 0.1}s">
          <div class="interp-card-header">
            <div>
              <div class="interp-role">${r.label}</div>
              <div class="interp-hero">${r.name}</div>
            </div>
            <div style="display:flex; align-items:center; margin-left:auto;">
              ${nettoBadge}
              <div class="interp-level" style="margin-left:6px;">${level.label} (${score.toFixed(1)})</div>
            </div>
          </div>
          <div class="interp-text">${interp.main}</div>
          ${nettoInsight ? `<div class="netto-insight">${nettoInsight}</div>` : ''}
          <div class="interp-impulse" style="margin-top:10px;">
            <strong>Coaching-Impuls</strong>
            ${interp.impulse}
          </div>
        </div>
      `;
    });
  }

  el.innerHTML = html;

  /* ── ANIMATE ── */
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-row').forEach((row, i) => {
      setTimeout(() => {
        row.classList.add('visible');
        row.querySelectorAll('.bar-fill').forEach(fill => {
          setTimeout(() => { fill.style.width = fill.dataset.pct + '%'; }, 50);
        });
      }, i * 80);
    });

    setTimeout(() => {
      const pb = document.getElementById('pattern-box');
      if (pb) pb.classList.add('visible');
      roles.forEach((_, i) => {
        setTimeout(() => {
          const card = document.getElementById(`icard-${i}`);
          if (card) card.classList.add('visible');
        }, i * 120);
      });
    }, 700);
  });
}

render();
</script>
