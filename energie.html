<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Energiebilanz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0C1D35;
    --c-innovator:  #F2B705;
    --c-commander:  #1167D6;
    --c-strategist: #7A8FA6;
    --c-sage:       #C0266A;
    --c-guardian:   #1F9D62;
    --c-explorer:   #F0672A;
    --bg: #0f1f38;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.08);
    --text: #F0EFE8;
    --text-muted: #7A9BBE;
  }

  html, body {
    background: transparent;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 28px;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .header p {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 90px 1fr 42px;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateX(-12px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .bar-row.visible {
    opacity: 1;
    transform: none;
  }

  .bar-label {
    font-size: 13px;
    font-weight: 800;
    color: var(--hero-color);
    text-align: right;
    white-space: nowrap;
  }

  .bar-track {
    background: rgba(255,255,255,0.07);
    border-radius: 50px;
    height: 22px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 50px;
    background: var(--hero-color);
    width: 0%;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
  }

  .bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 40%, rgba(255,255,255,0.15));
    border-radius: 50px;
  }

  .bar-score {
    font-size: 13px;
    font-weight: 900;
    color: var(--text);
    text-align: left;
  }

  .legend-row {
    display: grid;
    grid-template-columns: 90px 1fr 42px;
    gap: 10px;
    margin-top: 8px;
  }

  .legend-track {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .legend-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 0;
    overflow: visible;
  }

  .legend-bar {
    height: 3px;
    border-radius: 2px;
    width: 20px;
    margin-bottom: 5px;
    flex-shrink: 0;
  }

  .legend-item .l-label {
    font-size: 8.5px;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    line-height: 1.3;
    text-align: center;
    white-space: nowrap;
  }

  .scale-labels {
    display: grid;
    grid-template-columns: 90px 1fr 42px;
    gap: 10px;
    margin-bottom: 6px;
    padding: 0;
  }

  .scale-track {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }

  .scale-track span {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .no-data {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Meine Energiebilanz</h1>
  <p>Wie viel Energie gibt dir jeder Held?</p>
</div>

<div id="content"></div>

<script>
const HEROES = [
  { key: 'innovator',  label: 'Innovator',  color: '#F2B705' },
  { key: 'commander',  label: 'Commander',  color: '#1167D6' },
  { key: 'strategist', label: 'Strategist', color: '#7A8FA6' },
  { key: 'sage',       label: 'Sage',       color: '#C0266A' },
  { key: 'guardian',   label: 'Guardian',   color: '#1F9D62' },
  { key: 'explorer',   label: 'Explorer',   color: '#F0672A' },
];

const LEVELS = [
  { min: 4.0, max: 5.0, label: 'Sehr energievoll',      color: '#1F9D62' },
  { min: 3.1, max: 3.9, label: 'Gibt eher Energie',     color: '#84cc16' },
  { min: 2.6, max: 3.0, label: 'Teils-teils',           color: '#F2B705' },
  { min: 2.1, max: 2.5, label: 'Eher anstrengend',      color: '#F0672A' },
  { min: 0.0, max: 2.0, label: 'Kostet Energie',        color: '#C0266A' },
];

function getLevel(score) {
  return LEVELS.find(l => score >= l.min && score <= l.max) || LEVELS[4];
}

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const scores = {};
  let hasData = false;
  HEROES.forEach(h => {
    const v = parseFloat(p.get(h.key));
    scores[h.key] = isNaN(v) ? 0 : Math.min(5, Math.max(0, v));
    if (!isNaN(v) && v > 0) hasData = true;
  });
  return { scores, hasData };
}

function render() {
  const { scores, hasData } = getParams();
  const el = document.getElementById('content');

  if (!hasData) {
    el.innerHTML = `<div class="no-data">Keine Energie-Daten verfügbar.<br>Bitte schließe zuerst den Fragebogen ab.</div>`;
    return;
  }

  let html = `
    <div class="scale-labels">
      <div></div>
      <div class="scale-track">
        <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
      </div>
      <div></div>
    </div>
    <div class="bars">
  `;

  HEROES.forEach((h, i) => {
    const score = scores[h.key];
    const pct = (score / 5) * 100;
    const level = getLevel(score);
    html += `
      <div class="bar-row" style="--hero-color:${h.color}; transition-delay:${i * 0.08}s">
        <div class="bar-label">${h.label}</div>
        <div class="bar-track">
          <div class="bar-fill" data-pct="${pct}" style="background:${h.color}"></div>
        </div>
        <div class="bar-score">${score.toFixed(1)}</div>
      </div>
    `;
  });

  html += `</div>`;

  // Legend – aligned to bar track
  html += `<div class="legend-row"><div></div><div class="legend-track">`;
  [...LEVELS].reverse().forEach(l => {
    html += `
      <div class="legend-item">
        <div class="legend-bar" style="background:${l.color}"></div>
        <div class="l-label">${l.label.replace(' ', '<br>')}</div>
      </div>
    `;
  });
  html += `</div><div></div></div>`;

  el.innerHTML = html;

  // Animate
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-row').forEach((row, i) => {
      setTimeout(() => {
        row.classList.add('visible');
        const fill = row.querySelector('.bar-fill');
        const pct = fill.dataset.pct;
        setTimeout(() => { fill.style.width = pct + '%'; }, 50);
      }, i * 80);
    });
  });
}

render();
</script>
</body>
</html>
