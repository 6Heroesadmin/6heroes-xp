<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Energiebilanz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #F4F1E9;
    --text-muted: #AEB6C6;
    --border: rgba(255,255,255,0.09);
    --card: rgba(255,255,255,0.05);
    --accent: #F2B705;

    /* Batterie-Zustandsfarben (semantisch, nicht Heldenfarben) */
    --charge:  #3FB27F;   /* lädt auf  – grün  */
    --neutral: #E8B93B;   /* neutral   – gold  */
    --drain:   #D2607A;   /* kostet    – berry */
  }
  html, body {
    background: #20293A;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    padding: 20px 16px 32px;
  }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-family: 'DM Serif Display', serif; font-size: 30px; font-weight: 400; letter-spacing:-0.01em; margin-bottom: 6px; }
  .header p { font-size: 14px; color: var(--text-muted); font-weight: 400; }

  /* === NETTO-KLARTEXT-ZEILE (der Aha) === */
  .net-summary {
    max-width: 620px; margin: 0 auto 22px;
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 14px; padding: 16px 20px;
    font-size: 15px; line-height: 1.7; color: var(--text);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .net-summary.visible { opacity: 1; transform: none; }
  .net-summary strong { color: var(--accent); font-weight: 700; }

  /* === BATTERIE-LISTE === */
  .batteries { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  /* Kompakt-Modus fürs Profil: Batterien mittiger + klickbar */
  html.compact .batteries,
  body.compact .batteries,
  .energie-link .batteries {
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }
  /* Feste Spalten: Label rechtsbündig | Batterie+Text.
     Dadurch stehen alle Batterien exakt untereinander (eine gemeinsame
     linke Kante), egal wie lang der Heldenname ist. Die ganze Gruppe
     sitzt durch die zentrierte .batteries-Box mittig. */
  html.compact .batt-row,
  body.compact .batt-row {
    grid-template-columns: 120px auto;
    justify-content: start;
    gap: 14px;
  }
  .energie-link { display: block; text-decoration: none; color: inherit; }
  .energie-more {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 26px; font-size: 14px; font-weight: 700; color: var(--accent);
  }
  .energie-more .arrow { transition: transform .12s; }
  .energie-link:hover .energie-more .arrow { transform: translateX(3px); }

  .batt-row {
    display: grid;
    grid-template-columns: 128px 1fr;
    align-items: center; gap: 16px;
    opacity: 0; transform: translateX(-10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .batt-row.visible { opacity: 1; transform: none; }

  .batt-label { text-align: right; white-space: nowrap; }
  .batt-hero {
    font-size: 15px; font-weight: 800; color: var(--hero-color);
    line-height: 1.15;
  }
  .batt-role {
    display: block; font-size: 9px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.06em; margin-top: 2px;
  }

  .batt-right { display: flex; align-items: center; gap: 12px; }

  /* Batterie-Grafik */
  .battery {
    position: relative; flex-shrink: 0;
    width: 58px; height: 26px;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 6px; padding: 3px;
  }
  .battery::after {
    content: ''; position: absolute;
    right: -6px; top: 50%; transform: translateY(-50%);
    width: 4px; height: 10px;
    background: rgba(255,255,255,0.35); border-radius: 0 2px 2px 0;
  }
  .battery-fill {
    height: 100%; border-radius: 2px; width: 0%;
    transition: width 0.85s cubic-bezier(0.16,1,0.3,1);
  }
  .battery.state-charge  .battery-fill { background: var(--charge); }
  .battery.state-neutral .battery-fill { background: var(--neutral); }
  .battery.state-drain   .battery-fill { background: var(--drain); }

  .batt-state {
    font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .batt-row.state-charge  .batt-state { color: var(--charge); }
  .batt-row.state-neutral .batt-state { color: var(--neutral); }
  .batt-row.state-drain   .batt-state { color: var(--drain); }

  /* Teaser: gesperrte Batterien */
  .batt-row.locked .battery { opacity: 0.4; }
  .batt-row.locked .batt-hero { color: var(--text-muted) !important; }
  .batt-row.locked .batt-state { color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
  .batt-row.locked .batt-state svg { width: 13px; height: 13px; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 26px auto 20px; max-width: 620px; }

  /* === AUSWERTUNG (unverändert reich, aus Original übernommen) === */
  .interp-wrap { max-width: 620px; margin: 0 auto; }
  .interp-title { font-family: 'DM Serif Display', serif; font-size: 26px; font-weight: 400; letter-spacing:-0.01em; margin-bottom: 18px; }

  .interp-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 24px; margin-bottom: 10px;
    border-left: 2px solid var(--role-color);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .interp-card.visible { opacity: 1; transform: none; }
  .interp-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .interp-role { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--role-color); margin-bottom: 2px; }
  .interp-hero { font-family: 'DM Serif Display', serif; font-size: 22px; font-weight: 400; color: var(--role-color); }
  .state-pill {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-left: auto;
    color: #10151F;
  }
  .state-pill.state-charge  { background: var(--charge); }
  .state-pill.state-neutral { background: var(--neutral); }
  .state-pill.state-drain   { background: var(--drain); color: #fff; }

  .interp-text { font-size: 15px; color: var(--text); line-height: 1.75; margin-bottom: 14px; }
  .netto-insight {
    font-size: 14px; color: var(--text-muted);
    padding: 2px 0 2px 16px; margin-bottom: 16px;
    border-left: 2px solid var(--role-color); line-height: 1.7;
  }
  .interp-impulse {
    font-size: 14px; color: var(--text);
    background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px 18px; line-height: 1.7;
  }
  .interp-impulse strong { color: var(--role-color); display: block; margin-bottom: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }

  .pattern-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
  }
  .pattern-box.visible { opacity: 1; transform: none; }
  .pattern-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 10px; }
  .pattern-text { font-size: 15px; color: var(--text); line-height: 1.75; }

  .potential-section-title {
    font-family: 'DM Serif Display', serif; font-size: 24px; font-weight: 400;
    letter-spacing: 0.02em; color: var(--text-muted); margin: 22px 0 8px;
  }

  /* === TEASER-PAYWALL-KARTE === */
  .paywall-card {
    max-width: 620px; margin: 20px auto 0;
    background: linear-gradient(135deg, rgba(242,183,5,0.10), rgba(242,183,5,0.02));
    border: 1px solid rgba(242,183,5,0.35);
    border-radius: 18px; padding: 26px 24px; text-align: center;
  }
  .paywall-card .pw-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 8px; }
  .paywall-card .pw-title { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 10px; }
  .paywall-card .pw-text { font-size: 14px; color: var(--text-muted); line-height: 1.65; margin-bottom: 18px; }
  .paywall-card .pw-btn {
    display: inline-block; text-decoration: none;
    background: var(--accent); color: #20293A;
    font-weight: 700; font-size: 15px;
    padding: 13px 28px; border-radius: 10px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .paywall-card .pw-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(242,183,5,0.3); }

  .no-data { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <h1>Meine Energiebilanz</h1>
  <p>Welche deiner Modi dich tragen – und welche dich Kraft kosten.</p>
</div>

<div id="content"></div>

<script>
/* Frame-Kennung fuer den Profil-Wrapper (Cross-Origin-sichere Hoehen-Zuordnung) */
var __FRAME_ID__ = (new URLSearchParams(location.search)).get('frame') || '';

/* === COMPACT-MODUS: robust erkennen ===
   Greift bei ?compact=1, ?compact=true, ?compact (leer) ODER automatisch,
   sobald die Seite im Profil-Wrapper laeuft (in einem iframe UND mit frame-Param).
   Letzteres ist der Sicherheitsanker, falls der Wrapper compact nicht durchreicht. */
var __CQ__ = (new URLSearchParams(location.search)).get('compact');
// Explizit voll erzwingen: compact=0 gewinnt immer (Detailseite/Landingpage).
var __FORCE_FULL__ = (__CQ__ === '0' || __CQ__ === 'false');
var __EXPLICIT_COMPACT__ = (__CQ__ === '1' || __CQ__ === 'true' || __CQ__ === '');
// Auto-Compact: sobald die Seite den frame-Param traegt, laeuft sie im Profil-Wrapper.
// Das ist der zuverlaessige Anker, falls der Wrapper compact nicht durchreicht.
var __IN_WRAPPER__ = (__FRAME_ID__ !== '');
var IS_COMPACT = !__FORCE_FULL__ && (__EXPLICIT_COMPACT__ || __IN_WRAPPER__);
if (IS_COMPACT) { document.documentElement.classList.add('compact'); }
window.addEventListener('DOMContentLoaded', function(){
  if (IS_COMPACT) document.body.classList.add('compact');
});

const HEROES = [
  { key: 'innovator',  label: 'Innovator',  color: '#F2B705', nettoKey: 'ni' },
  { key: 'commander',  label: 'Commander',  color: '#1167D6', nettoKey: 'nc' },
  { key: 'strategist', label: 'Strategist', color: '#7A8FA6', nettoKey: 'nst' },
  { key: 'sage',       label: 'Sage',       color: '#C0266A', nettoKey: 'ns' },
  { key: 'guardian',   label: 'Guardian',   color: '#1F9D62', nettoKey: 'ng' },
  { key: 'explorer',   label: 'Explorer',   color: '#F0672A', nettoKey: 'ne' },
];

const UPGRADE_URL = 'https://6heroes.de/preise'; // TODO: zentrale Preisseite mit 3 Paketen

/* Drei Zustände statt fünf Farbkategorien.
   Die dahinterliegende 5-stufige Intelligenz bleibt im Netto-Wert erhalten,
   das Frontend bricht sie auf auflädt / neutral / kostet herunter. */
function getState(netto) {
  if (netto >= 0.5)  return { key: 'charge',  word: 'Lädt dich auf', fill: netto >= 2.0 ? 92 : 70 };
  if (netto <= -0.5) return { key: 'drain',   word: 'Kostet dich Kraft', fill: netto <= -2.0 ? 18 : 34 };
  return { key: 'neutral', word: 'Ausgeglichen', fill: 52 };
}

const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

function getHeroByName(name) { return HEROES.find(h => h.label.toLowerCase() === (name||'').toLowerCase()); }
function getHeroColor(name) { const h = getHeroByName(name); return h ? h.color : '#7A9BBE'; }
function getHeroNetto(nettos, name) { const h = getHeroByName(name); return h ? nettos[h.key] : null; }

/* ---- Auswertungstexte: 1:1 aus dem Original übernommen (die Intelligenz) ---- */
function getInterpText(role, heroName, netto) {
  const isNeg = netto < -0.4;
  const isHigh = netto >= 2.0;
  const isMid = netto >= 0.5 && netto < 2.0;
  const isNeutral = netto >= -0.4 && netto < 0.5;

  const nettoInsight = isHigh
    ? `Dieser Modus lädt dich netto stark auf: Die Energie, die du beim Einsatz des ${heroName}-Modus gewinnst, übersteigt die Kosten deutlich. Du kannst ihn großzügig einsetzen.`
    : isMid
    ? `Dieser Modus lädt dich netto leicht auf. Die Quellen überwiegen die Kosten – du kannst ihn regelmäßig einsetzen, solange du auf Erholungsphasen achtest.`
    : isNeutral
    ? `Dieser Modus ist energetisch ausgeglichen. Was du investierst, bekommst du in etwa zurück. Er belastet dich nicht – aber er lädt dich auch nicht aktiv auf.`
    : `Die Kosten dieses Modus übersteigen die Quellen. Das bedeutet nicht, dass du ihn meiden sollst – aber dosierter Einsatz und bewusste Erholung danach sind wichtig.`;

  const ROLE_TEXTS = {
    basis: {
      main: isNeg
        ? `Dein Basisheld ${heroName} ist der Modus, aus dem du am häufigsten heraus agierst – und er kostet dich aktuell netto Energie. Das erklärt, warum sich dauerhaftes Funktionieren anstrengend anfühlen kann. Die Fähigkeiten sind da, aber der Preis ist spürbar.`
        : isNeutral
        ? `Dein Basisheld ${heroName} ist energetisch ausgeglichen. Du agierst stabil aus diesem Modus – er erschöpft dich nicht, aber er trägt dich auch nicht automatisch. Der Kontext entscheidet, ob er aufladt oder kostet.`
        : `Dein Basisheld ${heroName} lädt dich netto auf. Das ist eine starke Ausgangslage: Du agierst am häufigsten aus einem Modus, der dir mehr gibt als er nimmt. Das macht dich langfristig belastbarer.`,
      impulse: isNeg
        ? `Schau dir an, welche Situationen oder Rahmenbedingungen die Kosten dieses Modus erhöhen – Rollenerwartungen, Teamdynamiken oder Dauerdruck sind häufige Treiber. Ziel: die Kontexte reduzieren, die den ${heroName}-Modus von aufladend auf zehrend kippen.`
        : isNeutral
        ? `Welche konkreten Situationen heben deinen ${heroName}-Modus von ausgeglichen auf aufladend? Kontext, Aufgabenart und Zusammenarbeit machen hier den entscheidenden Unterschied. Das ist der Hebel für mehr Energie.`
        : `Diese Stärke ist dein natürlicher Anker. Achte darauf, diese aufladenden Kontexte bewusst zu schützen – und ergänze sie durch deinen Zweithelden, damit keine Einseitigkeit entsteht.`
    },
    zweit: {
      main: isNeg
        ? `Dein Zweitheld ${heroName} ergänzt deinen Basishelden im Alltag – aber er kostet dich aktuell netto Energie. Das bedeutet: Auch dein wichtigster Ausgleichsmodus zehrt. Wenn beide Haupthelden netto kosten, fehlt dir ein natürlicher Erholungskanal.`
        : isNeutral
        ? `Dein Zweitheld ${heroName} ist energetisch neutral. Er ist situativ einsetzbar und belastet dich nicht – aber er gibt dir auch keinen aktiven Energieschub.`
        : `Dein Zweitheld ${heroName} ist eine echte Ressource. Er ergänzt deinen Basishelden auf eine Weise, die dich netto stärkt. Diese Kombination ist eine stabile Energiebasis.`,
      impulse: isNeg
        ? `Prüfe, welche Kontexte den ${heroName}-Modus bei dir von netto neutral auf zehrend kippen. Manchmal hilft es, diesen Modus bewusster einzusetzen – weniger als Dauerzustand, mehr als gezieltes Werkzeug.`
        : isNeutral
        ? `Identifiziere die Situationen, in denen der ${heroName}-Modus dich wirklich auflädt – und setze ihn gezielt dort ein, statt ihn als Standard-Ergänzung zu verwenden.`
        : `Ritualisiere die Momente, in denen du ${heroName} als Ergänzung einsetzt. Diese Kombination aus Basis- und Zweitheld ist dein natürlicher Energiekreislauf.`
    },
    stress1: {
      main: isNeg
        ? `Dein erster Stressheld ${heroName} aktiviert sich bei frühem Druck – und kostet dich netto Energie. Das ist eine doppelte Belastung: Stress selbst plus ein zehrender Modus. Frühe Stressphasen können dich dadurch schneller erschöpfen als du erwartest.`
        : isNeutral
        ? `Dein erster Stressheld ${heroName} ist energetisch ausgeglichen. Du zahlst keinen Extra-Preis für frühen Stress – der Modus selbst belastet dich nicht zusätzlich.`
        : `Dein erster Stressheld ${heroName} gibt dir sogar unter frühem Druck netto Energie. Das ist eine ungewöhnliche Stärke: Du aktivierst unter Stress einen Modus, der dich nicht zusätzlich belastet.`,
      impulse: isNeg
        ? `Lerne deine frühen Stress-Warnsignale kennen. Je früher du merkst, dass du in den ${heroName}-Modus rutschst, desto schneller kannst du gegensteuern – zum Beispiel durch bewussten Wechsel in einen aufladenderen Modus.`
        : isNeutral
        ? `Kenne die Kontexte, die diesen Modus unter Druck von ausgeglichen auf zehrend kippen – besonders in längeren Stressphasen ist das wichtig zu beobachten.`
        : `In Drucksituationen kannst du dem ${heroName}-Modus vertrauen. Nutze dieses Wissen bewusst – und achte darauf, danach wieder in deinen Basismodus zurückzufinden.`
    },
    stress2: {
      main: isNeg
        ? `Dein zweiter Stressheld ${heroName} aktiviert sich bei tiefer, lang anhaltender Erschöpfung – und er kostet dich netto Energie. Das ist die kritischste Kombination: Tiefe Erschöpfung plus ein zehrender Modus. Langzeitstress ist für dich besonders zehrend.`
        : isNeutral
        ? `Dein zweiter Stressheld ${heroName} ist energetisch ausgeglichen – auch bei tiefer Eskalation zahlst du keinen Extra-Preis durch den Modus selbst.`
        : `Dein zweiter Stressheld ${heroName} gibt dir auch bei tiefer Eskalation netto Energie. Das ist eine echte Resilienz-Ressource – du bleibst auch in extremen Stressphasen handlungsfähig.`,
      impulse: isNeg
        ? `Baue aktiv Erholungsphasen ein, bevor es zur zweiten Eskalation kommt. Auf diesem Level ist Gegensteuern deutlich schwerer – Prävention ist wichtiger als Reaktion.`
        : isNeutral
        ? `Der Fokus liegt auf dem generellen Stressmanagement. Erholungsroutinen und frühe Warnsignale sind dein wichtigstes Werkzeug – nicht der Modus selbst.`
        : `Vertraue diesem Modus in extremen Stressphasen. Vergiss aber nicht, danach bewusst zu regenerieren – auch starke Ressourcen brauchen Erholung.`
    }
  };
  return { main: ROLE_TEXTS[role].main, nettoInsight, impulse: ROLE_TEXTS[role].impulse };
}

/* Netto-Klartext-Zeile über den Batterien – der Aha-Moment.
   Fasst das Gesamtsystem in einem Satz zusammen. */
function getNetSummary(nettos, basis, zweit, stress1, stress2) {
  const nb = getHeroNetto(nettos, basis);
  const nz = getHeroNetto(nettos, zweit);
  const ns1 = getHeroNetto(nettos, stress1);
  const ns2 = getHeroNetto(nettos, stress2);

  const mainCharge = (nb !== null && nb >= 0.5) || (nz !== null && nz >= 0.5);
  const stressDrain = (ns1 !== null && ns1 <= -0.5) || (ns2 !== null && ns2 <= -0.5);
  const mainDrain = (nb !== null && nb <= -0.5);

  if (mainCharge && stressDrain) {
    return `Deine Hauptmodi laden dich auf – aber unter Druck schaltest du in einen Modus, der dich <strong>auslaugt</strong>. Das erklärt, warum stressige Phasen dich besonders erschöpfen.`;
  }
  if (mainDrain) {
    return `Dein häufigster Modus <strong>kostet dich netto Kraft</strong>. Das erklärt, warum sich dauerhaftes Funktionieren anstrengend anfühlen kann – die Fähigkeit ist da, aber der Preis ist spürbar.`;
  }
  if (mainCharge && !stressDrain) {
    return `Deine wichtigsten Modi <strong>tragen dich</strong> – auch unter Druck zahlst du keinen Extra-Preis. Eine stabile Ausgangslage, auf der du bewusst aufbauen kannst.`;
  }
  return `Deine Energiebilanz ist gemischt: Manche Modi laden dich auf, andere kosten Kraft. <strong>Das ist normal</strong> – und zeigt dir genau, wo du dosieren und wo du schöpfen kannst.`;
}

function getPatternText(nettos) {
  const vals = Object.values(nettos).filter(v => v !== null);
  if (!vals.length) return null;
  const posCount = vals.filter(v => v >= 0.5).length;
  const negCount = vals.filter(v => v < -0.4).length;
  if (negCount >= 4) return { title: 'Gesamtbild: Hohes Netto-Energiedefizit', text: 'Dein Profil zeigt, dass die Kosten deiner Heldenmodi aktuell die Quellen in vielen Bereichen übersteigen. Das ist ein wichtiges Signal: Nicht die Fähigkeiten fehlen – sondern der Kontext oder die Erholung, die nötig wäre, um die Balance zu halten. Der erste Schritt ist zu verstehen, welche Rahmenbedingungen die Kosten treiben – bevor du an den einzelnen Helden arbeitest.' };
  if (posCount >= 4) return { title: 'Gesamtbild: Starke Netto-Ressourcenbasis', text: 'Deine Heldenmodi laden dich netto in den meisten Bereichen auf. Das ist eine stabile Ausgangslage: Du kannst aus vielen Modi heraus agieren, ohne schnell auszubrennen. Nutze dieses Wissen, um gezielt die aufladendsten Kontexte zu schützen und zu stärken.' };
  return { title: 'Gesamtbild: Gemischte Energiebilanz', text: 'Dein Profil zeigt eine Mischung aus aufladenden und zehrenden Modi. Das ist normal – und gibt dir klare Orientierung. Die aufladenden Helden sind deine natürlichen Ressourcen, die zehrenden brauchen bewussteren Einsatz und mehr Erholung danach.' };
}

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const nettos = {};
  let hasNetto = false;
  HEROES.forEach(h => {
    const n = parseFloat(p.get(h.nettoKey));
    nettos[h.key] = isNaN(n) ? null : n;
    if (!isNaN(n)) hasNetto = true;
  });
  return {
    nettos, hasNetto,
    basis:   p.get('basis')   || '',
    zweit:   p.get('zweit')   || '',
    stress1: p.get('stress1') || '',
    stress2: p.get('stress2') || '',
    isPaid:  p.get('paid') === '1',
  };
}

function getRoleBadge(heroName, basis, zweit, stress1, stress2) {
  const n = heroName.toLowerCase();
  if (n === basis.toLowerCase())   return 'Basisheld';
  if (n === zweit.toLowerCase())   return 'Zweitheld';
  if (n === stress1.toLowerCase()) return 'Stressheld 1';
  if (n === stress2.toLowerCase()) return 'Stressheld 2';
  return '';
}

function render() {
  const { nettos, hasNetto, basis, zweit, stress1, stress2, isPaid } = getParams();
  const el = document.getElementById('content');

  if (!hasNetto) {
    el.innerHTML = `<div class="no-data">Keine Energie-Daten verfügbar.<br>Bitte schließe zuerst den Fragebogen ab.</div>`;
    return;
  }

  const basisLc = basis.toLowerCase();
  let html = '';

  /* --- Netto-Klartext-Zeile (nur wenn paid; im Teaser ersetzt durch Cliffhanger) --- */
  if (isPaid) {
    html += `<div class="net-summary" id="net-summary">${getNetSummary(nettos, basis, zweit, stress1, stress2)}</div>`;
  } else {
    html += `<div class="net-summary" id="net-summary">Das hier ist erst dein <strong>Basisheld</strong>. Deine vollständige Energiebilanz zeigt, welche deiner sechs Modi dich tragen – und welche dich heimlich auslaugen.</div>`;
  }

  /* --- Batterie-Liste --- */
  html += `<div class="batteries">`;
  HEROES.forEach((h, i) => {
    const netto = nettos[h.key];
    const badge = getRoleBadge(h.label, basis, zweit, stress1, stress2);
    const isBasis = h.label.toLowerCase() === basisLc;

    // Im Teaser: nur der Basisheld ist sichtbar, der Rest gesperrt.
    const locked = !isPaid && !isBasis;

    if (locked) {
      html += `<div class="batt-row locked" style="--hero-color:${h.color}; transition-delay:${i*0.06}s">
        <div class="batt-label">
          <div class="batt-hero">${h.label}</div>
          ${badge ? `<span class="batt-role">${badge}</span>` : ''}
        </div>
        <div class="batt-right">
          <div class="battery state-neutral"><div class="battery-fill" data-fill="50"></div></div>
          <div class="batt-state">${LOCK_ICON}Gesperrt</div>
        </div>
      </div>`;
      return;
    }

    if (netto === null) return;
    const st = getState(netto);
    html += `<div class="batt-row state-${st.key}" style="--hero-color:${h.color}; transition-delay:${i*0.06}s">
      <div class="batt-label">
        <div class="batt-hero">${h.label}</div>
        ${badge ? `<span class="batt-role">${badge}</span>` : ''}
      </div>
      <div class="batt-right">
        <div class="battery state-${st.key}"><div class="battery-fill" data-fill="${st.fill}"></div></div>
        <div class="batt-state">${st.word}</div>
      </div>
    </div>`;
  });
  html += `</div>`;

  /* --- Kompakt-Modus fürs Profil: nur oberer Teil (Titel+Netto+Batterien),
     ganze Sektion klickbar → Energie-Detailseite (Platzhalter). Aktiviert über ?compact=1. --- */
  if (IS_COMPACT) {
    html += `<div class="energie-more">Mehr über deine Energiebilanz <span class="arrow">&rarr;</span></div>`;
    el.innerHTML = html;
    // Inhalt in einen Link wickeln → _top, Platzhalter-Ziel bis Energie-Detailseite steht
    const BASE = 'https://regal-mooncake-d3a250.netlify.app';
    // Detail-URL sauber bauen: Vollansicht erzwingen (compact=0), frame-Param raus
    const dp = new URLSearchParams(location.search);
    dp.set('compact', '0');
    dp.delete('frame');
    const link = document.createElement('a');
    link.className = 'energie-link';
    link.href = BASE + '/energie-detail.html?' + dp.toString();
    link.target = '_top';
    while (el.firstChild) link.appendChild(el.firstChild);
    el.appendChild(link);
    animate(false);
    return;
  }

  /* --- Ab hier: volle Auswertung nur für paid. Im Teaser: Paywall-Karte. --- */
  if (!isPaid) {
    html += `<div class="paywall-card">
      <div class="pw-eyebrow">Deine vollständige Energiebilanz</div>
      <div class="pw-title">Sieh, was dich trägt – und was dich auslaugt</div>
      <div class="pw-text">Schalte 6Heroes frei und erhalte deine komplette Auswertung: alle sechs Modi, deine persönlichen Coaching-Impulse und dein ungenutztes Energiepotenzial.</div>
      <a class="pw-btn" href="${UPGRADE_URL}" target="_top">6Heroes freischalten</a>
    </div>`;
    el.innerHTML = html;
    animate(false);
    return;
  }

  /* === Volle Auswertung (paid) === */
  const roles = [
    { key: 'basis',   name: basis,   label: 'Basisheld' },
    { key: 'zweit',   name: zweit,   label: 'Zweitheld' },
    { key: 'stress1', name: stress1, label: 'Stressheld 1' },
    { key: 'stress2', name: stress2, label: 'Stressheld 2' },
  ].filter(r => r.name);

  const roleHeroes = roles.map(r => r.name.toLowerCase());
  const potentialHeroes = HEROES.filter(h => {
    const netto = nettos[h.key];
    return netto !== null && netto >= 0.5 && !roleHeroes.includes(h.label.toLowerCase());
  }).sort((a, b) => nettos[b.key] - nettos[a.key]);

  html += `<hr class="divider"><div class="interp-wrap">`;
  html += `<div class="interp-title">Deine persönliche Auswertung</div>`;

  const pattern = getPatternText(nettos);
  if (pattern) html += `<div class="pattern-box" id="pattern-box">
    <div class="pattern-title">${pattern.title}</div>
    <div class="pattern-text">${pattern.text}</div>
  </div>`;

  roles.forEach((r, i) => {
    const netto = getHeroNetto(nettos, r.name);
    if (netto === null) return;
    const heroColor = getHeroColor(r.name);
    const st = getState(netto);
    const interp = getInterpText(r.key, r.name, netto);

    html += `<div class="interp-card" id="icard-${i}" style="--role-color:${heroColor}; transition-delay:${0.1 + i*0.1}s">
      <div class="interp-card-header">
        <div>
          <div class="interp-role">${r.label}</div>
          <div class="interp-hero">${r.name}</div>
        </div>
        <span class="state-pill state-${st.key}">${st.word}</span>
      </div>
      <div class="interp-text">${interp.main}</div>
      <div class="netto-insight">${interp.nettoInsight}</div>
      <div class="interp-impulse"><strong>Coaching-Impuls</strong>${interp.impulse}</div>
    </div>`;
  });

  if (potentialHeroes.length > 0) {
    html += `<div class="potential-section-title">Dein ungenutztes Energiepotenzial</div>`;
    potentialHeroes.forEach((h, i) => {
      const netto = nettos[h.key];
      const st = getState(netto);
      const isHigh = netto >= 2.0;
      const potText = isHigh
        ? `Der ${h.label}-Modus lädt dich netto stark auf – auch wenn er nicht dein zugewiesener Basis- oder Zweitheld ist. Das bedeutet: Du hast hier eine brachliegende Ressource. In Situationen, die dem ${h.label}-Modus entgegenkommen, kannst du bewusst in diesen Modus wechseln – ohne dass es dich erschöpft.`
        : `Der ${h.label}-Modus gibt dir netto Energie, auch wenn er nicht dein Hauptheld ist. Er kann als situativer Verstärker dienen – zum Beispiel in Phasen, in denen dein Basisheld gerade viel Energie kostet.`;

      html += `<div class="interp-card" id="pcrd-${i}" style="--role-color:${h.color}; transition-delay:${0.3 + i*0.1}s">
        <div class="interp-card-header">
          <div>
            <div class="interp-role">Potenzial-Held</div>
            <div class="interp-hero">${h.label}</div>
          </div>
          <span class="state-pill state-${st.key}">${st.word}</span>
        </div>
        <div class="interp-text">${potText}</div>
        <div class="interp-impulse"><strong>Aktivierungs-Impuls</strong>Überlege: In welchen konkreten Situationen dieser Woche könntest du bewusst in den ${h.label}-Modus wechseln? Welche Aufgaben, Gespräche oder Entscheidungen passen zu diesem Modus – und wann hast du die Freiheit, ihn zu wählen?</div>
      </div>`;
    });
  }

  html += `</div>`; // interp-wrap
  el.innerHTML = html;
  animate(true);
}

function animate(full) {
  requestAnimationFrame(() => {
    const ns = document.getElementById('net-summary');
    if (ns) setTimeout(() => ns.classList.add('visible'), 60);

    document.querySelectorAll('.batt-row').forEach((row, i) => {
      setTimeout(() => {
        row.classList.add('visible');
        row.querySelectorAll('.battery-fill').forEach(f => {
          setTimeout(() => { f.style.width = f.dataset.fill + '%'; }, 60);
        });
      }, 120 + i * 80);
    });

    if (full) {
      setTimeout(() => {
        const pb = document.getElementById('pattern-box');
        if (pb) pb.classList.add('visible');
        document.querySelectorAll('.interp-card').forEach((c, i) => {
          setTimeout(() => c.classList.add('visible'), i * 120);
        });
      }, 700);
    }
  });
}

render();

/* === 6HEROES iframe Auto-Höhe: Sender (robust) === */
function postHeight(){
  var h=Math.max(document.body.scrollHeight,document.body.offsetHeight,
    document.documentElement.scrollHeight,document.documentElement.offsetHeight);
  parent.postMessage({type:"6heroes:setHeight",height:h,frame:__FRAME_ID__},"*");
}
window.addEventListener("load",postHeight);
window.addEventListener("resize",postHeight);
if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(postHeight); }
[50,200,500,1000,1600].forEach(function(t){ setTimeout(postHeight,t); });
</script>
</body>
</html>
