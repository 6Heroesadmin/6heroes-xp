<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deine Stressdynamik – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--ok:#1F9D62;--warn:#B4471B;--gold:#F2B705;--accent:#0B63CE;--accent2:#F0672A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 72px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.topbar svg{width:20px;height:20px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 6px}
.emb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'DM Serif Display',Georgia,serif;font-size:38px}
.emb2{display:flex}
.emb2 .emb{width:68px;height:68px;border-radius:34px;font-size:30px;border:3px solid var(--bg)}
.emb2 .emb+.emb{margin-left:-14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.15}
h1 .accent{color:var(--accent)}
.hook{font-size:16px;line-height:1.6;color:var(--mute);max-width:54ch}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
details[open]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s1{display:flex;flex-direction:column;gap:1px}
summary .a{font-size:15.5px;font-weight:600;line-height:1.35}
summary .b{font-size:12.5px;color:var(--mute)}
summary:after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details[open] summary:after{transform:rotate(45deg)}
.body{padding:2px 18px 20px;display:flex;flex-direction:column;gap:18px}
.blk{display:flex;flex-direction:column;gap:6px}
.bl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bl.ok{color:var(--ok)}.bl.warn{color:var(--warn)}
p{font-size:15.5px;line-height:1.7}
ul{padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:15.5px;line-height:1.6}
.card{display:flex;flex-direction:column;gap:18px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding-top:30px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.pill:hover{border-color:var(--ink)}
@media (max-width:480px){.wrap{padding:8px 16px 56px}}

.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px;margin-top:20px}
.chart svg{width:100%;height:auto;display:block}
.curve-note{margin-top:12px;font-size:13.5px;color:var(--mute);text-align:center;line-height:1.55}
.same{display:none;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--mute)}
.same.show{display:block}.same b{color:var(--ink)}
.stage{display:flex;align-items:center;gap:12px;padding:30px 2px 10px}
.stage .bd{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.stage .bd.s1{background:#C9921A}.stage .bd.s2{background:#C0405E}
.stage .ph{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.lock-wrap{position:relative}
.lock-wrap.locked .lockable{filter:blur(6px);opacity:.5;pointer-events:none;user-select:none}
.lock-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.lock-wrap.locked .lock-overlay{display:flex}
.lock-overlay .t{font-size:17px;font-weight:700;max-width:360px;line-height:1.45}
.lock-overlay a{display:inline-flex;align-items:center;min-height:44px;padding:0 26px;border-radius:999px;background:var(--gold);color:#20293A;font-weight:700;font-size:15px;text-decoration:none}
</style>
</head>

<script>
const STRESS={"intro":"Jeder Mensch hat zwei Stresshelden – einen für die Alarmphase (S1) und einen für die Übersteuerung (S2). Du erkennst deinen S1, wenn du anfängst, „nicht mehr ganz du selbst“ zu sein. Dein S2 zeigt sich, wenn S1 nicht mehr hilft und du in den Überlebensmodus wechselst. Das ist keine Schwäche. Es ist ein Muster – und Muster kann man erkennen, unterbrechen und verändern.","heroes":{"commander":{"s1":{"name":"Der Übernahme-Modus","lead":"Wenn der Commander als Stressheld aktiviert wird, reagierst du auf Druck mit sofortiger Kontrolle. Du übernimmst das Steuer – auch wenn du es eigentlich gar nicht wolltest.","felder":[["Was du tust","Du wirst direktiver, dein Ton wird schärfer, dein Tempo zieht an. Du entscheidest schneller und beziehst andere weniger ein – nicht aus Rücksichtslosigkeit, sondern weil Handeln sich sicherer anfühlt als Warten."],["Was andere erleben","Andere fühlen sich übergangen oder unter Druck gesetzt. Das erzeugt Widerstand, und den siehst du wiederum als Bestätigung, dass du selbst ran musst."],["Was wirklich dahintersteckt","Du brauchst das Gefühl von Wirksamkeit. Wenn du das Ruder nicht in der Hand hast, entsteht eine innere Unruhe, gegen die Handeln die einzige bekannte Gegenstrategie ist."],["Dein Frühwarnsignal","Du merkst, dass du schneller redest, weniger fragst und das Gespräch übernimmst – obwohl du dir vorgenommen hattest, zuzuhören."]],"x":{"trigger":"Dich stresst es, wenn Dinge unklar oder chaotisch sind, wenn das Tempo zu langsam ist oder jemand blockiert. Besonders schwer auszuhalten ist es, wenn niemand Verantwortung übernimmt und du denkst: „Niemand entscheidet.“","ziel":"Du willst wieder Kontrolle, eine klare Richtung und mehr Tempo herstellen.","verhalten":["Du übernimmst die Führung, ohne zu fragen.","Du entscheidest schnell und lässt kaum noch Diskussion zu.","Du priorisierst hart und sagst klar, was zuerst kommt.","Du forderst Updates und Status ein und setzt Deadlines.","Du wirst im Ton direkter und hast weniger Geduld."],"saetze":["„Wir verlieren Zeit.“","„Jemand muss das jetzt ziehen.“","„Nicht reden – machen.“","„So kriegen wir das wieder in den Griff.“"],"nutzen":"Du bringst Schwung in die Sache, schaffst Klarheit und machst alle wieder handlungsfähig.","risiko":"Du wirkst dominant, erzeugst Druck und steuerst vielleicht bis ins Detail. Andere machen dann zu oder gehen in Widerstand.","need":"Du brauchst einen klaren Entscheidungsrahmen, eindeutige Zuständigkeiten und sichtbaren Fortschritt."}},"s2":{"name":"Der Zwangskontroll-Modus","lead":"Wenn der Commander als zweiter Stressheld aktiviert wird, bist du schon eine Weile unter Druck. Und jetzt zeigt sich eine härtere Version: Du duldest keinen Widerspruch mehr.","felder":[["Was du tust","Dein Ton wird kalt oder aggressiv. Du nutzt deine Position, um andere kleinzumachen oder zum Schweigen zu bringen. Es geht nicht mehr darum, das Beste für die Situation zu finden – es geht darum, die Kontrolle zu behalten."],["Was andere erleben","Andere gehen in die innere Kündigung, ihr Vertrauen bricht weg, und die besten Stimmen im Raum werden still."],["Was wirklich dahintersteckt","Du stehst kurz vor dem Gefühl des totalen Kontrollverlusts – und dein System kämpft dagegen mit dem einzigen Mittel, das es kennt: totale Dominanz."],["Dein Frühwarnsignal","Du bemerkst, dass du Sarkasmus einsetzt, jemandem das Wort abschneidest oder jemanden öffentlich bloßstellst."]],"x":{"trigger":"Du stehst schon lange unter Druck, ohne dass dein Einsatz etwas bewirkt. Du verlierst trotz allem die Kontrolle, erlebst wiederholt Blockaden oder Fehler anderer und fühlst dich ohnmächtig.","ziel":"Du willst, dass es jetzt passiert, egal wie. Dafür kontrollierst du alles.","verhalten":["Du setzt Dinge einfach durch, erzeugst Druck anderen gegenüber oder eskalierst innerhalb der Hierarchie.","Du wirst schneidend, sarkastisch oder kalt.","Du übernimmst alles selbst und vertraust niemandem mehr.","Du machst Druck über Angst oder Schuld, etwa mit einem „sonst …“.","Du hörst nicht mehr zu, nur noch das Ergebnis zählt."],"saetze":["„Ich kann mich auf keinen verlassen.“","„Dann mache ich es eben selbst.“","„Das ist nicht verhandelbar.“"],"nutzen":"Du bekommst ein Ergebnis, aber um jeden Preis.","risiko":"Du beschädigst Beziehungen und erzeugst eine Kultur der Angst. Du erschöpfst dich selbst und triffst Fehlentscheidungen, weil du nur noch das Ziel siehst.","need":"Du brauchst Entlastung, das Gefühl von Sicherheit, jemanden, der dich beruhigt, und klare Grenzen dafür, wofür du verantwortlich bist."}}},"guardian":{"s1":{"name":"Der Absicherungs-Modus","lead":"Wenn der Guardian als Stressheld aktiviert wird, reagierst du auf Druck mit dem starken Drang, alles abzusichern – bevor du einen nächsten Schritt machst.","felder":[["Was du tust","Du verlangsamst. Du stellst mehr Fragen. Du prüfst Details doppelt. Du pochst auf Prozesse und Regeln – nicht um zu blockieren, sondern weil du Sicherheit brauchst, bevor du weitergehen kannst."],["Was andere erleben","Andere fühlen sich ausgebremst. Besonders Menschen mit höherem Tempo empfinden dein Verhalten als Widerstand gegen Fortschritt."],["Was wirklich dahintersteckt","Dein inneres Bedürfnis ist Schutz – vor Fehlern, vor Schaden, vor Chaos. Und solange du nicht das Gefühl hast, dass alles wirklich abgesichert ist, kannst du nicht loslassen."],["Dein Frühwarnsignal","Du merkst, dass du dieselbe Frage zum dritten Mal stellst – oder dass du Details prüfst, die du eigentlich schon kennst."]],"x":{"trigger":"Dich stresst es, wenn Risiken, Unsicherheit oder Fehlergefahr auftauchen, wenn Regeln gebrochen werden oder Informationen fehlen. Dann denkst du: „Das ist nicht sauber.“","ziel":"Du willst dich absichern, alles richtig machen und Schaden vermeiden.","verhalten":["Du checkst Details und packst Listen und Standards aus.","Du erinnerst andere an Regeln, Risiken und Zuständigkeiten.","Du wirst vorsichtig und bremst das Tempo.","Du willst Freigaben und Bestätigungen haben.","Du kontrollierst die Essentials, damit nichts vergessen wird."],"saetze":["„Wir dürfen nichts übersehen.“","„Sicherheit zuerst.“","„Sonst zahlen wir später.“"],"nutzen":"Du sorgst für Qualität und Stabilität und verhinderst Fehler, bevor sie passieren.","risiko":"Du bleibst zu lange stehen, wirst belehrend und bekommst Angst vor Fehlern. Mit schnellen Typen gerätst du leicht in Konflikt.","need":"Du brauchst Mindestkriterien, einen Plan B, verlässliche Informationen und klare Verantwortung."}},"s2":{"name":"Der Blockade-Modus","lead":"Wenn der Guardian als zweiter Stressheld aktiviert wird, kippt Absicherung in Starre. Du blockierst aktiv – nicht weil du nicht willst, sondern weil jede Bewegung sich gefährlich anfühlt.","felder":[["Was du tust","Du siehst überall Bedrohungen. Jede Veränderung wird zum Risiko. Du lehnst neue Vorschläge ab, bevor du sie wirklich gehört hast. Prozesse werden zur Festung."],["Was andere erleben","Es herrscht Stillstand, und niemand kann mehr mit dir planen. Du wirkst pedantisch oder zwanghaft, obwohl du eigentlich nur schützen willst."],["Was wirklich dahintersteckt","Dein System versucht, den „totalen Absturz“ zu verhindern. Die Energie, die normalerweise Sicherheit schafft, ist jetzt zu einem Schutzwall geworden, der dich einschließt."],["Dein Frühwarnsignal","Du lehnst etwas ab, ohne genau sagen zu können, was dich eigentlich stört."]],"x":{"trigger":"Du erlebst immer wieder Fehler oder Unzuverlässigkeit und fühlst dich über längere Zeit unsicher. Du hast den Eindruck, die Kontrolle zu verlieren.","ziel":"Du willst alles kontrollieren, weil du denkst: „Wenn ich nicht alles absichere, geht es schief.“","verhalten":["Du wirst perfektionistisch und dokumentierst übermäßig.","Du wirst misstrauisch und prüfst alles doppelt.","Du blockierst Entscheidungen, solange du keine hundertprozentige Sicherheit hast.","Du wirst rigide und bestehst darauf, dass es genau so sein muss.","Du wirkst auf andere schnell moralisch oder anklagend."],"saetze":["„Niemand nimmt das ernst.“","„Wenn ich nicht aufpasse, passiert was.“","„Das ist unverantwortlich.“"],"nutzen":"Du bekommst nur eine Scheinsicherheit.","risiko":"Du bleibst stehen und erschöpfst dich. Dein Umfeld wird frustriert, und die Leichtigkeit geht verloren.","need":"Du brauchst Vertrauen, Entlastung, klare Grenzen und das Gefühl, dass du dich sicher fühlen darfst."}}},"innovator":{"s1":{"name":"Der Ablenkungsflug-Modus","lead":"Wenn der Innovator als Stressheld aktiviert wird, reagierst du auf Druck mit einem plötzlichen Ideen-Schwall. Neue Ansätze, neue Projekte, neue Perspektiven – alles fühlt sich wichtiger an als das, womit du gerade feststeckst.","felder":[["Was du tust","Du wechselst das Thema. Du bringst neue Ideen ein, bevor die alten fertig sind. Du weichst konkreten Fragen aus – nicht absichtlich, sondern weil dein Geist bereits woanders ist."],["Was andere erleben","Andere sind verwirrt und frustriert. Sie fragen sich, wo du gedanklich gerade bist und ob du dich noch an gemeinsame Zusagen hältst."],["Was wirklich dahintersteckt","Neues Denken gibt dir Handlungsspielraum. Wenn du dich eingeengt fühlst, ist Kreativität die erste Fluchtstrategie."],["Dein Frühwarnsignal","Du merkst, dass du mittendrin eine neue Idee anfängst – obwohl du dir vorgenommen hattest, etwas Begonnenes zu beenden."]],"x":{"trigger":"Dich stresst es, wenn du eingeschränkt wirst, wenn nichts vorangeht oder die Regeln eng sind. Auch „Das geht nicht“ und Kritik, die dir keinen Lösungsspielraum lässt, setzen dich unter Druck.","ziel":"Du willst Optionen öffnen und durch Kreativität nach vorn ausweichen.","verhalten":["Du brainstormst und springst zwischen Ideen.","Du stellst das Vorgehen infrage und provozierst einen Perspektivwechsel.","Du suchst nach Abkürzungen, Tools und Hacks.","Du wechselst den Fokus, sobald es zäh wird.","Du wirkst ungeduldig gegenüber Bürokratie."],"saetze":["„Das muss doch einfacher gehen.“","„Warum machen wir das so kompliziert?“","„Ich löse das anders.“"],"nutzen":"Du findest neue Wege und wirst unter Druck innovativ.","risiko":"Du erzeugst Chaos und wirkst unverbindlich. Es bleibt bei Ideen, statt dass etwas umgesetzt wird.","need":"Du brauchst Spielraum, ein Experimentierfenster und die Möglichkeit, Dinge schnell zu testen."}},"s2":{"name":"Der Sabotage-Modus","lead":"Wenn der Innovator als zweiter Stressheld aktiviert wird, wird Kreativität destruktiv. Du sprengst Strukturen, statt neue zu schaffen.","felder":[["Was du tust","Du wirst zynisch gegenüber Regeln und bestehenden Prozessen. Du untergräbst aktiv, was aufgebaut wurde – manchmal bewusst, manchmal ohne es zu merken. Oder du ziehst dich vollständig zurück in eine innere Welt."],["Was andere erleben","Andere erleben Chaos und verlieren das Vertrauen in dich. Sie haben das Gefühl, dass du nicht mehr erreichbar bist."],["Was wirklich dahintersteckt","Du brauchst radikale Freiheit – und wenn du sie nicht bekommst, entsteht der Drang, die Grenzen selbst zu zerstören."],["Dein Frühwarnsignal","Du bemerkst, dass du öffentlich über etwas herzieht, das du eigentlich mitgebaut hast."]],"x":{"trigger":"Du wirst dauerhaft begrenzt, scheiterst wiederholt und fühlst dich eingesperrt. Dazu kommt, dass du keine Wertschätzung bekommst.","ziel":"Du willst radikal brechen und denkst: „Ich sprenge das System oder ich bin raus.“","verhalten":["Du unterläufst Regeln und wirst zynisch.","Du kündigst innerlich und ziehst dich aus Verbindlichkeit zurück.","Du machst nur noch das Minimum oder startest chaotische Aktionen.","Du provozierst Konflikte, um Bewegung zu erzwingen."],"saetze":["„Das ist alles sinnlos.“","„Dann macht euren Quatsch halt ohne mich.“","„Ich lass mich nicht einengen.“"],"nutzen":"Du schützt dich selbst, indem du Distanz schaffst und autonom bleibst.","risiko":"Du verlierst Vertrauen, Beziehungen brechen, und es bleibt verbrannte Erde zurück.","need":"Du brauchst Autonomie, Anerkennung, echten Handlungsspielraum und die Chance auf einen Neustart."}}},"strategist":{"s1":{"name":"Der Zerdenkungs-Modus","lead":"Wenn der Strategist als Stressheld aktiviert wird, reagierst du auf Druck mit mehr Analyse. Noch mehr Daten, noch mehr Abhängigkeiten, noch mehr Szenarien – bevor du handelst.","felder":[["Was du tust","Du ziehst dich mental zurück. Du stellst mehr klärende Fragen. Du baust komplexere Modelle. Du suchst nach dem perfekten Weg – während die Situation auf eine Entscheidung wartet."],["Was andere erleben","Du wirkst distanziert oder emotional unnahbar. Sie haben das Gefühl, dass du mit dem Kopf woanders bist."],["Was wirklich dahintersteckt","Dein Bedürfnis ist Klarheit vor Fehlentscheidung. Solange die Analyse nicht vollständig ist, fühlt sich Handeln unverantwortlich an."],["Dein Frühwarnsignal","Du merkst, dass du dieselben Daten zum zweiten Mal durchgehst – oder dass deine Fragen klarer werden, deine Entscheidung aber nicht."]],"x":{"trigger":"Dich stresst es, wenn Ziele unklar sind, wenn sich Dinge widersprechen oder Daten fehlen. Auch taktische Risiken und Planlosigkeit bringen dich unter Druck.","ziel":"Du willst Struktur und Logik herstellen und wieder entscheiden können.","verhalten":["Du stellst Klärungsfragen, ordnest und priorisierst.","Du baust Szenarien und prüfst Annahmen.","Du ziehst dich kurz zurück, um mentalen Abstand zu gewinnen.","Du willst Kriterien statt Bauchgefühl."],"saetze":["„Das ergibt so keinen Sinn.“","„Welche Variable fehlt?“","„Erst Struktur, dann Aktion.“"],"nutzen":"Du schaffst Klarheit, triffst bessere Entscheidungen und fliegst weniger blind.","risiko":"Du verlierst dich in Analyse und wirkst dabei kühl oder abwertend auf andere.","need":"Du brauchst eine klare Zieldefinition, feste Entscheidungsregeln und Zeit zum Denken."}},"s2":{"name":"Der Paralyse-Modus","lead":"Wenn der Strategist als zweiter Stressheld aktiviert wird, verlierst du dich in totaler Abstraktion. Entscheiden ist nicht mehr möglich.","felder":[["Was du tust","Du denkst. Du analysierst. Du siehst alle Seiten – und kannst dich deshalb für keine entscheiden. Du wirkst ruhig, vielleicht sogar kühl. Aber innerlich bist du in einem Labyrinth gefangen."],["Was andere erleben","Andere warten auf eine Entscheidung, die nicht kommt. Sie fühlen sich im Stich gelassen, obwohl du gedanklich niemals fleißiger warst."],["Was wirklich dahintersteckt","Dein System will logisches Scheitern um jeden Preis vermeiden. Und solange keine perfekte Antwort existiert, fühlt sich jede Entscheidung wie ein Risiko an."],["Dein Frühwarnsignal","Du hast die Situation bereits drei Mal neu analysiert – und bist immer noch am selben Punkt."]],"x":{"trigger":"Du erlebst dauerhaft, dass nichts planbar ist, und siehst wiederholt Fehlentscheidungen in deinem Umfeld. Du hast das Gefühl, die Kontrolle zu verlieren.","ziel":"Du denkst nur noch nach und schottest dich ab, weil du glaubst: „Nur Denken schützt mich.“","verhalten":["Du zerdenkst alles und blockierst über Kriterien.","Du wirst zynisch und überkritisch.","Du ziehst dich sozial zurück und denkst: „Ihr versteht es nicht.“","Du perfektionierst Modelle, statt umzusetzen."],"saetze":["„Das ist alles irrational.“","„Mit diesen Leuten geht das nicht.“","„Ohne sauberen Plan ist das Unsinn.“"],"nutzen":"Du bekommst nur eine Scheinkontrolle.","risiko":"Du isolierst dich und kommst nicht voran. Beziehungen werden kühl, und du verpasst Chancen.","need":"Du brauchst Sicherheit, Verbundenheit und das Vertrauen, dass man schrittweise besser wird."}}},"sage":{"s1":{"name":"Der Rückzugs-Modus","lead":"Wenn der Sage als Stressheld aktiviert wird, reagierst du auf Druck mit innerem Rückzug. Du wirst stiller. Du hinterfragst den Sinn dessen, was gerade passiert – und bist mit deinen Gedanken nicht mehr ganz dabei.","felder":[["Was du tust","Du ziehst dich aus der Gruppenenergie zurück. Du fragst (laut oder innerlich): „Warum machen wir das eigentlich?“ Du gibst weniger Input – nicht weil dir nichts einfällt, sondern weil du innerlich nicht mehr stimmig bist mit dem, was passiert."],["Was andere erleben","Du wirkst wie ein Bremser oder Spaßverderber. Sie lesen deine Stille als Desinteresse – obwohl du eigentlich sehr intensiv dabei bist."],["Was wirklich dahintersteckt","Dein Bedürfnis ist innere Stimmigkeit. Wenn etwas gegen deine Werte läuft oder keinen echten Sinn ergibt, kannst du nicht einfach mitmachen."],["Dein Frühwarnsignal","Du bemerkst, dass du still wirst, obwohl du eigentlich etwas sagen wolltest."]],"x":{"trigger":"Dich stresst es, wenn du den Sinn verlierst, wenn gegen deine Werte gehandelt wird oder alles oberflächlich bleibt. Auch zu viel Input und Konflikte ohne Tiefe belasten dich.","ziel":"Du willst Abstand gewinnen, innere Ordnung schaffen und herausfinden, was wirklich zählt.","verhalten":["Du wirst stiller, beobachtest und reflektierst.","Du ziehst dich zurück und reduzierst Kontakte und Input.","Du stellst Grundsatzfragen wie „Warum?“ und „Wozu?“.","Du bremst Schnellschüsse und suchst nach Stimmigkeit."],"saetze":["„Was ist hier wirklich wichtig?“","„Das fühlt sich nicht stimmig an.“","„Ich brauche kurz Abstand.“"],"nutzen":"Du hältst dich an deinen Werten, kommst zur Ruhe und bekommst Klarheit in der Tiefe.","risiko":"Du wirkst kalt oder abwesend, Dinge bleiben liegen, und es entstehen Missverständnisse.","need":"Du brauchst Ruhe, Sinn, einen Rückzug, der respektiert wird, und klare Prioritäten."}},"s2":{"name":"Der Resignations-Modus","lead":"Wenn der Sage als zweiter Stressheld aktiviert wird, kippt innerer Rückzug in emotionalen Abbruch. Du bist nicht mehr erreichbar.","felder":[["Was du tust","Du kommentierst Situationen nur noch fatalistisch oder gar nicht mehr. Du brichst den Kontakt ab und ziehst dich zurück, manchmal körperlich, manchmal emotional."],["Was andere erleben","Andere erleben einen Verlust. Sie wissen nicht, was passiert ist, und die Verbindung, die einmal da war, scheint einfach weg zu sein."],["Was wirklich dahintersteckt","Deine Seele versucht, sich vor weiterer Verletzung zu schützen. Wenn der Sinn komplett weg ist, bleibt nur noch Abschalten."],["Dein Frühwarnsignal","Du denkst: „Es hat eh alles keinen Zweck mehr.“"]],"x":{"trigger":"Du erlebst dauerhaft einen Sinnkonflikt, deine Tiefe wird nicht gesehen, und du wirst überfordert, ohne eine Pause zu bekommen.","ziel":"Du willst dich ganz zurückziehen und denkst: „Ich bin nicht mehr verfügbar.“","verhalten":["Du bist emotional dicht und kaum erreichbar.","Du vermeidest Gespräche und lässt Termine platzen.","Du wirst fatalistisch und denkst: „Es bringt eh nichts.“","Du kündigst innerlich und bist nur noch mental abwesend."],"saetze":["„Ich kann das nicht mehr.“","„Es versteht mich niemand.“","„Ich bin raus.“"],"nutzen":"Du schützt dich davor, überflutet zu werden.","risiko":"Du isolierst dich, Beziehungen brechen ab, und nichts bewegt sich mehr. Das kann deine Stimmung zusätzlich drücken.","need":"Du brauchst Sicherheit, Entlastung, jemanden, der dich beruhigt, und Hilfe, wieder Anschluss zu finden."}}},"explorer":{"s1":{"name":"Der Hektik-Modus","lead":"Wenn der Explorer als Stressheld aktiviert wird, reagierst du auf Druck mit Bewegung – innerlich und äußerlich. Du wirst schneller, unruhiger, suchst nach dem nächsten Ausweg.","felder":[["Was du tust","Du fängst mehrere Dinge gleichzeitig an. Du suchst nach Abkürzungen. Du redest schneller. Du willst die schwere Situation so schnell wie möglich hinter dich bringen."],["Was andere erleben","Du wirkst unzuverlässig oder getrieben, und Flüchtigkeitsfehler häufen sich. Andere wissen nicht mehr genau, womit du gerade wirklich beschäftigt bist."],["Was wirklich dahintersteckt","Bewegung gibt dir das Gefühl, aus dem Druck herauszukommen. Stillstand in einer schwierigen Situation ist unerträglich."],["Dein Frühwarnsignal","Du merkst, dass du gleichzeitig drei Dinge anfängst – und keines davon wirklich weiterkommt."]],"x":{"trigger":"Dich stresst es, wenn es eng wird, wenn nichts vorangeht und es zu viele Regeln gibt. Auch Schwere und festgefahrene Situationen setzen dir zu.","ziel":"Du willst in Bewegung kommen, Freiheit haben und den Druck rausnehmen.","verhalten":["Du wirst unruhig und wechselst Ort, Thema oder Aufgabe.","Du handelst pragmatisch und löst Dinge unterwegs.","Du meidest Details und Drama und kürzt ab.","Du suchst Reize, frische Luft und Tempo."],"saetze":["„Ich muss hier raus.“","„Lass uns einfach anfangen.“","„Das klären wir später.“"],"nutzen":"Du bekommst Energie und Schwung und baust Stress durch Handeln ab.","risiko":"Du wirkst flüchtig und lässt Dinge offen. Andere fühlen sich allein gelassen.","need":"Du brauchst Autonomie, Bewegung, eine klare kleine Etappe und wenig Aufwand drumherum."}},"s2":{"name":"Der Flucht-Modus","lead":"Wenn der Explorer als zweiter Stressheld aktiviert wird, wird Bewegung zur Flucht. Du brichst ab.","felder":[["Was du tust","Du verlässt Situationen, Projekte oder Beziehungen abrupt, manchmal körperlich, manchmal durch völlige emotionale Abwesenheit. Du weichst Verantwortung aus, nicht aus Bosheit, sondern weil das Gewicht unerträglich geworden ist."],["Was andere erleben","Andere bleiben mit einem Trümmerhaufen zurück. Sie stehen plötzlich allein mit dem, was ihr gemeinsam begonnen habt."],["Was wirklich dahintersteckt","Du brauchst totale Befreiung von der Last. Und die einzige Strategie, die dein System kennt, ist: weg."],["Dein Frühwarnsignal","Du planst innerlich bereits den Ausstieg, während du noch mitten in der Situation bist."]],"x":{"trigger":"Du wirst dauerhaft eingeengt und fühlst dich überfordert. Konflikte fühlen sich „klebrig“ an, und du siehst keinen Ausweg.","ziel":"Du willst weg und denkst: „Weg hier, koste es, was es wolle.“","verhalten":["Du brichst Kontakte oder Projekte abrupt ab.","Du weichst Verantwortung aus und tauchst ab.","Du suchst starke Ablenkung und bist rastlos.","Du wirst reizbar und sagst: „Lass mich in Ruhe.“"],"saetze":["„Ich halte das nicht aus.“","„Ich muss da weg.“","„Mir ist alles zu viel.“"],"nutzen":"Du bekommst kurzfristig Entlastung.","risiko":"Du wirst instabil und verlierst Vertrauen. Weil du Dinge vermeidest, entstehen langfristig größere Probleme.","need":"Du brauchst sichere Pausen, Wahlmöglichkeiten, klare Grenzen und einen Wiedereinstieg ohne Scham."}}}}};


var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';

function postHeight(){const h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}
async function getProfile(){
  const p=new URLSearchParams(location.search);const email=(p.get('email')||'').trim();
  if(!email) return null;
  try{const r=await fetch(PROFILE_FN+'?email='+encodeURIComponent(email));if(!r.ok) throw new Error(r.status);return await r.json();}
  catch(e){console.warn('Profil-Fetch fehlgeschlagen:',e);return null;}
}
function boot(render){
  window.addEventListener('load',()=>{render().then(()=>{var w=document.querySelector('.wrap');if(w)w.classList.add('ready');postHeight();});});
  window.addEventListener('resize',postHeight);
  if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
  document.addEventListener('toggle',postHeight,true);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(postHeight);}
  [50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
}


async function render(){
  const q=new URLSearchParams(location.search);
  let s1=cap((q.get('stress1')||'').trim()), s2=cap((q.get('stress2')||'').trim());
  let paid=q.get('paid')!=='0';
  let __d=null;if(!(s1&&s2)||!q.get('basis')){const d=await getProfile();window.__prof=d;if(d&&!(s1&&s2)){s1=s1||cap(d.s1||'');s2=s2||cap(d.s2||'');if(typeof d.isPaid==='boolean')paid=d.isPaid;}}
  let k1=(s1||'commander').toLowerCase(), k2=(s2||'commander').toLowerCase();
  if(!STRESS.heroes[k1]) k1='commander'; if(!STRESS.heroes[k2]) k2='commander';

  const FOCUS={commander:'Wirksamkeit und Kontrolle über das Ergebnis',guardian:'Sicherheit und Verlässlichkeit',innovator:'Freiheit und offene Möglichkeiten',strategist:'Logik und Klarheit',sage:'Sinn und innere Stimmigkeit',explorer:'Bewegung und Neugier'};
  let kb=(q.get('basis')||'').trim().toLowerCase();

  const list=a=>a;
  const one=(key,ph)=>{const d=STRESS.heroes[key][ph],x=d.x||{};const f={};d.felder.forEach(e=>f[e[0]]=e[1]);
    const g1=blk(null,d.lead)+blk('Deine Stressauslöser',x.trigger)+blk('Was du tust',f['Was du tust'])+blk('Woran man es erkennt',null,'',x.verhalten)+blk('Deine inneren Sätze',null,'',x.saetze);
    const g2=blk('Was andere erleben',f['Was andere erleben'])+blk('Was es dir kurzfristig bringt',x.nutzen,'ok')+blk('Wo es kippt',x.risiko,'warn');
    const g3=blk('Was du erreichen willst',x.ziel)+blk('Was wirklich dahintersteckt',f['Was wirklich dahintersteckt'])+blk('Was du in dem Moment brauchst',x.need)+blk('Dein Frühwarnsignal',f['Dein Frühwarnsignal']);
    return '<div class="stage"><span class="bd '+ph+'">'+ph.toUpperCase()+'</span><span><span class="ph">'+(ph==='s1'?'Alarmphase':'Übersteuerung')+'</span><br><b style="font-family:\'DM Serif Display\',Georgia,serif;font-weight:400;font-size:24px">'+esc(d.name)+'</b></span></div>'
      +'<div class="stack">'+acc('So zeigt es sich','Auslöser, Verhalten, innere Sätze',g1,true)+acc('Wie es wirkt','Auf andere und auf dich',g2)+acc('Was dahintersteckt','Ziel, Bedürfnis, Frühwarnsignal',g3)+'</div>';};
  const frict=(()=>{
    let inner;
    if(kb&&HERO_LABEL[kb]){
      inner=(kb===k1)?'Dein Basisheld ist der '+HERO_LABEL[kb]+', und dein Stressheld 1 ist derselbe. Dir ist also '+FOCUS[kb]+' wichtig, und genau das wird unter Druck immer stärker, bis es zu viel wird. In dir selbst entsteht deshalb wenig Spannung. Dafür wirkst du auf andere schnell zu intensiv.'
        :'Dein Basisheld ist der '+HERO_LABEL[kb]+'. Dir ist '+FOCUS[kb]+' wichtig. Dein Stressheld 1 ist der '+HERO_LABEL[k1]+', und ihm geht es um '+FOCUS[k1]+'. Wenn der Stress dich in diese Richtung zieht, handelst du gegen das, was dir sonst wichtig ist. Es fühlt sich an, als wärst du nicht mehr du selbst. Diese Spannung in dir nennen wir innere Reibung.';
    }else inner='Dein Basisheld zeigt, wie du normalerweise tickst und was dir wichtig ist. Unter Druck übernimmt ein Stressheld, der anders tickt. Innere Reibung entsteht, wenn dein Stressverhalten nicht zu dem passt, was dir als Basisheld wichtig ist. Du erkennst dich dann selbst nicht wieder, und das fühlt sich unangenehm an.';
    return blk('Innere Reibung',inner)+blk('Äußere Reibung','Äußere Reibung entsteht zwischen dir und anderen Menschen. Dein Stressverhalten trifft dann auf ein Bedürfnis, das dem anderen gerade wichtig ist. Ein Beispiel: Du wirst schneller, und dein Kollege braucht in diesem Moment Sicherheit und Ruhe. Dann stoßen eure Bedürfnisse aufeinander, und es eskaliert im Umgang miteinander. Andere sehen das sofort.');
  })();
  const AUSSEN={
    commander:['Du wirst im Ton härter und direkter, übernimmst die Führung und erwartest schnelle Ergebnisse. Andere erleben dich als fordernd.','Du setzt dich mit Druck durch und wirst kalt oder schneidend. Andere erleben dich als bedrohlich und ziehen sich zurück oder gehen in Widerstand.'],
    guardian:['Du bremst, sicherst ab und verlangst Regeln und Bestätigungen. Andere erleben dich als vorsichtig und zäh.','Du blockierst, prüfst alles doppelt und wirst rigide. Andere erleben dich als misstrauisch und fühlen sich kontrolliert.'],
    innovator:['Du springst zwischen Ideen, stellst alles infrage und wirst ungeduldig mit Abläufen. Andere erleben dich als unstet.','Du unterläufst Regeln, wirst zynisch und provozierst. Andere erleben dich als unberechenbar und nicht mehr verbindlich.'],
    strategist:['Du stellst viele Klärungsfragen und gehst auf Abstand, um zu ordnen. Andere erleben dich als kühl und distanziert.','Du zerdenkst alles, wirst überkritisch und ziehst dich zurück. Andere erleben dich als blockierend und abwertend.'],
    sage:['Du wirst stiller und ziehst dich zurück, um Sinn und Stimmigkeit zu prüfen. Andere erleben dich als schwer greifbar.','Du bist kaum erreichbar, meidest Gespräche und wirst fatalistisch. Andere fühlen sich allein gelassen.'],
    explorer:['Du wirst unruhig, wechselst Themen und kürzt ab. Andere erleben dich als flüchtig.','Du tauchst ab, brichst Dinge ab und wirst reizbar. Andere erleben dich als unzuverlässig und fühlen sich im Stich gelassen.']
  };
  const AUSSEN_BLK=same
    ? blk('Bei dir als '+HERO_LABEL[k1],AUSSEN[k1][0])+blk('Wenn der Druck steigt',AUSSEN[k1][1])
    : blk('In der Alarmphase ('+HERO_LABEL[k1]+')',AUSSEN[k1][0])+blk('In der Übersteuerung ('+HERO_LABEL[k2]+')',AUSSEN[k2][1]);
  const intro='<div class="label">So baut sich Stress auf</div><div class="stack">'
    +acc('Zuerst innen','Die ersten Sekunden',blk(null,'Stress beginnt in dir. Du merkst, dass etwas nicht stimmt, zum Beispiel weil du Gefahr, Enge, Sinnverlust oder Kontrollverlust spürst. Dein Körper und deine Gedanken schalten um. Das dauert null bis dreißig Sekunden, und von außen sieht noch niemand etwas.'))
    +acc('Dann außen','Wenn andere es merken',blk(null,'Danach wird der Stress sichtbar. Dein Stressheld bestimmt jetzt, wie du dich verhältst, und andere merken es.')+AUSSEN_BLK)
    +acc('Wie Reibung entsteht','Innen und außen',frict)
    +acc('Woran du erkennst, wo es gerade eskaliert','Drei Signale',blk(null,null,'',['Dein Körper:|Wirst du enger oder schneller, etwa bei Puls, Druck oder Unruhe? Dann eskaliert es gerade in dir.','Dein Ton und Tempo:|Wirst du härter, schneller oder stiller? Dann beginnt der Stress, nach außen sichtbar zu werden.','Dein Handeln:|Kontrollierst, bremst, wechselst oder tauchst du ab? Dann ist dein Stressheld gerade aktiv.']))
    +'</div>';
  document.getElementById('stages').innerHTML=intro+one(k1,'s1')+one(k2,'s2');
  if(!paid) document.getElementById('lockWrap').classList.add('locked');
}
boot(render);

</script>
