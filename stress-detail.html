<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deine Stressdynamik – 6Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#20293A;--mute:#5A6272;--line:#E4DFD4;--card:#fff;--ok:#1F9D62;--warn:#B4471B;--gold:#F2B705;--accent:#0B63CE;--accent2:#F0672A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 72px;opacity:0;transition:opacity .2s}
.wrap.ready{opacity:1}
.topbar{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.topbar svg{width:20px;height:20px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 6px}
.emb{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'DM Serif Display',Georgia,serif;font-size:38px}
.emb2{display:flex}
.emb2 .emb{width:68px;height:68px;border-radius:34px;font-size:30px;border:3px solid var(--bg)}
.emb2 .emb+.emb{margin-left:-14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.15}
h1 .accent{color:var(--accent)}
.hook{font-size:16px;line-height:1.6;color:var(--mute);max-width:54ch}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
details[open]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s1{display:flex;flex-direction:column;gap:1px}
summary .a{font-size:15.5px;font-weight:600;line-height:1.35}
summary .b{font-size:12.5px;color:var(--mute)}
summary:after{content:'';flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details[open] summary:after{transform:rotate(45deg)}
.body{padding:2px 18px 20px;display:flex;flex-direction:column;gap:18px}
.blk{display:flex;flex-direction:column;gap:6px}
.bl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bl.ok{color:var(--ok)}.bl.warn{color:var(--warn)}
p{font-size:15.5px;line-height:1.7}
ul{padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:15.5px;line-height:1.6}
.card{display:flex;flex-direction:column;gap:18px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding-top:30px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.pill:hover{border-color:var(--ink)}
@media (max-width:480px){.wrap{padding:8px 16px 56px}}

.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px;margin-top:20px}
.chart svg{width:100%;height:auto;display:block}
.curve-note{margin-top:12px;font-size:13.5px;color:var(--mute);text-align:center;line-height:1.55}
.same{display:none;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--mute)}
.same.show{display:block}.same b{color:var(--ink)}
.stage{display:flex;align-items:center;gap:12px;padding:30px 2px 10px}
.stage .bd{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.stage .bd.s1{background:#C9921A}.stage .bd.s2{background:#C0405E}
.stage .ph{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.lock-wrap{position:relative}
.lock-wrap.locked .lockable{filter:blur(6px);opacity:.5;pointer-events:none;user-select:none}
.lock-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.lock-wrap.locked .lock-overlay{display:flex}
.lock-overlay .t{font-size:17px;font-weight:700;max-width:360px;line-height:1.45}
.lock-overlay a{display:inline-flex;align-items:center;min-height:44px;padding:0 26px;border-radius:999px;background:var(--gold);color:#20293A;font-weight:700;font-size:15px;text-decoration:none}
</style>
</head>

<p class="curve-note">Schwelle 1 ist dein Frühwarnsignal. Wer sie bei sich erkennt, bemerkt früher, wann Schwelle 2 übernimmt.</p>

<script>
const STRESS={"intro":"Jeder Mensch hat zwei Stresshelden – einen für die Alarmphase (S1) und einen für die Übersteuerung (S2). Du erkennst deinen S1, wenn du anfängst, „nicht mehr ganz du selbst“ zu sein. Dein S2 zeigt sich, wenn S1 nicht mehr hilft und du in den Überlebensmodus wechselst. Das ist keine Schwäche. Es ist ein Muster – und Muster kann man erkennen, unterbrechen und verändern.","heroes":{"commander":{"s1":{"name":"Der Übernahme-Modus","lead":"Wenn der Commander als Stressheld aktiviert wird, reagierst du auf Druck mit sofortiger Kontrolle. Du übernimmst das Steuer – auch wenn du es eigentlich gar nicht wolltest.","felder":[["Was du tust","Du wirst direktiver, dein Ton wird schärfer, dein Tempo zieht an. Du entscheidest schneller und beziehst andere weniger ein – nicht aus Rücksichtslosigkeit, sondern weil Handeln sich sicherer anfühlt als Warten."],["Was andere erleben","Sie fühlen sich übergangen oder unter Druck gesetzt – was Widerstand erzeugt, den du wiederum als Bestätigung siehst, dass du selbst ran musst."],["Was wirklich dahintersteckt","Du brauchst das Gefühl von Wirksamkeit. Wenn du das Ruder nicht in der Hand hast, entsteht eine innere Unruhe, gegen die Handeln die einzige bekannte Gegenstrategie ist."],["Dein Frühwarnsignal","Du merkst, dass du schneller redest, weniger fragst und das Gespräch übernimmst – obwohl du dir vorgenommen hattest, zuzuhören."]]},"s2":{"name":"Der Zwangskontroll-Modus","lead":"Wenn der Commander als zweiter Stressheld aktiviert wird, bist du schon eine Weile unter Druck. Und jetzt zeigt sich eine härtere Version: Du duldest keinen Widerspruch mehr.","felder":[["Was du tust","Dein Ton wird kalt oder aggressiv. Du nutzt deine Position, um andere kleinzumachen oder zum Schweigen zu bringen. Es geht nicht mehr darum, das Beste für die Situation zu finden – es geht darum, die Kontrolle zu behalten."],["Was andere erleben","Sie gehen in die innere Kündigung. Vertrauen bricht weg. Die besten Stimmen im Raum werden still."],["Was wirklich dahintersteckt","Du stehst kurz vor dem Gefühl des totalen Kontrollverlusts – und dein System kämpft dagegen mit dem einzigen Mittel, das es kennt: totale Dominanz."],["Dein Signal","Du bemerkst, dass du Sarkasmus einsetzt, jemandem das Wort abschneidest oder jemanden öffentlich bloßstellst."]]}},"guardian":{"s1":{"name":"Der Absicherungs-Modus","lead":"Wenn der Guardian als Stressheld aktiviert wird, reagierst du auf Druck mit dem starken Drang, alles abzusichern – bevor du einen nächsten Schritt machst.","felder":[["Was du tust","Du verlangsamst. Du stellst mehr Fragen. Du prüfst Details doppelt. Du pochst auf Prozesse und Regeln – nicht um zu blockieren, sondern weil du Sicherheit brauchst, bevor du weitergehen kannst."],["Was andere erleben","Sie fühlen sich ausgebremst. Besonders Menschen mit höherem Tempo empfinden dein Verhalten als Widerstand gegen Fortschritt."],["Was wirklich dahintersteckt","Dein inneres Bedürfnis ist Schutz – vor Fehlern, vor Schaden, vor Chaos. Und solange du nicht das Gefühl hast, dass alles wirklich abgesichert ist, kannst du nicht loslassen."],["Dein Frühwarnsignal","Du merkst, dass du dieselbe Frage zum dritten Mal stellst – oder dass du Details prüfst, die du eigentlich schon kennst."]]},"s2":{"name":"Der Blockade-Modus","lead":"Wenn der Guardian als zweiter Stressheld aktiviert wird, kippt Absicherung in Starre. Du blockierst aktiv – nicht weil du nicht willst, sondern weil jede Bewegung sich gefährlich anfühlt.","felder":[["Was du tust","Du siehst überall Bedrohungen. Jede Veränderung wird zum Risiko. Du lehnst neue Vorschläge ab, bevor du sie wirklich gehört hast. Prozesse werden zur Festung."],["Was andere erleben","Stillstand. Niemand kann mehr mit dir planen. Du wirkst pedantisch oder zwanghaft – obwohl du eigentlich nur schützen willst."],["Was wirklich dahintersteckt","Dein System versucht, den „totalen Absturz“ zu verhindern. Die Energie, die normalerweise Sicherheit schafft, ist jetzt zu einem Schutzwall geworden, der dich einschließt."],["Dein Signal","Du lehnst etwas ab, ohne genau sagen zu können, was dich eigentlich stört."]]}},"innovator":{"s1":{"name":"Der Ablenkungsflug-Modus","lead":"Wenn der Innovator als Stressheld aktiviert wird, reagierst du auf Druck mit einem plötzlichen Ideen-Schwall. Neue Ansätze, neue Projekte, neue Perspektiven – alles fühlt sich wichtiger an als das, womit du gerade feststeckst.","felder":[["Was du tust","Du wechselst das Thema. Du bringst neue Ideen ein, bevor die alten fertig sind. Du weichst konkreten Fragen aus – nicht absichtlich, sondern weil dein Geist bereits woanders ist."],["Was andere erleben","Verwirrung und Frustration. Sie fragen sich, wo du gedanklich gerade bist – und ob du die gemeinsamen Commitments noch hältst."],["Was wirklich dahintersteckt","Neues Denken gibt dir Handlungsspielraum. Wenn du dich eingeengt fühlst, ist Kreativität die erste Fluchtstrategie."],["Dein Frühwarnsignal","Du merkst, dass du mittendrin eine neue Idee anfängst – obwohl du dir vorgenommen hattest, etwas Begonnenes zu beenden."]]},"s2":{"name":"Der Sabotage-Modus","lead":"Wenn der Innovator als zweiter Stressheld aktiviert wird, wird Kreativität destruktiv. Du sprengst Strukturen, statt neue zu schaffen.","felder":[["Was du tust","Du wirst zynisch gegenüber Regeln und bestehenden Prozessen. Du untergräbst aktiv, was aufgebaut wurde – manchmal bewusst, manchmal ohne es zu merken. Oder du ziehst dich vollständig zurück in eine innere Welt."],["Was andere erleben","Chaos. Glaubwürdigkeitsverlust. Das Gefühl, dass du nicht mehr erreichbar bist."],["Was wirklich dahintersteckt","Du brauchst radikale Freiheit – und wenn du sie nicht bekommst, entsteht der Drang, die Grenzen selbst zu zerstören."],["Dein Signal","Du bemerkst, dass du öffentlich über etwas herzieht, das du eigentlich mitgebaut hast."]]}},"strategist":{"s1":{"name":"Der Zerdenkungs-Modus","lead":"Wenn der Strategist als Stressheld aktiviert wird, reagierst du auf Druck mit mehr Analyse. Noch mehr Daten, noch mehr Abhängigkeiten, noch mehr Szenarien – bevor du handelst.","felder":[["Was du tust","Du ziehst dich mental zurück. Du stellst mehr klärende Fragen. Du baust komplexere Modelle. Du suchst nach dem perfekten Weg – während die Situation auf eine Entscheidung wartet."],["Was andere erleben","Du wirkst distanziert oder emotional unnahbar. Sie haben das Gefühl, dass du mit dem Kopf woanders bist."],["Was wirklich dahintersteckt","Dein Bedürfnis ist Klarheit vor Fehlentscheidung. Solange die Analyse nicht vollständig ist, fühlt sich Handeln unverantwortlich an."],["Dein Frühwarnsignal","Du merkst, dass du dieselben Daten zum zweiten Mal durchgehst – oder dass deine Fragen klarer werden, deine Entscheidung aber nicht."]]},"s2":{"name":"Der Paralyse-Modus","lead":"Wenn der Strategist als zweiter Stressheld aktiviert wird, verlierst du dich in totaler Abstraktion. Entscheiden ist nicht mehr möglich.","felder":[["Was du tust","Du denkst. Du analysierst. Du siehst alle Seiten – und kannst dich deshalb für keine entscheiden. Du wirkst ruhig, vielleicht sogar kühl. Aber innerlich bist du in einem Labyrinth gefangen."],["Was andere erleben","Sie warten auf eine Entscheidung, die nicht kommt. Sie fühlen sich im Stich gelassen – obwohl du gedanklich niemals fleißiger warst."],["Was wirklich dahintersteckt","Dein System will logisches Scheitern um jeden Preis vermeiden. Und solange keine perfekte Antwort existiert, fühlt sich jede Entscheidung wie ein Risiko an."],["Dein Signal","Du hast die Situation bereits drei Mal neu analysiert – und bist immer noch am selben Punkt."]]}},"sage":{"s1":{"name":"Der Rückzugs-Modus","lead":"Wenn der Sage als Stressheld aktiviert wird, reagierst du auf Druck mit innerem Rückzug. Du wirst stiller. Du hinterfragst den Sinn dessen, was gerade passiert – und bist mit deinen Gedanken nicht mehr ganz dabei.","felder":[["Was du tust","Du ziehst dich aus der Gruppenenergie zurück. Du fragst (laut oder innerlich): „Warum machen wir das eigentlich?“ Du gibst weniger Input – nicht weil dir nichts einfällt, sondern weil du innerlich nicht mehr stimmig bist mit dem, was passiert."],["Was andere erleben","Du wirkst wie ein Bremser oder Spaßverderber. Sie lesen deine Stille als Desinteresse – obwohl du eigentlich sehr intensiv dabei bist."],["Was wirklich dahintersteckt","Dein Bedürfnis ist innere Stimmigkeit. Wenn etwas gegen deine Werte läuft oder keinen echten Sinn ergibt, kannst du nicht einfach mitmachen."],["Dein Frühwarnsignal","Du bemerkst, dass du still wirst, obwohl du eigentlich etwas sagen wolltest."]]},"s2":{"name":"Der Resignations-Modus","lead":"Wenn der Sage als zweiter Stressheld aktiviert wird, kippt innerer Rückzug in emotionalen Abbruch. Du bist nicht mehr erreichbar.","felder":[["Was du tust","Du versiehst Situationen und Menschen mit einem fatalistischen Abschluss-Kommentar – oder gar keinem mehr. Du brichst Kontakt ab. Du „ghostest“ – manchmal physisch, manchmal emotional."],["Was andere erleben","Verlust. Sie wissen nicht, was passiert ist. Die Verbindung, die einmal da war, scheint einfach weg zu sein."],["Was wirklich dahintersteckt","Deine Seele versucht, sich vor weiterer Verletzung zu schützen. Wenn der Sinn komplett weg ist, bleibt nur noch Abschalten."],["Dein Signal","Du denkst: „Es hat eh alles keinen Zweck mehr.“"]]}},"explorer":{"s1":{"name":"Der Hektik-Modus","lead":"Wenn der Explorer als Stressheld aktiviert wird, reagierst du auf Druck mit Bewegung – innerlich und äußerlich. Du wirst schneller, unruhiger, suchst nach dem nächsten Ausweg.","felder":[["Was du tust","Du fängst mehrere Dinge gleichzeitig an. Du suchst nach Abkürzungen. Du redest schneller. Du willst die schwere Situation so schnell wie möglich hinter dich bringen."],["Was andere erleben","Du wirkst unzuverlässig oder getrieben. Flüchtigkeitsfehler häufen sich. Man weiß nicht mehr genau, womit du gerade wirklich beschäftigt bist."],["Was wirklich dahintersteckt","Bewegung gibt dir das Gefühl, aus dem Druck herauszukommen. Stillstand in einer schwierigen Situation ist unerträglich."],["Dein Frühwarnsignal","Du merkst, dass du gleichzeitig drei Dinge anfängst – und keines davon wirklich weiterkommt."]]},"s2":{"name":"Der Flucht-Modus","lead":"Wenn der Explorer als zweiter Stressheld aktiviert wird, wird Bewegung zur Flucht. Du brichst ab.","felder":[["Was du tust","Du verlässt Situationen, Projekte oder Beziehungen abrupt. Manchmal physisch, manchmal durch vollständige emotionale Abwesenheit. Du verleugnest Verantwortung – nicht aus Bosheit, sondern weil das Gewicht unerträglich geworden ist."],["Was andere erleben","Trümmerhaufen. Sie stehen plötzlich allein mit dem, was gemeinsam begonnen wurde."],["Was wirklich dahintersteckt","Du brauchst totale Befreiung von der Last. Und die einzige Strategie, die dein System kennt, ist: weg."],["Dein Signal","Du planst innerlich bereits den Ausstieg, während du noch mitten in der Situation bist."]]}}}};


var __FRAME_ID__=(new URLSearchParams(location.search)).get('frame')||'';
const PROFILE_FN='/.netlify/functions/profile';
const PROFILE_URL='https://app.6heroes.de/profil';
const HERO_COLOR={commander:'#0B63CE',explorer:'#F0672A',innovator:'#F2B705',guardian:'#1F9D62',sage:'#C0266A',strategist:'#475569'};
const HERO_LABEL={commander:'Commander',explorer:'Explorer',innovator:'Innovator',guardian:'Guardian',sage:'Sage',strategist:'Strategist'};
const ON_COLOR=k=>k==='innovator'?'#20293A':'#fff';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():'';
const blk=(l,p,cls,ul)=>'<div class="blk">'+(l?'<span class="bl '+(cls||'')+'">'+esc(l)+'</span>':'')+(p?'<p>'+esc(p)+'</p>':'')+(ul?'<ul>'+ul.map(x=>{const t=String(x).split('|');return t.length>1?'<li><b>'+esc(t[0])+'</b> '+esc(t.slice(1).join('|'))+'</li>':'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+'</div>';
const acc=(a,sub,inner,open)=>'<details'+(open?' open':'')+'><summary><span class="s1"><span class="a">'+esc(a)+'</span>'+(sub?'<span class="b">'+esc(sub)+'</span>':'')+'</span></summary><div class="body">'+inner+'</div></details>';
const lab=t=>'<div class="label">'+esc(t)+'</div>';
const topbar='<div class="topbar"><a href="'+PROFILE_URL+'" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mein Bereich</a></div>';
function postHeight(){const h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);parent.postMessage({type:'6heroes:setHeight',height:h,frame:__FRAME_ID__},'*');}
async function getProfile(){
  const p=new URLSearchParams(location.search);const email=(p.get('email')||'').trim();
  if(!email) return null;
  try{const r=await fetch(PROFILE_FN+'?email='+encodeURIComponent(email));if(!r.ok) throw new Error(r.status);return await r.json();}
  catch(e){console.warn('Profil-Fetch fehlgeschlagen:',e);return null;}
}
function boot(render){
  window.addEventListener('load',()=>{render().then(()=>{var w=document.querySelector('.wrap');if(w)w.classList.add('ready');postHeight();});});
  window.addEventListener('resize',postHeight);
  if(window.ResizeObserver){new ResizeObserver(postHeight).observe(document.body);}
  document.addEventListener('toggle',postHeight,true);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(postHeight);}
  [50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
}


async function render(){
  const q=new URLSearchParams(location.search);
  let s1=cap((q.get('stress1')||'').trim()), s2=cap((q.get('stress2')||'').trim());
  let paid=q.get('paid')!=='0';
  if(!(s1&&s2)){const d=await getProfile();if(d){s1=s1||cap(d.s1||'');s2=s2||cap(d.s2||'');if(typeof d.isPaid==='boolean')paid=d.isPaid;}}
  let k1=(s1||'commander').toLowerCase(), k2=(s2||'commander').toLowerCase();
  if(!STRESS.heroes[k1]) k1='commander'; if(!STRESS.heroes[k2]) k2='commander';
  const same=(k1===k2);
  document.getElementById('intro').textContent=STRESS.intro;
  document.getElementById('s1label').textContent=HERO_LABEL[k1];
  document.getElementById('s2label').textContent=HERO_LABEL[k2];
  if(same){const e=document.getElementById('same');e.classList.add('show');e.innerHTML='Bei dir ist beides der <b>'+esc(HERO_LABEL[k1])+'</b>. Dieselbe Kraft steigt mit dem Druck von der Alarmphase in die Übersteuerung: ein Muster, zwei Härtegrade.';}
  const one=(key,ph)=>{const d=STRESS.heroes[key][ph];
    return '<div class="stage"><span class="bd '+ph+'">'+ph.toUpperCase()+'</span><span><span class="ph">'+(ph==='s1'?'Alarmphase':'Übersteuerung')+'</span><br><b style="font-family:\'DM Serif Display\',Georgia,serif;font-weight:400;font-size:24px">'+esc(d.name)+'</b></span></div>'
      +'<div class="stack">'+acc(HERO_LABEL[key]+' als '+ph.toUpperCase(),'',blk(null,d.lead)+d.felder.map(f=>blk(f[0],f[1],f[0]==='Was du tust'?'':'')).join(''),true)+'</div>';};
  document.getElementById('stages').innerHTML=one(k1,'s1')+one(k2,'s2');
  if(!paid) document.getElementById('lockWrap').classList.add('locked');
}
boot(render);

</script>
