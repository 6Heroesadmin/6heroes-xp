<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #20293A;
    --navy-2: #1A2230;
    --gold: #F2B705;
    --gold-soft: #FFD24A;
    --text: #F4F1E9;
    --text-soft: #C8CEDA;
    --text-muted: #8E96A8;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --card: rgba(255,255,255,0.035);
    --card-hover: rgba(255,255,255,0.06);
    --done: #1F9D62;

    /* Held-Akzente */
    --commander: #E0764F;
    --strategist:#4F9DDE;
    --innovator: #F2B705;
    --sage:      #B98BD9;
    --guardian:  #4FBE9F;
    --explorer:  #6FB1E0;
  }
  html, body {
    background: var(--navy);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---------- Kopf ---------- */
  .greeting { margin-bottom: 4px; }
  .greeting .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .greeting h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 32px; font-weight: 400; letter-spacing: -0.01em;
  }
  .greeting h1 .name { color: var(--gold); }

  /* ---------- Dein Stand (Rückblick-Block, nach dem Schaufenster) ---------- */
  .standboard {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px; display: grid; gap: 18px;
  }
  .stand-level { }
  .sl-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .sl-num {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: 13px;
    background: linear-gradient(150deg, rgba(242,183,5,0.22), rgba(242,183,5,0.08));
    border: 1px solid rgba(242,183,5,0.3);
    display: grid; place-items: center;
    font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--gold);
  }
  .sl-label { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .sl-label span { color: var(--gold); }
  .sl-xp { font-size: 12.5px; color: var(--text-muted); }
  .sl-xp b { color: var(--text-soft); font-weight: 600; }
  .sl-bar {
    height: 8px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden;
  }
  .sl-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    width: 0%; transition: width 1s cubic-bezier(.2,.8,.2,1);
  }
  .stand-grid {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 12px;
    border-top: 1px solid var(--border); padding-top: 16px;
  }
  .stand-cell { text-align: center; }
  .sc-num {
    font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--text);
    margin-bottom: 3px; line-height: 1.1;
  }
  .sc-lbl { font-size: 12px; color: var(--text-muted); }

  /* Wochen-Zelle: 7 Tagespunkte, 5er-Schwelle markiert */
  .stand-week { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .week-dots { display: flex; gap: 4px; align-items: center; margin-top: 3px; }
  .week-dots .wd {
    width: 11px; height: 11px; border-radius: 50%;
    background: rgba(255,255,255,0.1); position: relative;
  }
  .week-dots .wd.active { background: var(--gold); }
  .week-dots .wd.perfect { background: var(--gold); }
  /* Trennstrich nach dem 5. Punkt = "Woche geschafft"-Schwelle */
  .week-dots .wd.threshold::after {
    content: ''; position: absolute; right: -4px; top: -3px; bottom: -3px;
    width: 1px; background: rgba(255,255,255,0.25);
  }
  .week-caption { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.3; }
  .week-caption b { color: var(--gold); font-weight: 600; }
  .week-caption.done b { color: var(--done); }
  @media (max-width: 440px){
    .sc-num { font-size: 18px; }
    .week-dots .wd { width: 9px; height: 9px; }
  }

  /* ---------- Coach-Hero-Karte ---------- */
  .coach {
    position: relative; overflow: hidden;
    border-radius: 22px; padding: 26px 24px 24px; margin-bottom: 26px;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(242,183,5,0.14), transparent 60%),
      linear-gradient(180deg, rgba(242,183,5,0.06), rgba(242,183,5,0.015));
    border: 1px solid rgba(242,183,5,0.28);
  }
  .coach .kicker {
    font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .coach .kicker .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 0 rgba(242,183,5,0.6); animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(242,183,5,0.5); }
    70%{ box-shadow: 0 0 0 8px rgba(242,183,5,0); }
    100%{ box-shadow: 0 0 0 0 rgba(242,183,5,0); }
  }
  .coach h2 {
    font-family: 'DM Serif Display', serif; font-size: 25px; font-weight: 400;
    line-height: 1.2; margin-bottom: 10px; letter-spacing: -0.01em;
  }
  .coach .lead {
    font-size: 14.5px; color: var(--text-soft); line-height: 1.6; margin-bottom: 20px; max-width: 52ch;
  }
  .coach .lead b { color: var(--gold); font-weight: 600; }

  /* Kriterien-Reihe im Coach — konkrete Zahlen, ehrlich sichtbar */
  .crit-list { display: grid; gap: 15px; margin-bottom: 20px; }
  .crit-line {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 7px;
  }
  .crit-label { font-size: 13.5px; color: var(--text-soft); font-weight: 500; }
  .crit-hint { color: var(--text-muted); font-weight: 400; font-size: 12px; }
  .crit-count {
    flex: 0 0 auto; font-size: 13.5px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .crit.met .crit-count { color: var(--done); }
  .crit-check { color: var(--done); }
  .crit-bar {
    height: 7px; border-radius: 999px; background: rgba(0,0,0,0.2); overflow: hidden;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .crit-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    width: 0%; transition: width .9s cubic-bezier(.2,.8,.2,1);
  }
  .crit.met .crit-fill { background: linear-gradient(90deg, var(--done), #37B87A); }

  /* Coach-CTA (nach Freischaltung) */
  .coach-cta {
    display: inline-flex; align-items: center; gap: 9px; margin-top: 4px;
    background: var(--gold); color: #1a1a1a; font-weight: 700; font-size: 15px;
    padding: 13px 22px; border-radius: 999px; border: none; cursor: pointer;
    transition: opacity .12s, transform .08s; text-decoration: none;
  }
  .coach-cta:hover { opacity: .92; }
  .coach-cta:active { transform: translateY(1px); }
  .coach-cta .arrow { font-size: 16px; }

  .coach-sub-actions {
    display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap;
  }
  .textlink {
    font-size: 13px; font-weight: 600; color: var(--text-soft);
    text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .12s, color .12s;
    cursor: pointer;
  }
  .textlink:hover { color: var(--gold); border-color: rgba(242,183,5,0.5); }

  /* ---------- Schaufenster-Kacheln ---------- */
  .shelf-label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); margin: 0 2px 12px;
  }

  /* ---------- Zwei gleichwertige Wege (Konzept B) ---------- */
  .choose-intro { margin-bottom: 16px; }
  .choose-intro .kicker {
    font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .choose-intro .kicker .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 0 rgba(242,183,5,0.6); animation: pulse 2.4s infinite;
  }
  .choose-intro h2 {
    font-family: 'DM Serif Display', serif; font-size: 25px; font-weight: 400;
    line-height: 1.2; letter-spacing: -0.01em;
  }
  .paths { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 26px; align-items: stretch; }
  .paths > .path { height: 100%; }
  @media (max-width: 560px){ .paths { grid-template-columns: 1fr; } }

  .path {
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    border-radius: 20px; padding: 22px 22px 20px;
    text-decoration: none; color: inherit;
    background:
      radial-gradient(120% 140% at 100% 0%, var(--path-glow, rgba(242,183,5,0.12)), transparent 60%),
      var(--card);
    border: 1px solid var(--path-border, rgba(242,183,5,0.26));
    transition: transform .12s, border-color .12s, background .12s;
    min-height: 190px;
  }
  .path:hover { transform: translateY(-2px); border-color: var(--path-border-hover, rgba(242,183,5,0.5)); }
  .path .path-eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--path-accent, var(--gold)); margin-bottom: 10px;
  }
  .path h3 {
    font-family: 'DM Serif Display', serif; font-size: 20px; font-weight: 400;
    line-height: 1.22; letter-spacing: -0.01em; margin-bottom: 8px;
  }
  .path .path-lead {
    font-size: 13.5px; color: var(--text-soft); line-height: 1.55; margin-bottom: 16px; flex: 1;
  }
  .path .path-go {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
    margin-top: auto;
    font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 999px;
    background: var(--path-accent, var(--gold)); color: #1a1a1a; border: none;
  }
  .path .path-go.ghost {
    background: transparent; color: var(--path-accent, var(--gold));
    border: 1px solid var(--path-border, rgba(242,183,5,0.4));
  }
  .path .path-go .arrow { font-size: 15px; }
  .path .path-meta {
    display: flex; align-items: center; gap: 7px; margin-bottom: 14px;
    font-size: 12.5px; color: var(--text-muted);
  }
  /* Coach-Weg im Fortschritt: kompakter Mini-Balken */
  .path-progress { margin: 4px 0 16px; }
  .path-progress .pp-track {
    height: 7px; border-radius: 999px; background: rgba(0,0,0,0.22); overflow: hidden;
    border: 1px solid rgba(255,255,255,0.04); margin-bottom: 8px;
  }
  .path-progress .pp-fill {
    height: 100%; border-radius: 999px; width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    transition: width .9s cubic-bezier(.2,.8,.2,1);
  }
  .path-progress .pp-cap { font-size: 12.5px; color: var(--text-soft); }
  .path-progress .pp-cap b { color: var(--gold); }
  .path .quest-dots { display: flex; gap: 5px; margin: 2px 0 14px; }

  /* Akzent-Varianten */
  .path.coach {
    --path-accent: var(--gold); --path-border: rgba(242,183,5,0.28);
    --path-border-hover: rgba(242,183,5,0.55); --path-glow: rgba(242,183,5,0.13);
  }
  .path.quests {
    --path-accent: var(--commander, #4C8DF5); --path-border: rgba(76,141,245,0.30);
    --path-border-hover: rgba(76,141,245,0.6); --path-glow: rgba(76,141,245,0.13);
  }

  .tiles { display: grid; grid-template-columns: 1fr; gap: 14px; }

  .tile {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px 20px 18px; transition: background .14s, border-color .14s, transform .1s;
    position: relative; overflow: hidden;
  }
  .tile:hover { background: var(--card-hover); border-color: var(--border-strong); transform: translateY(-2px); }
  .tile .tile-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 14px;
  }
  .tile h3 {
    font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 21px;
    margin-bottom: 6px; letter-spacing: -0.01em;
  }
  .tile .tile-value { font-size: 13.5px; color: var(--text-soft); margin-bottom: 18px; min-height: 20px; }
  .tile .tile-value .accent { color: var(--tile-accent, var(--gold)); font-weight: 600; }
  .tile .tile-open {
    font-size: 13px; font-weight: 600; color: var(--text-soft);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tile:hover .tile-open { color: var(--gold); }
  .tile .tile-open .arrow { transition: transform .14s; }
  .tile:hover .tile-open .arrow { transform: translateX(3px); }
  .tile .glow {
    position: absolute; right: -30px; top: -30px; width: 120px; height: 120px;
    background: radial-gradient(circle, var(--tile-accent, var(--gold)), transparent 70%);
    opacity: 0.08; pointer-events: none;
  }

  /* Profil-Kachel: Helden-Modi — 4 nebeneinander auf breit, 2x2 auf mobil */
  .hero-quad {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px;
  }
  @media (max-width: 560px){
    .hero-quad { grid-template-columns: 1fr 1fr; gap: 8px; }
  }
  .hero-slot {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 9px;
  }
  .hero-slot .hs-dot {
    flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
    background: var(--hs-color, var(--gold));
  }
  .hero-slot .hs-body { min-width: 0; }
  .hero-slot .hs-role {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted); line-height: 1.2;
  }
  .hero-slot .hs-name {
    font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- Badges-Ebene (unter Dein Stand) ---------- */
  .badges-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 16px 18px; margin-top: 14px;
    text-decoration: none; color: inherit; transition: background .14s, border-color .14s;
  }
  .badges-row:hover { background: var(--card-hover); border-color: var(--border-strong); }
  .badges-head { flex: 0 0 auto; }
  .badges-head .bh-count {
    font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--gold); line-height: 1;
  }
  .badges-head .bh-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .badges-slots {
    flex: 1 1 auto; margin-left: 14px;
    display: grid; gap: 9px;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    justify-content: end;
  }
  .badge-slot {
    aspect-ratio: 1 / 1; border-radius: 12px; width: 100%;
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .badge-slot.filled {
    background: radial-gradient(circle at 50% 35%, rgba(242,183,5,0.22), rgba(242,183,5,0.06));
    border: 1px solid rgba(242,183,5,0.4);
  }
  /* Coin-Variante: die SVG-Medaille ist selbst der Look -> kein Kachel-Rahmen */
  .badge-slot.coin.filled {
    background: none; border: none; overflow: visible;
  }
  .badge-slot.coin .medal { width: 100%; height: 100%; display: block; }
  .badge-slot.empty {
    background: rgba(255,255,255,0.02);
    border: 1px dashed var(--border-strong);
  }
  .badge-slot .bs-img {
    width: 100%; height: 100%; object-fit: contain; padding: 6px; display: block;
  }
  .badge-slot .bs-fallback {
    display: none; place-items: center; width: 100%; height: 100%;
    font-family: 'DM Serif Display', serif; font-size: 17px; color: var(--gold);
  }
  .badges-open {
    flex: 0 0 auto; margin-left: 4px; font-size: 18px; color: var(--text-muted);
    transition: color .14s, transform .14s;
  }
  .badges-row:hover .badges-open { color: var(--gold); transform: translateX(3px); }
  @media (max-width: 440px){
    .badges-slots { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
  }

  /* ================= TEASER (paid=0, Nicht-Zahler) ================= */
  /* Ein geblurrter Bereich mit lesbarer Erklärzeile darüber. */
  .teaser-wrap { position: relative; }
  .teaser-blur {
    filter: blur(6px) saturate(0.6);
    opacity: 0.5;
    pointer-events: none;
    user-select: none;
  }
  .teaser-note {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px; text-align: center; padding: 0 18px;
  }
  .teaser-note .tn-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px; color: var(--text);
  }
  .teaser-note .tn-sub {
    font-size: 12.5px; color: var(--text-soft); max-width: 340px; line-height: 1.45;
  }
  .teaser-note .tn-cta {
    margin-top: 6px; font-size: 12.5px; font-weight: 700;
    color: var(--navy); background: var(--gold);
    padding: 8px 16px; border-radius: 999px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .teaser-lock { display: inline-flex; align-items: center; gap: 6px; }
  .teaser-lock svg { width: 13px; height: 13px; }

  /* Held-Quad im Teaser: Basisheld scharf, andere drei geblurrt */
  .hero-slot.hs-blur { filter: blur(4px) saturate(0.6); opacity: 0.55; }

  /* Coach-Cliffhanger (paid=0) */
  .coach.teaser .lead { color: var(--text-soft); }
  .coach.teaser .coach-cta {
    background: var(--gold); color: var(--navy);
  }

  /* Quests-Kachel: kleine offene-Quests-Punkte */
  .quest-dots { display: flex; gap: 5px; margin-bottom: 18px; }
  .quest-dots .qd {
    width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.14);
  }
  .quest-dots .qd.open { background: var(--gold); }

  .footer-note {
    margin-top: 30px; text-align: center; font-size: 12px; color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Kopf -->
  <div class="greeting">
    <div class="eyebrow">Mein Dashboard</div>
    <h1>Willkommen zurück, <span class="name" id="userName">Stefan</span></h1>
  </div>

  <div style="height:22px"></div>

  <!-- ================= ZWEI GLEICHWERTIGE WEGE (Konzept B) ================= -->
  <div class="choose-intro">
    <div class="kicker"><span class="pulse"></span>Dein Dashboard</div>
    <h2>Was brauchst du gerade?</h2>
  </div>
  <div class="paths" id="paths"><!-- per JS gefüllt: Coach-Weg + Quests-Weg --></div>

  <!-- ================= Schaufenster ================= -->
  <div class="shelf-label">Dein Profil</div>
  <div class="tiles">

    <a class="tile" id="tileProfile" style="--tile-accent: var(--commander)" href="#" target="_top">
      <span class="glow"></span>
      <div class="tile-eyebrow">Mein Profil</div>
      <h3>Deine vier Modi</h3>
      <div class="hero-quad" id="heroQuad"><!-- per JS --></div>
      <span class="tile-open">Profil öffnen <span class="arrow">&rarr;</span></span>
    </a>

  </div>

  <!-- ================= Dein Stand (Rückblick, kein Antrieb) ================= -->
  <div class="shelf-label" style="margin-top:28px">Dein Stand</div>
  <div class="standboard">
    <div class="stand-level">
      <div class="sl-top">
        <div class="sl-num" id="slLevel">3</div>
        <div class="sl-meta">
          <div class="sl-label">Level <span id="slLevelName">Wegbereiter</span></div>
          <div class="sl-xp"><b id="slXpNow">640</b> / <span id="slXpNext">900</span> XP zum nächsten Level</div>
        </div>
      </div>
      <div class="sl-bar"><div class="sl-fill" id="slFill"></div></div>
    </div>
    <div class="stand-grid">
      <div class="stand-cell stand-week">
        <div class="week-dots" id="weekDots"></div>
        <div class="week-caption" id="weekCaption"></div>
      </div>
      <div class="stand-cell">
        <div class="sc-num" id="scWeeks">3</div>
        <div class="sc-lbl">Wochen am Stück</div>
      </div>
      <div class="stand-cell">
        <div class="sc-num" id="scEntries">12</div>
        <div class="sc-lbl">Quests abgeschlossen</div>
      </div>
    </div>
  </div>

  <!-- Badges-Ebene: letzte 3-4 bzw. Leerfelder, Absprung zu Meine Badges -->
  <a class="badges-row" id="badgesRow" href="#" target="_top">

/* Roh-Eintrag -> normalisiert (gleiche Feldnamen wie eintraege.html) */
function mapEntry(r){

    }
    return '';
  };
  return {

function parseWebhookPayload(text){
  if (!text || !text.trim()) return null;
  try { return JSON.parse(text); } catch(_) {}
  let repaired = repairControlChars(text)
    .replace(/\\{2,}"/g, '\\"')
    .replace(/:\s*,/g, ': [],').replace(/:\s*}/g, ': [] }')
    .replace(/,\s*}/g, ' }').replace(/,\s*]/g, ' ]');
  try { return JSON.parse(repaired); } catch(e){ return null; }
}

/* Escaped rohe Steuerzeichen nur innerhalb von String-Literalen. */
function repairControlChars(text){
  let out = '', inStr = false, esc = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if (esc){ out += c; esc = false; continue; }
    if (c === '\\'){ out += c; esc = true; continue; }
    if (c === '"'){ inStr = !inStr; out += c; continue; }
    if (inStr){
      if (c === '\n'){ out += '\\n'; continue; }
      if (c === '\r'){ out += '\\r'; continue; }
      if (c === '\t'){ out += '\\t'; continue; }
    }
    out += c;
  }
  return out;
}

/* ISO-Woche (Mo–So). Gibt einen vergleichbaren Schlüssel "YYYY-Www". */
function isoWeekKey(isoDate){
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d)) return null;
  // ISO: Donnerstag der Woche bestimmt das Jahr
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay() + 6) % 7;            // Mo=0 … So=6
  t.setUTCDate(t.getUTCDate() - day + 3);         // auf Donnerstag
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((t - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
  return t.getUTCFullYear() + '-W' + String(week).padStart(2,'0');
}

/* Aktueller ISO-Wochenschlüssel (heute). */
function currentWeekKey(){
  const now = new Date();
  return isoWeekKey(now.toISOString().slice(0,10));
}

/* Aus den Einträgen die echten Kennzahlen ableiten. */
function deriveFromEntries(entries){
  // --- Freischalt-Fortschritt (Feedback-basiert) ---
  const withFb = entries.filter(e => e.fbTap);
  const clear  = withFb.filter(e => CLEAR_TAPS.includes(e.fbTap));
  const types  = new Set(withFb.map(e => (e.type||'').toLowerCase()).filter(Boolean));
  D.withFeedback = withFb.length;
  D.clear        = clear.length;
  D.types        = types.size;
  D.entries      = entries.length;             // "Quests abgeschlossen" (gesamt)

  const met = D.withFeedback >= UNLOCK.minWithFeedback
           && D.clear        >= UNLOCK.minClear
           && D.types        >= UNLOCK.minTypes;
  // State aus Live-Daten ableiten (URL-Param bleibt Override für Vorschau).
  if (!P.get('state')) STATE = met ? 'unlocked' : 'locked';

  // --- Wochen-Streak (aktiver Tag = Tag mit >=1 Quest, egal welcher Typ) ---
  // Aktive Tage pro ISO-Woche sammeln.
  const weekDays = new Map();   // weekKey -> Set(YYYY-MM-DD)
  for (const e of entries){
    if (!e.date) continue;
    const wk = isoWeekKey(e.date);
    if (!wk) continue;
    if (!weekDays.has(wk)) weekDays.set(wk, new Set());
    weekDays.get(wk).add(e.date);
  }

  // Laufende Woche: aktive Tage zählen.
  const curKey = currentWeekKey();
  D.weekDaysActive = weekDays.has(curKey) ? weekDays.get(curKey).size : 0;

  // Wochen am Stück (>=5/7), rückwärts ab der aktuellen Woche.
  // Die laufende Woche zählt nur mit, wenn sie die Schwelle schon erreicht.
  D.weeksStreak = countWeekStreak(weekDays, curKey);
}

/* Zusammenhängende ISO-Wochen mit >= weekGoal aktiven Tagen,
   rückwärts ab startKey. Lücken (Woche ganz ohne Aktivität) brechen ab. */
function countWeekStreak(weekDays, startKey){
  const goal = DEMO.weekGoal;   // 5
  let count = 0;
  let [y, w] = startKey.split('-W').map(Number);
  // Falls die laufende Woche die Schwelle noch nicht hat, zählt sie nicht,
  // bricht aber die Kette auch nicht ab -> wir starten bei der Vorwoche.
  const curActive = weekDays.has(startKey) ? weekDays.get(startKey).size : 0;
  if (curActive >= goal) count++;
  // rückwärts weiterlaufen
  for (let i=0; i<520; i++){   // Sicherheitslimit ~10 Jahre
    // eine Woche zurück
    w--; if (w < 1){ y--; w = isoWeeksInYear(y); }
    const key = y + '-W' + String(w).padStart(2,'0');
    const active = weekDays.has(key) ? weekDays.get(key).size : 0;
    if (active >= goal) count++;
    else break;   // erste Woche unter Schwelle beendet die Kette
  }
  return count;
}

/* Anzahl ISO-Wochen in einem Jahr (52 oder 53). */
function isoWeeksInYear(year){
  const d = new Date(Date.UTC(year, 11, 31));
  const day = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - day + 3);
  const firstThu = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
}

async function loadLive(){
  if (!EMAIL) return;   // ohne E-Mail bleibt alles Demo
  try {
    const url = READ_WEBHOOK_URL + '?email=' + encodeURIComponent(EMAIL);
    const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
    if (!res.ok) throw new Error('Read '+res.status);
    const data = parseWebhookPayload(await res.text());

    // Held-Konstellation + paid aus dem profile-Block (überschreibt URL/Demo).
    if (data && data.profile){
      applyHeroes(data.profile);
      const p = (data.profile.paid ?? '').toString().trim().toLowerCase();
      if (p) PAID_STATE = (p === '1' || p === 'true' || p === 'yes');
    }

    const rows = (data && (data.entries || data.records)) || [];
    if (Array.isArray(rows) && rows.length){
      deriveFromEntries(rows.map(mapEntry));
    }
  } catch(e){
    // Netzwerk-/Parse-Fehler: Demo-/URL-Werte behalten, Seite bleibt nutzbar.
    console.warn('Live-Daten nicht geladen, nutze Fallback:', e.message);
  }
}

function pct(){
  const p1 = Math.min(D.withFeedback / D.minWithFeedback, 1);
  const p2 = Math.min(D.clear        / D.minClear, 1);
  const p3 = Math.min(D.types        / D.minTypes, 1);
  return Math.round((p1*0.4 + p2*0.4 + p3*0.2) * 100);
}

function renderWeek(){
  const active = D.weekDaysActive, goal = DEMO.weekGoal, perfect = DEMO.weekPerfect;
  const wrap = document.getElementById('weekDots');
  let html = '';
  for (let i=1;i<=7;i++){
    const cls = ['wd'];
    if (i <= active) cls.push(active >= perfect ? 'perfect' : 'active');
    if (i === goal) cls.push('threshold');   // Strich nach dem 5. Punkt
    html += `<span class="${cls.join(' ')}"></span>`;
  }
  wrap.innerHTML = html;

  const cap = document.getElementById('weekCaption');
  if (active >= perfect){
    cap.className = 'week-caption done';
    cap.innerHTML = 'Perfekte Woche <b>7/7</b>';
  } else if (active >= goal){
    cap.className = 'week-caption done';
    cap.innerHTML = `Woche geschafft <b>${active}/7</b>`;
  } else {
    cap.className = 'week-caption';
    const left = goal - active;
    cap.innerHTML = `Diese Woche <b>${active}/7</b> · noch ${left} bis geschafft`;
  }
}

  renderBadges();
  requestAnimationFrame(()=>{
    const w = Math.min(D.xpNow / D.xpNext * 100, 100);
    document.getElementById('slFill').style.width = w + '%';
  });

  document.getElementById('footerNote').textContent =
    STATE === 'unlocked' ? 'Vorschau: freigeschalteter Zustand' : 'Vorschau: vor Freischaltung';
  postHeight();
}

/* Teaser: "Dein Stand" als leere, geblurrte Struktur + Erklärzeile.
   Zeigt die FORM (Level/XP/Woche/Streak) ohne echte oder Demo-Werte. */
function applyStandTeaser(){
  // Platzhalter statt Zahlen (— statt Demo)
  document.getElementById('slLevel').textContent     = '—';
  document.getElementById('slLevelName').textContent = '—';
  document.getElementById('slXpNow').textContent     = '0';
  document.getElementById('slXpNext').textContent    = '—';
  document.getElementById('scWeeks').textContent     = '—';
  document.getElementById('scEntries').textContent   = '0';
  // leere Wochenpunkte (keine aktiven Tage)
  const wrap = document.getElementById('weekDots');
  let wd = ''; for (let i=1;i<=7;i++){ wd += `<span class="wd${i===DEMO.weekGoal?' threshold':''}"></span>`; }
  wrap.innerHTML = wd;
  const cap = document.getElementById('weekCaption');
  cap.className = 'week-caption'; cap.textContent = '';
  document.getElementById('slFill').style.width = '0%';

  wrapAsTeaser('standboard',
    'Hier wächst dein Fortschritt',
    'Level, XP, Wochen-Streak und abgeschlossene Quests — sie füllen sich, sobald du loslegst.');
}

/* Teaser: Badges-Zeile — leere Coins (locked-Optik), geblurrt + Erklärzeile. */
function applyBadgesTeaser(){
  document.getElementById('bhCount').textContent = '0';
  EARNED = new Set();   // nichts verdient -> Coins rendern im "locked"-Look
  const wrap = document.getElementById('badgesSlots');
  const slotSize = 44 + 9;
  const avail = wrap.clientWidth || 320;
  const fit = Math.max(DEMO.minBadgeSlots, Math.floor((avail + 9) / slotSize));
  // Ein paar repräsentative leere Coins (locked) aus verschiedenen Kategorien
  const sample = ['Erster Schritt','Auf Kurs','XP-Sammler','Ideenfunke','Heldenmix','Reflexionsstarter'];
  let html = '';
  for (let i=0;i<fit;i++){
    const b = BADGE_BY_NAME[(sample[i]||'').toLowerCase()];
    html += b ? `<div class="badge-slot coin filled">${medalSvg(b)}</div>`
              : `<div class="badge-slot empty"></div>`;
  }
  wrap.innerHTML = html;
  document.getElementById('badgesRow').setAttribute('href', UPGRADE_URL);

  wrapAsTeaser('badges-row',
    'Deine Abzeichen sammeln sich hier',
    'Für jeden Schritt ein Zeichen — schalte frei und beginne zu sammeln.');
}

/* Legt einen Blur+Notiz-Layer über ein bestehendes Element (per Klassenname).
   Das Element wird in einen .teaser-wrap gehüllt, Inhalt geblurrt,
   darüber eine lesbare Notiz mit CTA zur Preisseite. */
function wrapAsTeaser(className, title, sub){
  const el = document.querySelector('.'+className);
  if (!el || el.closest('.teaser-wrap')) return;
  const wrap = document.createElement('div');
  wrap.className = 'teaser-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el);
  el.classList.add('teaser-blur');
  const note = document.createElement('div');
  note.className = 'teaser-note';
  note.innerHTML = `
    <div class="tn-title">${title}</div>
    <div class="tn-sub">${sub}</div>
    <a class="tn-cta" href="${UPGRADE_URL}" target="_top">
      <span class="teaser-lock">${LOCK_ICON_SVG}Jetzt freischalten</span>
    </a>`;
  wrap.appendChild(note);
}

const LOCK_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

/* iframe-Höhe (wie die übrigen Seiten) */
let lastH = 0;
function postHeight(){
  const el = document.documentElement, bd = document.body;
  const h = Math.max(bd.scrollHeight, el.scrollHeight, bd.offsetHeight, el.offsetHeight);
  if (h === lastH) return; lastH = h;
  parent.postMessage({type:"6heroes:setHeight",height:h},"*");
}
window.addEventListener('load', init);
window.addEventListener('resize', ()=>{ postHeight(); renderBadges(); });
if (window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
if (document.fonts && document.fonts.ready){ document.fonts.ready.then(postHeight); }
[50,200,500,1000,1600].forEach(t=>setTimeout(postHeight,t));
</script>
