  .wrap{max-width:940px;margin:0 auto;padding:28px 20px 60px}

  h1{font-family:'DM Serif Display',serif;font-size:34px;font-weight:400;line-height:1.1;margin-bottom:12px}
  .lead{font-size:15px;line-height:1.55;color:var(--text-soft);max-width:640px}
  .summary{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin:22px 0 4px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .summary .stat{display:inline-flex;align-items:baseline}
  .summary .num{font-family:'DM Serif Display',serif;font-size:26px;color:var(--gold)}
  .summary .lbl{font-size:13px;color:var(--text-muted);margin-left:8px}
  .cat{margin-top:26px;border:1px solid var(--border-strong);border-radius:16px;padding:22px;background:var(--card)}
  .cat-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  .cat-title{font-family:'DM Serif Display',serif;font-size:21px;font-weight:400}
  .cat-count{font-size:12.5px;color:var(--text-muted)}
  .cat-sub{font-size:13px;color:var(--text-soft);margin-bottom:18px}
  svg.medal{display:block}
  .cell svg.medal{width:60px;height:60px}
  .sname{font-size:11px;font-weight:600;margin-top:7px;text-align:center;max-width:96px;line-height:1.2}
  .locked .sname{color:var(--text-muted);font-weight:500}
  .smeta{font-size:10px;margin-top:2px;color:var(--text-muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:20px 12px}
  .cell{display:flex;flex-direction:column;align-items:center}
  .heroes{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}
  @media (max-width:780px){ .heroes{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:460px){ .heroes{grid-template-columns:repeat(2,1fr)} }
  .hcard{border:1px solid var(--pc);border-radius:12px;padding:14px 4px 12px;background:color-mix(in srgb,var(--pc) 6%,transparent)}
  .hlabel{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--pc);text-align:center;margin-bottom:10px}
  .col{display:flex;flex-direction:column-reverse;align-items:center}
  .conn{width:2px;height:20px}
  .conn.walked{background:var(--pc)} .conn.open{border-left:2px dashed color-mix(in srgb,var(--pc) 55%,transparent)}
  .journey + .journey{margin-top:14px}
  .journey svg{display:block;width:100%;height:auto;overflow:visible}
  .jlabel{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
  @media (max-width:560px){ h1{font-size:27px} }

</head>

function groups(items){const m={};items.forEach(b=>{const k=b.rule+'|'+(b.hero||'')+'|'+(b.qt||'');(m[k]=m[k]||[]).push(b);});return Object.values(m).map(g=>g.sort((a,b)=>num(a.thr)-num(b.thr)));}
const TIER_MAP={};
(function(){const byCat={};BADGES.forEach(b=>(byCat[b.cat]=byCat[b.cat]||[]).push(b));Object.values(byCat).forEach(items=>{groups(items).forEach(g=>{if(g.length===3)['Bronze','Silber','Gold'].forEach((t,i)=>TIER_MAP[g[i].id]=t);});});})();
function tierOf(b){return TIER_MAP[b.id]||b.tier||'';}
function glyphFor(b){
  const rt=b.rule,qt=b.qt,hero=b.hero,thr=num(b.thr),id=b.id;
  if(id==='Badge_001')return 'footprints';
  if(id==='Badge_002')return 'power';
  if(rt==='quest_count_total')return 'footprints';
  if(rt==='quest_count_by_type')return ({Activate:'spark',Perform:'bolt',StopLimit:'gear'})[qt]||'gear';
  if(rt==='type_variety_count')return 'notes';
  if(rt==='streak_days')return 'flame';
  if(rt==='active_days_total')return 'calendar';
  if(rt==='perfect_weeks')return 'target';
  if(rt==='streak_weeks')return 'chain';
  if(rt==='total_xp')return 'xp';
  if(rt==='quest_count_by_hero')return ({Innovator:'bulb',Commander:'chevron',Strategist:'brain',Sage:'eye',Guardian:'shieldlet',Explorer:'compass'})[hero]||'target';
  if(rt==='distinct_heroes_count')return thr<=3?'triad':'hexring';
  if(rt==='heroes_with_min_quests')return 'bars';
  if(rt==='quest_count_by_profile_hero')return 'anchor';
  if(rt==='reflection_count')return 'ripple';
  return 'target';
}
function ringKey(b){
  const t=tierOf(b);
  if(t)return t;
  if(b.rule==='streak_days')return 'Streak';
  if(b.cat==='Einstieg')return 'Einstieg';
  if(b.cat==='XP')return 'XP';
  if(b.cat==='Balance')return 'Balance';
  return 'Einstieg';
}
const PROGRESS={};
(function(){const grp={};BADGES.forEach(b=>{const rk=ringKey(b);if(rk==='Bronze'||rk==='Silber'||rk==='Gold')return;const k=b.rule+'|'+(b.hero||'')+'|'+(b.qt||'');(grp[k]=grp[k]||[]).push(b);});Object.values(grp).forEach(g=>{g.sort((a,b)=>num(a.thr)-num(b.thr)).forEach((b,i)=>PROGRESS[b.id]=i);});})();
/* Pfadfarbe einer Journey-Serie = Medaillenfarbe der Serie */
function seriesColor(g){ if(g[0].rule==='streak_days')return CAT.Streak.b; if(g[0].rule==='total_xp')return CAT.XP.b; return METAL.Gold.b; }

const RING_CAP=4; let uid=0;
/* Medaille als Inneres (viewBox 0..100), fuer Einbettung in HTML und Journey-SVG */
function badgeInner(b){
  const e=EARNED.has(b.id), locked=!e;
  const key=ringKey(b), m=ringDef(key), rd=locked?METAL.Locked:m, id='m'+(uid++);
  const hero=(b.cat==='Heldenmeisterschaft'&&b.hero)?HERO[b.hero]:null;
  const glyphId=glyphFor(b), gc=locked?'#565F73':m.a, go=locked?0.6:1;
  const hr=hero&&!locked?'<circle cx="50" cy="50" r="33" fill="none" stroke="'+hero+'" stroke-width="2" opacity=".9"/>':'';
  let prings='';const P=(glyphId==='xp')?0:Math.min(PROGRESS[b.id]||0,RING_CAP);
  for(let i=0;i<P;i++){const r=36-i*3.4;prings+='<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+(locked?'#3A4356':m.b)+'" stroke-width="1.4" opacity="'+(locked?.4:.82)+'"/>';}
  const val=(b.rule==='total_xp')?b.thr:null;
  const inner=(glyphId==='xp')
    ?'<text x="50" y="43" text-anchor="middle" dominant-baseline="central" font-family="Inter,sans-serif" font-weight="800" font-size="23" letter-spacing="-1" fill="'+gc+'" opacity="'+go+'">XP</text>'+(val!=null?'<text x="50" y="63" text-anchor="middle" dominant-baseline="central" font-family="Inter,sans-serif" font-weight="700" font-size="15" fill="'+gc+'" opacity="'+(go*0.9)+'">'+val+'</text>':'')
    :'<g transform="translate(50,50) scale(.9) translate(-50,-50)" fill="none" stroke="'+gc+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="'+go+'"><path d="'+(GLYPH[glyphId]||GLYPH.target)+'"/></g>';
  return '<defs>'+
    '<linearGradient id="'+id+'r" x1="20" y1="14" x2="80" y2="86" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="'+rd.a+'"/><stop offset=".5" stop-color="'+rd.b+'"/><stop offset="1" stop-color="'+rd.c+'"/></linearGradient>'+
    '<radialGradient id="'+id+'d" cx="50" cy="40" r="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2C3852"/><stop offset="1" stop-color="#141A28"/></radialGradient>'+
    '<radialGradient id="'+id+'g" cx="50" cy="50" r="50" gradientUnits="userSpaceOnUse"><stop offset=".72" stop-color="'+m.glow+'" stop-opacity="0"/><stop offset=".9" stop-color="'+m.glow+'" stop-opacity="'+(locked?0:.28)+'"/><stop offset="1" stop-color="'+m.glow+'" stop-opacity="0"/></radialGradient></defs>'+
    '<circle cx="50" cy="50" r="49" fill="url(#'+id+'g)"/>'+
    '<circle cx="50" cy="50" r="45" fill="none" stroke="url(#'+id+'r)" stroke-width="5"/>'+
    '<circle cx="50" cy="50" r="41" fill="none" stroke="#fff" stroke-opacity="'+(locked?.05:.14)+'" stroke-width="1"/>'+
    '<circle cx="50" cy="50" r="40.5" fill="url(#'+id+'d)"/>'+hr+prings+inner;
}
function medalSvg(b){return '<svg class="medal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+badgeInner(b)+'</svg>';}
function cellHtml(b){
  const e=EARNED.has(b.id);
  return '<div class="cell '+(e?'earned':'locked')+'">'+medalSvg(b)+
    '<div class="sname">'+b.name+'</div><div class="smeta">'+(e?'erreicht':'ab '+b.thr)+'</div></div>';
}

function journeySvg(g, containerW){
  const col=seriesColor(g), label=JLABEL[g[0].rule]||'';
  const n=g.length, nodeR=33, stationW=168;
  let perRow=Math.max(2, Math.floor(containerW/stationW)); perRow=Math.min(perRow,n);
  const rows=Math.ceil(n/perRow), W=Math.max(containerW,340);
  const padX=76, rowH=150, amp=18, H=rows*rowH+18;
  const pos=[];
  for(let i=0;i<n;i++){
    const row=Math.floor(i/perRow), idxInRow=i%perRow;
    const countThisRow=Math.min(perRow,n-row*perRow), ltr=(row%2===0), span=W-2*padX;
    let frac=countThisRow>1?idxInRow/(countThisRow-1):0.5; if(!ltr)frac=1-frac;
    const x=padX+span*frac;
    const y=row*rowH+rowH/2 + amp*Math.sin(idxInRow/Math.max(countThisRow-1,1)*Math.PI);
    pos.push({x,y,row,ltr});
  }
  function seg(from,to){let d='M '+pos[from].x+' '+pos[from].y;
    for(let i=from+1;i<=to;i++){const a=pos[i-1],b=pos[i];
      if(a.row===b.row){const cx=(a.x+b.x)/2;d+=' Q '+a.x+' '+a.y+' '+cx+' '+((a.y+b.y)/2)+' T '+b.x+' '+b.y;}
      else{d+=' C '+(a.x+(a.ltr?52:-52))+' '+(a.y+52)+' '+(b.x+(b.ltr?52:-52))+' '+(b.y-52)+' '+b.x+' '+b.y;}}
    return d;}
  let lastE=-1; g.forEach((b,i)=>{if(EARNED.has(b.id))lastE=i;});
  const walked=lastE>0?seg(0,lastE):'';
  const open=seg(Math.max(lastE,0),n-1);
  let nodes='';
  g.forEach((b,i)=>{
    const e=EARNED.has(b.id);
    const s2=(2*nodeR)/100;
    nodes+='<g transform="translate('+(pos[i].x-nodeR)+','+(pos[i].y-nodeR)+') scale('+s2+')">'+badgeInner(b)+'</g>';
    const ly=pos[i].y+nodeR+17;
    nodes+='<text x="'+pos[i].x+'" y="'+ly+'" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="'+(e?'#F4F1E9':'#8E96A8')+'">'+b.name+'</text>';
    nodes+='<text x="'+pos[i].x+'" y="'+(ly+15)+'" text-anchor="middle" font-family="Inter" font-size="10.5" fill="'+(e?'#8E96A8':col)+'" opacity="'+(e?1:0.85)+'">'+(e?'erreicht':'ab '+b.thr)+'</text>';
  });
  return '<div class="journey">'+
    (label?'<div class="jlabel" style="color:'+col+'">'+label+'</div>':'')+
    '<svg viewBox="0 0 '+W+' '+H+'">'+
    (walked?'<path d="'+walked+'" fill="none" stroke="'+col+'" stroke-width="3"/>':'')+
    '<path d="'+open+'" fill="none" stroke="color-mix(in srgb, '+col+' 50%, transparent)" stroke-width="2.5" stroke-dasharray="6 8"/>'+
    nodes+'</svg></div>';
}

const WEBHOOK_URL='https://hook.eu1.make.com/hcu1vka2e03gq5clei96g2q7lkdp7ar5';
const EARNED=new Set(['Badge_001','Badge_002','Badge_021','Badge_045','Badge_015']);
async function loadEarned(){
  const email=new URLSearchParams(location.search).get('email');
  if(!email) return false;
  try{const res=await fetch(WEBHOOK_URL+'?email='+encodeURIComponent(email),{cache:'no-store'});
    const data=await res.json();
    const ids=(data.earned||[]).map(e=>e&&e.BadgeID_Text).filter(Boolean);
    EARNED.clear(); ids.forEach(id=>EARNED.add(id));
  }catch(e){ EARNED.clear(); }
  return true;
}
let LONG_PATHS=[];
function render(){
  const root=document.getElementById('cats'); root.innerHTML=''; LONG_PATHS=[];
  const byCat={}; BADGES.forEach(b=>(byCat[b.cat]=byCat[b.cat]||[]).push(b));
  let earnedTotal=0; const heroEarned={};
  CAT_ORDER.forEach(cat=>{
    const items=byCat[cat]||[];
    const earnedHere=items.filter(b=>EARNED.has(b.id)).length; earnedTotal+=earnedHere;
    items.forEach(b=>{if(EARNED.has(b.id)&&b.hero)heroEarned[b.hero]=(heroEarned[b.hero]||0)+1;});
    const sec=document.createElement('div'); sec.className='cat';
    sec.innerHTML='<div class="cat-head"><div class="cat-title">'+cat+'</div><div class="cat-count">'+earnedHere+' / '+items.length+'</div></div><div class="cat-sub">'+(CAT_SUB[cat]||'')+'</div>';
    if(cat==='Heldenmeisterschaft'){
      const wrap=document.createElement('div'); wrap.className='heroes';
      HERO_ORDER.forEach(hero=>{
        const hi=items.filter(b=>b.hero===hero).sort((a,b)=>num(a.thr)-num(b.thr));
        if(!hi.length)return; const v=HERO_VAR[hero]; let col='';
        hi.forEach((b,i)=>{ if(i>0){const p=EARNED.has(hi[i-1].id);col+='<div class="conn '+(p?'walked':'open')+'"></div>';} col+=cellHtml(b); });
        wrap.insertAdjacentHTML('beforeend','<div class="hcard" style="--pc:var('+v+')"><div class="hlabel">'+hero+'</div><div class="col">'+col+'</div></div>');
      });
      sec.appendChild(wrap);
    } else {
      const gs=groups(items);
      const longs=gs.filter(g=>g.length>=3), rest=gs.filter(g=>g.length<3).flat();
      longs.forEach(g=>{ const holder=document.createElement('div'); sec.appendChild(holder); LONG_PATHS.push({holder,group:g}); });
      if(rest.length){
        const grid=document.createElement('div'); grid.className='grid';
        if(longs.length){ grid.style.marginTop='22px'; grid.style.paddingTop='20px'; grid.style.borderTop='1px dashed var(--border)'; }
        grid.innerHTML=rest.map(cellHtml).join(''); sec.appendChild(grid);
      }
    }
    root.appendChild(sec);
  });
  renderJourneys();
  document.getElementById('sEarned').textContent=earnedTotal;
  let focus='—',max=0; Object.entries(heroEarned).forEach(([h,n])=>{if(n>max){max=n;focus=h;}});
  if(focus==='—'){document.getElementById('sFocus').textContent='—';document.getElementById('sFocusLbl').textContent='noch kein Schwerpunkt';}
  else document.getElementById('sFocus').textContent=focus;
  postHeight();
}
function renderJourneys(){ LONG_PATHS.forEach(({holder,group})=>{ const w=holder.clientWidth||holder.parentElement.clientWidth||600; holder.innerHTML=journeySvg(group,w); }); }
let rt; function onResize(){clearTimeout(rt);rt=setTimeout(()=>{renderJourneys();postHeight();},120);}
function postHeight(){try{parent.postMessage({type:'6heroes:setHeight',height:document.body.scrollHeight},'*');}catch(e){}}
function boot(){
  const hasEmail=!!new URLSearchParams(location.search).get('email');
  if(hasEmail) EARNED.clear();
  render(); requestAnimationFrame(()=>{renderJourneys();postHeight();});
  if(hasEmail){ loadEarned().then(()=>{ render(); requestAnimationFrame(()=>{renderJourneys();postHeight();}); }); }
  setTimeout(()=>{renderJourneys();postHeight();},250);
}
window.addEventListener('load', boot);
window.addEventListener('resize', onResize);
</script>
